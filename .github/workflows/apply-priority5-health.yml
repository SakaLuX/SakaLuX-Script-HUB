name: Apply Priority 5 Hub Health
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_priority5_health.js'
      - '.github/workflows/apply-priority5-health.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Priority 5 diagnostics
        run: node .github/scripts/apply_priority5_health.js
      - name: Install validation dependencies
        run: |
          python3 -m pip install PyYAML==6.0.3
          npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Validate repository and diagnostics
        run: |
          python3 .github/scripts/validate_repository.py
          node tests/hub-health-diagnostics-regression.cjs
          NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/hub-details-regression.cjs
      - name: Commit generated Priority 5 changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js scripts.json greasyfork/Script-Hub.md
          git commit -m 'Add Hub health and API Broker diagnostics v1.9.86'
          git push

name: Ensure managed standalone dock
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/ensure_managed_standalone_dock.py'
      - '.github/workflows/ensure-managed-standalone-dock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add and audit shared standalone dock
        run: python3 .github/scripts/ensure_managed_standalone_dock.py
      - name: Synchronize Hub registry and release surfaces
        run: python3 .github/scripts/normalize_installed_versions.py
      - name: Validate repository
        run: python3 .github/scripts/validate_repository.py
      - name: JavaScript syntax checks
        run: |
          for f in *.user.js; do node --check "$f"; done
      - name: Commit managed standalone dock update
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.user.js scripts.json greasyfork/*.md
          git commit -m "Add Smart Pricer to shared standalone dock"
          git push

name: Sync all release surfaces 2026-09-18

on:
  push:
    paths:
      - '.github/release-surface-sync.trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize versions, docs and audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, shutil

          root = Path('.')
          date = '2026-09-18'

          sources = {
              'enhancer': ('SakaLuX-Enhancer-Guard.user.js', 'greasyfork/Enhancer-Guard.md'),
              'bazaar': ('SakaLuX-Bazaar-Thanker-PDA.user.js', 'greasyfork/Bazaar-Thanker.md'),
              'mission-rewards': ('SakaLuX-Mission-Rewards.user.js', 'greasyfork/Mission-Rewards.md'),
              'market-intelligence': ('SakaLuX-Market-Intelligence.user.js', 'greasyfork/Market-Intelligence.md'),
              'elimination-assistant': ('SakaLuX-Elimination-Assistant.user.js', 'greasyfork/Elimination-Assistant.md'),
              'company-intelligence': ('SakaLuX-Company-Intelligence-v1.0.0.user.js', 'greasyfork/Company-Intelligence.md'),
              'stock-manager-advisor': ('SakaLuX-Stock-Manager-Advisor.user.js', 'greasyfork/Stock-Manager-Advisor.md'),
              'chat-intelligence': ('SakaLuX-Chat-Intelligence.user.js', 'greasyfork/Chat-Intelligence.md'),
              'account-auditor': ('SakaLuX-Account-Auditor.user.js', 'greasyfork/Account-Auditor.md'),
              'script-hub': ('SakaLuX-Script-Hub.user.js', 'greasyfork/Script-Hub.md'),
              'suite': ('SakaLuX-Suite.user.js', 'greasyfork/SakaLuX-Suite.md'),
          }

          def version_of(path):
              txt = Path(path).read_text(encoding='utf-8', errors='replace')
              m = re.search(r'^//\s*@version\s+([^\s]+)', txt, re.M)
              if not m:
                  raise SystemExit(f'No @version in {path}')
              return m.group(1).strip()

          versions = {k: version_of(src) for k,(src,_) in sources.items()}

          backup = Path('backups/release-surface-sync-2026-09-18')
          backup.mkdir(parents=True, exist_ok=True)
          for _,(_,doc) in sources.items():
              p = Path(doc)
              if p.exists():
                  shutil.copy2(p, backup / p.name)
          for extra in ['scripts.json','RELEASE-SURFACE-AUDIT-2026-09-18.md']:
              p=Path(extra)
              if p.exists(): shutil.copy2(p, backup / p.name)

          # Synchronize every documentation Current version and Current release label to its userscript.
          for key,(src,doc) in sources.items():
              p = Path(doc)
              if not p.exists():
                  continue
              v = versions[key]
              txt = p.read_text(encoding='utf-8')
              txt, n1 = re.subn(r'(## Current version\s*\n\*\*v)[^*]+(\*\*)', rf'\g<1>{v}\2', txt, count=1)
              txt, n2 = re.subn(r'(## Current release note\s*\n\s*\*\*v)[0-9][0-9A-Za-z.\-]*', rf'\g<1>{v}', txt, count=1)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f'Could not synchronize version labels in {doc}: current={n1}, release={n2}')
              p.write_text(txt, encoding='utf-8')

          # Correct stale prose that still described older releases as current.
          mission = Path('greasyfork/Mission-Rewards.md')
          txt = mission.read_text(encoding='utf-8')
          txt = txt.replace('the active/canonical release is the current v1.0.41 line.',
                            f'the active/canonical release is the current v{versions["mission-rewards"]} line.')
          mission.write_text(txt, encoding='utf-8')

          company = Path('greasyfork/Company-Intelligence.md')
          txt = company.read_text(encoding='utf-8')
          txt = re.sub(r'(this information page are synchronized at \*\*v)[^*]+(\*\*\.)',
                       rf'\g<1>{versions["company-intelligence"]}\2', txt, count=1)
          company.write_text(txt, encoding='utf-8')

          # Registry: userscript @version is the canonical source for registered modules.
          reg_path = Path('scripts.json')
          reg = json.loads(reg_path.read_text(encoding='utf-8'))
          entries = reg.get('scripts', reg if isinstance(reg, list) else [])
          if not isinstance(entries, list):
              raise SystemExit('Unexpected scripts.json shape')
          registered = {}
          for entry in entries:
              sid = entry.get('id')
              if sid in sources and sid not in {'chat-intelligence','account-auditor','script-hub','suite'}:
                  v = versions[sid]
                  entry['version'] = v
                  rel = entry.setdefault('release', {})
                  rel['version'] = v
                  rel.setdefault('date', date)
                  registered[sid] = v
          reg_path.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Hub documentation list must mirror the actual registry versions.
          hub = Path('greasyfork/Script-Hub.md')
          txt = hub.read_text(encoding='utf-8')
          labels = {
              'enhancer': '🛡️ SakaLuX Enhancer Guard',
              'bazaar': '💬 SakaLuX Bazaar Thanker - PDA',
              'mission-rewards': '🎯 SakaLuX Mission Rewards',
              'market-intelligence': '📈 SakaLuX Market Intelligence',
              'elimination-assistant': '⚔️ SakaLuX Elimination Assistant',
              'company-intelligence': '🏢 SakaLuX Company Intelligence',
              'stock-manager-advisor': '📊 SakaLuX Stock Manager & Advisor',
          }
          for sid,label in labels.items():
              v = versions[sid]
              pattern = rf'^- {re.escape(label)} \*\*v[^*]+\*\*$'
              repl = f'- {label} **v{v}**'
              txt, n = re.subn(pattern, repl, txt, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit(f'Hub registered list line missing for {sid}')
          txt = re.sub(r'Company Intelligence is currently registered at \*\*v[^*]+\*\*',
                       f'Company Intelligence is currently registered at **v{versions["company-intelligence"]}**', txt, count=1)
          txt = txt.replace('Account Auditor and SakaLuX Suite remain standalone tools and are intentionally not registered in `scripts.json`.',
                            'Chat Intelligence, Account Auditor and SakaLuX Suite remain standalone tools and are intentionally not registered in `scripts.json`.')
          hub.write_text(txt, encoding='utf-8')

          # Validate registry versions and doc surfaces after correction.
          doc_rows = []
          for key,(src,doc) in sources.items():
              v = versions[key]
              d = Path(doc).read_text(encoding='utf-8')
              cv = re.search(r'## Current version\s*\n\*\*v([^*]+)\*\*', d)
              cr = re.search(r'## Current release note\s*\n\s*\*\*v([0-9][0-9A-Za-z.\-]*)', d)
              if not cv or cv.group(1) != v or not cr or cr.group(1) != v:
                  raise SystemExit(f'Doc mismatch after sync: {key} source={v} current={cv.group(1) if cv else None} release={cr.group(1) if cr else None}')
              doc_rows.append((key, src, v, registered.get(key, 'standalone/core'), 'OK'))

          # Ensure registered entries match the canonical source.
          reg2 = json.loads(reg_path.read_text(encoding='utf-8'))
          entries2 = reg2.get('scripts', reg2 if isinstance(reg2, list) else [])
          for e in entries2:
              sid=e.get('id')
              if sid in registered:
                  v=versions[sid]
                  if e.get('version') != v or e.get('release',{}).get('version') != v:
                      raise SystemExit(f'Registry mismatch after sync: {sid}')

          rows = ['# Release Surface Audit — 2026-09-18','',
                  'Canonical rule: each userscript `@version` is the source of truth. Registered `scripts.json` version/release surfaces and each documentation `Current version` / `Current release note` label are synchronized to that source. Standalone/core scripts are checked directly against their documentation.','',
                  '| Module | Source | Canonical @version | Registry status | Documentation |',
                  '|---|---|---:|---|---|']
          for key,src,v,regstat,_ in doc_rows:
              if key in registered:
                  rs=f'{v} / release {v}'
              elif key in {'chat-intelligence','account-auditor','suite'}:
                  rs='intentionally standalone / not registered'
              elif key == 'script-hub':
                  rs='core manager / not a module entry'
              else:
                  rs=str(regstat)
              rows.append(f'| {key} | `{src}` | {v} | {rs} | Current version/release {v} — OK |')
          rows += ['', '## Validation',
                   '- All userscript headers were read directly from the current main-branch files.',
                   '- Every active registered module in `scripts.json` is synchronized to its userscript `@version`, including `release.version`.',
                   '- Every maintained Greasy Fork information page has matching `Current version` and `Current release note` labels.',
                   '- Script Hub registered-module version list is synchronized with the seven actual registry modules.',
                   '- Mission and Company stale prose references to older “current” versions were corrected.',
                   '- Chat Intelligence, Account Auditor and SakaLuX Suite remain intentionally outside the Hub registry.',
                   '- No userscript feature code or userscript version was changed by this release-surface synchronization pass.', '']
          Path('RELEASE-SURFACE-AUDIT-2026-09-18.md').write_text('\n'.join(rows), encoding='utf-8')

          # Remove one-shot trigger/workflow from main after successful sync.
          Path('.github/release-surface-sync.trigger').unlink(missing_ok=True)
          Path('.github/workflows/sync-all-release-surfaces-2026-09-18.yml').unlink(missing_ok=True)
          PY

      - name: Commit synchronized release surfaces
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Synchronize all script release surfaces'
          git push

name: Fix SakaLuX Standalone Dock v2

on:
  push:
    paths:
      - 'tools/fix_standalone_dock_v2.py'
      - '.github/workflows/fix-standalone-dock-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Dock v2
        run: python3 tools/fix_standalone_dock_v2.py
      - name: Remove one-time migration files
        run: |
          rm -f tools/fix_standalone_dock_v2.py
          rm -f .github/workflows/fix-standalone-dock-v2.yml
      - name: Validate changed scripts
        run: |
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Elimination-Assistant.user.js
          node --check SakaLuX-Script-Hub.user.js
          python3 -m json.tool scripts.json >/dev/null
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix standalone dock overlap and missing modules"
          git push origin HEAD:main

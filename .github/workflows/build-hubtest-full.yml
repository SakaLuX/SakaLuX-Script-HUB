name: Build Full Hubtest

on:
  push:
    paths:
      - '.github/scripts/build_hubtest_full.py'
      - '.github/workflows/build-hubtest-full.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build complete hubtest from official Hub
        run: python .github/scripts/build_hubtest_full.py
      - name: Validate hubtest syntax
        run: node --check hubtest.user.js
      - name: Commit complete hubtest
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add hubtest.user.js
          git commit -m "test: replace hubtest with full standalone Hub build"
          git push

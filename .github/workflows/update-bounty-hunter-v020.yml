name: Update Bounty Hunter v0.2.0

on:
  push:
    paths:
      - '.github/scripts/update_bounty_hunter_v020.py'
      - '.github/workflows/update-bounty-hunter-v020.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update registry
        run: python .github/scripts/update_bounty_hunter_v020.py
      - name: Syntax check
        run: node --check SakaLuX-Bounty-Hunter.user.js
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Bounty-Hunter.user.js').read_text(encoding='utf-8')
          d=Path('greasyfork/Bounty-Hunter.md').read_text(encoding='utf-8')
          r=json.loads(Path('scripts.json').read_text(encoding='utf-8'))
          assert '@version      0.2.0' in s
          assert "const VERSION='0.2.0'" in s
          assert 'api.torn.com/v2/torn/bounties' in s
          assert 'hospitalWindowMin' in s
          assert 'notifyTargets' in s
          assert '### v0.2.0' in d
          item=next(x for x in r['scripts'] if x.get('id')=='bounty-hunter')
          assert item['version']=='0.2.0'
          assert item['release']['version']=='0.2.0'
          print('verified Bounty Hunter v0.2.0')
          PY
      - name: Commit registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Register Bounty Hunter v0.2.0'
          git push

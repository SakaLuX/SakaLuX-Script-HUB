name: Update Bounty Hunter v0.2.0

on:
  push:
    paths:
      - '.github/scripts/update_bounty_hunter_v020.py'
      - '.github/workflows/update-bounty-hunter-v020.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update registry
        run: python .github/scripts/update_bounty_hunter_v020.py
      - name: Syntax check
        run: node --check SakaLuX-Bounty-Hunter.user.js
      - name: Verify
        run: |
          grep -q '@version      0.2.0' SakaLuX-Bounty-Hunter.user.js
          grep -q "const VERSION='0.2.0'" SakaLuX-Bounty-Hunter.user.js
          grep -q 'api.torn.com/v2/torn/bounties' SakaLuX-Bounty-Hunter.user.js
          grep -q 'hospitalWindowMin' SakaLuX-Bounty-Hunter.user.js
          grep -q 'notifyTargets' SakaLuX-Bounty-Hunter.user.js
          grep -q '### v0.2.0' greasyfork/Bounty-Hunter.md
          grep -q '"version": "0.2.0"' scripts.json
      - name: Commit registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Register Bounty Hunter v0.2.0'
          git push

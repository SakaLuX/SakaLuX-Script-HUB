name: Fix Account Auditor coverage v1.3.21
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_account_auditor_coverage_v1321.py'
      - '.github/workflows/fix-account-auditor-coverage-v1321.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Account Auditor coverage
        run: python3 .github/scripts/fix_account_auditor_coverage_v1321.py
      - name: Validate syntax
        run: node --check SakaLuX-Account-Auditor.user.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Account-Auditor.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Account Auditor endpoint coverage"
          git push

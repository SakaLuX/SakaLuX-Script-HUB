name: Fix Hub registry rollback cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hub-registry-rollback-cache.yml'
      - '.migration/fix-hub-registry-rollback-cache.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply registry rollback cache fix
        run: python .migration/fix-hub-registry-rollback-cache.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q '^// @version      1.9.36$' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.36';" SakaLuX-Script-Hub.user.js
          grep -q "updates: 'SakaLuX_HUB_UPDATES_V17'" SakaLuX-Script-Hub.user.js
          grep -q "registry: 'SakaLuX_HUB_REGISTRY_V19'" SakaLuX-Script-Hub.user.js
          grep -q "id: 'mission-rewards'.*version: '1.0.18'" SakaLuX-Script-Hub.user.js || true
          grep -q '"version": "1.0.18"' scripts.json
          python -m json.tool scripts.json >/dev/null
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix stale registry rollback cache in Hub v1.9.36 [skip ci]'
          git push

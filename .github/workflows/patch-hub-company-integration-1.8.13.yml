name: Patch Hub + Company integration
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-hub-company-integration.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_hub_company_integration_1_8_13.py
      - name: Validate
        run: |
          grep -q '@version      1.8.13' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q "version:'1.8.13'" SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q '@version      1.9.39' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.39'" SakaLuX-Script-Hub.user.js
          grep -q 'data-sakalux-hub-installed' SakaLuX-Script-Hub.user.js
          grep -q 'data-slx-standalone-registration' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q '"version": "1.8.13"' scripts.json
          python -m json.tool scripts.json >/dev/null
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          node --check SakaLuX-Script-Hub.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Company-Intelligence.md greasyfork/Script-Hub.md
          git commit -m 'Fix Hub and Company standalone integration'
          git push

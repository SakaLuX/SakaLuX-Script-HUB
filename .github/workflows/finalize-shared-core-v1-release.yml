name: Finalize Shared Core v1 release

on:
  push:
    branches:
      - test/shared-core-v1
    paths:
      - tools/finalize-shared-core-v1-release.cjs
      - .github/workflows/finalize-shared-core-v1-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/shared-core-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check finalizer
        run: node --check tools/finalize-shared-core-v1-release.cjs
      - name: Finalize versions and release surfaces
        run: node tools/finalize-shared-core-v1-release.cjs
      - name: Syntax check every userscript
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -maxdepth 1 -type f -name '*.user.js' -print0)
      - name: Run Shared Core regression
        run: node tests/shared-core-v1-regression.cjs
      - name: Run API broker regression
        run: node tests/shared-core-api-broker-regression.cjs
      - name: Run API integration regression
        run: node tests/shared-core-api-integration-regression.cjs
      - name: Run Market Travel regression
        run: node tests/market-travel-state-machine-regression.cjs
      - name: Run Stock rebalance regression
        run: node tests/stock-rebalance-state-machine-regression.cjs
      - name: Run repository-wide compatibility
        run: node tests/shared-core-v1-all-scripts.cjs
      - name: Commit finalized release surfaces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.user.js' scripts.json greasyfork/*.md SHARED-CORE-v1-RELEASE.md
          git commit -m 'Finalize Shared Core v1 production versions'
          git push origin HEAD:test/shared-core-v1

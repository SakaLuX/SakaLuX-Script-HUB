name: Elimination v1.3.3 Compact UI

on:
  push:
    paths:
      - '.github/workflows/elimination-v133-compact-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          echo ' outcome' | base64 -d > /tmp/elimination-v133.py

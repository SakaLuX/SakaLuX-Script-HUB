name: Elimination v1.3.3 Compact UI

on:
  push:
    paths:
      - '.github/workflows/elimination-v133-compact-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/elimination-v133.py
          python3 /tmp/elimination-v133.py
          node --check SakaLuX-Elimination-Assistant.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Elimination-Assistant.user.js').read_text()
          assert '// @version      1.3.3' in s
          assert "const VERSION='1.3.3';" in s
          assert 'slx-cal-mini' in s
          assert '<col class="signal">' in s
          assert '>ATK</a>' in s and '>W</button>' in s and '>L</button>' in s
          d=json.loads(Path('scripts.json').read_text())
          assert next(x for x in d['scripts'] if x['id']=='elimination-assistant')['version']=='1.3.3'
          assert Path('backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js').exists()
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Elimination-Assistant.user.js scripts.json greasyfork/Elimination-Assistant.md UPDATE-INFO.md backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js
          git diff --cached --quiet || git commit -m "feat: Elimination Assistant v1.3.3 compact attack-first UI"
          git push origin main

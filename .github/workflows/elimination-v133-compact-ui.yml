name: Elimination v1.3.3 Compact UI

on:
  push:
    paths:
      - '.github/workflows/elimination-v133-compact-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p=Path('SakaLuX-Elimination-Assistant.user.js')
          s=p.read_text()
          old=s
          backup=Path('backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js')
          if not backup.exists(): backup.write_text(s)

          s=s.replace('// @version      1.3.2','// @version      1.3.3',1)
          s=s.replace("const VERSION='1.3.2';","const VERSION='1.3.3';",1)

          new_signal="function signal(p){const r=risk(p);const top=`${p.ff?'FF '+p.ff.toFixed(2):'FF —'} · ${p.bs?'BS '+fmtBS(p.bs):'BS —'}`;const bottom=`${r.edge!==null?r.edge.toFixed(1)+'× · ':''}${r.label} · ${smart(p)}/100`;return top+'\\n'+bottom}"
          s,n=re.subn(r"function signal\(p\)\{[^\n]*\}",lambda m:new_signal,s,count=1)
          if n!=1: raise SystemExit('signal marker missing')

          old_controls='<div class="slx-t"><select id="slx-team"><option value="">Team…</option></select><button id="slx-load">LOAD</button><button id="slx-ff">FF SCAN</button><button id="slx-cal">CALIBRATE ME</button><input id="slx-q" placeholder="Player / ID"><select id="slx-filter"><option value="all">All</option><option value="safe">SAFE</option><option value="ok">SAFE + RISKY</option><option value="new">Not opened</option></select></div><div class="slx-s"><span id="slx-status">Set Torn API key in ⚙ Settings.</span><b id="slx-summary"></b></div>'
          new_controls='<div class="slx-t slx-top"><select id="slx-team"><option value="">Team…</option></select><button id="slx-load">LOAD</button><button id="slx-ff">FF SCAN</button></div><div class="slx-t slx-search"><select id="slx-filter"><option value="all">All</option><option value="safe">SAFE</option><option value="ok">SAFE + RISKY</option><option value="new">Not opened</option></select><input id="slx-q" placeholder="Player / ID"></div><div class="slx-s"><span id="slx-status">Set Torn API key in ⚙ Settings.</span><button class="slx-cal-mini" id="slx-cal">CALIBRATE</button><b id="slx-summary"></b></div>'
          if old_controls not in s: raise SystemExit('controls marker missing')
          s=s.replace(old_controls,new_controls,1)
          s=s.replace('<div class="slx-body"><table><thead>','<div class="slx-body"><table><colgroup><col class="signal"><col class="player"><col class="lvl"><col class="last"><col class="actions"></colgroup><thead>',1)
          s=s.replace('<a class="slx-a" href="https://www.torn.com/profiles.php?XID=${p.id}"','<a class="slx-a slx-player" href="https://www.torn.com/profiles.php?XID=${p.id}"',1)
          s=s.replace('<td><a class="slx-a atk" data-id="${p.id}"','<td class="slx-actions"><a class="slx-a atk" data-id="${p.id}"',1)
          s=s.replace('>ATTACK</a><button class="slx-a win"','>ATK</a><button class="slx-a win"',1)
          s=s.replace('>WIN</button><button class="slx-a loss"','>W</button><button class="slx-a loss"',1)
          s=s.replace('>LOSS</button></td></tr>','>L</button></td></tr>',1)
          s=s.replace("'uncalibrated'} · SAFE", "'—'} · SAFE",1)

          compact='''function compactCss(){if($('#slx-elim-compact-style'))return;const x=document.createElement('style');x.id='slx-elim-compact-style';x.textContent=`#${IDS.panel}{right:4px!important;bottom:72px!important;width:min(920px,calc(100vw - 8px))!important;height:88vh!important;max-height:calc(100vh - 88px)!important;font-size:13px!important}.slx-h{padding:6px 8px!important;gap:6px!important}.slx-h b{font-size:14px!important}.slx-t{padding:5px 7px!important;gap:5px!important;flex-wrap:nowrap!important}.slx-top #slx-team{flex:1!important;min-width:0!important}.slx-search #slx-filter{width:104px!important;flex:0 0 104px!important}.slx-search #slx-q{flex:1!important;min-width:0!important}.slx-t input,.slx-t select,.slx-t button{min-height:34px!important;padding:6px 7px!important;font-size:12px!important}.slx-s{padding:4px 7px!important;gap:5px!important;flex-wrap:nowrap!important;min-height:32px!important}.slx-s span{min-width:0!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;font-size:11px!important}.slx-s b{font-size:11px!important;white-space:nowrap!important;color:#facc15!important}.slx-cal-mini{background:#2a220b!important;color:#fde68a!important;border:1px solid #7c5f11!important;border-radius:7px!important;padding:4px 6px!important;min-height:26px!important;font-size:10px!important;font-weight:900!important;white-space:nowrap!important}.slx-body table{table-layout:fixed!important}.slx-body col.signal{width:35%}.slx-body col.player{width:23%}.slx-body col.lvl{width:7%}.slx-body col.last{width:9%}.slx-body col.actions{width:26%}.slx-body th,.slx-body td{font-size:11px!important;padding:5px 3px!important;line-height:1.12!important;vertical-align:middle!important;overflow:hidden!important}.slx-body td:first-child{min-width:0!important;white-space:pre-line!important}.slx-body td:nth-child(2){min-width:0!important;white-space:nowrap!important;text-overflow:ellipsis!important}.slx-body td:nth-child(2) small{display:block;font-size:8px;color:#94a3b8}.slx-body td:nth-child(3),.slx-body td:nth-child(4){text-align:center;white-space:nowrap}.slx-player{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slx-actions{white-space:nowrap!important;text-align:right!important}.slx-actions .slx-a{display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:9px!important;padding:3px 4px!important;min-height:24px!important;min-width:22px!important;margin:1px!important}.slx-actions .atk{min-width:34px!important;font-weight:900!important}.slx-actions .win{color:#86efac!important}.slx-actions .loss{color:#fda4af!important}.safe{color:#4ade80!important}.risky{color:#fbbf24!important}.skip{color:#fb7185!important}@media(max-width:640px){#${IDS.panel}{height:90vh!important;max-height:calc(100vh - 72px)!important}}`;document.head.appendChild(x)}'''
          marker='function inject(){if(!state.enabled||$(\'#\'+IDS.panel))return;css();'
          if marker not in s: raise SystemExit('inject marker missing')
          s=s.replace(marker,compact+'\n'+marker.replace('css();','css();compactCss();'),1)

          p.write_text(s)
          if s==old: raise SystemExit('no changes')

          j=Path('scripts.json'); data=json.loads(j.read_text())
          for row in data.get('scripts',[]):
              if row.get('id')=='elimination-assistant': row['version']='1.3.3'
          j.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          md=Path('greasyfork/Elimination-Assistant.md'); t=md.read_text()
          t=re.sub(r'## Current version\s+\*\*v[^*]+\*\*','## Current version\n\n**v1.3.3**',t,count=1)
          entry='''\n## v1.3.3 — Compact attack-first TornPDA layout\n\n- Moved the target filter beside Player / ID and moved CALIBRATE into the thin status bar.\n- Reduced header/control height to show substantially more targets.\n- Signal / Player / Lvl / Last / Actions now use fixed mobile columns on one row.\n- Signal is condensed to two lines and actions are compact ATK / W / L controls.\n- Added exact backup: `backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js`.\n\n'''
          if '## v1.3.3 — Compact attack-first TornPDA layout' not in t:
              pos=t.find('\n## '); t=t[:pos+1]+entry+t[pos+1:]
          t=re.sub(r'## Current release notes\s+\n\n### v[^\n]+','## Current release notes\n\n### v1.3.3',t,count=1)
          md.write_text(t)

          u=Path('UPDATE-INFO.md'); x=u.read_text()
          x=x.replace('Last updated: 2026-09-09','Last updated: 2026-09-10',1)
          x=x.replace('SakaLuX Elimination Assistant: **v1.3.2**','SakaLuX Elimination Assistant: **v1.3.3**',1)
          if '### SakaLuX Elimination Assistant v1.3.3' not in x:
              x=x.replace('## Latest changes\n','## Latest changes\n\n### SakaLuX Elimination Assistant v1.3.3\n- Compact attack-first TornPDA layout with filter/search row, status-bar calibration, fixed target columns and ATK/W/L actions.\n- Added exact backup: `backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js`.\n\n',1)
          x=x.replace('**Elimination Assistant v1.2.9** — info/release notes current','**Elimination Assistant v1.3.3** — info/release notes current',1)
          u.write_text(x)
          PY
          node --check SakaLuX-Elimination-Assistant.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Elimination-Assistant.user.js').read_text()
          assert '// @version      1.3.3' in s and "const VERSION='1.3.3';" in s
          assert 'compactCss()' in s and 'slx-cal-mini' in s
          assert '<col class="signal">' in s and '>ATK</a>' in s and '>W</button>' in s and '>L</button>' in s
          assert "top+'\\n'+bottom" in s
          d=json.loads(Path('scripts.json').read_text())
          assert next(x for x in d['scripts'] if x['id']=='elimination-assistant')['version']=='1.3.3'
          assert Path('backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js').exists()
          assert '**v1.3.3**' in Path('greasyfork/Elimination-Assistant.md').read_text()
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Elimination-Assistant.user.js scripts.json greasyfork/Elimination-Assistant.md UPDATE-INFO.md backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js
          git diff --cached --quiet || git commit -m "feat: Elimination Assistant v1.3.3 compact attack-first UI"
          git push origin main

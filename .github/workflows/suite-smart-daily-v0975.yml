name: Suite Smart Daily Checklist v0.9.975

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/suite-smart-daily-v0975.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suite-smart-daily-v0975
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply full-day pagination fix v0.9.975
        run: python3 .github/scripts/fix_suite_daily_pagination_v0975.py
      - name: Validate Suite JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Install regression-test dependency
        run: npm install --no-save --package-lock=false jsdom@24
      - name: Run Smart Daily Checklist regression
        run: node tests/suite-daily-progress-regression.cjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit Suite fix
        run: |
          if git diff --quiet -- SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-daily-progress-regression.cjs; then
            echo "Suite v0.9.975 already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-daily-progress-regression.cjs
            git commit -m "Fix Suite v0.9.975 full-day Torn pagination"
            git push origin HEAD:main
          fi
      - name: Create Suite tag
        run: |
          git fetch origin main --tags
          git reset --hard origin/main
          TAG="suite-v0.9.975"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo "$TAG exists"; else git tag -a "$TAG" -m "SakaLuX Suite v0.9.975" && git push origin "$TAG"; fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="suite-v0.9.975"
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release exists"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "SakaLuX Suite v0.9.975 — Full-Day Wheel Pagination" --notes $'## Full-day Torn pagination fix\n\n- Fixes logs/events being limited to the first 100 rows.\n- Uses current UTC/TCT day, sort=asc, limit=100.\n- Follows _metadata.links.next and merges pages before Wheel detection.\n- COPY DEBUG reports pagination page/row counts and cap state.\n- Keeps API keys out of reused pagination links.'
          fi

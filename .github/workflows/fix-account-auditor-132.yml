name: Fix Account Auditor v1.3.2

on:
  push:
    branches: [main]
    paths:
      - '.migration/fix-account-auditor-132.py'
      - '.github/workflows/fix-account-auditor-132.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Account Auditor fixes
        run: python .migration/fix-account-auditor-132.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Account-Auditor.user.js
          grep -q '^// @version      1.3.2$' SakaLuX-Account-Auditor.user.js
          grep -q "const VERSION = '1.3.2';" SakaLuX-Account-Auditor.user.js
          grep -q 'sakalux-torn-account-snapshot-v5' SakaLuX-Account-Auditor.user.js
          grep -q 'sakalux-account-split-v3' SakaLuX-Account-Auditor.user.js
          grep -q 'decodeMerits' SakaLuX-Account-Auditor.user.js
          grep -q 'tornV2Selection' SakaLuX-Account-Auditor.user.js
          ! grep -q "'revivesfull','trade','trades'" SakaLuX-Account-Auditor.user.js
          grep -q '\*\*v1.3.2\*\*' greasyfork/Account-Auditor.md
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Account-Auditor.user.js greasyfork/Account-Auditor.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Account Auditor API accuracy v1.3.2 [skip ci]'
          git push

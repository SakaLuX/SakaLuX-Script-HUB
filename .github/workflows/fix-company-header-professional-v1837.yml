name: Fix Company professional mobile header v1.8.37

on:
  push:
    paths:
      - '.github/workflows/fix-company-header-professional-v1837.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup and patch Company
        shell: python
        run: |
          from pathlib import Path

          path = Path('SakaLuX-Company-Intelligence-v1.0.0.user.js')
          text = path.read_text(encoding='utf-8')

          backup = Path('backups/company-v1.8.37-professional-mobile-header-2026-09-18')
          backup.mkdir(parents=True, exist_ok=True)
          (backup / 'SakaLuX-Company-Intelligence-v1.8.36.user.js').write_text(text, encoding='utf-8')

          text = text.replace('// @version      1.8.36', '// @version      1.8.37', 1)
          text = text.replace("version:'1.8.36'", "version:'1.8.37'", 1)

          marker = '/* SAKALUX_COMPANY_PRO_HEADER_V1837 */'
          block = r'''

/* SAKALUX_COMPANY_PRO_HEADER_V1837 */
(()=>{
  const id='sakalux-company-pro-header-v1837';
  document.getElementById(id)?.remove();
  const st=document.createElement('style');
  st.id=id;
  st.textContent=`
@media(max-width:720px){
  #ci-root .ci-head{
    display:grid!important;
    grid-template-columns:minmax(0,1fr) 42px 42px 42px!important;
    grid-template-rows:auto auto!important;
    column-gap:6px!important;
    row-gap:8px!important;
    align-items:center!important;
    width:100%!important;
    box-sizing:border-box!important;
    padding:9px 10px 8px!important;
    min-height:0!important;
    overflow:hidden!important;
  }
  #ci-root .ci-brand{
    grid-column:1!important;
    grid-row:1!important;
    min-width:0!important;
    width:auto!important;
    overflow:hidden!important;
    padding-right:4px!important;
  }
  #ci-root .ci-brand b{
    display:block!important;
    width:100%!important;
    margin:0!important;
    font-size:15px!important;
    line-height:1.12!important;
    font-weight:900!important;
    white-space:normal!important;
    overflow-wrap:normal!important;
    word-break:normal!important;
    color:#f8fafc!important;
  }
  #ci-root .ci-brand small{
    display:block!important;
    width:100%!important;
    margin-top:4px!important;
    font-size:9.5px!important;
    line-height:1.15!important;
    white-space:nowrap!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
    color:#8fa1b5!important;
  }
  #ci-root .ci-head>.ci-icon{
    position:static!important;
    inset:auto!important;
    width:42px!important;
    min-width:42px!important;
    max-width:42px!important;
    height:42px!important;
    min-height:42px!important;
    margin:0!important;
    padding:0!important;
    display:grid!important;
    place-items:center!important;
    justify-self:end!important;
    align-self:center!important;
    border-radius:12px!important;
    box-sizing:border-box!important;
    transform:none!important;
  }
  #ci-root .ci-head>.ci-icon[data-act="refresh"]{grid-column:2!important;grid-row:1!important}
  #ci-root .ci-head>.ci-icon[data-act="settings"]{grid-column:3!important;grid-row:1!important}
  #ci-root .ci-head>.ci-icon[data-act="close"]{grid-column:4!important;grid-row:1!important}
  #ci-root .ci-mode{
    grid-column:1 / -1!important;
    grid-row:2!important;
    display:grid!important;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    margin:0!important;
    padding:0!important;
    box-sizing:border-box!important;
    overflow:hidden!important;
    border-radius:12px!important;
  }
  #ci-root .ci-mode button{
    width:100%!important;
    min-width:0!important;
    max-width:none!important;
    margin:0!important;
    padding:10px 8px!important;
    box-sizing:border-box!important;
    font-size:11px!important;
    line-height:1!important;
    white-space:nowrap!important;
    border-radius:0!important;
  }
  #ci-root .ci-tabs{top:108px!important}
}
@media(max-width:430px){
  #ci-root .ci-head{grid-template-columns:minmax(0,1fr) 40px 40px 40px!important;column-gap:5px!important;padding-left:8px!important;padding-right:8px!important}
  #ci-root .ci-head>.ci-icon{width:40px!important;min-width:40px!important;max-width:40px!important;height:40px!important;min-height:40px!important}
  #ci-root .ci-brand b{font-size:14px!important}
  #ci-root .ci-brand small{font-size:9px!important}
}
`;
  (document.head||document.documentElement).appendChild(st);
})();
'''
          if marker not in text:
              text += block

          path.write_text(text, encoding='utf-8')

          doc = Path('greasyfork/Company-Intelligence.md')
          d = doc.read_text(encoding='utf-8')
          d = d.replace('**v1.8.31**', '**v1.8.37**', 1)
          note = '''\n### v1.8.37 — Professional TornPDA header layout\n- Fixes Company header overflow caused by the older Elimination-style override.\n- Keeps Refresh, API and Close grouped tightly at the top-right and permanently inside the viewport.\n- Gives the Company title the remaining header width for cleaner typography.\n- Moves Employee/Director to a dedicated full-width second row with equal-width controls, preventing Director from leaving the screen.\n- Leaves shared standalone behavior unchanged.\n'''
          if '### v1.8.37' not in d:
              anchor = '## Release history / Changelog\n'
              if anchor in d:
                  d = d.replace(anchor, anchor + note + '\n', 1)
              else:
                  d += note
          doc.write_text(d, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          f='SakaLuX-Company-Intelligence-v1.0.0.user.js'
          grep -q '// @version      1.8.37' "$f"
          grep -q "version:'1.8.37'" "$f"
          grep -q 'SAKALUX_COMPANY_PRO_HEADER_V1837' "$f"
          grep -q 'grid-template-columns:minmax(0,1fr) 42px 42px 42px' "$f"
          grep -q 'grid-column:1 / -1' "$f"
          grep -q 'data-act="close"' "$f"
          grep -q '### v1.8.37' greasyfork/Company-Intelligence.md
          node --check "$f"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js greasyfork/Company-Intelligence.md backups/company-v1.8.37-professional-mobile-header-2026-09-18
          git commit -m 'Company v1.8.37: professional mobile header layout'
          git push

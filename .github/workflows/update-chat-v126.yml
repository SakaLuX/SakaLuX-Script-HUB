name: Update Chat Intelligence v1.2.26

on:
  push:
    paths:
      - '.github/scripts/update_chat_v126.py'
      - '.github/workflows/update-chat-v126.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Chat Intelligence v1.2.26 patch
        run: python .github/scripts/update_chat_v126.py
      - name: Syntax check
        run: node --check SakaLuX-Chat-Intelligence.user.js
      - name: Verify restored controls and settings
        run: |
          grep -q '@version      1.2.26' SakaLuX-Chat-Intelligence.user.js
          grep -q "const V='1.2.26'" SakaLuX-Chat-Intelligence.user.js
          grep -q 'contextFavorite' SakaLuX-Chat-Intelligence.user.js
          grep -q 'contextReply' SakaLuX-Chat-Intelligence.user.js
          grep -q 'contextCopyId' SakaLuX-Chat-Intelligence.user.js
          grep -q 'contextCopyName' SakaLuX-Chat-Intelligence.user.js
          grep -q 'contextProfile' SakaLuX-Chat-Intelligence.user.js
          grep -q 'contextMute' SakaLuX-Chat-Intelligence.user.js
          grep -q 'contextAlias' SakaLuX-Chat-Intelligence.user.js
          grep -q 'Reset settings' SakaLuX-Chat-Intelligence.user.js
          grep -q 'function chatShell' SakaLuX-Chat-Intelligence.user.js
          grep -q 'function restoreStyle' SakaLuX-Chat-Intelligence.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Chat-Intelligence.user.js greasyfork/Chat-Intelligence.md
          if git diff --cached --quiet; then
            echo 'No release changes required.'
          else
            git commit -m 'Release Chat Intelligence v1.2.26'
            git push
          fi

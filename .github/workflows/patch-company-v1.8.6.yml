name: Patch Company Intelligence v1.8.6

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-company-v1.8.6.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Company Intelligence
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('SakaLuX-Company-Intelligence-v1.0.0.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      1.8.5','// @version      1.8.6',1)
          s=s.replace("version:'1.8.5'","version:'1.8.6'",1)

          old="for(const src of [job(),userProfile(),S.data.job,S.data.userProfile,S.data.legacyJob]){const id=num(first(src,paths,0));if(id>0)return id}"
          new="for(const src of [profile(),S.data.profile,job(),userProfile(),S.data.job,S.data.userProfile,S.data.legacyJob]){const id=num(first(src,['id','ID','company_id','companyId','company.id','company.ID','company.company_id','company.companyId','job.company_id','job.companyId','job.company.id','employment.company_id','employment.company.id'],0));if(id>0)return id}"
          if old not in s:
              raise SystemExit('detectCompanyId source loop not found')
          s=s.replace(old,new,1)

          old2=" const companyId=detectCompanyId();\n delete S.data.employees;delete S.data.stock;\n if(companyId){"
          new2=""" let selfProfile=null;\n try{selfProfile=await legacyApi('company','','profile')}catch{}\n if(selfProfile){S.data.profile=selfProfile;set(KEY.company,selfProfile)}\n const companyId=detectCompanyId();\n delete S.data.employees;delete S.data.stock;\n if(companyId){"""
          if old2 not in s:
              raise SystemExit('refresh company block not found')
          s=s.replace(old2,new2,1)

          old3="const x=unwrap(S.data.employees,'employees');"
          new3="const x=unwrap(S.data.employees,'employees');"
          # no-op anchor retained intentionally

          old4="kv('Company ID',detectCompanyId()||'Missing')+kv('Company profile',health().available?'Loaded':'Missing')+kv('Employees',employees().length||'Not loaded')"
          new4="kv('Company ID',detectCompanyId()||'Missing')+kv('Company profile',health().available?'Loaded':'Missing')+kv('Employees',S.mode==='director'?(employees().length||'Not loaded'):'Director only')"
          if old4 in s:
              s=s.replace(old4,new4,1)

          p.write_text(s,encoding='utf-8')

          md=Path('greasyfork/Company-Intelligence.md')
          if md.exists():
              m=md.read_text(encoding='utf-8')
              m=m.replace('**v1.8.5**','**v1.8.6**',1)
              marker='## Current release note\n'
              if marker in m:
                  st=m.index(marker)+len(marker); en=m.find('\n## ',st)
                  if en==-1: en=len(m)
                  note='\n**v1.8.6** fixes self-company discovery for employee mode. The script now calls the API v1 company profile without requiring a company ID first, which Torn supports for the API key owner. This provides the real company rating, age and company ID, then allows v2/company calls to continue normally.\n'
                  m=m[:st]+note+m[en:]
              hist='## Release history\n'
              if hist in m and '### v1.8.6 — Self-company discovery fix' not in m:
                  m=m.replace(hist,hist+'### v1.8.6 — Self-company discovery fix\n\n- Loads the API key owner company profile without requiring a company ID first.\n- Recovers real company stars, age and ID in Employee mode.\n- Uses the recovered company ID for subsequent company API requests.\n- Sync Diagnostics now shows Employees as Director only in Employee mode.\n\n',1)
              md.write_text(m,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q '@version      1.8.6' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q "version:'1.8.6'" SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q "legacyApi('company','','profile')" SakaLuX-Company-Intelligence-v1.0.0.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js greasyfork/Company-Intelligence.md
          git commit -m 'Company Intelligence v1.8.6: fix self-company discovery'
          git push

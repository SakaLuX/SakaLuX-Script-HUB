name: Patch hubtest 1.9.57

on:
  push:
    paths:
      - '.github/scripts/patch_hubtest_1957.py'
      - '.github/workflows/patch-hubtest-1957.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hubtest
        run: python .github/scripts/patch_hubtest_1957.py
      - name: Validate syntax
        run: node --check hubtest.user.js
      - name: Commit hubtest
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add hubtest.user.js
          git commit -m "test: hubtest 1.9.57 exact module fullscreen contract"
          git push

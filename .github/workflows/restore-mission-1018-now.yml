name: Restore Mission Rewards stable v1.0.18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-mission-1018-now.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact stable Mission Rewards and sync metadata
        run: |
          set -euo pipefail
          git show 17848cae628043a59b460f8e35e2d6bd2b810c3b:SakaLuX-Mission-Rewards.user.js > SakaLuX-Mission-Rewards.user.js
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')

          # scripts.json
          p=root/'scripts.json'
          data=json.loads(p.read_text(encoding='utf-8'))
          for row in data['scripts']:
              if row.get('id')=='mission-rewards':
                  row['version']='1.0.18'
                  row['description']='Mission Shop reward value, ammo ownership and weapon mod intelligence.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Hub fallback only. Do not bump Hub version.
          p=root/'SakaLuX-Script-Hub.user.js'
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"(id\s*:\s*'mission-rewards'.*?version\s*:\s*')([^']+)(')",r"\g<1>1.0.18\3",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Mission fallback row not found in Hub')
          p.write_text(s,encoding='utf-8')

          # Mission info page
          p=root/'greasyfork/Mission-Rewards.md'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(## Current version\s*\n)\*\*v[^*]+\*\*',r'\1**v1.0.18**',s,count=1)
          s=re.sub(r'## Current release note\s*\n\n.*?\n\n## Recommended',
                   '## Current release note\n\n**v1.0.18** is the restored stable Mission Rewards release. The experimental integrated Mission Hints code has been removed from the Mission Rewards userscript so its startup, Hub registration, ON/OFF and Mission Shop features remain isolated and reliable.\n\n## Recommended',
                   s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')

          # Hub info managed-version listing only
          p=root/'greasyfork/Script-Hub.md'
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(Mission Rewards\s+\*\*v)[^*]+(\*\*)',r'\g<1>1.0.18\2',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate stable core and synchronized versions
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Script-Hub.user.js
          grep -q '^// @version      1.0.18$' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.0.18';" SakaLuX-Mission-Rewards.user.js
          ! grep -q 'SAKALUX_MISSION_HINTS' SakaLuX-Mission-Rewards.user.js
          grep -q '"version": "1.0.18"' scripts.json
          python -m json.tool scripts.json >/dev/null
      - name: Commit rollback
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js scripts.json SakaLuX-Script-Hub.user.js greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore stable Mission Rewards v1.0.18 [skip ci]'
          git push

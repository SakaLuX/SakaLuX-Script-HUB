name: Fix Market travel-only panels 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_market_travel_only_20260919.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Market Intelligence
        run: python3 .github/scripts/fix_market_travel_only_20260919.py
      - name: Normalize release surfaces
        run: python3 .github/scripts/normalize_installed_versions.py
      - name: Validate JavaScript
        run: node --check SakaLuX-Market-Intelligence.user.js
      - name: Assert travel-only guards
        run: |
          grep -q 'v1.17.43: travel-only hard guard' SakaLuX-Market-Intelligence.user.js
          grep -q "state.page!=='travel'" SakaLuX-Market-Intelligence.user.js
          grep -q '// @version      1.17.43' SakaLuX-Market-Intelligence.user.js
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Market-Intelligence.user.js scripts.json greasyfork/Market-Intelligence.md
          git commit -m 'Fix Market travel-only panels'
          git push

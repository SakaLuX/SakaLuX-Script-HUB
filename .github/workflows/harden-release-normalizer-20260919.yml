name: Harden release normalizer 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/harden_release_normalizer_20260919.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Harden permanent normalizer
        run: python3 .github/scripts/harden_release_normalizer_20260919.py
      - name: Run permanent normalizer
        run: python3 .github/scripts/normalize_installed_versions.py
      - name: Validate JavaScript
        run: node --check SakaLuX-Script-Hub.user.js
      - name: Install INFO NEW regression dependency
        run: npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Validate Hub INFO and NEW
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/hub-details-regression.cjs
      - name: Commit permanent synchronization
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/normalize_installed_versions.py SakaLuX-Script-Hub.user.js scripts.json greasyfork/*.md
          git commit -m "Harden permanent release and INFO NEW synchronization"
          git push

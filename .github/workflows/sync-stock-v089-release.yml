name: Sync Stock v0.8.9 release

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_stock_v089_release.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Stock release metadata
        run: python3 .github/scripts/sync_stock_v089_release.py
      - name: Normalize all release surfaces
        run: python3 .github/scripts/normalize_installed_versions.py
      - name: Validate JavaScript
        run: |
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          node --check SakaLuX-Script-Hub.user.js
      - name: Commit synchronized release surfaces
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Stock-Manager-Advisor.md
          git commit -m "Synchronize Stock Manager v0.8.9 release surfaces"
          git push

name: Patch Account Auditor v1.1.2 docs
on:
  push:
    paths:
      - '.github/workflows/patch-aa-v1.1.2-docs.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/patches/aa-v1.1.2-docs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPDATE-INFO.md greasyfork/Account-Auditor.md
          git commit -m "Document Account Auditor v1.1.2"
          git push

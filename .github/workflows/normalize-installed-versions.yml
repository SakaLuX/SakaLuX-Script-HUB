name: Normalize installed versions
on:
  push:
    branches: [main]
    paths:
      - '*.user.js'
      - 'scripts.json'
      - 'greasyfork/*.md'
      - 'release-config.json'
      - 'tools/sync_release_metadata.py'
      - 'tools/release_preflight.py'
      - '.github/scripts/verify_release_consistency.py'
      - '.github/scripts/verify_runtime_version_signals.py'
      - '.github/workflows/normalize-installed-versions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: normalize-installed-versions-main
  cancel-in-progress: true
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      # Historical one-shot patch migrations are already part of production.
      # Reapplying them can restore stale releases and fail on newer metadata.
      # Version changes use tools/sync_release_metadata.py with explicit notes;
      # CI verifies the committed release without silently rewriting it.
      - name: Verify release and changelog consistency
        run: python3 .github/scripts/verify_release_consistency.py
      - name: Verify application version signals
        run: python3 .github/scripts/verify_runtime_version_signals.py
      - name: Verify complete release metadata
        run: python3 tools/release_preflight.py --all

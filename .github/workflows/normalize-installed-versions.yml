name: Normalize installed versions
on:
  push:
    branches: [main]
    paths:
      - '*.user.js'
      - 'scripts.json'
      - 'greasyfork/*.md'
      - '.github/scripts/normalize_installed_versions.py'
      - '.github/scripts/sync_release_doc_headers.py'
      - '.github/scripts/verify_release_consistency.py'
      - '.github/scripts/fix_historical_changelog_details.py'
      - '.github/scripts/fix_bazaar_v1114_release.py'
      - '.github/scripts/fix_standalone_hub_navigation.py'
      - '.github/scripts/ensure_auditor_draggable.py'
      - '.github/scripts/fix_bazaar_smart_pricer_power.py'
      - '.github/scripts/fix_bazaar_pricer_sell_floor.py'
      - '.github/scripts/fix_market_intelligence_budget_cap.py'
      - '.github/scripts/fix_enhancer_inventory_market.py'
      - '.github/scripts/fix_suite_target_alerts_mobile.py'
      - '.github/scripts/fix_suite_target_alerts_render.py'
      - '.github/scripts/polish_suite_target_alerts_ui.py'
      - '.github/workflows/normalize-installed-versions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: normalize-installed-versions-main
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix standalone dock order and module navigation
        run: python3 .github/scripts/fix_standalone_hub_navigation.py
      - name: Make Account Auditor launcher draggable
        run: python3 .github/scripts/ensure_auditor_draggable.py
      - name: Make Bazaar Smart Pricer power global
        run: python3 .github/scripts/fix_bazaar_smart_pricer_power.py
      - name: Fix Bazaar Smart Pricer city sell floor
        run: python3 .github/scripts/fix_bazaar_pricer_sell_floor.py
      - name: Enforce Market Intelligence travel budget cap
        run: python3 .github/scripts/fix_market_intelligence_budget_cap.py
      - name: Fix Enhancer inventory cache visibility and direct market links
        run: python3 .github/scripts/fix_enhancer_inventory_market.py
      - name: Normalize module, Hub, NEW and release surfaces
        run: python3 .github/scripts/normalize_installed_versions.py
      - name: Fix Suite Target Alerts People panel on TornPDA
        run: python3 .github/scripts/fix_suite_target_alerts_mobile.py
      - name: Recover Suite Target Alerts list rendering
        run: python3 .github/scripts/fix_suite_target_alerts_render.py
      - name: Polish Suite Target Alerts People panel
        run: python3 .github/scripts/polish_suite_target_alerts_ui.py
      - name: Correct Bazaar Smart Pricer v1.1.14 release metadata
        run: python3 .github/scripts/fix_bazaar_v1114_release.py
      - name: Repair historical changelog detail gaps
        run: python3 .github/scripts/fix_historical_changelog_details.py
      - name: Synchronize release documentation headers
        run: python3 .github/scripts/sync_release_doc_headers.py
      - name: Verify release and changelog consistency
        run: python3 .github/scripts/verify_release_consistency.py
      - name: Validate JavaScript syntax
        run: |
          for f in *.user.js; do node --check "$f"; done
      - name: Commit normalization if needed
        run: |
          if git diff --quiet; then
            echo "Version, release and changelog surfaces already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.user.js' scripts.json greasyfork/*.md
          git commit -m "Synchronize versions releases and changelogs"
          git push

name: Audit API key architecture 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit_api_key_architecture_20260919.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit API key architecture
        run: python3 .github/scripts/audit_api_key_architecture_20260919.py
      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md)" ]; then
            echo "No audit report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md
          git commit -m "Audit API key architecture"
          git push

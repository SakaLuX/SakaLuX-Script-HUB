name: One-time remove Market and Enhancer launchers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-market-enhancer-launchers.yml'
      - '.migration/remove-market-enhancer-launchers.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply migration
        run: python .migration/remove-market-enhancer-launchers.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          python -m json.tool scripts.json >/dev/null
          ! grep -q "function createButton()" SakaLuX-Enhancer-Guard.user.js
          ! grep -q "id = 'sl-eg-button'" SakaLuX-Enhancer-Guard.user.js
          ! grep -q "function createButton(){" SakaLuX-Market-Intelligence.user.js
          ! grep -q "b.id='sl-mi-button'" SakaLuX-Market-Intelligence.user.js
      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Market-Intelligence.user.js scripts.json greasyfork/Script-Hub.md greasyfork/Enhancer-Guard.md greasyfork/Market-Intelligence.md
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Remove Market and Enhancer floating launchers [skip ci]'
          git push

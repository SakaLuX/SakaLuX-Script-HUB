name: Upgrade Stocks v0.8.2 Portfolio Simulator

on:
  push:
    paths:
      - '.github/workflows/upgrade-stocks-portfolio-v082.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Upgrade Stocks v0.8.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          sp=Path('SakaLuX-Stock-Manager-Advisor.user.js'); dp=Path('greasyfork/Stock-Manager-Advisor.md'); rp=Path('scripts.json')
          s=sp.read_text(); d=dp.read_text(); r=json.loads(rp.read_text())
          if '// @version      0.8.1' not in s: raise SystemExit('Expected v0.8.1 baseline')
          b=Path('backups/stocks-v0.8.2-portfolio-simulator-2026-09-18'); b.mkdir(parents=True,exist_ok=True)
          (b/'SakaLuX-Stock-Manager-Advisor-v0.8.1.user.js').write_text(s); (b/'Stock-Manager-Advisor-v0.8.1.md').write_text(d)
          e=next(x for x in r['scripts'] if x.get('id')=='stock-manager-advisor'); (b/'scripts-stock-entry-v0.8.1.json').write_text(json.dumps(e,indent=2)+'\n')
          s=s.replace('// @version      0.8.1','// @version      0.8.2',1).replace("version:'0.8.1'","version:'0.8.2'").replace("version: '0.8.1'","version: '0.8.2'")
          pat=r"  function renderPortfolioSimulatorV080\(\)\{.*?\n  \}\n\n  function bindAdvisorSuiteControlsV080\(\)\{"
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit('Portfolio simulator anchor not found')
          block="  function portfolioValueV082(){let total=0;for(const [sym] of S.stocks){const m=stockRowMetrics(sym);if(m&&m.price>0)total+=Math.max(0,Number(m.owned)||ownedShares(sym))*m.price;}return total;}\n  function annualBenefitValueV082(sym){const p=BENEFITS?.[sym]||{};const direct=Number(p.annualValue||p.yearlyValue||p.valueYear||0);if(direct>0)return direct;const weekly=Number(p.weeklyValue||p.valueWeek||0);if(weekly>0)return weekly*52;const monthly=Number(p.monthlyValue||p.valueMonth||0);return monthly>0?monthly*12:0;}\n  function positionBenefitYieldV082(sym,owned,price){if(!(price>0&&owned>0))return 0;const tier=benefitTier(sym,owned),keep=Math.max(0,Number(tier.keep)||0),annual=annualBenefitValueV082(sym);return keep>0&&annual>0&&owned>=keep?annual/(keep*price):0;}\n  function technicalBiasV082(sym){try{const x=Number(technicalStatsV080(sym,'1w')?.signal?.score);return Number.isFinite(x)?x:0;}catch{return 0;}}\n  function renderPortfolioSimulatorV080(){\n    const host=ensureAdvisorSuiteHostV080();if(!host)return;\n    const fromSel=host.querySelector('#slx-v080-sim-from'),toSel=host.querySelector('#slx-v080-sim-to'),amountEl=host.querySelector('#slx-v080-sim-amount'),box=host.querySelector('#slx-v080-simulator');\n    const syms=[...S.stocks.keys()].sort();if(!syms.length){box.innerHTML='<div class=\\\"slx-v080-empty\\\">No stocks detected.</div>';return;}\n    const fill=el=>{if(el.options.length!==syms.length||![...el.options].every((o,i)=>o.value===syms[i]))el.innerHTML=syms.map(x=>`<option value=\\\"${esc(x)}\\\">${esc(x)}</option>`).join('');};fill(fromSel);fill(toSel);\n    const f=get(K.simFrom,syms[0]),t=get(K.simTo,syms.find(x=>x!==f)||syms[0]);fromSel.value=syms.includes(f)?f:syms[0];toSel.value=syms.includes(t)?t:(syms.find(x=>x!==fromSel.value)||fromSel.value);amountEl.value=get(K.simAmount,'10m');\n    const from=stockRowMetrics(fromSel.value),to=stockRowMetrics(toSel.value),requested=Math.max(0,parseAmount(amountEl.value));\n    if(!from||!to||!(from.price>0)||!(to.price>0)){box.innerHTML='<div class=\\\"slx-v080-empty\\\">Waiting for live stock metrics.</div>';return;}if(fromSel.value===toSel.value){box.innerHTML='<div class=\\\"slx-v080-empty\\\">Choose two different stocks.</div>';return;}\n    const sellable=Math.max(0,Math.floor(Number(from.freeShares)||0)),maxSafeValue=sellable*from.price,amount=Math.min(requested,maxSafeValue),sellShares=Math.min(sellable,Math.floor(amount/from.price)),proceeds=sellShares*from.price,buyShares=Math.floor(proceeds/to.price),buyCost=buyShares*to.price,unused=Math.max(0,proceeds-buyCost);\n    const fromOwned=Math.max(0,Number(from.owned)||ownedShares(fromSel.value)),toOwned=Math.max(0,Number(to.owned)||ownedShares(toSel.value)),fromAfter=Math.max(0,fromOwned-sellShares),toAfter=toOwned+buyShares;\n    const beforeTier=benefitTier(toSel.value,toOwned),afterTier=benefitTier(toSel.value,toAfter),beforeGap=Math.max(0,(Number(beforeTier.next)||0)-toOwned),afterGap=Math.max(0,(Number(afterTier.next)||0)-toAfter);\n    const beforePortfolio=portfolioValueV082(),afterPortfolio=Math.max(0,beforePortfolio-proceeds+buyCost+unused),portfolioDelta=afterPortfolio-beforePortfolio;\n    const fy=positionBenefitYieldV082(fromSel.value,fromOwned,from.price),ty0=positionBenefitYieldV082(toSel.value,toOwned,to.price),ty1=positionBenefitYieldV082(toSel.value,toAfter,to.price),annualBefore=fy*(fromOwned*from.price)+ty0*(toOwned*to.price),annualAfter=positionBenefitYieldV082(fromSel.value,fromAfter,from.price)*(fromAfter*from.price)+ty1*(toAfter*to.price),annualDelta=annualAfter-annualBefore;\n    const tf=technicalBiasV082(fromSel.value),tt=technicalBiasV082(toSel.value),td=tt-tf,moved=beforePortfolio>0?proceeds/beforePortfolio*100:0,coverage=requested>0?proceeds/requested*100:0;\n    const score=(annualDelta>0?2:annualDelta<0?-2:0)+(td>1?1:td<-1?-1:0)+(afterTier.tier>beforeTier.tier?1:0);let verdict='NEUTRAL',cls='neutral';if(score>=3){verdict='STRONGER AFTER';cls='buy';}else if(score>=1){verdict='IMPROVED';cls='watch';}else if(score<=-2){verdict='WEAKER AFTER';cls='sell';}\n    const yp=x=>x>0?`${(x*100).toFixed(2)}%`:'—',reasons=[];if(annualDelta)reasons.push(`annual benefit ${annualDelta>=0?'+':''}${money(annualDelta)}`);if(td)reasons.push(`technical delta ${td>=0?'+':''}${td.toFixed(1)}`);if(afterTier.tier!==beforeTier.tier)reasons.push(`target tier ${beforeTier.tier} → ${afterTier.tier}`);if(coverage<99&&requested>0)reasons.push(`safe coverage ${coverage.toFixed(1)}%`);\n    box.innerHTML=`<div class=\\\"slx-v082-verdict ${cls}\\\"><div><span>What-if result</span><b>${verdict}</b></div><strong>${money(proceeds)} reallocated</strong><small>${reasons.length?reasons.map(esc).join(' · '):'No measurable advantage from current local data.'}</small></div><div class=\\\"slx-v082-before-after\\\"><div><span>BEFORE</span><b>${esc(fromSel.value)} ${fromOwned.toLocaleString()} sh</b><small>Benefit yield ${yp(fy)} · Tech ${tf>=0?'+':''}${tf.toFixed(1)}</small></div><div><span>AFTER</span><b>${esc(toSel.value)} ${toAfter.toLocaleString()} sh</b><small>Benefit yield ${yp(ty1)} · Tech ${tt>=0?'+':''}${tt.toFixed(1)}</small></div></div><div class=\\\"slx-v080-sim-grid slx-v082-grid\\\"><div><span>SELL</span><b>${sellShares.toLocaleString()} ${esc(fromSel.value)}</b><small>${money(proceeds)} · safe max ${money(maxSafeValue)}</small></div><div><span>BUY</span><b>${buyShares.toLocaleString()} ${esc(toSel.value)}</b><small>${money(buyCost)} · unused ${money(unused)}</small></div><div><span>Target tier</span><b>${beforeTier.tier} → ${afterTier.tier}</b><small>Next gap ${beforeGap.toLocaleString()} → ${afterGap.toLocaleString()}</small></div><div><span>Portfolio moved</span><b>${moved.toFixed(2)}%</b><small>Requested coverage ${coverage.toFixed(1)}% · Benefit Lock respected</small></div><div><span>Est. annual benefit</span><b class=\\\"${annualDelta>=0?'good':'bad'}\\\">${annualDelta>=0?'+':''}${money(annualDelta)}</b><small>Uses available benefit metadata</small></div><div><span>Value after simulation</span><b>${money(afterPortfolio)}</b><small>Rounding delta ${portfolioDelta>=0?'+':''}${money(portfolioDelta)}</small></div></div><div class=\\\"api-help\\\">Preview only — no trade is submitted. Uses current detected prices, protected/free shares, benefit tiers and locally collected technical history.</div>`;\n  }\n\n  function bindAdvisorSuiteControlsV080(){"
          s=s[:m.start()]+block+s[m.end():]
          marker='/* SAKALUX_STOCK_STABILIZATION_V0801 */'
          if marker not in s: raise SystemExit('Style marker not found')
          css="(()=>{const id='slx-stock-portfolio-v082-style';if(document.getElementById(id))return;const st=document.createElement('style');st.id=id;st.textContent=`#slx-stock-advisor-suite-v080 .slx-v082-verdict{margin-top:9px;padding:10px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:#101923;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}#slx-stock-advisor-suite-v080 .slx-v082-verdict span,#slx-stock-advisor-suite-v080 .slx-v082-before-after span{display:block;color:#91a2b6;font-size:9px;text-transform:uppercase;font-weight:900}#slx-stock-advisor-suite-v080 .slx-v082-verdict b{display:block;font-size:15px}#slx-stock-advisor-suite-v080 .slx-v082-verdict small{grid-column:1/-1;color:#9fb0c3}#slx-stock-advisor-suite-v080 .slx-v082-verdict.buy{border-color:rgba(85,217,138,.45)}#slx-stock-advisor-suite-v080 .slx-v082-verdict.sell{border-color:rgba(255,107,120,.45)}#slx-stock-advisor-suite-v080 .slx-v082-verdict.watch{border-color:rgba(223,189,97,.4)}#slx-stock-advisor-suite-v080 .slx-v082-before-after{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}#slx-stock-advisor-suite-v080 .slx-v082-before-after>div{padding:9px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:#0b121b}#slx-stock-advisor-suite-v080 .slx-v082-grid{margin-top:8px}#slx-stock-advisor-suite-v080 .slx-v082-grid .good{color:#55d98a}#slx-stock-advisor-suite-v080 .slx-v082-grid .bad{color:#ff6b78}@media(max-width:700px){#slx-stock-advisor-suite-v080 .slx-v082-before-after,#slx-stock-advisor-suite-v080 .slx-v082-verdict{grid-template-columns:1fr}}`;document.head.appendChild(st);})();\n\n/* SAKALUX_STOCK_PORTFOLIO_V082 */\n\n"
          s=s.replace(marker,css+marker,1)
          if '## v0.8.2' not in d:
              note='\n## v0.8.2 — Portfolio Simulator\n- BEFORE → AFTER What-if comparison.\n- Safe reallocatable coverage with Benefit Lock respected.\n- Benefit-yield and local technical-score deltas.\n- Target benefit-tier movement and unused-cash/share-rounding visibility.\n- Preview-only; no trade is submitted.\n\n'; p=d.find('\n## '); d=d[:p+1]+note+d[p+1:] if p>=0 else d+note
          d=re.sub(r'0\.8\.1','0.8.2',d,count=1)
          e['version']='0.8.2'; e['release']={'version':'0.8.2','date':'2026-09-18','notes':['Portfolio Simulator now shows BEFORE → AFTER positions and safe reallocation coverage.','Adds benefit-yield and local technical-score deltas with target tier movement.','What-if remains preview-only and never submits a trade.']}
          sp.write_text(s); dp.write_text(d); rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Stock-Manager-Advisor.user.js').read_text(); j=json.loads(Path('scripts.json').read_text()); e=next(x for x in j['scripts'] if x.get('id')=='stock-manager-advisor')
          assert '// @version      0.8.2' in s and 'SAKALUX_STOCK_PORTFOLIO_V082' in s and 'What-if result' in s
          assert e['version']=='0.8.2' and e['release']['version']=='0.8.2'
          print('Stocks v0.8.2 validation OK')
          PY
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Stock-Manager-Advisor.user.js greasyfork/Stock-Manager-Advisor.md scripts.json backups/stocks-v0.8.2-portfolio-simulator-2026-09-18
          git commit -m 'Stocks v0.8.2: Portfolio Simulator'
          git push

name: Patch Market Intelligence v1.16.1

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/mi-v1.16.1.py'
      - '.github/workflows/patch-mi-v1.16.1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact v1.16.0 backup first
        run: |
          mkdir -p backups
          git show 8b1509cd26ab87712529771d839fb0260a440083:SakaLuX-Market-Intelligence.user.js > backups/SakaLuX-Market-Intelligence-v1.16.0.user.js
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add backups/SakaLuX-Market-Intelligence-v1.16.0.user.js
          if git diff --cached --quiet; then
            echo "Exact backup already exists"
          else
            git commit -m "Backup Market Intelligence v1.16.0"
            git push
          fi
      - name: Apply stable-panels patch
        run: python .github/patches/mi-v1.16.1.py
      - name: Commit v1.16.1
        run: |
          git add SakaLuX-Market-Intelligence.user.js scripts.json UPDATE-INFO.md greasyfork/Market-Intelligence.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "SakaLuX Market Intelligence v1.16.1: stable travel panels"
            git push
          fi

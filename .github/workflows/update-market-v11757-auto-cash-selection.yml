name: Update Market Intelligence v1.17.57 Auto Cash and Selection
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_market_v11757_auto_cash_selection.py'
      - '.github/workflows/update-market-v11757-auto-cash-selection.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-v11757-auto-cash-selection
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Market Intelligence v1.17.57 update
        run: python3 .github/scripts/update_market_v11757_auto_cash_selection.py
      - name: Validate userscript syntax
        run: node --check SakaLuX-Market-Intelligence.user.js
      - name: Validate registry JSON
        run: python3 -m json.tool scripts.json >/dev/null
      - name: Verify auto-cash and selectable Best Buys patch
        run: |
          grep -q '@version      1.17.57' SakaLuX-Market-Intelligence.user.js
          grep -q 'readAvailableCashFromPage' SakaLuX-Market-Intelligence.user.js
          grep -q 'SakaLuX_MI_BEST_BUY_SELECTION_V1' SakaLuX-Market-Intelligence.user.js
          grep -q "mode:'SELECTED'" SakaLuX-Market-Intelligence.user.js
          grep -q 'MARK PLAN BOUGHT' SakaLuX-Market-Intelligence.user.js
          grep -q 'market-intelligence-v1.17.57' greasyfork/Market-Intelligence.md || true
          test -f releases/market-intelligence-v1.17.57.md
      - name: Commit release
        run: |
          if git diff --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Market-Intelligence.user.js scripts.json greasyfork/Market-Intelligence.md releases/market-intelligence-v1.17.57.md
          git commit -m 'Release Market Intelligence v1.17.57 auto cash and selectable Best Buys'
          git push

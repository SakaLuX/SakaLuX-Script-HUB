name: Apply SakaLuX Suite v0.9.4 reminder sizing
on:
  push:
    paths:
      - '.github/workflows/suite-v094-reminder-size.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reminder sizing patch
        run: python tools/suite_v094_reminder_size.py
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.9.4
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m 'Match Suite reminder controls to Torn icon size in v0.9.4'
          git push origin HEAD:main

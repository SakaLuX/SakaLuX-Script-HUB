name: Patch Market Intelligence v1.15.7
on:
  push:
    branches: [main]
    paths:
      - '.github/patches/mi-v1.15.7.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patches/mi-v1.15.7.py
      - name: Commit exact backup first
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add backups/SakaLuX-Market-Intelligence-v1.15.6.user.js
          git commit -m "Backup Market Intelligence v1.15.6"
      - name: Commit v1.15.7
        run: |
          git add SakaLuX-Market-Intelligence.user.js scripts.json UPDATE-INFO.md greasyfork/Market-Intelligence.md
          git commit -m "Market Intelligence v1.15.7 Torn PDA badge layout"
          git push

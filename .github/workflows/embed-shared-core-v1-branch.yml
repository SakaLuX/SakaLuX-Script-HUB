name: Embed Shared Core v1

on:
  push:
    branches:
      - main
      - test/shared-core-v1
    paths:
      - src/core/sakalux-core.js
      - tools/embed-shared-core.cjs
      - tools/embed-shared-core-all.cjs
      - .github/workflows/embed-shared-core-v1-branch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Embed Shared Core into every userscript
        run: node tools/embed-shared-core-all.cjs
      - name: Validate generated userscripts
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.user.js' -print0)
      - name: Commit embedded userscripts
        run: |
          if git diff --quiet -- '*.user.js'; then
            echo 'No userscript changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.user.js'
          git commit -m 'Embed Shared Core v1 into all userscripts'
          git push origin HEAD:${{ github.ref_name }}

name: Apply SakaLuX Suite v0.9.2 native reminder icon sizing
on:
  push:
    paths:
      - '.github/workflows/suite-v092-native-icon-sizing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match reminder icons to Torn resource-row controls
        shell: python
        run: |
          from pathlib import Path
          p=Path('SakaLuX-Suite.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      0.9.1','// @version      0.9.2',1)
          s=s.replace("const VERSION='0.9.1';","const VERSION='0.9.2';",1)

          old="""function iconButton(id,text,title,fn){
 const native=document.getElementById(IDS.native);
 let b;
 if(native){
  b=native.cloneNode(true);
  b.removeAttribute('href');b.removeAttribute('target');b.removeAttribute('aria-current');b.removeAttribute('style');
  b.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
  const span=b.querySelector('.slxs-skull')||b.querySelector('span')||b;
  span.textContent=text;
  span.style.cssText='font-size:14px!important;line-height:1!important;min-width:16px!important;min-height:16px!important;width:16px!important;height:16px!important;display:flex!important;align-items:center!important;justify-content:center!important;color:inherit!important;';
 }else{
  b=document.createElement('button');b.type='button';b.textContent=text;
 }
 b.id=id;b.classList.add('slx-rem-btn');b.title=title;b.setAttribute('aria-label',title);b.onclick=e=>{e.preventDefault();e.stopPropagation();fn()};return b
}
"""
          new="""function iconButton(id,text,title,fn){
 const native=document.getElementById(IDS.native);
 let b;
 if(native){
  b=native.cloneNode(true);
  b.removeAttribute('href');b.removeAttribute('target');b.removeAttribute('aria-current');b.removeAttribute('style');
  b.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
  b.classList.remove('slx-rem-btn');
  b.classList.add('slx-rem-native');
  b.style.cssText='margin:0!important;padding:0!important;transform:none!important;flex:0 0 auto!important;';
  const span=b.querySelector('.slxs-skull')||b.querySelector('span')||b;
  span.textContent=text;
  if(span!==b)span.removeAttribute('style');
  span.style.cssText='font-size:13px!important;line-height:1!important;min-width:0!important;min-height:0!important;width:auto!important;height:auto!important;display:flex!important;align-items:center!important;justify-content:center!important;color:inherit!important;';
 }else{
  b=document.createElement('button');b.type='button';b.textContent=text;b.classList.add('slx-rem-btn');
 }
 b.id=id;b.title=title;b.setAttribute('aria-label',title);b.onclick=e=>{e.preventDefault();e.stopPropagation();fn()};return b
}
"""
          if old not in s:
              raise SystemExit('iconButton anchor not found')
          s=s.replace(old,new,1)

          # Keep the dock from adding its own visual size in the native Torn row.
          s=s.replace("height:19px!important;min-height:19px!important;", "height:auto!important;min-height:0!important;", 1)

          # Add a tiny guard so native-row reminder controls inherit Torn sizing instead of the old 30px fallback class.
          css_anchor='.slx-rem-btn{width:30px;height:30px;border-radius:50%;border:1px solid #59616e;background:#202630;color:#e6edf5;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 6px #0007}'
          css_extra=css_anchor+'.slx-rem-native{box-sizing:border-box!important;min-width:0!important;min-height:0!important;box-shadow:none!important;}'
          if css_anchor not in s:
              raise SystemExit('reminder CSS anchor not found')
          s=s.replace(css_anchor,css_extra,1)
          p.write_text(s,encoding='utf-8')

          d=Path('greasyfork/SakaLuX-Suite.md')
          t=d.read_text(encoding='utf-8')
          t=t.replace('**v0.9.1**','**v0.9.2**',1)
          if '### v0.9.2 — native reminder icon sizing' not in t:
              t += '\n\n### v0.9.2 — native reminder icon sizing\n- Reminder icons on the Torn resource row now inherit the native row control dimensions instead of the larger fallback reminder-button styling.\n- Removed the 30px reminder class from native-row clones and reduced only the inner symbol to match surrounding compact icons.\n- Kept the larger circular styling only for the emergency floating fallback.\n'
          d.write_text(t,encoding='utf-8')
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.9.2
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m 'Match Suite reminder icons to Torn row sizing in v0.9.2'
          git push origin HEAD:main

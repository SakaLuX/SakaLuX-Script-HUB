name: Update Bazaar Smart Pricer v1.1.15

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_bazaar_smart_pricer_v1115.py'
      - '.github/workflows/update-bazaar-smart-pricer-v1115.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v1.1.15 no-accordion update
        run: python3 .github/scripts/update_bazaar_smart_pricer_v1115.py

      - name: Validate userscript
        run: node --check SakaLuX-Bazaar-Smart-Pricer.user.js

      - name: Validate registry
        run: python3 -m json.tool scripts.json >/dev/null

      - name: Verify v1.1.15 surfaces
        run: |
          grep -q '// @version      1.1.15' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'await new Promise(r=>setTimeout(r,90));' SakaLuX-Bazaar-Smart-Pricer.user.js
          ! grep -q 'Waiting 2s' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'v1.1.15' CHANGELOG-Bazaar-Smart-Pricer.md
          test -f releases/bazaar-smart-pricer-v1.1.15.md

      - name: Commit complete v1.1.15 update
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bazaar-Smart-Pricer.user.js scripts.json CHANGELOG-Bazaar-Smart-Pricer.md README-Bazaar-Smart-Pricer.md greasyfork/Bazaar-Smart-Pricer.md releases/bazaar-smart-pricer-v1.1.15.md backups/bazaar-smart-pricer-v1.1.14-2026-09-20 || true
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Release Bazaar Smart Pricer v1.1.15 no-accordion bulk pricing'
            git push
          fi

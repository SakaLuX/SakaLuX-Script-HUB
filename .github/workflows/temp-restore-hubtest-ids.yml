name: Restore Hub Test IDS
on:
  push:
    paths:
      - '.github/workflows/temp-restore-hubtest-ids.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore IDS
        run: python .migration/restore_hubtest_ids.py
      - name: Validate Hub Test
        run: node --check hubtest.user.js
      - name: Commit Hub Test
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add hubtest.user.js
          git commit -m 'Restore Hub Test IDS object' || exit 0
          git push origin HEAD:main

name: Fix Market force travel basket v1.17.48
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_market_force_travel_basket_v11748.py'
      - '.github/workflows/fix-market-force-travel-basket-v11748.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-force-travel-basket-v11748
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply force Travel Basket fix
        run: python3 .github/scripts/fix_market_force_travel_basket_v11748.py
      - name: Validate userscript syntax
        run: node --check SakaLuX-Market-Intelligence.user.js
      - name: Validate registry JSON
        run: python3 -m json.tool scripts.json >/dev/null
      - name: Audit Basket visibility rules
        run: |
          grep -q '@version      1.17.48' SakaLuX-Market-Intelligence.user.js
          grep -q 'On every landed Travel page, render Best Route Basket first' SakaLuX-Market-Intelligence.user.js
          grep -q 'Loading routes' SakaLuX-Market-Intelligence.user.js
          grep -q 'No profitable route right now' SakaLuX-Market-Intelligence.user.js
          ! grep -Fq "if(!detectDestination()){await renderBestTravelRun();paintTravelSessionSummary();return;}" SakaLuX-Market-Intelligence.user.js
          ! grep -Fq "detectDestination()||detectInFlight()" SakaLuX-Market-Intelligence.user.js
      - name: Commit release
        run: |
          if git diff --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Market-Intelligence.user.js scripts.json SakaLuX-Script-Hub.user.js greasyfork/Market-Intelligence.md
          git commit -m 'Release Market Intelligence v1.17.48 force Travel Basket'
          git push

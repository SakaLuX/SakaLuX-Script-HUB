name: Stock v0.7.17 shared standalone bootstrap

on:
  push:
    paths:
      - '.github/workflows/stock-copy-bazaar-standalone-v0717.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup and patch Stock
        shell: python
        run: |
          from pathlib import Path
          import re, json

          stock_path = Path('SakaLuX-Stock-Manager-Advisor.user.js')
          bazaar_path = Path('SakaLuX-Bazaar-Thanker-PDA.user.js')
          stock = stock_path.read_text(encoding='utf-8')
          bazaar = bazaar_path.read_text(encoding='utf-8')

          backup = Path('backups/stock-v0.7.17-bazaar-standalone-bootstrap-2026-09-18')
          backup.mkdir(parents=True, exist_ok=True)
          (backup / 'SakaLuX-Stock-Manager-Advisor-v0.7.16.user.js').write_text(stock, encoding='utf-8')

          begin = '/* SakaLuX Standalone Dock Bootstrap — BEGIN */'
          end = '/* SakaLuX Standalone Dock Bootstrap — END */'
          b0 = bazaar.index(begin)
          b1 = bazaar.index(end, b0) + len(end)
          block = bazaar[b0:b1]

          # Stock gets the exact Bazaar shared bootstrap, changing only module identity/version.
          block = re.sub(
              r'const SELF=Object\.assign\([^\n]+\);',
              "const SELF=Object.assign({\"id\":\"stock-manager-advisor\",\"name\":\"Stocks\",\"icon\":\"📊\",\"selector\":\"#sakalux-module-bridge-stock-manager-advisor\",\"fallback\":\"https://www.torn.com/page.php?sid=stocks\"},{version:'0.7.17'});",
              block,
              count=1,
          )

          # Remove any previous copied bootstrap before inserting the Bazaar source-of-truth block.
          if begin in stock and end in stock:
              s0 = stock.index(begin)
              s1 = stock.index(end, s0) + len(end)
              stock = stock[:s0] + stock[s1:]

          # Remove the old Stock-only standalone registration shim. The shared bootstrap now owns registration.
          stock = re.sub(
              r"\n\s*let entry=document\.querySelector\('\[data-slx-standalone-registration=\\\"stock-manager-advisor\\\"\]'\);\n\s*if\(!entry\)\{entry=document\.createElement\('span'\);entry\.hidden=true;entry\.setAttribute\('data-slx-standalone-registration','stock-manager-advisor'\);document\.body\.appendChild\(entry\);\}\n\s*Object\.assign\(entry\.dataset,\{id:'stock-manager-advisor',name:'Stocks',icon:'📊',selector:'#sakalux-module-bridge-stock-manager-advisor',fallback:APP\.stocksUrl,version:APP\.version\}\);(?:\n\s*setTimeout\([^\n]+\);)?",
              '',
              stock,
              count=1,
          )

          stock = stock.replace('// @version      0.7.16', '// @version      0.7.17', 1)
          stock = stock.replace("version: '0.7.16'", "version: '0.7.17'", 1)

          header_end = '// ==/UserScript=='
          pos = stock.index(header_end) + len(header_end)
          stock = stock[:pos] + '\n\n' + block + '\n\n' + stock[pos:].lstrip('\n')
          stock_path.write_text(stock, encoding='utf-8')

          # Registry: module version only. Script Hub userscript is intentionally untouched.
          reg_path = Path('scripts.json')
          reg = json.loads(reg_path.read_text(encoding='utf-8'))
          for item in reg.get('scripts', []):
              if item.get('id') == 'stock-manager-advisor':
                  item['version'] = '0.7.17'
                  rel = item.setdefault('release', {})
                  rel['version'] = '0.7.17'
                  rel['date'] = '2026-09-18'
                  rel['notes'] = [
                      'Copies the shared Standalone Dock bootstrap from Bazaar and registers Stocks as a module in the same common dock.',
                      'Uses the common sakalux-standalone-dock, launcher, style and registration IDs; it does not create a Stock-specific standalone dock.',
                      'Whichever SakaLuX module loads first owns the shared dock; Stocks only joins the existing dock when one is already present.'
                  ]
                  break
          reg_path.write_text(json.dumps(reg, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          doc_path = Path('greasyfork/Stock-Manager-Advisor.md')
          doc = doc_path.read_text(encoding='utf-8')
          doc = re.sub(r'(?m)^\*\*v0\.7\.\d+\*\*$', '**v0.7.17**', doc, count=1)
          note = '''\n### v0.7.17 — Shared Bazaar standalone bootstrap\n- Copies the current Bazaar Standalone Dock bootstrap into Stock Manager.\n- Uses the same common dock/launcher/style/registration IDs as Bazaar and the other SakaLuX modules.\n- Stocks registers only as `stock-manager-advisor`; it does not create a separate Stock standalone menu.\n- The first loaded SakaLuX module creates the shared dock and all later modules attach to it.\n- Keeps the existing Stock module bridge as the Stocks row open target.\n'''
          if '### v0.7.17' not in doc:
              marker = '## Release history / Changelog'
              if marker in doc:
                  doc = doc.replace(marker, marker + '\n' + note, 1)
              else:
                  doc += note
          doc_path.write_text(doc, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          f='SakaLuX-Stock-Manager-Advisor.user.js'
          node --check "$f"
          python3 -m json.tool scripts.json >/dev/null
          grep -q '// @version      0.7.17' "$f"
          grep -q "version: '0.7.17'" "$f"
          grep -q 'SakaLuX Standalone Dock Bootstrap — BEGIN' "$f"
          grep -q "DOCK_ID='sakalux-standalone-dock'" "$f"
          grep -q "STYLE_ID='sakalux-standalone-dock-style'" "$f"
          grep -q "REG_ATTR='data-slx-standalone-registration'" "$f"
          grep -q 'stock-manager-advisor' "$f"
          grep -q '#sakalux-module-bridge-stock-manager-advisor' "$f"
          test "$(grep -c 'SakaLuX Standalone Dock Bootstrap — BEGIN' "$f")" -eq 1
          test "$(grep -c 'SakaLuX Standalone Dock Bootstrap — END' "$f")" -eq 1
          grep -q '### v0.7.17' greasyfork/Stock-Manager-Advisor.md

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Stock-Manager-Advisor.user.js scripts.json greasyfork/Stock-Manager-Advisor.md backups/stock-v0.7.17-bazaar-standalone-bootstrap-2026-09-18
          git commit -m 'Stocks v0.7.17: use shared Bazaar standalone bootstrap'
          git push

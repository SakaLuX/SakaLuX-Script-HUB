name: Suite Clickable Daily v0.9.981

on:
  push:
    paths:
      - '.github/scripts/add_suite_clickable_daily_tasks_v0981.py'
      - '.github/workflows/suite-clickable-daily-v0981.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clickable Daily tasks patch
        run: python .github/scripts/add_suite_clickable_daily_tasks_v0981.py
      - name: Validate syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Validate navigation helpers
        run: |
          grep -q "const TASK_NAV = Object.freeze" SakaLuX-Suite.user.js
          grep -q "function navigateTask(id)" SakaLuX-Suite.user.js
          grep -q "data-nav-task" SakaLuX-Suite.user.js
          grep -q "wheel_lame:'/page.php?sid=spinTheWheel'" SakaLuX-Suite.user.js
          grep -q "shops:'/city.php?step=shops'" SakaLuX-Suite.user.js
          grep -q "@version      0.9.981" SakaLuX-Suite.user.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js
          git commit -m "Suite v0.9.981 clickable Smart Daily tasks"
          git push
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag suite-v0.9.981
          git push origin suite-v0.9.981
          gh release create suite-v0.9.981 --title "SakaLuX Suite v0.9.981 — Clickable Smart Daily Tasks" --notes "Makes Smart Daily Checklist rows clickable and routes each task to the corresponding Torn page. Preserves the stable v0.9.980 API/Wheel/COPY DEBUG behavior."

name: Patch Market Intelligence v1.17.19

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-market-v1.17.19.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Market Intelligence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('SakaLuX-Market-Intelligence.user.js')
          s = p.read_text(encoding='utf-8')
          old = "if(!settings.itemMarket||detectPage()==='items'||detectPage()==='profile'){"
          new = "if(!settings.itemMarket||!/[?&]sid=ItemMarket(?:[&#]|$)/i.test(location.href)){"
          if old not in s:
              raise SystemExit('Expected scanItemMarket guard not found')
          s = s.replace(old, new, 1)
          s = s.replace('1.17.18', '1.17.19')
          p.write_text(s, encoding='utf-8')

          reg = Path('scripts.json')
          data = json.loads(reg.read_text(encoding='utf-8'))
          found = False
          for item in data.get('scripts', []):
              if item.get('id') == 'market-intelligence':
                  item['version'] = '1.17.19'
                  item['description'] = 'Torn PDA-first market/travel intelligence with strict Item Market page scoping, Loadout Comparator, API access diagnostics/key setup, Price Network and travel tools.'
                  found = True
                  break
          if not found:
              raise SystemExit('market-intelligence missing from scripts.json')
          reg.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          md = Path('greasyfork/Market-Intelligence.md')
          m = md.read_text(encoding='utf-8')
          m = m.replace('**v1.17.18**', '**v1.17.19**', 1)
          marker = '## Current release note\n'
          if marker in m:
              start = m.index(marker) + len(marker)
              end = m.find('\n## ', start)
              if end == -1: end = len(m)
              note = '\n**v1.17.19** fixes Item Market Intelligence page scoping. The Item Market card now renders only while the URL is actually on `sid=ItemMarket`, and it is removed when navigating to Home, Profile, Eliminations, or any other Torn page. This prevents stale market cards from remaining visible after Torn SPA navigation.\n'
              m = m[:start] + note + m[end:]
          hist = '## Release history\n'
          if hist in m and '### v1.17.19 — Item Market page-scope fix' not in m:
              m = m.replace(hist, hist + '### v1.17.19 — Item Market page-scope fix\n\n- Restricted Item Market Intelligence to the actual `sid=ItemMarket` route.\n- Removes the market card immediately when navigating to Home, Profile, Eliminations, or another Torn page.\n- Prevents stale cached Item Market UI from being mounted on unrelated pages during SPA navigation.\n\n', 1)
          md.write_text(m, encoding='utf-8')

          hubmd = Path('greasyfork/Script-Hub.md')
          if hubmd.exists():
              h = hubmd.read_text(encoding='utf-8').replace('SakaLuX Market Intelligence **v1.17.18**','SakaLuX Market Intelligence **v1.17.19**')
              hubmd.write_text(h, encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          grep -q '@version      1.17.19' SakaLuX-Market-Intelligence.user.js
          grep -q "sid=ItemMarket" SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Market-Intelligence.user.js scripts.json greasyfork/Market-Intelligence.md greasyfork/Script-Hub.md
          git commit -m 'Market Intelligence v1.17.19: scope Item Market card to market page'
          git push

name: Suite City Shops Route v0.9.983
on:
  push:
    paths:
      - '.github/scripts/fix_suite_city_shops_route_v0983.py'
      - '.github/workflows/suite-city-shops-route-v0983.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply City Shops route hotfix
        run: python .github/scripts/fix_suite_city_shops_route_v0983.py
      - name: Validate syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Validate stable behavior
        run: |
          grep -q "// @version      0.9.983" SakaLuX-Suite.user.js
          grep -Eq "const API_VERSION = '2.1.[45]'" SakaLuX-Suite.user.js
          grep -q "shops:'https://www.torn.com/city.php'" SakaLuX-Suite.user.js
          ! grep -q "shops:'https://www.torn.com/shops.php'" SakaLuX-Suite.user.js
          ! grep -q "shops:'https://www.torn.com/city.php?step=shops'" SakaLuX-Suite.user.js
          grep -q "function wheelDiagnostics" SakaLuX-Suite.user.js
          grep -q "function copyWheelDiagnostics" SakaLuX-Suite.user.js
          grep -q "spinTheWheel" SakaLuX-Suite.user.js
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Hotfix Suite v0.9.983 City Shops route"
          git push
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag suite-v0.9.983
          git push origin suite-v0.9.983
          gh release create suite-v0.9.983 --title "SakaLuX Suite v0.9.983 — City Shops Route Hotfix" --notes "Fixes the Smart Daily Checklist City Shops card so it opens Torn City instead of the obsolete /shops.php or /city.php?step=shops routes. No changes to Wheels, sync, COPY DEBUG, or other task routes."

name: Patch experimental Stock Manager v0.7.2
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v072.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v072.py
      - name: Validate
        run: |
          grep -q '@version      0.7.2' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.7.2'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'https://api.torn.com/v2/user/money' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'https://api.torn.com/v2/user/stocks' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'https://api.torn.com/v2/torn/stocks' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Rebalance Preview' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function rebalanceConfirmText' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'price:Number(st.price)||0' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-inline-advanced"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.7.2' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.7.2 API UI and rebalance fixes'
          git push

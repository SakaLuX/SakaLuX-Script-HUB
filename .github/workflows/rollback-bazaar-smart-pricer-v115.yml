name: Rollback Bazaar Smart Pricer to v1.1.5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-bazaar-smart-pricer-v115.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact v1.1.5 userscript
        run: |
          git show f0ea0e5b0d629b214635eff1f3473b4a466ab710:SakaLuX-Bazaar-Smart-Pricer.user.js > SakaLuX-Bazaar-Smart-Pricer.user.js
      - name: Sync scripts.json entry
        run: |
          python3 - <<'PY'
          import json
          p='scripts.json'
          d=json.load(open(p,encoding='utf-8'))
          for e in d.get('scripts',[]):
              if e.get('id')=='bazaar-smart-pricer':
                  e['version']='1.1.5'
                  e['detailsRevision']=int(e.get('detailsRevision',1))+1
                  e['release']={
                      'version':'1.1.5',
                      'date':'2026-09-20',
                      'notes':['Rollback: restored the exact Bazaar Smart Pricer v1.1.5 userscript from commit f0ea0e5b0d629b214635eff1f3473b4a466ab710.']
                  }
                  break
          with open(p,'w',encoding='utf-8') as f:
              json.dump(d,f,indent=2,ensure_ascii=False)
              f.write('\n')
          PY
      - name: Validate
        run: |
          grep -q '@version      1.1.5' SakaLuX-Bazaar-Smart-Pricer.user.js
          node --check SakaLuX-Bazaar-Smart-Pricer.user.js
          python3 -m json.tool scripts.json >/dev/null
      - name: Commit rollback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Bazaar-Smart-Pricer.user.js scripts.json
          if git diff --cached --quiet; then
            echo 'Already at v1.1.5'
            exit 0
          fi
          git commit -m 'Rollback Bazaar Smart Pricer to v1.1.5'
          git push

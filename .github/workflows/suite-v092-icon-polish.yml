name: Apply SakaLuX Suite v0.9.2 icon integration polish
on:
  push:
    paths:
      - '.github/workflows/suite-v092-icon-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish reminder icons for Torn resource row
        shell: python
        run: |
          from pathlib import Path
          p=Path('SakaLuX-Suite.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      0.9.1','// @version      0.9.2',1)
          s=s.replace("const VERSION='0.9.1';","const VERSION='0.9.2';",1)

          old="#${IDS.dock}{display:flex;align-items:center;gap:5px;z-index:2147483644}.slx-rem-btn{width:30px;height:30px;border-radius:50%;border:1px solid #59616e;background:#202630;color:#e6edf5;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 6px #0007}.slx-rem-fallback{position:fixed;right:10px;top:180px;display:flex;flex-direction:column;gap:6px;z-index:2147483643}"
          new="#${IDS.dock}{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:2px!important;z-index:2147483644;order:2147483647!important;flex:0 0 auto!important}.slx-rem-btn{appearance:none!important;-webkit-appearance:none!important;box-sizing:border-box!important;width:30px!important;height:30px!important;min-width:30px!important;max-width:30px!important;min-height:30px!important;max-height:30px!important;padding:0!important;margin:0 1px!important;border-radius:50%!important;border:1px solid rgba(91,112,130,.72)!important;background:rgba(24,33,42,.78)!important;color:#dbe7f0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:17px!important;font-weight:400!important;line-height:1!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)!important;vertical-align:middle!important;overflow:hidden!important}.slx-rem-btn:active{transform:scale(.94)!important}.slx-rem-fallback{position:fixed;right:10px;top:180px;display:flex;flex-direction:row;gap:3px;z-index:2147483643}"
          if old not in s:
              raise SystemExit('reminder CSS anchor not found')
          s=s.replace(old,new,1)

          old2="d.style.cssText='display:inline-flex!important;flex-direction:row!important;align-items:center!important;gap:4px!important;position:static!important;inset:auto!important;margin:0 0 0 5px!important;z-index:auto!important;vertical-align:middle!important;';"
          new2="d.style.cssText='display:inline-flex!important;flex-direction:row!important;align-items:center!important;justify-content:center!important;gap:2px!important;position:static!important;inset:auto!important;margin:0 2px!important;padding:0!important;z-index:auto!important;vertical-align:middle!important;order:2147483647!important;flex:0 0 auto!important;';"
          if old2 not in s:
              raise SystemExit('dock inline style anchor not found')
          s=s.replace(old2,new2,1)

          old3="d.style.cssText='position:fixed!important;right:10px!important;top:150px!important;display:flex!important;flex-direction:row!important;align-items:center!important;gap:5px!important;z-index:2147483644!important;';"
          new3="d.style.cssText='position:fixed!important;right:10px!important;top:150px!important;display:flex!important;flex-direction:row!important;align-items:center!important;gap:3px!important;z-index:2147483644!important;';"
          if old3 not in s:
              raise SystemExit('fallback style anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s,encoding='utf-8')

          d=Path('greasyfork/SakaLuX-Suite.md')
          t=d.read_text(encoding='utf-8')
          t=t.replace('**v0.9.1**','**v0.9.2**',1)
          if '### v0.9.2 — native-size reminder icons' not in t:
              t += '\n\n### v0.9.2 — native-size reminder icons\n- Reset Torn inherited button sizing so Suite reminder controls stay compact on PDA.\n- Prayer, Recovery and Chain reminder buttons are now fixed at 30×30 px with native-like circular styling.\n- The reminder dock receives maximum flex order so it stays at the visual end of the resource icon row.\n- Tightened spacing and removed oversized padding/shadows for better integration with Torn and other compact helper icons.\n'
          d.write_text(t,encoding='utf-8')
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.9.2
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m 'Polish Suite resource-row icons in v0.9.2'
          git push origin HEAD:main

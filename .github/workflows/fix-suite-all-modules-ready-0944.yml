name: Fix Suite all modules + READY 0.9.944
on:
  push:
    branches: [fix/suite-all-modules-ready-0944]
    paths:
      - '.github/scripts/fix_suite_all_modules_ready_0944.py'
      - '.github/workflows/fix-suite-all-modules-ready-0944.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python .github/scripts/fix_suite_all_modules_ready_0944.py
      - run: node --check SakaLuX-Suite.user.js
      - run: node tests/suite-all-modules-ready-0944-regression.cjs
      - run: npm install --no-save --ignore-scripts jsdom
      - run: node tests/suite-modules-regression.cjs
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-all-modules-ready-0944-regression.cjs
          git commit -m 'Release Suite v0.9.944 all modules and truthful READY states'
          git push

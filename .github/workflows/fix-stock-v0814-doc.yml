name: Fix Stock v0.8.14 documentation sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stock-v0814-doc.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Stock release documentation labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('greasyfork/Stock-Manager-Advisor.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('- Canonical version: **v0.8.13**','- Canonical version: **v0.8.14**',1)
          s=s.replace('**v0.8.14 — Release metadata synchronization**','**v0.8.14 — Verified Rebalance state machine**',1)
          s=s.replace('### v0.8.14 — Release metadata synchronization','### v0.8.14 — Verified Rebalance state machine',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit documentation sync
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add greasyfork/Stock-Manager-Advisor.md
          git commit -m 'Sync Stock v0.8.14 release documentation'
          git push

name: Synchronize release surfaces 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync_release_surfaces_20260919.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install regression dependency
        run: npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Synchronize changelog, registry, INFO, NEW and markdowns
        run: python3 .github/scripts/sync_release_surfaces_20260919.py
      - name: Validate JavaScript syntax
        run: |
          for f in *.user.js; do node --check "$f"; done
      - name: Validate Hub INFO and NEW
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/hub-details-regression.cjs
      - name: Verify exact version alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import json,re
          root=Path('.')
          reg=json.loads((root/'scripts.json').read_text())
          def ver(p):
              m=re.search(r'(?m)^//\s*@version\s+(\S+)',Path(p).read_text())
              assert m, p
              return m.group(1)
          for s in reg['scripts']:
              if not s.get('active',True): continue
              src=unquote(Path(urlparse(s['sourceUrl']).path).name)
              v=ver(src)
              assert s['version']==v,(s['id'],s['version'],v)
              assert s['release']['version']==v,(s['id'],s['release']['version'],v)
          hv=ver('SakaLuX-Script-Hub.user.js')
          hub=(root/'SakaLuX-Script-Hub.user.js').read_text()
          assert f"const VERSION = '{hv}';" in hub
          md=(root/'greasyfork/Script-Hub.md').read_text()
          assert f'**v{hv}**' in md
          print('Exact release/version alignment passed; Hub',hv)
          PY
      - name: Commit synchronized surfaces
        run: |
          if git diff --quiet; then
            echo "All release surfaces were already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js scripts.json greasyfork/*.md RELEASE-SURFACE-AUDIT-2026-09-18.md RELEASE-SURFACE-AUDIT-2026-09-19.md
          git commit -m "Synchronize changelog, INFO, NEW, MD and versions"
          git push

name: One-time Bazaar version synchronization fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bazaar-version-sync.yml'
      - '.migration/fix-bazaar-version-sync.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply migration
        run: python .migration/fix-bazaar-version-sync.py
      - name: Validate docs
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          files={
            'greasyfork/Script-Hub.md':'1.9.28',
            'greasyfork/Enhancer-Guard.md':'1.3.28',
            'greasyfork/Bazaar-Thanker.md':'5.3.19',
            'greasyfork/Mission-Rewards.md':'1.0.16',
            'greasyfork/Market-Intelligence.md':'1.17.16',
            'greasyfork/Elimination-Assistant.md':'1.3.28',
          }
          for path,version in files.items():
            text=Path(path).read_text(encoding='utf-8')
            m=re.search(r'## Current version\s+\*\*v([^*]+)\*\*',text)
            assert m and m.group(1).strip()==version,(path,m.group(1).strip() if m else None,version)
          print('Release info versions synchronized')
          PY
      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add greasyfork/Script-Hub.md greasyfork/Enhancer-Guard.md greasyfork/Bazaar-Thanker.md greasyfork/Mission-Rewards.md greasyfork/Market-Intelligence.md greasyfork/Elimination-Assistant.md
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Synchronize release info version format [skip ci]'
          git push

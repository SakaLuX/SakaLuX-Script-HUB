name: Upgrade Stocks v0.8.3 Smart Rebalance

on:
  push:
    paths:
      - '.github/workflows/upgrade-stocks-smart-rebalance-v083.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v0.8.3
        run: python3 .github/scripts/upgrade-stocks-v083.py
      - name: Validate
        run: |
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Stock-Manager-Advisor.user.js').read_text()
          j=json.loads(Path('scripts.json').read_text())
          e=next(x for x in j['scripts'] if x.get('id')=='stock-manager-advisor')
          assert '// @version      0.8.3' in s
          assert 'SAKALUX_STOCK_SMART_REBALANCE_V083' in s
          assert 'renderSmartRebalanceV083' in s
          assert 'buildSmartRebalancePlanV083' in s
          assert e['version']=='0.8.3'
          assert e['release']['version']=='0.8.3'
          print('Stocks v0.8.3 validation OK')
          PY
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Stock-Manager-Advisor.user.js greasyfork/Stock-Manager-Advisor.md scripts.json backups/stocks-v0.8.3-smart-rebalance-2026-09-18
          git commit -m 'Stocks v0.8.3: Smart Rebalance Engine'
          git push

# trigger: 2026-09-18-v083

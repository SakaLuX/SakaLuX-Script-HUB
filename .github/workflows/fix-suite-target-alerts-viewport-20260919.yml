name: Fix Suite Target Alerts viewport
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_suite_target_alerts_viewport_20260919.py'
      - '.github/workflows/fix-suite-target-alerts-viewport-20260919.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-suite-target-alerts-viewport-main
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Target Alerts viewport fix
        run: python3 .github/scripts/fix_suite_target_alerts_viewport_20260919.py
      - name: Validate Suite syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Assert Target Alerts viewport contract
        run: |
          grep -q 'Suite v0.9.932 — Target Alerts settings viewport lock' SakaLuX-Suite.user.js
          grep -q "panel.style.removeProperty('left')" SakaLuX-Suite.user.js
          grep -q '@version      0.9.932' SakaLuX-Suite.user.js
          grep -q 'v0.9.932 — Target Alerts mobile viewport fix' greasyfork/SakaLuX-Suite.md
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Fix Suite Target Alerts settings viewport"
          git push

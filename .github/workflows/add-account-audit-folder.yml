name: Add Account Auditor audit folder
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_account_audit_folder.py'
      - '.github/workflows/add-account-audit-folder.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add dedicated audit folder support
        run: python3 .github/scripts/add_account_audit_folder.py
      - name: Validate syntax
        run: node --check SakaLuX-Account-Auditor.user.js
      - name: Commit Account Auditor update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Account-Auditor.user.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Store Account Auditor snapshots in dedicated audit folder"
          git push

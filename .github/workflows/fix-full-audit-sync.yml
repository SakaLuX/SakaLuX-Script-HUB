name: Fix full userscript audit sync
on:
  push:
    branches: [main]
    paths:
      - '.github/fix-full-audit-sync.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply documentation sync fixes
        run: python .github/scripts/fix_full_audit_sync.py
      - name: Commit fixes
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add greasyfork/Script-Hub.md
          git commit -m 'Synchronize Hub add-on versions with registry'
          git push

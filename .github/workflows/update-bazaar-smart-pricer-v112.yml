name: Update Bazaar Smart Pricer v1.1.2
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_bazaar_smart_pricer_v112.py'
      - '.github/workflows/update-bazaar-smart-pricer-v112.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/update_bazaar_smart_pricer_v112.py
      - run: node --check SakaLuX-Bazaar-Smart-Pricer.user.js
      - run: python3 -m json.tool scripts.json >/dev/null
      - name: Verify pricing fix
        run: |
          grep -q '@version      1.1.2' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'lowestMarketPrice' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'buyPrice' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'v2/market/' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'Torn City shop floor' SakaLuX-Bazaar-Smart-Pricer.user.js
      - name: Commit release
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Bazaar-Smart-Pricer.user.js scripts.json CHANGELOG-Bazaar-Smart-Pricer.md greasyfork/Bazaar-Smart-Pricer.md releases/bazaar-smart-pricer-v1.1.2.md
          git commit -m 'Release Bazaar Smart Pricer v1.1.2 live market and city shop floor'
          git push

name: Patch Bazaar profile emoji
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-bazaar-profile-emoji.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_bazaar_profile_emoji.py
      - name: Validate
        run: |
          grep -q '@version      5.3.24' SakaLuX-Bazaar-Thanker-PDA.user.js
          grep -q "const BAZAAR_VERSION='5.3.24';" SakaLuX-Bazaar-Thanker-PDA.user.js
          grep -q "'🙏'" SakaLuX-Bazaar-Thanker-PDA.user.js
          ! grep -A3 -B1 "const sellerLink = makeLink" SakaLuX-Bazaar-Thanker-PDA.user.js | grep -q "'SakaLuX'"
          python -m json.tool scripts.json >/dev/null
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bazaar-Thanker-PDA.user.js scripts.json greasyfork/Bazaar-Thanker.md
          git commit -m 'Bazaar Thanker v5.3.24 profile emoji link'
          git push

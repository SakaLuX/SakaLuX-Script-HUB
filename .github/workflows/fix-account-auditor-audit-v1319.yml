name: Fix Account Auditor audit v1.3.19
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_account_auditor_audit_v1319.py'
      - '.github/workflows/fix-account-auditor-audit-v1319.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Account Auditor v1.3.19 fixes
        run: python3 .github/scripts/fix_account_auditor_audit_v1319.py
      - name: Validate syntax
        run: node --check SakaLuX-Account-Auditor.user.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Account-Auditor.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Account Auditor audit folder and invalid API guard"
          git push

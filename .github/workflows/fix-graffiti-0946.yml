name: Fix Suite graffiti 0.9.946
on:
  push:
    branches: [fix/graffiti-0946]
    paths:
      - '.github/scripts/fix_graffiti_0946.py'
      - '.github/workflows/fix-graffiti-0946.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python .github/scripts/fix_graffiti_0946.py
      - run: node --check SakaLuX-Suite.user.js
      - run: node tests/suite-graffiti-0946-regression.cjs
      - run: npm install --no-save --ignore-scripts jsdom
      - run: node tests/suite-modules-regression.cjs
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-graffiti-0946-regression.cjs
          git commit -m 'Fix Suite graffiti TornPDA DOM v0.9.946'
          git push

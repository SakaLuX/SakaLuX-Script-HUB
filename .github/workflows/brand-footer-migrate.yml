name: One-time SakaLuX branding footer migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brand-footer-migrate.yml'
      - '.migration/brand-footer-v1.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply branding migration
        run: python .migration/brand-footer-v1.py

      - name: Validate all userscripts
        shell: bash
        run: |
          set -euo pipefail
          for file in SakaLuX-*.user.js; do node --check "$file"; done
          python -m json.tool scripts.json >/dev/null

      - name: Commit migrated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-*.user.js scripts.json greasyfork/*.md
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Persistent Made with love branding across SakaLuX scripts [skip ci]'
          git push

name: Patch experimental Stock Manager v0.7.1
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v071.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v071.py
      - name: Validate
        run: |
          grep -q '@version      0.7.1' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.7.1'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function favoriteTargets' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function sellToCashTarget' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function renderTransactionHistory' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function executeGuidedRebalance' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-near-pct"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-target-favorites"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.7.1' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.7.1 complete remaining roadmap features'
          git push

name: One-time restore Hub runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hub-runtime.yml'
      - '.migration/fix-hub-runtime.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Hub runtime
        run: python .migration/fix-hub-runtime.py
      - name: Validate Hub runtime
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q "function openHub()" SakaLuX-Script-Hub.user.js
          grep -q "function closeHub()" SakaLuX-Script-Hub.user.js
          grep -q "function createOverlay(" SakaLuX-Script-Hub.user.js
          grep -q "function renderList()" SakaLuX-Script-Hub.user.js
          grep -q "function bindCards()" SakaLuX-Script-Hub.user.js
          grep -q "function runAction(" SakaLuX-Script-Hub.user.js
          ! grep -q "settingSwitch('slhs-hide'" SakaLuX-Script-Hub.user.js
          ! grep -q "settings.hideIndividualButtons =" SakaLuX-Script-Hub.user.js
      - name: Commit restored runtime
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Restore Hub panel runtime [skip ci]'
          git push

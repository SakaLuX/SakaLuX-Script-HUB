name: Apply SakaLuX Suite v0.9.1 reminder row fix
on:
  push:
    paths:
      - '.github/workflows/suite-v091-reminder-row.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move reminder icons to Torn money row
        shell: python
        run: |
          from pathlib import Path
          p=Path('SakaLuX-Suite.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      0.9.0','// @version      0.9.1',1)
          s=s.replace("const VERSION='0.9.0';","const VERSION='0.9.1';",1)
          a=s.index('function ensureDock(){')
          b=s.index('function iconButton',a)
          new='''function ensureDock(){\n let d=document.getElementById(IDS.dock);\n if(!d){d=document.createElement('div');d.id=IDS.dock}\n const native=document.getElementById(IDS.native);\n const money=moneyTarget();\n const row=native?.parentElement||money?.parentElement||null;\n if(row){\n  if(d.parentElement!==row)row.appendChild(d);\n  d.className='';\n  d.style.cssText='display:inline-flex!important;flex-direction:row!important;align-items:center!important;gap:4px!important;position:static!important;inset:auto!important;margin:0 0 0 5px!important;z-index:auto!important;vertical-align:middle!important;';\n  return d\n }\n if(!d.isConnected)document.body.appendChild(d);\n d.className='slx-rem-fallback';\n d.style.cssText='position:fixed!important;right:10px!important;top:150px!important;display:flex!important;flex-direction:row!important;align-items:center!important;gap:5px!important;z-index:2147483644!important;';\n return d\n}\n'''
          s=s[:a]+new+s[b:]
          p.write_text(s,encoding='utf-8')

          d=Path('greasyfork/SakaLuX-Suite.md')
          t=d.read_text(encoding='utf-8')
          t=t.replace('**v0.9.0**','**v0.9.1**',1)
          if '### v0.9.1 — reminder row placement' not in t:
              t += '\n\n### v0.9.1 — reminder row placement\n- Moved Daily Prayer Bell, Recovery Planner and Chain Alarm icons out of the profile/settings popup.\n- Reminder icons now attach to the same Torn resource row as the SakaLuX skull/money balance and are appended at the end of that row.\n- Kept a horizontal PDA fallback only when the native resource row is unavailable.\n'
          d.write_text(t,encoding='utf-8')
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.9.1
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m 'Place Suite reminder icons on Torn resource row in v0.9.1'
          git push origin HEAD:main

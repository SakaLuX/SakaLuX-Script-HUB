name: Diagnose Suite OC scan
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/diagnose_suite_oc_scan_20260919.py'
      - '.github/workflows/diagnose-suite-oc-scan-20260919.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/diagnose_suite_oc_scan_20260919.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/oc-scan-diagnostic.txt
          git commit -m "Capture Suite OC scan diagnostic" || exit 0
          git push

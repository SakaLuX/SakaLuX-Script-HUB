name: Run SakaLuX Suite v0.6.0 parity upgrade
on:
  push:
    paths:
      - '.github/workflows/suite-v060-parity.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run prepared parity patch
        shell: bash
        run: |
          git show 2db9209a51d867ae5178a396affbfeea9ea426b5:.github/workflows/suite-v060-parity.yml > /tmp/slx-old.yml
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/slx-old.yml').read_text(encoding='utf-8')
          a=text.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          b=text.index("          PY\n",a)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[a:b].splitlines())
          exec(compile(code,'slx-suite-v060-patch.py','exec'),{})
          PY
          nl -ba SakaLuX-Suite.user.js | sed -n '175,205p'
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.6.0
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Expand SakaLuX Suite module parity to v0.6.0"
          git push origin HEAD:main

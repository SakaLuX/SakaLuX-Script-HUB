name: One-time SakaLuX Suite v0.6.0 parity upgrade
on:
  push:
    paths:
      - '.github/workflows/suite-v060-parity.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Suite parity modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('SakaLuX-Suite.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      0.5.0','// @version      0.6.0',1)
          s=s.replace("const VERSION='0.5.0';","const VERSION='0.6.0';",1)
          # All internal tools now expose a settings entry.
          for mid in ['daily-prayer','item-signals','event-lens','chain-alarm','faction-pulse','armory-loan-radar','member-travel-map','oc-role-match','oc-readiness','war-performance','company-console','odds-scout','race-league-board']:
              needle=f"id:'{mid}'"
              pos=s.find(needle)
              if pos>=0:
                  end=s.find('},',pos)
                  seg=s[pos:end]
                  if 'settings:true' not in seg:
                      s=s[:end]+',settings:true'+s[end:]
          s=s.replace("o.querySelectorAll('[data-settings]').forEach(b=>b.onclick=()=>{if(b.dataset.settings==='recovery-planner')openRecoverySettings()});","o.querySelectorAll('[data-settings]').forEach(b=>b.onclick=()=>openModuleSettings(b.dataset.settings));",1)
          start=s.index('function syncReminderIcons(){')
          end=s.index('function applyModules(){',start)
          block=r'''function syncReminderIcons(){
 const d=ensureDock();
 const defs=[
  ['slx-daily-prayer','daily-prayer','🙏','Daily Prayer Bell',()=>{location.href='https://www.torn.com/church.php'},!prayedToday()],
  ['slx-recovery-planner','recovery-planner','✚','Recovery Planner',openRecoveryPanel,true],
  ['slx-chain-alarm-icon','chain-alarm','⛓️','Chain Alarm',()=>{const p=document.getElementById('slx-chain-alarm-panel');if(p)p.remove();else chainAlarm(true)},true]
 ];
 for(const [id,mid,ico,title,fn,extra] of defs){let b=document.getElementById(id);const need=state[mid]&&extra;if(need&&!b)d.appendChild(iconButton(id,ico,title,fn));else if(!need)b?.remove()}
}

const SLX_KEYS={
 chain:'SakaLuX_SUITE_CHAIN_CFG_V2',item:'SakaLuX_SUITE_ITEM_CFG_V2',events:'SakaLuX_SUITE_EVENT_CFG_V2',pulse:'SakaLuX_SUITE_PULSE_CFG_V2',
 armory:'SakaLuX_SUITE_ARMORY_SCAN_V2',travel:'SakaLuX_SUITE_TRAVEL_OVERRIDES_V2',ocReq:'SakaLuX_SUITE_OC_REQUIREMENTS_V2',
 ocCfg:'SakaLuX_SUITE_OC_CFG_V2',war:'SakaLuX_SUITE_WAR_LEDGER_V2',company:'SakaLuX_SUITE_COMPANY_V2',odds:'SakaLuX_SUITE_ODDS_CFG_V2',race2:'SakaLuX_SUITE_RACE_LEAGUE_V2'
};
const CHAIN_DEFAULTS={warn:120,critical:60,flash:true,dim:true,pos:null,size:null};
const ITEM_CFG_DEFAULTS={oc:true,energy:true,nerve:true,happy:true,heal:true,enh:true};
const EVENT_CFG_DEFAULTS={savedOnly:false,combat:true,trading:true,faction:true,games:true,other:true};
const OC_CFG_DEFAULTS={threshold:65,scope:'self'};

function visibleLife(){const text=document.body.innerText||'';for(const re of [/life[^0-9]{0,25}(\d[\d,]*)\s*\/\s*(\d[\d,]*)/i,/(\d[\d,]*)\s*\/\s*(\d[\d,]*)\s*(?:life|hp)/i]){const m=text.match(re);if(m){const cur=Number(m[1].replace(/,/g,'')),max=Number(m[2].replace(/,/g,''));if(max>0&&cur>=0&&cur<=max)return{cur,max}}}return null}
function hospitalMinutes(){const text=document.body.innerText||'';const h=text.match(/hospital[^0-9]{0,40}(?:(\d+)\s*h(?:ours?)?)?\s*(?:(\d+)\s*m(?:in(?:utes?)?)?)?/i);return h?(Number(h[1]||0)*60)+Number(h[2]||0):0}
function recoveryBonus(){return(recoveryCfg.bio1?10:0)+(recoveryCfg.bio2?10:0)+(recoveryCfg.iv?10:0)+(Number(recoveryCfg.factionUpgrades)||0)*5}
function inventoryQty(name){const n=name.toLowerCase();for(const e of document.querySelectorAll('li,tr,[class*="item"],[data-item],[data-itemid]')){const t=(e.innerText||'').toLowerCase();if(!t.includes(n))continue;const q=(e.innerText||'').match(/(?:x|qty\s*:?|quantity\s*:?)[ ]*(\d[\d,]*)/i)||e.getAttribute('data-qty')?.match(/(\d+)/);if(q)return Number(q[1].replace(/,/g,''))}return null}
function recoveryData(){const hp=visibleLife(),hosp=hospitalMinutes(),bonus=recoveryBonus(),missing=hp?Math.max(0,hp.max-hp.cur):0;let items=RECOVERY_ITEMS.filter(x=>!(recoveryCfg.noDrugs&&x.drug)).map(x=>{const pct=x.healPct*(1+bonus/100),heal=hp?Math.round(hp.max*pct/100):0,count=hp&&missing>0?Math.max(1,Math.ceil(missing/Math.max(1,heal))):0,qty=inventoryQty(x.name);return{...x,healPct:pct,heal,count,qty,waste:hp?Math.max(0,count*heal-missing):0}});const score=x=>recoveryCfg.order==='exit'?x.hospMin:recoveryCfg.order==='full'?x.heal:recoveryCfg.order==='waste'?-x.waste:recoveryCfg.order==='cooldown'?-x.cooldown:recoveryCfg.order==='strongest'?x.healPct:(x.healPct*3)+(x.hospMin/20)-(x.cooldown/10)-(x.waste/Math.max(1,hp?.max||1))*15;items.sort((a,b)=>score(b)-score(a));return{hp,hosp,bonus,items}}
function openRecoveryPanel(){const d=recoveryData(),usable=d.items.filter(x=>x.qty===null||x.qty>0),best=usable[0]||d.items[0];toggleFloat('slx-recovery-panel','Recovery Planner',`${d.hp?`Life: <b>${d.hp.cur.toLocaleString()} / ${d.hp.max.toLocaleString()}</b><br>`:'Life: <b>not detected</b><br>'}Hospital: <b>${Math.round(d.hosp)} min</b><br>Recovery bonus: <b>+${d.bonus}%</b><br>${best?`Suggested: <b>${esc(best.name)}</b>${d.hp?` × ${best.count}`:''}${best.qty!==null?` · owned ${best.qty}`:''}`:'No suggestion available.'}<hr style="border-color:#333">${d.items.slice(0,5).map(x=>`${esc(x.name)} — ${x.healPct.toFixed(1)}%${d.hp?` · ${x.count} needed · waste ${x.waste}`:''}${x.qty!==null?` · owned ${x.qty}`:''}`).join('<br>')}<br><button class="slxs-settings" id="slx-recovery-settings-open">SETTINGS</button>`,()=>{document.getElementById('slx-recovery-settings-open').onclick=openRecoverySettings})}
function openRecoverySettings(){document.getElementById('slx-recovery-settings')?.remove();const m=document.createElement('div');m.className='slxs-modal';m.id='slx-recovery-settings';const choices=[['smart','Balanced'],['exit','Hospital Exit'],['full','Full Life'],['waste','Low Waste'],['cooldown','Low Cooldown'],['strongest','Strongest']],sw=(key,label)=>`<div class="slxs-setting-row"><span>${label}</span><button class="slxs-switch ${recoveryCfg[key]?'on':''}" data-rsw="${key}"><i></i></button></div>`;m.innerHTML=`<div class="slxs-modal-card"><div class="slxs-modal-head"><strong>⚙ Recovery Planner Settings</strong><button class="slxs-close" id="slx-r-close">×</button></div><div class="slxs-modal-body"><div class="slxs-box"><div>Total recovery bonus: <b style="color:#e8bf67">+${recoveryBonus()}%</b></div></div><div class="slxs-box"><div class="slxs-box-title">ITEM SOURCE</div><div class="slxs-choice-grid"><button class="slxs-choice ${recoveryCfg.source==='personal'?'active':''}" data-rsource="personal">Personal Items</button><button class="slxs-choice ${recoveryCfg.source==='faction'?'active':''}" data-rsource="faction">Faction Armory</button></div></div><div class="slxs-box"><div class="slxs-box-title">EDUCATION</div>${sw('bio1','Intermediate Biochemistry +10%')}${sw('bio2','Advanced Biochemistry +10%')}${sw('iv','Intravenous Therapy')}</div><div class="slxs-box"><div class="slxs-box-title">FACTION BONUS</div><input id="slx-r-range" type="range" min="0" max="10" value="${Number(recoveryCfg.factionUpgrades)||0}" style="width:100%"><div id="slx-r-label">${Number(recoveryCfg.factionUpgrades)||0} upgrades (+${(Number(recoveryCfg.factionUpgrades)||0)*5}%)</div></div><div class="slxs-box"><div class="slxs-box-title">PRIORITY</div><div class="slxs-choice-grid">${choices.map(([k,l])=>`<button class="slxs-choice ${recoveryCfg.order===k?'active':''}" data-rorder="${k}">${l}</button>`).join('')}</div></div><div class="slxs-box">${sw('noDrugs','No Drug Usage (exclude Opium)')}</div><button class="slxs-save-wide" id="slx-r-save">Save Settings</button></div></div>`;document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.remove()};document.getElementById('slx-r-close').onclick=()=>m.remove();m.querySelectorAll('[data-rsource]').forEach(b=>b.onclick=()=>{recoveryCfg.source=b.dataset.rsource;save(K.recovery,recoveryCfg);openRecoverySettings()});m.querySelectorAll('[data-rorder]').forEach(b=>b.onclick=()=>{recoveryCfg.order=b.dataset.rorder;save(K.recovery,recoveryCfg);openRecoverySettings()});m.querySelectorAll('[data-rsw]').forEach(b=>b.onclick=()=>{recoveryCfg[b.dataset.rsw]=!recoveryCfg[b.dataset.rsw];save(K.recovery,recoveryCfg);openRecoverySettings()});const r=document.getElementById('slx-r-range');r.oninput=()=>{recoveryCfg.factionUpgrades=Number(r.value);document.getElementById('slx-r-label').textContent=`${r.value} upgrades (+${Number(r.value)*5}%)`};document.getElementById('slx-r-save').onclick=()=>{save(K.recovery,recoveryCfg);m.remove()}}
function toggleFloat(id,title,html,after){const old=document.getElementById(id);if(old){old.remove();return}const p=document.createElement('div');p.id=id;p.className='slx-suite-float';p.innerHTML=`<div class="slx-float-head"><strong>${esc(title)}</strong><button class="slxs-close">×</button></div><div class="slx-float-body">${html}</div>`;document.body.appendChild(p);p.querySelector('.slxs-close').onclick=()=>p.remove();after?.(p)}

function itemSignals(){document.querySelectorAll('.slx-item-tags').forEach(x=>x.remove());if(!state['item-signals'])return;const cfg={...ITEM_CFG_DEFAULTS,...load(SLX_KEYS.item,{})},map={OC:'oc',ENERGY:'energy',NERVE:'nerve',HAPPY:'happy',HEAL:'heal',ENH:'enh'};const candidates=[...document.querySelectorAll('li,tr,[class*="item"],[data-item],[data-itemid]')].filter(el=>!el.closest('#'+IDS.overlay)&&!el.closest('.slx-suite-float'));for(const el of candidates){const txt=(el.innerText||el.getAttribute('aria-label')||'').trim();if(txt.length<2||txt.length>260)continue;const matches=ITEM_RULES.filter(r=>cfg[map[r.tag]]&&r.names.some(n=>txt.toLowerCase().includes(n.toLowerCase())));if(!matches.length)continue;const wrap=document.createElement('div');wrap.className='slx-item-tags';for(const r of matches){const b=document.createElement('span');b.className='slx-item-tag';b.textContent=r.tag;b.title=`${r.note} · ${txt.slice(0,90)}`;wrap.appendChild(b)}el.appendChild(wrap)}}

function onEventsPage(){return /events/i.test(location.href)||/\bEvents\b/i.test(document.querySelector('h1,h2')?.textContent||'')}
function collectEvents(){const rows=[...document.querySelectorAll('li,tr,[class*="event"]')],out=[],seen=new Set();for(const el of rows){if(el.closest('#slx-event-lens'))continue;const t=(el.innerText||'').trim().replace(/\s+/g,' ');if(t.length<12||t.length>600||seen.has(t))continue;if(!/\d{1,2}:\d{2}|ago|yesterday|today|you |your /i.test(t))continue;seen.add(t);let cat='Other';if(/attack|mug|hospital|revive|defeat|hit|bounty/i.test(t))cat='Combat';else if(/bazaar|market|sold|bought|trade|money|\$/i.test(t))cat='Trading';else if(/faction|chain|war|crime|organized crime/i.test(t))cat='Faction';else if(/race|casino|lottery|poker|bookie/i.test(t))cat='Games';out.push({text:t,cat});if(out.length>=150)break}return out}
function eventLens(){document.getElementById('slx-event-lens')?.remove();if(!state['event-lens']||!onEventsPage())return;const events=collectEvents(),cfg={...EVENT_CFG_DEFAULTS,...load(SLX_KEYS.events,{})};if(!events.length)return;const saved=load(K.eventSaved,[]),anchor=document.querySelector('h1,h2')?.parentElement||document.querySelector('#mainContainer')||document.body,p=document.createElement('div');p.id='slx-event-lens';p.className='slx-inline-panel';p.innerHTML=`<div class="slx-inline-top"><strong>🗂️ Event Lens</strong><input id="slx-event-search" placeholder="Search events"><select id="slx-event-filter"><option>All</option>${[...new Set(events.map(e=>e.cat))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><button id="slx-event-saved">${cfg.savedOnly?'ALL':'SAVED'}</button><button id="slx-event-export">EXPORT</button></div><div class="slx-stat">${events.length} visible · ${saved.length} saved</div><div id="slx-event-list"></div>`;anchor.prepend(p);const paint=()=>{const q=document.getElementById('slx-event-search')?.value.toLowerCase()||'',f=document.getElementById('slx-event-filter')?.value||'All',list=document.getElementById('slx-event-list');if(!list)return;list.innerHTML=events.filter(e=>(f==='All'||e.cat===f)&&e.text.toLowerCase().includes(q)&&(!cfg.savedOnly||saved.includes(e.text))).slice(0,50).map(e=>`<div style="border-top:1px solid #333;padding:7px"><b>${esc(e.cat)}</b> · ${esc(e.text)} <button data-save="${esc(encodeURIComponent(e.text))}">${saved.includes(e.text)?'SAVED':'SAVE'}</button></div>`).join('');list.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const t=decodeURIComponent(b.dataset.save);let a=load(K.eventSaved,[]);a=a.includes(t)?a.filter(x=>x!==t):[t,...a];save(K.eventSaved,a.slice(0,250));eventLens()})};document.getElementById('slx-event-search').oninput=paint;document.getElementById('slx-event-filter').onchange=paint;document.getElementById('slx-event-saved').onclick=()=>{cfg.savedOnly=!cfg.savedOnly;save(SLX_KEYS.events,cfg);eventLens()};document.getElementById('slx-event-export').onclick=()=>prompt('Saved Event Lens entries:',JSON.stringify(saved));paint()}

function chainText(){const t=document.body.innerText||'',m=t.match(/chain[^0-9]{0,30}(\d[\d,]*)[\s\S]{0,100}?(\d{1,2}:\d{2}(?::\d{2})?)/i);return m?{count:m[1],time:m[2]}:null}
function chainSecs(x){if(!x)return 99999;const a=x.split(':').map(Number);return a.length===3?a[0]*3600+a[1]*60+a[2]:a[0]*60+a[1]}
function chainAlarm(force=false){let p=document.getElementById('slx-chain-alarm-panel');if(!state['chain-alarm']){p?.remove();return}const c=chainText();if(!c&&!force){p?.remove();return}const cfg={...CHAIN_DEFAULTS,...load(SLX_KEYS.chain,{})};if(!p){p=document.createElement('div');p.id='slx-chain-alarm-panel';p.className='slx-suite-float';p.style.top=(cfg.pos?.top||155)+'px';p.style.left=cfg.pos?.left!=null?cfg.pos.left+'px':'';p.style.right=cfg.pos?.left!=null?'auto':'10px';p.style.width=(cfg.size?.w||210)+'px';p.style.height=(cfg.size?.h||120)+'px';p.style.resize='both';p.style.overflow='auto';p.innerHTML='<div class="slx-float-head"><strong>⛓️ Chain Alarm</strong><button class="slxs-close">×</button></div><div class="slx-float-body"></div>';document.body.appendChild(p);p.querySelector('.slxs-close').onclick=()=>p.remove();let d=null,h=p.querySelector('.slx-float-head');h.onpointerdown=e=>{d={x:e.clientX-p.offsetLeft,y:e.clientY-p.offsetTop};h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(d){p.style.left=Math.max(0,e.clientX-d.x)+'px';p.style.top=Math.max(0,e.clientY-d.y)+'px';p.style.right='auto'}};h.onpointerup=()=>{d=null;cfg.pos={left:p.offsetLeft,top:p.offsetTop};cfg.size={w:p.offsetWidth,h:p.offsetHeight};save(SLX_KEYS.chain,cfg)}}const sec=chainSecs(c?.time),crit=sec<=cfg.critical,warn=sec<=cfg.warn;const body=p.querySelector('.slx-float-body');body.innerHTML=c?`Chain: <b>${c.count}</b><br>Timer: <b>${c.time}</b>${warn?'<br>⚠ Chain timer is low.':''}`:'Chain data is not visible on this page.';p.style.borderColor=crit?'#db4455':warn?'#b78b34':'#4a5260';p.style.opacity=(cfg.dim&&document.hidden)?'.45':'1';p.style.animation=(cfg.flash&&crit&&!document.hidden)?'slxChainFlash .8s steps(2,end) infinite':'none'}
if(!document.getElementById('slx-chain-keyframes')){const st=document.createElement('style');st.id='slx-chain-keyframes';st.textContent='@keyframes slxChainFlash{50%{box-shadow:0 0 20px #ff334d}}';document.head.appendChild(st)}
document.addEventListener('visibilitychange',()=>{if(state['chain-alarm'])chainAlarm()});document.addEventListener('keydown',e=>{if(e.altKey&&String(e.key).toLowerCase()==='c'){e.preventDefault();const p=document.getElementById('slx-chain-alarm-panel');if(p)p.remove();else chainAlarm(true)}});

function pagePanel(id,title,html){document.getElementById(id)?.remove();const a=document.querySelector('h1,h2')?.parentElement||document.querySelector('#mainContainer');if(!a)return;const p=document.createElement('div');p.id=id;p.className='slx-inline-panel';p.innerHTML=`<div class="slx-inline-top"><strong>${title}</strong></div><div class="slx-stat">${html}</div>`;a.prepend(p)}
function factionRows(){const o=[],seen=new Set;for(const e of document.querySelectorAll('tr,li,[class*="member"]')){const a=e.querySelector('a[href*="profiles.php"],a[href*="XID="]');if(!a)continue;const n=(a.textContent||'').trim(),t=(e.innerText||'').replace(/\s+/g,' ');if(!n||seen.has(n)||t.length>800)continue;seen.add(n);const ago=(t.match(/(?:last action|action)[^0-9]{0,10}(\d+)\s*(minute|hour|day)/i)||[]);o.push({n,t,e,a,status:/hospital/i.test(t)?'Hospital':/travel|abroad/i.test(t)?'Travel':/jail/i.test(t)?'Jail':'Okay',act:/online/i.test(t)?'Online':/idle/i.test(t)?'Idle':/offline/i.test(t)?'Offline':'Unknown',ago:ago?`${ago[1]} ${ago[2]}`:''})}return o}
function factionPulse(){document.getElementById('slx-faction-pulse')?.remove();if(!state['faction-pulse']||!/faction/i.test(location.href))return;const r=factionRows(),n=x=>r.filter(y=>y.status===x||y.act===x).length;if(r.length){const risky=r.filter(x=>x.status==='Hospital'||x.status==='Travel'||x.act==='Offline').slice(0,8);pagePanel('slx-faction-pulse','📡 Faction Pulse',`Members: <b>${r.length}</b> · online: <b>${n('Online')}</b> · idle: <b>${n('Idle')}</b> · hospital: <b>${n('Hospital')}</b> · traveling: <b>${n('Travel')}</b> · offline: <b>${n('Offline')}</b>${risky.length?`<br>Attention: ${risky.map(x=>esc(x.n)+' ['+x.status+'/'+x.act+']').join(' · ')}`:''}`)}}
function armoryRadar(){document.getElementById('slx-armory-radar')?.remove();document.querySelectorAll('[data-slx-loan]').forEach(x=>x.remove());if(!state['armory-loan-radar']||!/(armory|armoury|faction)/i.test(location.href))return;const rows=[];for(const e of document.querySelectorAll('li,tr,[class*="item"]')){const t=(e.innerText||'').replace(/\s+/g,' ').trim();if(t.length>600||!/loaned|borrowed|available|returned/i.test(t))continue;const h=(t.match(/(?:loaned to|borrowed by|holder)\s*:?\s*([A-Za-z0-9_\-\[\] ]{2,35})/i)||[])[1]||'';rows.push({t,h});e.style.outline=h?'1px solid #b44':'1px solid #285';if(h){const b=document.createElement('button');b.dataset.slxLoan='1';b.className='slx-badge-mini';b.textContent='LOAN';b.onclick=()=>alert(`${h}\n\n${t}`);e.appendChild(b)}}if(rows.length){save(SLX_KEYS.armory,{at:Date.now(),url:location.href,rows});pagePanel('slx-armory-radar','🎒 Armory Loan Radar',`Scanned: <b>${rows.length}</b> · loaned: <b>${rows.filter(x=>x.h).length}</b> · available: <b>${rows.filter(x=>!x.h).length}</b> · snapshot saved. <button id="slx-armory-rescan">SCAN</button>`);document.getElementById('slx-armory-rescan')?.addEventListener('click',armoryRadar)}}
function travelMap(){document.querySelectorAll('.slx-country-tag').forEach(x=>x.remove());document.getElementById('slx-travel-summary')?.remove();if(!state['member-travel-map']||!/faction|profiles\.php/i.test(location.href))return;const ov=load(SLX_KEYS.travel,{}),rows=factionRows(),counts={};for(const r of rows){const id=(r.a.href.match(/XID=(\d+)/)||[])[1]||r.n;let c=ov[id]||Object.keys(COUNTRY).find(x=>r.t.toLowerCase().includes(x));if(!c)continue;counts[c]=(counts[c]||0)+1;const s=document.createElement('span');s.className='slx-country-tag';s.textContent=' '+(COUNTRY[c]||'🌐');s.title='Country: '+c+' — tap to edit';s.onclick=e=>{e.preventDefault();e.stopPropagation();const v=prompt('Country override (blank = automatic):',c);if(v===null)return;if(v.trim())ov[id]=v.trim().toLowerCase();else delete ov[id];save(SLX_KEYS.travel,ov);travelMap()};r.a.after(s)}if(Object.keys(counts).length)pagePanel('slx-travel-summary','🌍 Member Travel Map',Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`${COUNTRY[c]||'🌐'} ${esc(c)}: <b>${n}</b>`).join(' · '))}
function ocRoleMatch(){document.querySelectorAll('.slx-oc-match,.slx-oc-pred').forEach(x=>x.remove());if(!state['oc-role-match']||!/(organizedcrimes|crime|faction)/i.test(location.href))return;const cfg={...OC_CFG_DEFAULTS,...load(SLX_KEYS.ocCfg,{})};for(const e of document.querySelectorAll('li,tr,[class*="crime"],[class*="role"],[class*="panel"]')){const t=e.innerText||'';if(t.length>1200||!/(role|success|position)/i.test(t))continue;const ps=[...t.matchAll(/([A-Za-z][A-Za-z \-]{2,30})\s*[:\-]?\s*(\d{1,3}(?:\.\d+)?)\s*%/g)].map(m=>({n:m[1].trim(),p:+m[2]})).filter(x=>x.p<=100);if(!ps.length)continue;const sorted=[...ps].sort((a,b)=>b.p-a.p),best=sorted[0],avg=ps.reduce((a,x)=>a+x.p,0)/ps.length,status=avg>=75?'Balanced Team':avg>=65?'Moderate Risk':avg>=50?'Needs Attention':'High-Risk Assignment',s=document.createElement('span');s.className='slx-oc-match slx-badge-mini';s.textContent=`BEST ${best.n} ${best.p}%`;s.title=`Threshold ${cfg.threshold}% · Estimated ${avg.toFixed(1)}% · ${status}`;e.appendChild(s);const q=document.createElement('span');q.className='slx-oc-pred slx-badge-mini';q.textContent=`EST ${avg.toFixed(0)}% ${status}`;e.appendChild(q)}}
function ocReadiness(){document.getElementById('slx-oc-ready')?.remove();if(!state['oc-readiness']||!/(organizedcrimes|crime|faction)/i.test(location.href))return;const t=document.body.innerText||'',no=/not (?:currently )?in an organized crime|not in an oc|join an organized crime/i.test(t),matches=[...t.matchAll(/(?:missing|required item|vacant role|not ready)[^\n]{0,120}/gi)].map(x=>x[0].trim()),req=[...t.matchAll(/(?:requires?|required)\s*:?\s*([A-Za-z0-9 '&\-]{3,45})/gi)].map(x=>x[1].trim());if(req.length)save(SLX_KEYS.ocReq,{at:Date.now(),requirements:[...new Set(req)].slice(0,100)});if(no||matches.length||req.length)pagePanel('slx-oc-ready','✅ OC Readiness',`${no?'⚠ <b>Not in an active OC.</b><br>':''}${matches.length?`Warnings: <b>${matches.length}</b><br>${matches.slice(0,6).map(esc).join('<br>')}`:'No visible missing-role/item warning.'}${req.length?`<br>Captured requirements: ${[...new Set(req)].slice(0,8).map(esc).join(' · ')}`:''}`)}
function warPerformance(){document.getElementById('slx-war-performance')?.remove();if(!state['war-performance']||!/faction/i.test(location.href))return;const fr=factionRows(),rows=fr.map(x=>{const q=x.t.match(/respect[^0-9]{0,12}([\d,.]+)/i),h=x.t.match(/hits?[^0-9]{0,12}(\d+)/i),a=x.t.match(/attacks?[^0-9]{0,12}(\d+)/i);return{n:x.n,res:q?+q[1].replace(/,/g,''):0,h:h?+h[1]:0,a:a?+a[1]:0,risk:x.status!=='Okay'||x.act==='Offline'}}).filter(x=>x.res||x.h||x.a),d=load(SLX_KEYS.war,{reports:[]});if(!rows.length)return;const z=[...rows].sort((a,b)=>(b.res*10+b.h*2+b.a)-(a.res*10+a.h*2+a.a));const sig=rows.map(x=>`${x.n}:${x.res}:${x.h}:${x.a}`).join('|');if(d.reports[0]?.sig!==sig)d.reports=[{sig,at:Date.now(),url:location.href,rows},...(d.reports||[])].slice(0,50);save(SLX_KEYS.war,d);pagePanel('slx-war-performance','⚔️ War Performance',`Tracked: <b>${rows.length}</b> · MVP: <b>${esc(z[0].n)}</b> (${z[0].res} respect / ${z[0].h} hits) · risk flags: <b>${rows.filter(x=>x.risk).length}</b> · reports: <b>${d.reports.length}</b><br>${z.slice(0,8).map((x,i)=>`${i+1}. ${esc(x.n)} — ${x.res}R / ${x.h}H / ${x.a}A${x.risk?' ⚠':''}`).join('<br>')}`)}
function companyConsole(){document.getElementById('slx-company-console')?.remove();if(!state['company-console']||!/company/i.test(location.href))return;const t=document.body.innerText||'',emps=[...document.querySelectorAll('tr,li,[class*="employee"]')].filter(e=>/wage|position|employee|train/i.test(e.innerText||'')),wages=[...t.matchAll(/(?:wage|salary)[^$]{0,15}\$([\d,]+)/gi)].map(m=>+m[1].replace(/,/g,'')),income=(t.match(/(?:income|revenue|profit)[^$]{0,25}\$([\d,]+)/i)||[])[1],tr=(t.match(/trains?[^0-9]{0,20}(\d+)/i)||[])[1],tax=(t.match(/tax[^$]{0,20}\$([\d,]+)/i)||[])[1],d=load(SLX_KEYS.company,{snapshots:[],training:[],tax:[]}),snap={at:Date.now(),employees:emps.length,wages:wages.reduce((a,b)=>a+b,0),income:income?+income.replace(/,/g,''):null,trains:+tr||null,tax:tax?+tax.replace(/,/g,''):null};if(!d.snapshots[0]||Date.now()-d.snapshots[0].at>300000)d.snapshots=[snap,...d.snapshots].slice(0,100);save(SLX_KEYS.company,d);pagePanel('slx-company-console','🏢 Company Console',`Employees: <b>${emps.length}</b> · visible wages: <b>$${snap.wages.toLocaleString()}</b> · income: <b>${snap.income!=null?'$'+snap.income.toLocaleString():'—'}</b> · trains: <b>${snap.trains??'—'}</b> · tax: <b>${snap.tax!=null?'$'+snap.tax.toLocaleString():'—'}</b><br><button id="slx-co-price">PRICE CALC</button> <button id="slx-co-train">LOG TRAIN</button> <button id="slx-co-tax">LOG TAX</button> · snapshots ${d.snapshots.length}`);document.getElementById('slx-co-price')?.addEventListener('click',()=>{const c=+prompt('Cost per item')||0,m=+prompt('Markup %','10')||0;alert('Suggested price: $'+Math.round(c*(1+m/100)).toLocaleString())});document.getElementById('slx-co-train')?.addEventListener('click',()=>{const n=prompt('Training note / employee:');if(n){d.training.unshift({at:Date.now(),note:n});d.training=d.training.slice(0,200);save(SLX_KEYS.company,d)}});document.getElementById('slx-co-tax')?.addEventListener('click',()=>{const v=+prompt('Tax amount')||0;if(v){d.tax.unshift({at:Date.now(),amount:v});d.tax=d.tax.slice(0,200);save(SLX_KEYS.company,d)}})}
function oddsScout(){document.querySelectorAll('.slx-odds-hint').forEach(x=>x.remove());document.getElementById('slx-odds-summary')?.remove();if(!state['odds-scout']||!/(casino|bookie|sports)/i.test(location.href))return;const markets=[];for(const e of document.querySelectorAll('tr,li,[class*="bet"],[class*="market"],[class*="event"]')){const t=(e.innerText||'').trim().replace(/\s+/g,' ');if(t.length>1000||t.length<8)continue;const o=[...t.matchAll(/(?:^|\s)([1-9]\d*(?:\.\d{1,3})?)(?=\s|$)/g)].map(m=>+m[1]).filter(x=>x>=1.01&&x<=1000);if(o.length<2)continue;const sum=o.reduce((a,x)=>a+100/x,0),margin=sum-100;if(e.querySelector('.slx-odds-hint'))continue;const s=document.createElement('span');s.className='slx-odds-hint slx-badge-mini';s.textContent=`MARGIN ${margin.toFixed(1)}%`;s.title='Implied probabilities: '+o.map(x=>(100/x).toFixed(1)+'%').join(' / ');e.appendChild(s);markets.push({t,o,margin})}if(markets.length){const best=[...markets].sort((a,b)=>a.margin-b.margin)[0];pagePanel('slx-odds-summary','🎲 Odds Scout',`Markets scanned: <b>${markets.length}</b> · lowest visible margin: <b>${best.margin.toFixed(1)}%</b> · duplicate protection ON.<br><button id="slx-odds-research">RESEARCH EVENT</button>`);document.getElementById('slx-odds-research')?.addEventListener('click',()=>{const q=encodeURIComponent(best.t.slice(0,120));window.open('https://www.google.com/search?q='+q,'_blank')})}}
function raceLeague(){document.getElementById('slx-race-league')?.remove();if(!state['race-league-board']||!/race/i.test(location.href))return;const rows=[],seen=new Set;for(const e of document.querySelectorAll('tr,li,[class*="result"]')){const t=(e.innerText||'').trim().replace(/\s+/g,' '),m=t.match(/(?:^|\s)(\d{1,2})(?:st|nd|rd|th)?[.)\s-]+([A-Za-z0-9_\-\[\] ]{2,35})/i);if(m&&+m[1]<=30&&!seen.has(m[1]+'|'+m[2])){seen.add(m[1]+'|'+m[2]);rows.push({p:+m[1],n:m[2].trim()})}}const d=load(SLX_KEYS.race2,{active:'Default',champs:{Default:{races:[],drivers:{}}}});d.champs??={Default:{races:[],drivers:{}}};d.active=d.active&&d.champs[d.active]?d.active:Object.keys(d.champs)[0]||'Default';d.champs[d.active]??={races:[],drivers:{}};const c=d.champs[d.active];if(rows.length>=2){const pts=[25,18,15,12,10,8,6,4,2,1],key=rows.map(x=>x.p+':'+x.n).join('|');if(!c.races.some(x=>x.key===key)){c.races.unshift({key,at:Date.now(),rows});for(const x of rows){c.drivers[x.n]??={pts:0,w:0,podiums:0,r:0};c.drivers[x.n].pts+=pts[x.p-1]||0;c.drivers[x.n].r++;if(x.p===1)c.drivers[x.n].w++;if(x.p<=3)c.drivers[x.n].podiums++}c.races=c.races.slice(0,250);save(SLX_KEYS.race2,d)}}const z=Object.entries(c.drivers).sort((a,b)=>b[1].pts-a[1].pts).slice(0,15);if(z.length||rows.length)pagePanel('slx-race-league','🏁 Race League Board',`Championship: <b>${esc(d.active)}</b> · races: <b>${c.races.length}</b> · duplicate protection ON<br><button id="slx-race-new">NEW CHAMP</button> <button id="slx-race-switch">SWITCH</button> <button id="slx-race-backup">BACKUP</button><br>${z.map(([n,v],i)=>`${i+1}. <button data-driver="${esc(encodeURIComponent(n))}">${esc(n)}</button> <b>${v.pts} pts</b> · ${v.w}W · ${v.podiums}P · ${v.r} races`).join('<br>')}`);document.getElementById('slx-race-new')?.addEventListener('click',()=>{const n=prompt('New championship name:');if(n?.trim()){d.champs[n.trim()]={races:[],drivers:{}};d.active=n.trim();save(SLX_KEYS.race2,d);raceLeague()}});document.getElementById('slx-race-switch')?.addEventListener('click',()=>{const n=prompt('Championship:\n'+Object.keys(d.champs).join('\n'),d.active);if(n&&d.champs[n]){d.active=n;save(SLX_KEYS.race2,d);raceLeague()}});document.getElementById('slx-race-backup')?.addEventListener('click',()=>prompt('Race League backup:',JSON.stringify(d)));document.querySelectorAll('[data-driver]').forEach(b=>b.onclick=()=>{const n=decodeURIComponent(b.dataset.driver),v=c.drivers[n];alert(`${n}\nPoints: ${v.pts}\nWins: ${v.w}\nPodiums: ${v.podiums}\nRaces: ${v.r}`)})}}

function openModuleSettings(id){
 if(id==='recovery-planner'){openRecoverySettings();return}
 if(id==='daily-prayer'){if(confirm('Reset today\'s prayer reminder?')){localStorage.removeItem(K.prayerDay);syncReminderIcons()}return}
 if(id==='chain-alarm'){const c={...CHAIN_DEFAULTS,...load(SLX_KEYS.chain,{})};c.warn=Math.max(10,+prompt('Warning threshold (seconds):',c.warn)||c.warn);c.critical=Math.max(5,+prompt('Critical threshold (seconds):',c.critical)||c.critical);c.flash=confirm('Enable critical flashing?');c.dim=confirm('Dim tracker when Torn is not focused?');save(SLX_KEYS.chain,c);chainAlarm();return}
 if(id==='item-signals'){const c={...ITEM_CFG_DEFAULTS,...load(SLX_KEYS.item,{})};for(const k of Object.keys(c))c[k]=confirm(`Show ${k.toUpperCase()} markers?`);save(SLX_KEYS.item,c);itemSignals();return}
 if(id==='event-lens'){const c={...EVENT_CFG_DEFAULTS,...load(SLX_KEYS.events,{})};c.savedOnly=confirm('Show only saved events by default?');save(SLX_KEYS.events,c);eventLens();return}
 if(id==='oc-role-match'||id==='oc-readiness'){const c={...OC_CFG_DEFAULTS,...load(SLX_KEYS.ocCfg,{})};c.threshold=Math.max(0,Math.min(100,+prompt('Suitability threshold %:',c.threshold)||c.threshold));c.scope=confirm('Check all visible members? OK = all, Cancel = self')?'all':'self';save(SLX_KEYS.ocCfg,c);applyModules();return}
 if(id==='armory-loan-radar'){const d=load(SLX_KEYS.armory,null);alert(d?`Last armory snapshot: ${new Date(d.at).toLocaleString()}\nRows: ${d.rows.length}`:'No armory snapshot yet.');return}
 if(id==='member-travel-map'){if(confirm('Clear all country overrides?')){localStorage.removeItem(SLX_KEYS.travel);travelMap()}return}
 if(id==='war-performance'){const d=load(SLX_KEYS.war,{reports:[]});if(confirm(`Stored war reports: ${d.reports.length}\nClear them?`)){save(SLX_KEYS.war,{reports:[]});warPerformance()}return}
 if(id==='company-console'){const d=load(SLX_KEYS.company,{snapshots:[],training:[],tax:[]});prompt('Company local data backup:',JSON.stringify(d));return}
 if(id==='odds-scout'){alert('Odds Scout is advisory only. It never places bets. It calculates implied probabilities and visible market margin.');return}
 if(id==='race-league-board'){const d=load(SLX_KEYS.race2,{active:'Default',champs:{Default:{races:[],drivers:{}}}}),raw=prompt('Race League backup / paste replacement:',JSON.stringify(d));if(raw&&raw!==JSON.stringify(d)){try{save(SLX_KEYS.race2,JSON.parse(raw));raceLeague()}catch{alert('Invalid race backup.')}}return}
 if(id==='faction-pulse'){alert('Faction Pulse scans visible member rows for online/idle/offline, hospital, travel, abroad and jail signals.');return}
}

'''
          s=s[:start]+block+s[end:]

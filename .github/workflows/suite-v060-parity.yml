name: Apply SakaLuX Suite v0.6.0 parity
on:
  push:
    paths:
      - '.github/workflows/suite-v060-parity.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply parity patch
        run: python tools/suite_v060_patch.py
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.6.0
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Expand SakaLuX Suite module parity to v0.6.0"
          git push origin HEAD:main

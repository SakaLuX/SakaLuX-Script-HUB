          s=s.replace("window.SakaLuXSuite={version:VERSION,open,close,health,isModuleEnabled:id=>!!state[id],getSharedApiKey:()=>apiKey,openRecoverySettings,markPrayed};","window.SakaLuXSuite={version:VERSION,open,close,health,isModuleEnabled:id=>!!state[id],getSharedApiKey:()=>apiKey,openRecoverySettings,openModuleSettings,markPrayed};",1)
          p.write_text(s,encoding='utf-8')

name: Sync SakaLuX script versions and releases

on:
  push:
    branches: [main]
    paths:
      - '*.user.js'
      - 'release-config.json'
      - 'tools/sync_release_metadata.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sakalux-release-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: "!contains(github.event.head_commit.message, '[skip-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize dock, runtime, registry and markdown
        run: python tools/sync_release_metadata.py
      - name: Validate syntax of synchronized userscripts
        run: |
          for script in *.user.js; do node --check "$script"; done
      - name: Commit synchronized metadata
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.user.js' scripts.json 'greasyfork/*.md'
          git commit -m "chore(release): synchronize versions, dock, docs and registry [skip-sync]"
          git push
      - name: Publish GitHub releases for changed script versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git diff --name-only HEAD^ HEAD -- '*.user.js' | while read -r script; do
            [ -f "$script" ] || continue
            version=$(sed -nE 's@^//[[:space:]]*@version[[:space:]]+([^[:space:]]+).*@\\1@p' "$script" | head -1)
            [ -n "$version" ] || continue
            id=$(python - "$script" <<'PY'
          import json,sys
          rows=json.load(open('release-config.json'))['scripts']
          print(next((r['id'] for r in rows if r['file']==sys.argv[1]), ''))
          PY
            )
            [ -n "$id" ] || continue
            tag="$id-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            doc=$(python - "$id" <<'PY'
          import json,sys
          print(next(r['doc'] for r in json.load(open('release-config.json'))['scripts'] if r['id']==sys.argv[1]))
          PY
            )
            gh release create "$tag" "$script" --title "$id v$version" --notes-file "$doc" --target main
          done

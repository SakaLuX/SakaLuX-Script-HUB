name: Test Priority 5 Health Status v2
on:
  push:
    branches: [test/hub-health-status-v2-final]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply per-module health status migration
        run: node .github/scripts/apply_priority5_status_v2.js
      - name: Install validation dependencies
        run: |
          python3 -m pip install PyYAML==6.0.3
          npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Validate health status and repository
        run: |
          node --check SakaLuX-Script-Hub.user.js
          node tests/hub-health-status-regression.cjs
          node tests/hub-health-diagnostics-regression.cjs
          NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/hub-details-regression.cjs
          python3 .github/scripts/validate_repository.py
      - name: Commit generated Hub v1.9.87 changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          git commit -m 'Add per-module Hub health status v1.9.87'
          git push

name: Prepare PR50 userscript release bumps
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-pr50-version-bumps.yml'
      - 'tools/bump_pr50_releases.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: release/bump-signed-license-scripts-20261023
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply complete source, registry and changelog bumps
        run: python tools/bump_pr50_releases.py
      - name: Validate release versions
        run: python tools/release_preflight.py --all
      - name: Commit full bumps to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-*.user.js scripts.json greasyfork/
          git diff --cached --quiet || git commit -m "release: bump all PR50 userscripts, suite and metadata"
          git push

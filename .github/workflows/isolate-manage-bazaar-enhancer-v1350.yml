name: Enhancer Guard v1.3.50 Manage Bazaar isolation
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/isolate_manage_bazaar_enhancer_v1350.py'
      - '.github/workflows/isolate-manage-bazaar-enhancer-v1350.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: enhancer-v1350-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply strict Manage Bazaar isolation
        run: python3 .github/scripts/isolate_manage_bazaar_enhancer_v1350.py
      - name: Validate
        run: |
          node --check SakaLuX-Enhancer-Guard.user.js
          python3 -m json.tool scripts.json >/dev/null
          grep -F '// @version      1.3.50' SakaLuX-Enhancer-Guard.user.js
          grep -F 'if (isManageBazaarPage()) return false;' SakaLuX-Enhancer-Guard.user.js
          grep -F 'if (isManageBazaarPage()) return;' SakaLuX-Enhancer-Guard.user.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Enhancer-Guard.user.js scripts.json greasyfork/Enhancer-Guard.md greasyfork/Script-Hub.md releases/enhancer-guard-v1.3.50.md backups/enhancer-manage-isolation-v*-2026-09-20
          git commit -m "Release Enhancer Guard v1.3.50 strict Manage Bazaar isolation"
          git push
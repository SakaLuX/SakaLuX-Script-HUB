name: Apply Hub launcher recovery
on:
  push:
    paths:
      - '.github/workflows/temp-hub-launcher-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/hub_launcher_fix.py
      - name: Validate
        run: |
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit source changes
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Script-Hub.user.js scripts.json greasyfork/Script-Hub.md
          git commit -m 'Restore Hub launcher controls' || exit 0
          git push origin HEAD:main

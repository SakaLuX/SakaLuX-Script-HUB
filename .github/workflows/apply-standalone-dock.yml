name: Finalize SakaLuX coordinated release

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apply_standalone_dock.py'
      - '.github/workflows/apply-standalone-dock.yml'

permissions:
  contents: write

concurrency:
  group: sakalux-coordinated-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync versions, dock, registry and release information
        run: python3 tools/apply_standalone_dock.py

      - name: Remove one-time migration files
        shell: bash
        run: |
          rm -f tools/apply_standalone_dock.py
          rm -f .github/workflows/apply-standalone-dock.yml

      - name: Validate JavaScript and JSON before release
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.user.js; do
            node --check "$file"
          done
          python3 -m json.tool scripts.json >/dev/null

      - name: Commit coordinated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes required."
            exit 0
          fi
          git commit -m "Release standalone dock and 12-hour Hub reminders"
          git push origin HEAD:main

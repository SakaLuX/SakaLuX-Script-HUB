name: Apply SakaLuX Standalone Dock

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apply_standalone_dock.py'
      - '.github/workflows/apply-standalone-dock.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply standalone dock and 12-hour Hub reminder
        run: python3 tools/apply_standalone_dock.py

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No userscript changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.user.js'
          git commit -m "Unify standalone dock and 12-hour Hub reminder"
          git push

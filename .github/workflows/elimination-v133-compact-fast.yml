name: Elimination v1.3.3 Compact Fast

on:
  push:
    paths:
      - '.github/workflows/elimination-v133-compact-fast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p=Path('SakaLuX-Elimination-Assistant.user.js')
          s=p.read_text()
          old=s
          backup=Path('backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js')
          if not backup.exists(): backup.write_text(s)

          s=s.replace('// @version      1.3.2','// @version      1.3.3',1)
          s=s.replace("const VERSION='1.3.2';","const VERSION='1.3.3';",1)

          # Load only first 100 targets for fast initial rendering.
          s=s.replace("for(let off=0,i=0;i<5;i++,off+=100)","for(let off=0,i=0;i<1;i++,off+=100)",1)

          # Compact signal: two visual lines via span blocks in render; keep function plain text.
          s=re.sub(r"function signal\(p\)\{[^\n]*\}",
                   lambda m: "function signal(p){const r=risk(p);const a=`${p.ff?'FF '+p.ff.toFixed(2):'FF —'} · ${p.bs?'BS '+fmtBS(p.bs):'BS —'}`;const b=`${r.edge!==null?r.edge.toFixed(1)+'× · ':''}${r.label} · ${smart(p)}/100`;return{a,b}}",
                   s,count=1)

          css_start=s.find("function css(){")
          css_end=s.find("function inject(){",css_start)
          if css_start<0 or css_end<0: raise SystemExit('css block not found')
          new_css=r'''function css(){if($('#'+IDS.style))return;const s=document.createElement('style');s.id=IDS.style;s.textContent=`
#${IDS.button}{position:fixed;right:12px;bottom:82px;z-index:999999;background:#171b21;color:#fff;border:1px solid #414a55;border-radius:999px;padding:10px 13px;font-weight:900;font-size:13px}
#${IDS.panel}{display:none;position:fixed;right:4px;bottom:72px;z-index:999998;width:min(920px,calc(100vw - 8px));height:90vh;max-height:calc(100vh - 72px);background:#0b1016;color:#f8fafc;border:1px solid #3b4652;border-radius:14px;overflow:hidden;font:13px Arial,sans-serif}
#${IDS.panel}.open{display:flex;flex-direction:column}.slx-h,.slx-t,.slx-s{display:flex;align-items:center;border-bottom:1px solid #27323d}.slx-h{gap:6px;padding:6px 8px;background:#111821;min-height:36px}.slx-h b{flex:1;font-size:14px;line-height:1.1}.slx-h button{min-width:36px}.slx-t{gap:5px;padding:5px 7px;background:#0f151d;flex-wrap:nowrap}.slx-top #slx-team{flex:1;min-width:0}.slx-search #slx-filter{width:102px;flex:0 0 102px}.slx-search #slx-q{flex:1;min-width:0}.slx-t input,.slx-t select,.slx-t button,.slx-a,.slx-h button,.slx-cal-mini{background:#18212c;color:#f8fafc;border:1px solid #475569;border-radius:7px;padding:6px 7px;font-size:12px;min-height:34px}.slx-t button{font-weight:900;white-space:nowrap}.slx-s{gap:5px;padding:4px 7px;background:#121a23;min-height:32px;flex-wrap:nowrap}.slx-s span{flex:1;min-width:0;color:#dbe4ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.slx-s b{color:#facc15;font-size:11px;white-space:nowrap}.slx-cal-mini{padding:4px 6px;min-height:26px;font-size:10px;font-weight:900;color:#fde68a;border-color:#7c5f11;background:#2a220b;white-space:nowrap}.slx-body{overflow:auto;flex:1;background:#0b1016}.slx-body table{width:100%;border-collapse:collapse;table-layout:fixed}.slx-body col.signal{width:34%}.slx-body col.player{width:23%}.slx-body col.lvl{width:7%}.slx-body col.last{width:9%}.slx-body col.actions{width:27%}.slx-body th,.slx-body td{border-bottom:1px solid #22303c;text-align:left;vertical-align:middle;padding:5px 4px;font-size:11px;line-height:1.1;overflow:hidden}.slx-body th{position:sticky;top:0;z-index:2;background:#131c25;color:#f8fafc;font-weight:900;white-space:nowrap}.slx-sig-top,.slx-sig-bottom{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slx-sig-bottom{margin-top:2px}.slx-body td:nth-child(2){white-space:nowrap;text-overflow:ellipsis}.slx-body td:nth-child(2) small{display:block;font-size:9px;color:#94a3b8;margin-top:1px}.slx-body td:nth-child(3),.slx-body td:nth-child(4){text-align:center;white-space:nowrap}.slx-a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin:1px;padding:4px 5px;min-height:26px;font-size:10px}.slx-player{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slx-actions{white-space:nowrap!important;text-align:right!important}.slx-actions .slx-a{padding:3px 4px;min-width:22px;font-size:9px}.slx-actions .atk{min-width:34px;font-weight:900;color:#fff;border-color:#64748b}.slx-actions .win{color:#86efac}.slx-actions .loss{color:#fda4af}.safe{color:#4ade80!important;font-weight:900}.risky{color:#fbbf24!important;font-weight:900}.skip{color:#fb7185!important;font-weight:900}.slx-modal{display:none;position:absolute;inset:0;z-index:20;background:#0c1015f5;padding:14px;overflow:auto;font-size:13px}.slx-modal.open{display:block}.slx-modal input{width:100%;padding:9px;margin:4px 0 9px;background:#11161c;color:#fff;border:1px solid #475569;border-radius:8px;font-size:13px}@media(max-width:640px){#${IDS.panel}{height:92vh;max-height:calc(100vh - 64px)}.slx-h{padding:5px 6px}.slx-h b{font-size:13px}.slx-t{padding:4px 6px}.slx-search #slx-filter{width:92px;flex-basis:92px}.slx-s{padding:3px 6px}.slx-body th,.slx-body td{font-size:10.5px;padding:4px 3px}.slx-body col.signal{width:35%}.slx-body col.player{width:22%}.slx-body col.lvl{width:7%}.slx-body col.last{width:9%}.slx-body col.actions{width:27%}}
`;document.head.appendChild(s)}
'''
          s=s[:css_start]+new_css+s[css_end:]

          html_start=s.find("p.innerHTML=`",s.find("function inject(){"))
          html_end=s.find("`;document.body.append(b,p);",html_start)
          if html_start<0 or html_end<0: raise SystemExit('panel html not found')
          new_html='''p.innerHTML=`<div class="slx-h"><b>SakaLuX Elimination Assistant v${VERSION}</b><button id="slx-set">⚙</button><button id="slx-close">✕</button></div><div class="slx-t slx-top"><select id="slx-team"><option value="">Team…</option></select><button id="slx-load">LOAD</button><button id="slx-ff">FF SCAN</button></div><div class="slx-t slx-search"><select id="slx-filter"><option value="all">All</option><option value="safe">SAFE</option><option value="ok">SAFE + RISKY</option><option value="new">Not opened</option></select><input id="slx-q" placeholder="Player / ID"></div><div class="slx-s"><span id="slx-status">Set Torn API key in ⚙ Settings.</span><button class="slx-cal-mini" id="slx-cal">CALIBRATE</button><b id="slx-summary"></b></div><div class="slx-body"><table><colgroup><col class="signal"><col class="player"><col class="lvl"><col class="last"><col class="actions"></colgroup><thead><tr><th>Signal</th><th>Player</th><th>Lvl</th><th>Last</th><th>Actions</th></tr></thead><tbody id="slx-rows"></tbody></table></div><div class="slx-modal" id="slx-settings"><h3>Settings</h3><p>TEST TORN KEY checks battlestats and Eliminations separately. API 32 on eliminationteam means that Torn is not currently exposing that event endpoint; it is not treated as a bad API key.</p><button class="slx-a" id="slx-create">🔑 CREATE REQUIRED TORN KEY</button> <button class="slx-a" id="slx-test">🧪 TEST TORN KEY</button><label>Torn API key</label><input id="slx-torn"><label>FFScouter API key (optional)</label><input id="slx-ffkey"><label>Manual total BS</label><input id="slx-manual" type="number"><button class="slx-a" id="slx-save">SAVE</button> <button class="slx-a" id="slx-cancel">CLOSE</button></div>'''
          s=s[:html_start]+new_html+s[html_end:]

          render_start=s.find("function render(){")
          render_end=s.find("function record(",render_start)
          if render_start<0 or render_end<0: raise SystemExit('render block not found')
          new_render='''function render(){const e=$('#slx-rows');if(!e)return;e.innerHTML=state.view.map(p=>{const r=risk(p),c=r.label==='SAFE'?'safe':r.label==='RISKY'?'risky':'skip',l=learn(p.id),sg=signal(p);return`<tr><td class="${c}"><span class="slx-sig-top">${esc(sg.a)}</span><span class="slx-sig-bottom">${esc(sg.b)}</span></td><td><a class="slx-a slx-player" href="https://www.torn.com/profiles.php?XID=${p.id}" target="_blank" rel="noopener">${esc(p.name)}</a><small>${l.wins}W/${l.losses}L</small></td><td>${p.level||'—'}</td><td>${age(p.last)}</td><td class="slx-actions"><a class="slx-a atk" data-id="${p.id}" href="https://www.torn.com/loader.php?sid=attack&user2ID=${p.id}" target="_blank" rel="noopener">ATK</a><button class="slx-a win" data-id="${p.id}">W</button><button class="slx-a loss" data-id="${p.id}">L</button></td></tr>`}).join('');$$('.atk',e).forEach(a=>a.onclick=()=>{const p=state.players.find(x=>x.id===Number(a.dataset.id));if(p){state.history.unshift({id:p.id,name:p.name,action:'opened',at:Date.now()});save(K.hist,state.history.slice(0,1000))}});$$('.win',e).forEach(b=>b.onclick=()=>record(state.players.find(x=>x.id===Number(b.dataset.id)),'win'));$$('.loss',e).forEach(b=>b.onclick=()=>record(state.players.find(x=>x.id===Number(b.dataset.id)),'loss'));const safe=state.players.filter(p=>!unavailable(p)&&risk(p).label==='SAFE').length;$('#slx-summary').textContent=`ME ${state.my.total?fmtBS(state.my.total):'—'} · SAFE ${safe}`}
'''
          s=s[:render_start]+new_render+s[render_end:]

          p.write_text(s)
          if s==old: raise SystemExit('no script changes')

          j=Path('scripts.json'); data=json.loads(j.read_text())
          for row in data.get('scripts',[]):
              if row.get('id')=='elimination-assistant':
                  row['version']='1.3.3'
                  row['description']='Fast compact TornPDA Eliminations advisor loading 100 targets at a time with dense attack-first layout.'
          j.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          md=Path('greasyfork/Elimination-Assistant.md'); t=md.read_text()
          t=re.sub(r'## Current version\s+\*\*v[^*]+\*\*','## Current version\n\n**v1.3.3**',t,count=1)
          entry='''\n## v1.3.3 — Compact fast target list\n\n- LOAD now fetches the first **100 targets** instead of 500 for much faster initial results on TornPDA.\n- ATK opens the attack page in a **new tab / webview**.\n- Compact attack-first layout: team + LOAD + FF SCAN on one row, filter + Player/ID on the next.\n- CALIBRATE moved into the thin status bar before `ME ... · SAFE ...`.\n- Signal / Player / Lvl / Last / Actions stay aligned on one row; Signal uses two compact lines.\n- Actions use compact **ATK / W / L** buttons so more targets fit on screen.\n- Added exact backup: `backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js`.\n\n'''
          if '## v1.3.3 — Compact fast target list' not in t:
              pos=t.find('\n## '); t=t[:pos+1]+entry+t[pos+1:]
          t=re.sub(r'## Current release notes\s+\n\n### v[^\n]+','## Current release notes\n\n### v1.3.3',t,count=1)
          md.write_text(t)

          u=Path('UPDATE-INFO.md'); x=u.read_text()
          x=x.replace('Last updated: 2026-09-09','Last updated: 2026-09-10',1)
          x=x.replace('SakaLuX Elimination Assistant: **v1.3.2**','SakaLuX Elimination Assistant: **v1.3.3**',1)
          latest='''\n### SakaLuX Elimination Assistant v1.3.3\n- LOAD now fetches 100 targets for faster TornPDA results instead of waiting for up to 500.\n- ATK opens attacks in a new tab/webview.\n- Compact attack-first layout with CALIBRATE in the status bar and dense single-row columns.\n- Added exact backup: `backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js`.\n\n'''
          if '### SakaLuX Elimination Assistant v1.3.3' not in x:
              x=x.replace('## Latest changes\n','## Latest changes\n'+latest,1)
          u.write_text(x)
          PY
          node --check SakaLuX-Elimination-Assistant.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Elimination-Assistant.user.js').read_text()
          assert '// @version      1.3.3' in s
          assert "const VERSION='1.3.3';" in s
          assert 'i<1' in s
          assert 'target="_blank" rel="noopener">ATK</a>' in s
          assert 'slx-cal-mini' in s
          assert 'slx-sig-top' in s
          d=json.loads(Path('scripts.json').read_text())
          assert next(x for x in d['scripts'] if x['id']=='elimination-assistant')['version']=='1.3.3'
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Elimination-Assistant.user.js scripts.json greasyfork/Elimination-Assistant.md UPDATE-INFO.md backups/SakaLuX-Elimination-Assistant-v1.3.2.user.js
          git diff --cached --quiet || git commit -m "fix: Elimination Assistant v1.3.3 compact fast targets"
          git push origin main

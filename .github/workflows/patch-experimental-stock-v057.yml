name: Patch experimental Stock Manager v0.5.7
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v057.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare patch helper
        run: python .github/scripts/fix_patch_experimental_stock_v057_helper.py
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v057.py
      - name: Validate
        run: |
          grep -q '@version      0.5.7' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.5.7'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function applyStockView' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-stock-sort"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-stock-filter"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'slx-opp-badge' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.5.7' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.5.7 stock sorting filters and highlights'
          git push

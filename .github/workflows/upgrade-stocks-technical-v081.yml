name: Upgrade Stocks v0.8.1 Technical Trade Assistant

on:
  push:
    paths:
      - '.github/workflows/upgrade-stocks-technical-v081.yml'
      - '.github/scripts/upgrade_stocks_technical_v081.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Upgrade Stocks only
        run: python3 .github/scripts/upgrade_stocks_technical_v081.py
      - name: Validate release
        run: |
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          python3 -m json.tool scripts.json >/dev/null
          grep -q '@version      0.8.1' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version:'0.8.1'" SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SAKALUX_STOCK_TECHNICAL_V081' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'technicalSignalV081' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q '\*\*v0.8.1\*\*' greasyfork/Stock-Manager-Advisor.md
          python3 - <<'PY'
          import json
          d=json.load(open('scripts.json'))
          x=next(s for s in d['scripts'] if s.get('id')=='stock-manager-advisor')
          assert x['version']=='0.8.1'
          assert x['release']['version']=='0.8.1'
          PY
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Stock-Manager-Advisor.user.js scripts.json greasyfork/Stock-Manager-Advisor.md backups/stocks-v0.8.1-technical-trade-assistant-2026-09-18
          git diff --cached --quiet && exit 0
          git commit -m 'Stocks v0.8.1: Technical Trade Assistant'
          git push

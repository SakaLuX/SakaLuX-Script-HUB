name: Fix Standalone Dock only v1.1.2
on:
  push:
    paths:
      - '.github/workflows/fix-standalone-only-v112.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch standalone runtime only
        run: python .github/scripts/fix_standalone_only_v112.py
      - name: Embed fixed runtime into every standalone script without changing script versions
        run: |
          for f in             SakaLuX-Bounty-Hunter.user.js             SakaLuX-Enhancer-Guard.user.js             SakaLuX-Account-Auditor.user.js             SakaLuX-Mission-Rewards.user.js             SakaLuX-Bazaar-Thanker-PDA.user.js             SakaLuX-Bazaar-Smart-Pricer.user.js             SakaLuX-Elimination-Assistant.user.js             SakaLuX-Market-Intelligence.user.js             SakaLuX-Stock-Manager-Advisor.user.js             SakaLuX-Company-Intelligence-v1.0.0.user.js
          do
            node tools/embed-shared-dock-runtime.cjs "$f" src/core/sakalux-dock-runtime.js "$f"
          done
      - name: Verify no Bounty/Hub version bump
        run: |
          grep -q "const VERSION = '1.1.2'" src/core/sakalux-dock-runtime.js
          grep -q "for(const ev of \['pointerdown','touchstart','mousedown','click'\])" src/core/sakalux-dock-runtime.js
          grep -q "mark.className = 'slx-dock-mark'" src/core/sakalux-dock-runtime.js
          ! grep -q "slx-dock-close" src/core/sakalux-dock-runtime.js
          grep -q "@version      0.5.4" SakaLuX-Bounty-Hunter.user.js
          grep -q "@version      1.9.93" SakaLuX-Script-Hub.user.js
          for f in SakaLuX-Bounty-Hunter.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Account-Auditor.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Bazaar-Smart-Pricer.user.js SakaLuX-Elimination-Assistant.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js; do
            grep -q "const VERSION = '1.1.2'" "$f"
          done
      - name: Syntax checks
        run: |
          node --check src/core/sakalux-dock-runtime.js
          node --check SakaLuX-Bounty-Hunter.user.js
      - name: Commit standalone-only fix
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add src/core/sakalux-dock-runtime.js SakaLuX-Bounty-Hunter.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Account-Auditor.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Bazaar-Smart-Pricer.user.js SakaLuX-Elimination-Assistant.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Standalone Dock runtime only v1.1.2'
          git push

name: One-shot SakaLuX mobile UI repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-ui-contract-fix.yml'
      - '.github/scripts/ui_contract_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/ui_contract_patch.py
      - name: Validate
        shell: bash
        run: |
          set -e
          for f in SakaLuX-Script-Hub.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Elimination-Assistant.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js SakaLuX-Chat-Intelligence.user.js SakaLuX-Account-Auditor.user.js; do
            node --check "$f"
          done
          python3 -m json.tool scripts.json >/dev/null
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'SakaLuX UI Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: full-height blur surfaces and Company whole-sheet scroll'
          git push

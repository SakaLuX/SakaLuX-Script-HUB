name: Fix API architecture 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_api_architecture_20260919.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix API architecture
        run: python3 .github/scripts/fix_api_architecture_20260919.py
      - name: Normalize release surfaces
        run: python3 .github/scripts/normalize_installed_versions.py
      - name: Re-run API architecture audit
        run: python3 .github/scripts/audit_api_key_architecture_20260919.py
      - name: Validate changed JavaScript
        run: |
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Account-Auditor.user.js
      - name: Assert architecture
        run: |
          ! grep -q 'Missing from Hub shared key: `{' API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md || grep -q 'Missing from Hub shared key: `{}`' API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md
          grep -q 'SakaLuX-Account-Auditor.user.js | yes | yes | yes | no | no' API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md
          grep -q 'SakaLuX-Mission-Rewards.user.js | yes | yes | yes | yes | no' API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md
          ! grep -q '^\- ❌' API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md
      - name: Commit fixes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain -- API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Account-Auditor.user.js scripts.json greasyfork/*.md API-KEY-ARCHITECTURE-AUDIT-2026-09-19.md .github/scripts/audit_api_key_architecture_20260919.py
          git commit -m "Fix and verify API key architecture"
          git push

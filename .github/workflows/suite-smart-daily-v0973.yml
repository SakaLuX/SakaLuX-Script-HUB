name: Suite Smart Daily Checklist v0.9.973

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/suite-smart-daily-v0973.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suite-smart-daily-v0973
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply wheel logtypes/events hotfix v0.9.973
        run: python3 .github/scripts/fix_suite_wheels_logtypes_events_v0973.py
      - name: Validate Suite JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Install regression-test dependency
        run: npm install --no-save --package-lock=false jsdom@24
      - name: Run Smart Daily Checklist regression
        run: node tests/suite-daily-progress-regression.cjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit Suite hotfix
        run: |
          if git diff --quiet -- SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-daily-progress-regression.cjs; then
            echo "Suite v0.9.973 already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-daily-progress-regression.cjs
            git commit -m "Hotfix Suite v0.9.973 wheel detection"
            git push origin HEAD:main
          fi
      - name: Create Suite tag
        run: |
          git fetch origin main --tags
          git reset --hard origin/main
          TAG="suite-v0.9.973"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo "$TAG exists"; else git tag -a "$TAG" -m "SakaLuX Suite v0.9.973" && git push origin "$TAG"; fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="suite-v0.9.973"
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release exists"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "SakaLuX Suite v0.9.973 — Wheel Detection Hotfix" --notes $'## Wheel detection hotfix\n\n- Resolves numeric user/log IDs through Torn official /torn/logtypes endpoint.\n- Adds /user/events as a second API fallback for all three Leslie wheels.\n- Scans complete log rows, including top-level fields.\n- Keeps direct Spin The Wheel DOM/click detection.\n- Adds regression tests for numeric log IDs and events-based completion.'
          fi

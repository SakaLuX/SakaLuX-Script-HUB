name: Patch experimental Stock Manager v0.7.0
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v070.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v070.py
      - name: Validate
        run: |
          grep -q '@version      0.7.0' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.7.0'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function favoriteStocks' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function exportStockManagerData' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-stock-search"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-target-lock"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.7.0' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.7.0 watchlist safety diagnostics and UX'
          git push

name: Register Company Intelligence in Hub
on:
  push:
    branches: [main]
    paths:
      - '.github/register-company-intelligence.trigger'
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register module
        run: python .github/scripts/register_company_intelligence.py
      - name: Validate
        run: |
          python -m json.tool scripts.json >/dev/null
          grep -q '"id": "company-intelligence"' scripts.json
          grep -q '595873' scripts.json
          grep -q 'Complementary add-on for SakaLuX Script Hub' greasyfork/Company-Intelligence.md
      - name: Commit
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add scripts.json greasyfork/Company-Intelligence.md
          git commit -m 'Register Company Intelligence v1.8.11 in Script Hub'
          git push

name: Register Bounty Hunter v0.1.0

on:
  push:
    paths:
      - '.github/scripts/register_bounty_hunter_v010.py'
      - '.github/workflows/register-bounty-hunter-v010.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Register module
        run: python .github/scripts/register_bounty_hunter_v010.py
      - name: Syntax check
        run: node --check SakaLuX-Bounty-Hunter.user.js
      - name: Verify
        run: |
          grep -q '@version      0.1.0' SakaLuX-Bounty-Hunter.user.js
          grep -q '"id": "bounty-hunter"' scripts.json
          grep -q '"version": "0.1.0"' scripts.json
      - name: Commit registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Register Bounty Hunter v0.1.0'
          git push

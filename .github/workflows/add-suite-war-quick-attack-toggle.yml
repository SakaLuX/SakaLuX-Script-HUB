name: Add Suite war quick attack toggle
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_suite_war_quick_attack_toggle.py'
      - '.github/workflows/add-suite-war-quick-attack-toggle.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: add-suite-war-quick-attack-toggle-main
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add faction Quick Attack toggle
        run: python3 .github/scripts/add_suite_war_quick_attack_toggle.py
      - name: Validate Suite syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit Suite update
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js
          git commit -m "Add faction toggle for War Quick Attack"
          git push

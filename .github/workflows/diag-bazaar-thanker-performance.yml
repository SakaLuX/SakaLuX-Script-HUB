name: Fix Bazaar Thanker Performance
on:
  push:
    branches: [test/bazaar-thanker-performance]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch Bazaar Thanker event observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SakaLuX-Bazaar-Thanker-PDA.user.js')
          s=p.read_text()
          old="""    function startEventObserver() {\n        if (!moduleEnabled || eventObserver) return;\n        eventObserver = new MutationObserver(function (records) { if (!window.SakaLuXPerf?.unrelated?.(records)) scheduleProcess(); });\n        eventObserver.observe(document.body, { childList: true, subtree: true });\n    }\n"""
          new="""    function startEventObserver() {\n        if (!moduleEnabled || eventObserver) return;\n        const ignoredUi = '#chat-box,[id^=\\\"chat-box\\\"],[class*=\\\"chat-box\\\"],[class*=\\\"chatBox\\\"],#sakalux-standalone-dock,#sakalux-standalone-fallback-s,#sakalux-standalone-native-s,#sakalux-hub-install-prompt,[id^=\\\"sakalux-inline-footer-\\\"]';\n        const relevantMutation = record => {\n            const target = record?.target?.nodeType === 1 ? record.target : record?.target?.parentElement;\n            if (target?.closest?.(ignoredUi)) return false;\n            const changed = [...(record?.addedNodes || []), ...(record?.removedNodes || [])];\n            if (!changed.length) return true;\n            return changed.some(node => {\n                const el = node?.nodeType === 1 ? node : node?.parentElement;\n                return !el?.matches?.(ignoredUi) && !el?.closest?.(ignoredUi);\n            });\n        };\n        eventObserver = new MutationObserver(function (records) {\n            if (window.SakaLuXPerf?.unrelated?.(records)) return;\n            if (records.some(relevantMutation)) scheduleProcess();\n        });\n        eventObserver.observe(document.body, { childList: true, subtree: true });\n    }\n"""
          if old not in s:
              raise SystemExit('observer anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Verify Bazaar Thanker performance repeatedly
        run: |
          for i in 1 2 3; do
            NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/performance/worker.cjs SakaLuX-Bazaar-Thanker-PDA.user.js relevant | tee /tmp/bt-$i.json
            node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/bt-$i.json','utf8').trim().split('\\n').at(-1)); if(x.timeoutsScheduled>25||x.errors.length) process.exit(1); console.log('run', $i, 'timers', x.timeoutsScheduled);"
          done
      - name: Run Priority 6 and navigation regressions
        run: |
          node tests/priority6-shared-dock-runtime-regression.cjs
          node tests/priority6-shared-dock-migration-regression.cjs
          node tests/tornpda-navigation-regression.cjs
      - name: Commit fix
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bazaar-Thanker-PDA.user.js
          git diff --cached --quiet && exit 0
          git commit -m 'Filter unrelated Bazaar Thanker event mutations'
          git push

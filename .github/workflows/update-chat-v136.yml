name: Update Chat Intelligence v1.2.36

on:
  push:
    paths:
      - '.github/scripts/update_chat_v136.py'
      - '.github/workflows/update-chat-v136.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/update_chat_v136.py
      - name: Syntax check
        run: node --check SakaLuX-Chat-Intelligence.user.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Chat-Intelligence.user.js greasyfork/Chat-Intelligence.md scripts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Release Chat Intelligence v1.2.36'
          git push

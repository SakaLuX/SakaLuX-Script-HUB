name: Fix Account Auditor last sync
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_account_auditor_last_sync.py'
      - '.github/workflows/fix-account-auditor-last-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix LAST SYNC persistence
        run: python3 .github/scripts/fix_account_auditor_last_sync.py
      - name: Validate syntax
        run: node --check SakaLuX-Account-Auditor.user.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Account-Auditor.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Account Auditor last sync persistence"
          git push

name: One-time stale runtime version fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stale-runtime-version.yml'
      - '.migration/fix-stale-runtime-version.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .migration/fix-stale-runtime-version.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q '@version      1.9.37' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.37';" SakaLuX-Script-Hub.user.js
          grep -q 'RELOAD REQUIRED' SakaLuX-Script-Hub.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          git commit -m 'Detect stale loaded add-on runtimes [skip ci]'
          git push

name: Rebuild Mission Rewards v1.0.19 isolated hints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-mission-1019-isolated.yml'
      - '.migration/rebuild-mission-1019-isolated.py'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild from stable core
        run: python .migration/rebuild-mission-1019-isolated.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          python -m json.tool scripts.json >/dev/null
          grep -q '^// @version      1.0.19$' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.0.19';" SakaLuX-Mission-Rewards.user.js
          grep -q "version:'1.0.19'" SakaLuX-Mission-Rewards.user.js
          grep -q 'SAKALUX_MISSION_HINTS_ISOLATED_V1019_BEGIN' SakaLuX-Mission-Rewards.user.js
          grep -q '"version": "1.0.19"' scripts.json
          grep -q '\*\*v1.0.19\*\*' greasyfork/Mission-Rewards.md
          grep -q 'SakaLuX Mission Rewards \*\*v1.0.19\*\*' greasyfork/Script-Hub.md
          grep -q '^// @version      1.9.35$' SakaLuX-Script-Hub.user.js
      - name: Commit synchronized release
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild Mission Rewards v1.0.19 with isolated Mission Hints [skip ci]'
          git push

name: Update Chat Intelligence v1.2.30

on:
  push:
    paths:
      - '.github/scripts/update_chat_v130.py'
      - '.github/workflows/update-chat-v130.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/update_chat_v130.py
      - name: Syntax check
        run: node --check SakaLuX-Chat-Intelligence.user.js
      - name: Verify
        run: |
          grep -q '@version      1.2.30' SakaLuX-Chat-Intelligence.user.js
          grep -q "const V='1.2.30',ID='chat-intelligence'" SakaLuX-Chat-Intelligence.user.js
          grep -q "Choose alias color" SakaLuX-Chat-Intelligence.user.js
          grep -q "Green" SakaLuX-Chat-Intelligence.user.js
          grep -q "Purple" SakaLuX-Chat-Intelligence.user.js
          ! grep -q "Optional color (#d7a94a)" SakaLuX-Chat-Intelligence.user.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Chat-Intelligence.user.js greasyfork/Chat-Intelligence.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Release Chat Intelligence v1.2.30'
          git push

name: Rebuild Bazaar Smart Pricer v1.1.0
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/rebuild_bazaar_smart_pricer_v110.py'
      - '.github/workflows/rebuild-bazaar-smart-pricer-v110.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bazaar-smart-pricer-v110-main
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate v1.1.0 from pinned Quick Pricer upstream
        run: python3 .github/scripts/rebuild_bazaar_smart_pricer_v110.py
      - name: Validate userscript
        run: node --check SakaLuX-Bazaar-Smart-Pricer.user.js
      - name: Validate registry and manifest
        run: |
          python3 -m json.tool scripts.json >/dev/null
          python3 -m json.tool releases/bazaar-smart-pricer-v1.1.0-manifest.json >/dev/null
      - name: Verify parity and Hub integration
        run: |
          grep -q '@version      1.1.0' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'function addQuickPriceButton(itemElement)' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'Quick Add / Undo' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'SakaLuX Smart Pricer settings' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'skipBonusItems' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'window.SakaLuXBazaarSmartPricer' SakaLuX-Bazaar-Smart-Pricer.user.js
      - name: Commit complete release
        run: |
          if git diff --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Bazaar-Smart-Pricer.user.js scripts.json CHANGELOG-Bazaar-Smart-Pricer.md greasyfork/Bazaar-Smart-Pricer.md greasyfork/Script-Hub.md README-Bazaar-Smart-Pricer.md INSTALL-Bazaar-Smart-Pricer.md releases/bazaar-smart-pricer-v1.1.0.md releases/bazaar-smart-pricer-v1.1.0-manifest.json
          git commit -m 'Release Bazaar Smart Pricer v1.1.0 Quick Pricer parity rebuild'
          git push

name: Fix Suite Version 0.9.916

on:
  push:
    paths:
      - '.github/scripts/fix_suite_version_0916.py'
      - '.github/workflows/fix-suite-version-0916.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync Suite runtime version
        run: python .github/scripts/fix_suite_version_0916.py
      - name: Validate Suite syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit Suite version sync
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Suite.user.js
          git commit -m "fix: sync Suite runtime version"
          git push

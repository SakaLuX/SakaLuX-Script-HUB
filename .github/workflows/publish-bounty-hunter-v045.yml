name: Publish Bounty Hunter v0.4.5
on:
  push:
    paths:
      - '.github/workflows/publish-bounty-hunter-v045.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply release + GreasyFork docs
        run: python .github/scripts/publish_bounty_v045.py
      - name: Re-embed Shared Core
        run: node tools/embed-shared-core.cjs SakaLuX-Bounty-Hunter.user.js src/core/sakalux-core.js SakaLuX-Bounty-Hunter.user.js
      - name: Syntax checks
        run: |
          node --check src/core/sakalux-core.js
          node --check SakaLuX-Bounty-Hunter.user.js
      - name: Shared Core regression
        run: |
          node tests/shared-core-v1-embedding.cjs
          node tests/shared-core-v1-regression.cjs
      - name: Verify release surfaces
        run: |
          grep -q '@version      0.4.5' SakaLuX-Bounty-Hunter.user.js
          grep -q "const VERSION='0.4.5'" SakaLuX-Bounty-Hunter.user.js
          grep -q "const CORE_VERSION = '1.2.1'" src/core/sakalux-core.js
          grep -q 'Hub-aligned mobile workspace' greasyfork/Bounty-Hunter.md
          grep -q '### v0.4.5' greasyfork/Bounty-Hunter.md
          grep -q '### v0.4.4' greasyfork/Bounty-Hunter.md
          grep -q '### v0.3.6' greasyfork/Bounty-Hunter.md
          grep -q 'border-color:#f2a54a!important' SakaLuX-Bounty-Hunter.user.js
      - name: Commit and publish
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bounty-Hunter.user.js src/core/sakalux-core.js scripts.json CHANGELOG.md greasyfork/Bounty-Hunter.md tests/shared-core-v1-regression.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Bounty Hunter v0.4.5 with GreasyFork changelog'
          git push

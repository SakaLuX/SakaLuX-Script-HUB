name: Apply Hub v1.9.38

on:
  push:
    paths:
      - 'tools/hub-v1.9.38.gz.b64'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Hub source
        shell: bash
        run: |
          base64 -d tools/hub-v1.9.38.gz.b64 | gzip -d > SakaLuX-Script-Hub.user.js
          grep -q "@version      1.9.38" SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.38'" SakaLuX-Script-Hub.user.js
      - name: Commit Hub v1.9.38
        shell: bash
        run: |
          git config user.name "SakaLuX Hub Updater"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SakaLuX Script Hub v1.9.38"
          git push

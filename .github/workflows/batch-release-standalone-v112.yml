name: Batch release Standalone Runtime v1.1.2
on:
  push:
    paths:
      - '.github/workflows/batch-release-standalone-v112.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bump module maintenance versions
        run: python .github/scripts/batch_release_standalone_v112.py
      - name: Embed canonical Dock Runtime v1.1.2
        run: |
          for f in             SakaLuX-Enhancer-Guard.user.js             SakaLuX-Account-Auditor.user.js             SakaLuX-Mission-Rewards.user.js             SakaLuX-Bazaar-Thanker-PDA.user.js             SakaLuX-Bazaar-Smart-Pricer.user.js             SakaLuX-Elimination-Assistant.user.js             SakaLuX-Market-Intelligence.user.js             SakaLuX-Stock-Manager-Advisor.user.js             SakaLuX-Company-Intelligence-v1.0.0.user.js             SakaLuX-Bounty-Hunter.user.js
          do
            node tools/embed-shared-dock-runtime.cjs "$f" src/core/sakalux-dock-runtime.js "$f"
          done
      - name: Syntax checks
        run: |
          node --check src/core/sakalux-dock-runtime.js
          for f in             SakaLuX-Enhancer-Guard.user.js             SakaLuX-Account-Auditor.user.js             SakaLuX-Mission-Rewards.user.js             SakaLuX-Bazaar-Thanker-PDA.user.js             SakaLuX-Bazaar-Smart-Pricer.user.js             SakaLuX-Elimination-Assistant.user.js             SakaLuX-Market-Intelligence.user.js             SakaLuX-Stock-Manager-Advisor.user.js             SakaLuX-Company-Intelligence-v1.0.0.user.js             SakaLuX-Bounty-Hunter.user.js
          do
            node --check "$f"
          done
      - name: Verify maintenance versions and runtime
        run: |
          grep -q "@version      1.3.55" SakaLuX-Enhancer-Guard.user.js
          grep -q "@version      1.3.26" SakaLuX-Account-Auditor.user.js
          grep -q "@version      1.0.48" SakaLuX-Mission-Rewards.user.js
          grep -q "@version      5.3.46" SakaLuX-Bazaar-Thanker-PDA.user.js
          grep -q "@version      1.1.15" SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q "@version      1.3.49" SakaLuX-Elimination-Assistant.user.js
          grep -q "@version      1.17.59" SakaLuX-Market-Intelligence.user.js
          grep -q "@version      0.8.17" SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "@version      1.8.55" SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q "@version      0.5.5" SakaLuX-Bounty-Hunter.user.js
          for f in             SakaLuX-Enhancer-Guard.user.js             SakaLuX-Account-Auditor.user.js             SakaLuX-Mission-Rewards.user.js             SakaLuX-Bazaar-Thanker-PDA.user.js             SakaLuX-Bazaar-Smart-Pricer.user.js             SakaLuX-Elimination-Assistant.user.js             SakaLuX-Market-Intelligence.user.js             SakaLuX-Stock-Manager-Advisor.user.js             SakaLuX-Company-Intelligence-v1.0.0.user.js             SakaLuX-Bounty-Hunter.user.js
          do
            grep -q "const VERSION = '1.1.2'" "$f"
          done
          grep -q '"version": "0.5.5"' scripts.json
          grep -q '"version": "1.17.59"' scripts.json
          grep -q "@version      1.9.93" SakaLuX-Script-Hub.user.js
      - name: Commit batch maintenance release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add             SakaLuX-Enhancer-Guard.user.js             SakaLuX-Account-Auditor.user.js             SakaLuX-Mission-Rewards.user.js             SakaLuX-Bazaar-Thanker-PDA.user.js             SakaLuX-Bazaar-Smart-Pricer.user.js             SakaLuX-Elimination-Assistant.user.js             SakaLuX-Market-Intelligence.user.js             SakaLuX-Stock-Manager-Advisor.user.js             SakaLuX-Company-Intelligence-v1.0.0.user.js             SakaLuX-Bounty-Hunter.user.js             scripts.json CHANGELOG.md releases/standalone-runtime-v1.1.2.md             greasyfork/Enhancer-Guard.md greasyfork/Mission-Rewards.md greasyfork/Bazaar-Thanker.md             greasyfork/Bazaar-Smart-Pricer.md greasyfork/Elimination-Assistant.md greasyfork/Market-Intelligence.md             greasyfork/Stock-Manager-Advisor.md greasyfork/Company-Intelligence.md greasyfork/Bounty-Hunter.md
          git diff --cached --quiet && exit 0
          git commit -m 'Batch release Standalone Runtime v1.1.2 maintenance updates'
          git push

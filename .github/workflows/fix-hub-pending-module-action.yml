name: One-time Hub pending module action fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hub-pending-module-action.yml'
      - '.migration/fix-hub-pending-module-action.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .migration/fix-hub-pending-module-action.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q '@version      1.9.35' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.35';" SakaLuX-Script-Hub.user.js
          grep -q 'SakaLuX_HUB_PENDING_MODULE_ACTION' SakaLuX-Script-Hub.user.js
          grep -q 'retryPendingModuleAction' SakaLuX-Script-Hub.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          git commit -m 'Fix Hub module bridge fallback and pending actions [skip ci]'
          git push

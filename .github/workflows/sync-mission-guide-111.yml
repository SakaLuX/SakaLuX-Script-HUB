name: One-time Mission Guide sync 1.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-mission-guide-111.yml'
      - '.migration/sync-mission-guide-111.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Mission Guide sync
        run: python .migration/sync-mission-guide-111.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('SakaLuX-Mission-Rewards.user.js').read_text()
          assert '@version      1.1.1' in s
          assert "const VERSION = '1.1.1'" in s
          assert 'Hit 6–14 unique body parts' in s
          assert 'Feet count as leg hits' in s
          data=json.loads(Path('scripts.json').read_text())
          row=next(x for x in data['scripts'] if x['id']=='mission-rewards')
          assert row['version']=='1.1.1'
          print('Mission Guide sync validation OK')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          git commit -m 'Sync Mission Rewards guide with current TornTools mission info [skip ci]'
          git push

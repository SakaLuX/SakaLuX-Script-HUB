name: Publish SakaLuX Standalone Dock v3

on:
  push:
    paths:
      - 'tools/publish_standalone_dock_v3.py'
      - '.github/workflows/publish-standalone-dock-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply compact native S dock release
        run: python3 tools/publish_standalone_dock_v3.py

      - name: Remove one-time publisher
        run: |
          rm -f tools/publish_standalone_dock_v3.py
          rm -f .github/workflows/publish-standalone-dock-v3.yml

      - name: Validate JavaScript syntax
        run: |
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Elimination-Assistant.user.js
          node --check SakaLuX-Script-Hub.user.js

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish compact native S standalone dock" || exit 0
          git push origin HEAD:main

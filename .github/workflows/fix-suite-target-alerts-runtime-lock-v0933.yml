name: Fix Suite Target Alerts runtime viewport lock
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_suite_target_alerts_runtime_lock_v0933.py'
      - '.github/workflows/fix-suite-target-alerts-runtime-lock-v0933.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-suite-target-alerts-runtime-lock-v0933
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime viewport lock
        run: python3 .github/scripts/fix_suite_target_alerts_runtime_lock_v0933.py
      - name: Validate Suite syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Assert runtime lock
        run: |
          grep -q '@version      0.9.933' SakaLuX-Suite.user.js
          grep -q 'function applyTargetAlertsViewportLock(panel)' SakaLuX-Suite.user.js
          grep -q "setProperty('left', '50vw', 'important')" SakaLuX-Suite.user.js
          grep -q 'v0.9.933 — Target Alerts runtime viewport lock' greasyfork/SakaLuX-Suite.md
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Force Suite Target Alerts dialog inside viewport"
          git push

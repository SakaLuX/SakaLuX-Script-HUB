name: Finalize Mission Hints v1.2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mission-hints-v120.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build safe integrated release
        run: |
          set -euo pipefail
          python .migration/integrate-mission-hints-v120.py
          python - <<'PY'
          from pathlib import Path
          for p in [Path('SakaLuX-Mission-Rewards.user.js'), Path('greasyfork/Mission-Rewards.md')]:
              s=p.read_text(encoding='utf-8')
              s=s.replace('no Violentmonkey-specific code','no userscript-manager-specific compatibility code')
              s=s.replace('with no Violentmonkey-specific bridge and no external runtime dependency','with no userscript-manager-specific bridge and no external runtime dependency')
              s=s.replace('No Violentmonkey-specific compatibility layer or external runtime dependency.','No userscript-manager-specific compatibility layer or external runtime dependency.')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate final release
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
          grep -q '^// @version      1.2.0$' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.2.0';" SakaLuX-Mission-Rewards.user.js
          grep -q 'SAKALUX_MISSION_HINTS_V120_BEGIN' SakaLuX-Mission-Rewards.user.js
          grep -q 'window.SakaLuXMissionHints' SakaLuX-Mission-Rewards.user.js
          grep -q '^// @version      1.9.36$' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.36';" SakaLuX-Script-Hub.user.js
          ! grep -qi 'violentmonkey' SakaLuX-Mission-Rewards.user.js
          python - <<'PY'
          import json
          d=json.load(open('scripts.json'))
          r=next(x for x in d['scripts'] if x['id']=='mission-rewards')
          assert r['version']=='1.2.0',r
          assert 'task and hint' in r['description'].lower(),r
          print('Validated Mission Rewards',r['version'])
          PY
      - name: Commit final integrated release
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          git commit -m 'Integrate Mission Hints safely into Mission Rewards v1.2.0 [skip ci]'
          git push

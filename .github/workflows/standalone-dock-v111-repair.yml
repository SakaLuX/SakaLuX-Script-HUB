name: Standalone Dock v1.1.1 compatibility repair
on:
  push:
    paths:
      - '.github/workflows/standalone-dock-v111-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch canonical runtime + Bounty/Hub
        run: python .github/scripts/standalone_dock_v111_repair.py
      - name: Embed runtime into every standalone script
        run: |
          for f in             SakaLuX-Bounty-Hunter.user.js             SakaLuX-Enhancer-Guard.user.js             SakaLuX-Account-Auditor.user.js             SakaLuX-Mission-Rewards.user.js             SakaLuX-Bazaar-Thanker-PDA.user.js             SakaLuX-Bazaar-Smart-Pricer.user.js             SakaLuX-Elimination-Assistant.user.js             SakaLuX-Market-Intelligence.user.js             SakaLuX-Stock-Manager-Advisor.user.js             SakaLuX-Company-Intelligence-v1.0.0.user.js
          do
            node tools/embed-shared-dock-runtime.cjs "$f" src/core/sakalux-dock-runtime.js "$f"
          done
      - name: Syntax checks
        run: |
          node --check src/core/sakalux-dock-runtime.js
          node --check SakaLuX-Bounty-Hunter.user.js
          node --check SakaLuX-Script-Hub.user.js
      - name: Verify repaired behavior
        run: |
          grep -q "const VERSION = '1.1.1'" src/core/sakalux-dock-runtime.js
          grep -q "function forceCloseDock" src/core/sakalux-dock-runtime.js
          grep -q "stopImmediatePropagation" src/core/sakalux-dock-runtime.js
          grep -q "enforceClosedUnlessUserOpened" src/core/sakalux-dock-runtime.js
          ! grep -q "slx-dock-close" src/core/sakalux-dock-runtime.js
          grep -q "grid-template-columns:28px 1fr auto" src/core/sakalux-dock-runtime.js
          grep -q "font:900 14px/28px" src/core/sakalux-dock-runtime.js
          for f in SakaLuX-Bounty-Hunter.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Account-Auditor.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Bazaar-Smart-Pricer.user.js SakaLuX-Elimination-Assistant.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js; do
            grep -q "const VERSION = '1.1.1'" "$f"
          done
          grep -q "@version      0.5.4" SakaLuX-Bounty-Hunter.user.js
          grep -q "@version      1.9.93" SakaLuX-Script-Hub.user.js
          grep -q '"version": "0.5.4"' scripts.json
          grep -q '### v0.5.4' greasyfork/Bounty-Hunter.md
      - name: Commit repair
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add src/core/sakalux-dock-runtime.js SakaLuX-Bounty-Hunter.user.js SakaLuX-Script-Hub.user.js scripts.json CHANGELOG.md greasyfork/Bounty-Hunter.md greasyfork/Script-Hub.md SakaLuX-Enhancer-Guard.user.js SakaLuX-Account-Auditor.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Bazaar-Smart-Pricer.user.js SakaLuX-Elimination-Assistant.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js
          git diff --cached --quiet && exit 0
          git commit -m 'Repair Standalone Dock v1.1.1 compatibility'
          git push

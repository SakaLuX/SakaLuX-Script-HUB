name: Patch Market Intelligence v1.15.1

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/mi-v1.15.1.py'
      - '.github/workflows/patch-mi-v1.15.1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.15.1 hotfix
        run: python .github/patches/mi-v1.15.1.py
      - name: Commit changes
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Market-Intelligence.user.js scripts.json UPDATE-INFO.md greasyfork/Market-Intelligence.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "SakaLuX Market Intelligence v1.15.1: Session tracking hotfix"
            git push
          fi
# trigger

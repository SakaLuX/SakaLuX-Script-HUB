name: Extended performance audit
on:
  push:
    branches: [main]
    paths: ['tests/performance/extended.cjs', '.github/workflows/extended-performance.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extended-performance-audit
  cancel-in-progress: false
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Chromium test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.62.1 --no-audit --no-fund
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify bounded chat cache and notification semantics
        run: node tests/performance/chat-cache-regression.cjs --assert
      - name: Run all twelve scripts and real thirty-minute combined soak
        id: stress
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
          SOAK_MINUTES: '30'
        run: node tests/performance/extended.cjs reports/extended-performance-2026-09-18/results.json
      - name: Upload complete findings even if a budget fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-performance-findings
          path: reports/extended-performance-2026-09-18/results.json
      - name: Save measured report and publish complete Chat fix
        if: steps.stress.outcome == 'success' || steps.stress.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('reports/extended-performance-2026-09-18/results.json').read_text())
          failed=[x['label'] for x in data['assertions'] if not x['passed']]
          text='## Extended performance findings\n\n'
          text+='12 scripts; 100 return routes per script; 10,000-row DOM; 20 off/on cycles where public APIs support them; slow/offline/429/malformed/recovery modes with exercised request counts; simulated visibility transitions; 30 actual minutes of combined chat churn. Offline fixtures, no actual TornPDA battery/FPS or authenticated-account test.\n\n'
          text+='| Script | Observers before/after | Intervals before/after | JS errors |\n|---|---|---|---|\n'
          for r in data['results']:text+=f"| {r['file']} | {r['before']['observers']}/{r['after']['observers']} | {r['before']['intervals']}/{r['after']['intervals']} | {len(r['errors'])} |\n"
          if data['soak']:
              first,last=data['soak'][0],data['soak'][-1]
              text+=f"\nSoak elapsed: {last['elapsedSeconds']} seconds. Post-GC heap {first['heapMB']} → {last['heapMB']} MB. DOM {first['nodes']} → {last['nodes']}. Observers {first['observers']} → {last['observers']}.\n"
          text+='\nFailed checks: '+(', '.join(failed) or 'none')+'.\n'
          text+='\nChat v1.2.20 bounds recent message IDs at 4,096 and uses weak per-node message tracking to preserve notification deduplication after eviction. Regression: 100,000 messages, retained nodes, new messages and reused nodes.\n'
          Path('reports/extended-performance-2026-09-18/README.md').write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/extended-performance-2026-09-18
          git commit -m 'Record extended Chromium stress and thirty-minute soak measurements'
          git pull --rebase origin main
          git push origin HEAD:main
          cp SakaLuX-Chat-Intelligence.user.js /tmp/SakaLuX-Chat-Intelligence-v1.2.20.user.js
          gh release create chat-intelligence-v1.2.20 /tmp/SakaLuX-Chat-Intelligence-v1.2.20.user.js reports/extended-performance-2026-09-18/results.json --target "$(git rev-parse HEAD)" --title 'Chat Intelligence v1.2.20 — bounded session memory' --notes-file releases/chat-intelligence-v1.2.20.md --latest=false
          echo 'All findings are recorded. Read assertions in results.json; budget failures are findings, not silently passed tests.' >> "$GITHUB_STEP_SUMMARY"

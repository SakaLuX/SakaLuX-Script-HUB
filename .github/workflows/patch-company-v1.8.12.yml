name: Patch Company Intelligence v1.8.12
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-company-v1.8.12.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_company_1_8_12.py
      - name: Validate
        run: |
          grep -q '@version      1.8.12' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q '"version": "1.8.12"' scripts.json
          grep -q 'Hub launcher cleanup' greasyfork/Company-Intelligence.md
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js scripts.json greasyfork/Company-Intelligence.md
          git commit -m 'Company Intelligence v1.8.12: hide standalone launcher in Hub'
          git push

name: Market Intelligence Loadout Comparator v1.16.6

on:
  push:
    paths:
      - '.github/workflows/market-loadout-v1166.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/market_loadout_patch.py
      - name: Validate
        run: |
          node --check SakaLuX-Market-Intelligence.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Market-Intelligence.user.js').read_text()
          assert '// @version      1.16.6' in s
          assert "const VERSION = '1.16.6';" in s
          assert 'LOADOUT COMPARATOR' in s
          assert '/v2/user/equipment?key=' in s
          data=json.loads(Path('scripts.json').read_text())
          row=next(x for x in data['scripts'] if x['id']=='market-intelligence')
          assert row['version']=='1.16.6'
          assert '**Current version: v1.16.6**' in Path('greasyfork/Market-Intelligence.md').read_text()
          PY
      - name: Commit
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Market-Intelligence.user.js backups/SakaLuX-Market-Intelligence-v1.16.5.user.js scripts.json greasyfork/Market-Intelligence.md UPDATE-INFO.md
          git commit -m 'feat: add Loadout Comparator to Market Intelligence v1.16.6'
          git push origin main

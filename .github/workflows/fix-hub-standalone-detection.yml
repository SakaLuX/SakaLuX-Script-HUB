name: One-time Hub standalone detection fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-hub-standalone-detection.yml'
      - '.migration/fix-hub-standalone-detection.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply migration
        run: python .migration/fix-hub-standalone-detection.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Elimination-Assistant.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Elimination-Assistant.user.js scripts.json greasyfork/Script-Hub.md greasyfork/Enhancer-Guard.md greasyfork/Bazaar-Thanker.md greasyfork/Mission-Rewards.md greasyfork/Market-Intelligence.md greasyfork/Elimination-Assistant.md
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Fix Hub standalone dock detection [skip ci]'
          git push

name: Patch Market Intelligence v1.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/patches/mi-v1.7.0.py'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  patch:
    if: github.event_name == 'push' || github.event.issue.title == 'RUN MI v1.7.0 PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.7.0 patch
        run: python .github/patches/mi-v1.7.0.py
      - name: Commit changes
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Market-Intelligence.user.js scripts.json UPDATE-INFO.md greasyfork/Market-Intelligence.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "SakaLuX Market Intelligence v1.7.0: Travel Buy Planner"
            git push
          fi

name: One-time Hub same-page pending action fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-same-page-pending-action.yml'
      - '.migration/fix-same-page-pending-action.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .migration/fix-same-page-pending-action.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q '@version      1.9.36' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.36';" SakaLuX-Script-Hub.user.js
          grep -q 'navigateForPendingAction' SakaLuX-Script-Hub.user.js
          grep -q 'location.reload()' SakaLuX-Script-Hub.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          git commit -m 'Fix same-page pending module actions [skip ci]'
          git push

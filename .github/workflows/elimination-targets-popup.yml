name: One-time Elimination TARGETS popup migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elimination-targets-popup.yml'
      - '.migration/elimination-targets-popup.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration
        run: python .migration/elimination-targets-popup.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check SakaLuX-Elimination-Assistant.user.js
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Elimination-Assistant.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Elimination-Assistant.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git commit -m 'Elimination v1.3.14 compact TARGETS popup [skip ci]'
          git push

name: Apply Suite 0.9.941 reconstruction

on:
  push:
    branches:
      - release/suite-0.9.941-graffiti-hub-sync
    paths:
      - '.github/scripts/reconstruct_suite_0941.py'
      - '.github/workflows/apply-suite-0941.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reconstruction
        run: python .github/scripts/reconstruct_suite_0941.py
      - name: Syntax check Suite
        run: node --check SakaLuX-Suite.user.js
      - name: Run graffiti + Hub sync regression
        run: node tests/suite-graffiti-hub-sync-regression.cjs
      - name: Run existing Suite regression when dependencies are available
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
          node tests/suite-modules-regression.cjs
      - name: Commit generated release files
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-graffiti-hub-sync-regression.cjs
          git commit -m 'Release Suite v0.9.941 graffiti guide and Hub sync'
          git push

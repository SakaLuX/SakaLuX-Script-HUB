name: Audit script versions and release info

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-version-info.yml'
      - '.migration/audit-version-info.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit and synchronize
        run: python .migration/audit-version-info.py
      - name: Validate JavaScript and registry
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Elimination-Assistant.user.js
          node --check SakaLuX-Account-Auditor.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          node --check SakaLuX-Suite.user.js
          python -m json.tool scripts.json >/dev/null
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.')
          managed={
           'enhancer':'SakaLuX-Enhancer-Guard.user.js',
           'bazaar':'SakaLuX-Bazaar-Thanker-PDA.user.js',
           'mission-rewards':'SakaLuX-Mission-Rewards.user.js',
           'market-intelligence':'SakaLuX-Market-Intelligence.user.js',
           'elimination-assistant':'SakaLuX-Elimination-Assistant.user.js',
          }
          def ver(p):
              m=re.search(r'^//\s*@version\s+([^\s]+)',(root/p).read_text(),re.M)
              assert m,p
              return m.group(1)
          data=json.loads((root/'scripts.json').read_text())
          rows={r['id']:r for r in data['scripts']}
          for sid,p in managed.items():
              assert rows[sid]['version']==ver(p),(sid,rows[sid]['version'],ver(p))
          print('Registry versions match userscripts.')
          PY
      - name: Commit synchronized metadata
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add scripts.json SakaLuX-Script-Hub.user.js greasyfork/*.md
          if git diff --cached --quiet; then
            echo 'All version/release information was already synchronized.'
            exit 0
          fi
          git commit -m 'Synchronize all script versions and release info [skip ci]'
          git push

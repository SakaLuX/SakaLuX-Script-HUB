name: One-time Market Intelligence API panel migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mi-api-migrate.yml'
      - '.migration/market-api-panel-v1174.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration
        run: python .migration/market-api-panel-v1174.py

      - name: Validate Market Intelligence syntax
        run: node --check SakaLuX-Market-Intelligence.user.js

      - name: Validate registry JSON
        run: python -m json.tool scripts.json >/dev/null

      - name: Commit migrated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Market-Intelligence.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Market-Intelligence.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Market Intelligence v1.17.4 dedicated API Access panel [skip ci]'
          git push

name: Hub Test runtime diagnostic
on:
  push:
    paths:
      - '.github/workflows/temp-hubtest-runtime-diag.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Hub Test
        run: python .migration/hubtest_runtime_diag.py
      - name: Validate Hub Test
        run: node --check hubtest.user.js
      - name: Commit Hub Test
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add hubtest.user.js
          git commit -m 'Add Hub Test runtime diagnostics' || exit 0
          git push origin HEAD:main

name: One-time live runtime authority fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-runtime-authority.yml'
      - '.migration/fix-live-runtime-authority.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .migration/fix-live-runtime-authority.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q '@version      1.9.39' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.39';" SakaLuX-Script-Hub.user.js
          grep -q 'function getLiveEnabledState' SakaLuX-Script-Hub.user.js
          grep -q 'NOT RUNNING' SakaLuX-Script-Hub.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          git commit -m 'Use live runtime state for Hub modules [skip ci]'
          git push

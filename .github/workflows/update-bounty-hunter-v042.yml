name: Update Bounty Hunter v0.4.2
on:
  push:
    paths:
      - '.github/workflows/update-bounty-hunter-v042.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix Bounty Hunter panel/footer layout
        run: python .github/scripts/update_bounty_hunter_v042.py
      - name: Syntax check
        run: node --check SakaLuX-Bounty-Hunter.user.js
      - name: Verify release
        run: |
          grep -q '@version      0.4.2' SakaLuX-Bounty-Hunter.user.js
          grep -q "const VERSION='0.4.2'" SakaLuX-Bounty-Hunter.user.js
          grep -q "overlay?.querySelector(':scope > section')" SakaLuX-Bounty-Hunter.user.js
          grep -q '#slx-bh>section{--bh-bg:' SakaLuX-Bounty-Hunter.user.js
          grep -q 'SEND MONEY' SakaLuX-Bounty-Hunter.user.js
          grep -q 'SEND ITEMS' SakaLuX-Bounty-Hunter.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bounty-Hunter.user.js scripts.json CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Bounty Hunter v0.4.2 mobile panel footer layout'
          git push

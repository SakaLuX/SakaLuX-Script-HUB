name: Fix Account and Chat standalone registration

on:
  push:
    paths:
      - '.github/fix-account-chat-standalone.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup and patch
        shell: bash
        run: |
          set -euo pipefail
          B='backups/account-chat-standalone-2026-09-17'
          mkdir -p "$B"
          cp SakaLuX-Account-Auditor.user.js "$B/"
          cp SakaLuX-Chat-Intelligence.user.js "$B/"
          cp STANDALONE-AUDIT-2026-09-17.md "$B/" 2>/dev/null || true
          cp scripts.json "$B/"

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          # Account Auditor — it already has the shared standalone bootstrap; add the missing canonical registration.
          p=Path('SakaLuX-Account-Auditor.user.js'); s=p.read_text()
          s=s.replace('// @version      1.3.13','// @version      1.3.14',1)
          s=s.replace("const VERSION = '1.3.13';","const VERSION = '1.3.14';",1)
          if 'SAKALUX_GLOBAL_STANDALONE_ACCOUNT_AUDITOR' not in s:
              s += '''\n/* SAKALUX_GLOBAL_STANDALONE_ACCOUNT_AUDITOR */\n(()=>{\n const mount=()=>{\n  if(!document.body)return;\n  let e=document.querySelector('[data-slx-standalone-registration="account-auditor"]');\n  if(!e){e=document.createElement('span');e.hidden=true;e.setAttribute('data-slx-standalone-registration','account-auditor');document.body.appendChild(e);}\n  Object.assign(e.dataset,{id:'account-auditor',name:'Auditor',icon:'🔎',selector:'#sl-aa-panel',fallback:'https://www.torn.com/index.php',version:'1.3.14'});\n };\n if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount,{once:true});\n})();\n'''
          p.write_text(s)

          # Chat Intelligence — register it in the common SakaLuX Scripts Standalone list.
          p=Path('SakaLuX-Chat-Intelligence.user.js'); s=p.read_text()
          s=s.replace('// @version      1.2.17','// @version      1.2.18',1)
          s=s.replace("const VERSION = '1.2.17';","const VERSION = '1.2.18';",1)
          if 'SAKALUX_GLOBAL_STANDALONE_CHAT_INTELLIGENCE' not in s:
              s += '''\n/* SAKALUX_GLOBAL_STANDALONE_CHAT_INTELLIGENCE */\n(()=>{\n const mount=()=>{\n  if(!document.body)return;\n  let e=document.querySelector('[data-slx-standalone-registration="chat-intelligence"]');\n  if(!e){e=document.createElement('span');e.hidden=true;e.setAttribute('data-slx-standalone-registration','chat-intelligence');document.body.appendChild(e);}\n  Object.assign(e.dataset,{id:'chat-intelligence',name:'Chat',icon:'💬',selector:'',fallback:'https://www.torn.com/index.php',version:'1.2.18'});\n };\n if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount,{once:true});\n})();\n'''
          p.write_text(s)

          # Keep canonical ordering in every shared standalone dock owner. Hub source is intentionally excluded.
          canonical="const ORDER=['enhancer','bazaar','mission-rewards','market-intelligence','elimination-assistant','company-intelligence','chat-intelligence','stock-manager-advisor','account-auditor'];"
          for p in Path('.').glob('SakaLuX-*.user.js'):
              if p.name in ('SakaLuX-Script-Hub.user.js','SakaLuX-Suite.user.js','SakaLuX-Stock-Manager-Advisor.user.js'): continue
              t=p.read_text()
              if "const ORDER=['enhancer'" in t:
                  t=re.sub(r"const ORDER=\['enhancer'[^;]+;",canonical,t,count=1)
                  p.write_text(t)

          # Registry version sync only for Chat. Do not alter Hub source/version.
          data=json.loads(Path('scripts.json').read_text())
          def walk(o):
              if isinstance(o,dict):
                  if o.get('id')=='chat-intelligence': o['version']='1.2.18'
                  for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(data); Path('scripts.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          # Rebuild audit. Every installable SakaLuX module must register in standalone.
          checks={
            'SakaLuX-Account-Auditor.user.js':'account-auditor',
            'SakaLuX-Bazaar-Thanker-PDA.user.js':'bazaar',
            'SakaLuX-Chat-Intelligence.user.js':'chat-intelligence',
            'SakaLuX-Company-Intelligence-v1.0.0.user.js':'company-intelligence',
            'SakaLuX-Elimination-Assistant.user.js':'elimination-assistant',
            'SakaLuX-Enhancer-Guard.user.js':'enhancer',
            'SakaLuX-Market-Intelligence.user.js':'market-intelligence',
            'SakaLuX-Mission-Rewards.user.js':'mission-rewards',
            'SakaLuX-Stock-Manager-Advisor.user.js':'stock-manager-advisor'}
          rows=[]
          for fn,mid in checks.items():
              text=Path(fn).read_text()
              ok=('data-slx-standalone-registration' in text and mid in text)
              rows.append((fn,mid,ok))
          missing=[fn for fn,mid,ok in rows if not ok]
          if missing: raise SystemExit('Missing standalone: '+', '.join(missing))
          out=['# SakaLuX Standalone audit — 2026-09-17','', '| Script | Registration |','|---|---|']
          out += [f'| {fn} | ✅ `{mid}` |' for fn,mid,ok in rows]
          out += ['', 'All current installable SakaLuX modules register in the shared standalone list.', 'Hub is intentionally excluded. Suite keeps its own Master Control launcher.', 'Stock Manager registers globally and appears as 📊 Stocks.']
          Path('STANDALONE-AUDIT-2026-09-17.md').write_text('\n'.join(out)+'\n')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check SakaLuX-Account-Auditor.user.js
          node --check SakaLuX-Chat-Intelligence.user.js
          python3 -m json.tool scripts.json >/dev/null
          grep -q '✅ `account-auditor`' STANDALONE-AUDIT-2026-09-17.md
          grep -q '✅ `chat-intelligence`' STANDALONE-AUDIT-2026-09-17.md
          grep -q '✅ `stock-manager-advisor`' STANDALONE-AUDIT-2026-09-17.md
          git diff --exit-code -- SakaLuX-Script-Hub.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-*.user.js scripts.json STANDALONE-AUDIT-2026-09-17.md "$B" 2>/dev/null || git add SakaLuX-*.user.js scripts.json STANDALONE-AUDIT-2026-09-17.md backups/account-chat-standalone-2026-09-17/
          git commit -m 'Auditor v1.3.14 Chat v1.2.18 complete standalone registration'
          git push

name: Update Chat Intelligence v1.2.28b

on:
  push:
    paths:
      - '.github/scripts/update_chat_v128b.py'
      - '.github/workflows/update-chat-v128b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/update_chat_v128b.py
      - name: Syntax check
        run: node --check SakaLuX-Chat-Intelligence.user.js
      - name: Verify
        run: |
          grep -q '@version      1.2.28' SakaLuX-Chat-Intelligence.user.js
          grep -q 'function contextRows' SakaLuX-Chat-Intelligence.user.js
          grep -q 'function commonChatPanel' SakaLuX-Chat-Intelligence.user.js
          grep -q 'slx-msg-actions' SakaLuX-Chat-Intelligence.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Chat-Intelligence.user.js greasyfork/Chat-Intelligence.md
          if git diff --cached --quiet; then
            echo 'No release changes required.'
          else
            git commit -m 'Release Chat Intelligence v1.2.28'
            git push
          fi

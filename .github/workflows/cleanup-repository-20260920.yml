name: Serious repository cleanup 2026-09-20
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/cleanup_repository_20260920.py'
      - '.github/workflows/cleanup-repository-20260920.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: serious-repository-cleanup-main
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run cleanup
        run: python3 .github/scripts/cleanup_repository_20260920.py
      - name: Validate retained repository
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 .github/scripts/validate_repository.py
          test -f locales.json
          test -f scripts.json
          test -f LICENSE
          test -f FONT-SAFETY-AUDIT-2026-09-18.md
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find .github/scripts -maxdepth 1 -type f | wc -l)" -eq 4
      - name: Remove cleanup machinery itself
        run: |
          rm -f .github/scripts/cleanup_repository_20260920.py
          rm -f .github/workflows/cleanup-repository-20260920.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "Clean repository history artifacts and one-shot automation"
          git push

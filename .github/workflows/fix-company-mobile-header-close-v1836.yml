name: Fix Company mobile header close button v1.8.36

on:
  push:
    paths:
      - '.github/workflows/fix-company-mobile-header-close-v1836.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup and patch Company
        shell: python
        run: |
          from pathlib import Path

          path = Path('SakaLuX-Company-Intelligence-v1.0.0.user.js')
          text = path.read_text(encoding='utf-8')
          backup = Path('backups/company-v1.8.36-mobile-header-close-2026-09-18')
          backup.mkdir(parents=True, exist_ok=True)
          (backup / 'SakaLuX-Company-Intelligence-v1.8.35.user.js').write_text(text, encoding='utf-8')

          text = text.replace('// @version      1.8.35', '// @version      1.8.36', 1)
          text = text.replace("version:'1.8.35'", "version:'1.8.36'", 1)

          marker = '@media(max-width:720px){#ci-root{inset:0 0 72px;'
          if marker not in text:
              raise SystemExit('Company mobile media marker not found')

          old = '@media(max-width:720px){#ci-root{inset:0 0 72px;padding:0;display:block;overflow:hidden;touch-action:pan-y;overscroll-behavior:contain}.ci-shell{width:100%;height:100%;min-height:0;border:0;border-radius:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px;box-sizing:border-box}.ci-grid,.ci-snapshots{grid-template-columns:1fr}.ci-head{padding:7px}.ci-brand b{font-size:13px}.ci-brand small{font-size:10px}.ci-mode button{font-size:10px;padding:7px}.ci-tabs{position:sticky;top:58px;z-index:2;padding:5px}.ci-tabs button{font-size:11px;padding:7px 8px}.ci-form{grid-template-columns:1fr}.ci-form .wide{grid-column:auto}#ci-launch{right:8px;bottom:72px}}'
          new = '@media(max-width:720px){#ci-root{inset:0 0 72px;padding:0;display:block;overflow:hidden;touch-action:pan-y;overscroll-behavior:contain}.ci-shell{width:100%;height:100%;min-height:0;border:0;border-radius:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px;box-sizing:border-box}.ci-grid,.ci-snapshots{grid-template-columns:1fr}.ci-head{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 44px;grid-template-rows:auto auto;gap:6px;padding:7px}.ci-brand{grid-column:1/2;grid-row:1;min-width:0;overflow:hidden}.ci-brand b{font-size:13px;white-space:normal;line-height:1.05}.ci-brand small{font-size:10px;line-height:1.15;display:block}.ci-head>.ci-icon{width:44px;height:44px;min-width:44px;padding:0;display:grid;place-items:center;align-self:center}.ci-head>.ci-icon[data-act="refresh"]{grid-column:2;grid-row:1}.ci-head>.ci-icon[data-act="settings"]{grid-column:3;grid-row:1}.ci-head>.ci-icon[data-act="close"]{grid-column:4;grid-row:1}.ci-mode{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:1fr 1fr;width:100%;box-sizing:border-box}.ci-mode button{font-size:10px;padding:8px 7px;min-width:0}.ci-tabs{position:sticky;top:102px;z-index:2;padding:5px}.ci-tabs button{font-size:11px;padding:7px 8px}.ci-form{grid-template-columns:1fr}.ci-form .wide{grid-column:auto}#ci-launch{right:8px;bottom:72px}}'
          if old not in text:
              raise SystemExit('Exact Company mobile media block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          doc = Path('greasyfork/SakaLuX-Company-Intelligence.md')
          if doc.exists():
              d = doc.read_text(encoding='utf-8')
              d = d.replace('1.8.35', '1.8.36')
              note = '\n- v1.8.36: Fixed TornPDA/mobile Company header overflow. Refresh, API key and Close buttons now stay permanently visible in the first header row, while Employee/Director moves to a full-width second row. The standalone dock logic remains unchanged.\n'
              if 'v1.8.36:' not in d:
                  d += note
              doc.write_text(d, encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          set -e
          f='SakaLuX-Company-Intelligence-v1.0.0.user.js'
          grep -q '// @version      1.8.36' "$f"
          grep -q 'grid-template-columns:minmax(0,1fr) 44px 44px 44px' "$f"
          grep -q 'data-act="close"' "$f"
          grep -q 'grid-column:4;grid-row:1' "$f"
          grep -q 'SakaLuX Standalone Dock Bootstrap — BEGIN' "$f"
          node --check "$f"

      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js greasyfork/SakaLuX-Company-Intelligence.md backups/company-v1.8.36-mobile-header-close-2026-09-18 || true
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Company v1.8.36: keep Close button visible on mobile'
          git push

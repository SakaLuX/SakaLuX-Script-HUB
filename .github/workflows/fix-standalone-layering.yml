name: One-time fix standalone layering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-standalone-layering.yml'
      - '.migration/fix-standalone-layering.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch all managed scripts
        run: python .migration/fix-standalone-layering.py
      - name: Validate userscripts
        run: |
          set -euo pipefail
          for f in SakaLuX-*.user.js; do node --check "$f"; done
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('scripts.json').read_text())
          expected={'enhancer':'1.3.30','bazaar':'5.3.21','mission-rewards':'1.0.18','market-intelligence':'1.17.18','elimination-assistant':'1.3.30'}
          for row in data['scripts']:
              if row.get('id') in expected and row['version']!=expected[row['id']]:
                  raise SystemExit(f"registry mismatch {row['id']}")
          for f in ['SakaLuX-Enhancer-Guard.user.js','SakaLuX-Bazaar-Thanker-PDA.user.js','SakaLuX-Mission-Rewards.user.js','SakaLuX-Market-Intelligence.user.js','SakaLuX-Elimination-Assistant.user.js']:
              s=Path(f).read_text()
              assert 'z-index:2147483646!important' in s
              assert '#sakalux-standalone-dock{z-index:2147483500!important;}' in s
          print('layering invariants OK')
          PY
      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-*.user.js scripts.json greasyfork/*.md
          git commit -m 'Keep all managed panels above standalone dock [skip ci]'
          git push

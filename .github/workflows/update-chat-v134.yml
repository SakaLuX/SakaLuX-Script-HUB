name: Update Chat Intelligence v1.2.34

on:
  push:
    paths:
      - '.github/scripts/update_chat_v134.py'
      - '.github/workflows/update-chat-v134.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/update_chat_v134.py
      - name: Syntax check
        run: node --check SakaLuX-Chat-Intelligence.user.js
      - name: Verify
        run: |
          grep -q '@version      1.2.34' SakaLuX-Chat-Intelligence.user.js
          grep -q "const V='1.2.34',ID='chat-intelligence'" SakaLuX-Chat-Intelligence.user.js
          grep -q 'function isChatHeaderCandidate' SakaLuX-Chat-Intelligence.user.js
          grep -q 'isChatHeaderCandidate(r,e)' SakaLuX-Chat-Intelligence.user.js
          grep -q 'max-width:132px' SakaLuX-Chat-Intelligence.user.js
          grep -q 'v1.2.34' greasyfork/Chat-Intelligence.md
          grep -q '"version": "1.2.34"' scripts.json
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Chat-Intelligence.user.js greasyfork/Chat-Intelligence.md scripts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Release Chat Intelligence v1.2.34'
          git push

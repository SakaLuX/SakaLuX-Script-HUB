name: Fix Stocks Mission Company UI

on:
  push:
    paths:
      - '.github/fix-stocks-mission-company-ui.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/fix_stocks_mission_company_ui.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          python3 -m json.tool scripts.json >/dev/null
          grep -q '@version      0.7.14' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SAKALUX_STOCKS_PANEL_CHROME_V0714' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SAKALUX_MISSION_REAL_FOOTER_V1038' SakaLuX-Mission-Rewards.user.js
          grep -q "selector:'#sakalux-module-bridge-company-intelligence'" SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q 'SAKALUX_COMPANY_ABOVE_STANDALONE_V1832' SakaLuX-Company-Intelligence-v1.0.0.user.js
          git diff --exit-code -- SakaLuX-Script-Hub.user.js

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js scripts.json greasyfork/ backups/stocks-mission-company-ui-2026-09-18/
          git commit -m 'Stocks v0.7.14 Mission v1.0.38 Company v1.8.32 UI fixes'
          git push

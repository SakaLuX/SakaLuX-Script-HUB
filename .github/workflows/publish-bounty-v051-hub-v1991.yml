name: Publish Bounty v0.5.1 + Hub v1.9.91
on:
  push:
    paths:
      - '.github/workflows/publish-bounty-v051-hub-v1991.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply release
        run: python .github/scripts/publish_bounty_v051_hub_v1991.py
      - name: Re-embed Shared Core into Bounty
        run: node tools/embed-shared-core.cjs SakaLuX-Bounty-Hunter.user.js src/core/sakalux-core.js SakaLuX-Bounty-Hunter.user.js
      - name: Syntax checks
        run: |
          node --check SakaLuX-Bounty-Hunter.user.js
          node --check SakaLuX-Script-Hub.user.js
      - name: Hub health regression
        run: node tests/hub-health-status-regression.cjs
      - name: Verify release
        run: |
          grep -q '@version      0.5.1' SakaLuX-Bounty-Hunter.user.js
          grep -q '598988/SakaLuX%20Bounty%20Hunter.meta.js' SakaLuX-Bounty-Hunter.user.js
          grep -q 'function testTornAccess' SakaLuX-Bounty-Hunter.user.js
          grep -q 'fatalHealthError' SakaLuX-Bounty-Hunter.user.js
          grep -q 'function pruneCaches' SakaLuX-Bounty-Hunter.user.js
          grep -q '@version      1.9.91' SakaLuX-Script-Hub.user.js
          grep -q 'torn=items,elimination,eliminationteam,stocks,bounties' SakaLuX-Script-Hub.user.js
          grep -q 'Missing Torn: Bounties access' SakaLuX-Script-Hub.user.js
          grep -q '"greasyForkId": "598988"' scripts.json
          grep -q '"version": "0.5.1"' scripts.json
          grep -q '### v0.5.1' greasyfork/Bounty-Hunter.md
          grep -q '### v1.9.91' greasyfork/Script-Hub.md
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bounty-Hunter.user.js SakaLuX-Script-Hub.user.js scripts.json CHANGELOG.md greasyfork/Bounty-Hunter.md greasyfork/Script-Hub.md tests/module-active-alpha-sort-regression.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Bounty v0.5.1 and Hub v1.9.91'
          git push

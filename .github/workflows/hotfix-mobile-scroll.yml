name: Fix Company runtime version

on:
  push:
    paths:
      - '.github/scripts/fix_company_runtime_version.py'
      - '.github/workflows/hotfix-mobile-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize Company runtime version
        run: python .github/scripts/fix_company_runtime_version.py
      - name: Validate Company
        run: |
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q '// @version      1.8.22' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q "version:'1.8.22'" SakaLuX-Company-Intelligence-v1.0.0.user.js
      - name: Commit Company runtime fix
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js
          git commit -m "fix: synchronize Company runtime version 1.8.22"
          git push

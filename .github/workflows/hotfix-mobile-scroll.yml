name: Hotfix SakaLuX module mobile scroll

on:
  push:
    paths:
      - '.github/scripts/hotfix_module_scroll.py'
      - '.github/workflows/hotfix-mobile-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply module patch
        run: python .github/scripts/hotfix_module_scroll.py
      - name: Validate patched sources
        run: |
          for f in SakaLuX-*.user.js; do node --check "$f"; done
          python -m json.tool scripts.json >/dev/null
      - name: Commit synchronized hotfix
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-*.user.js scripts.json greasyfork backups/ui-scroll-hotfix-2026-09-17
          git commit -m "fix: restore module TornPDA scrolling and Company whole-sheet scroll"
          git push

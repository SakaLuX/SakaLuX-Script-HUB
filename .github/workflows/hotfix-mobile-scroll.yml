name: Hotfix Hub mobile scroll

on:
  push:
    paths:
      - '.github/scripts/hotfix_hub_scroll.py'
      - '.github/workflows/hotfix-mobile-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hub patch
        run: python .github/scripts/hotfix_hub_scroll.py
      - name: Validate Hub
        run: |
          node --check SakaLuX-Script-Hub.user.js
          grep -q '// @version      1.9.49' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.49'" SakaLuX-Script-Hub.user.js
      - name: Commit Hub hotfix
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md backups/ui-scroll-hotfix-2026-09-17
          git commit -m "fix: restore Hub TornPDA scrolling in v1.9.49"
          git push

name: Patch Market Intelligence v1.15.5
on:
  push:
    branches: [main]
    paths:
      - '.github/patches/mi-v1.15.5-lite.py'
      - '.github/workflows/patch-mi-v1.15.5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/patches/mi-v1.15.5-lite.py
      - run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Market-Intelligence.user.js scripts.json UPDATE-INFO.md greasyfork/Market-Intelligence.md
          git diff --cached --quiet || (git commit -m "SakaLuX Market Intelligence v1.15.5: Torn PDA row accuracy" && git push)

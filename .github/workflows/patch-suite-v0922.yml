name: Apply Suite v0.9.922 Elimination layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-suite-v0922.yml'

permissions:
  contents: write

jobs:
  patch-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Back up and patch Suite
        shell: python
        run: |
          from pathlib import Path
          import shutil

          script = Path('SakaLuX-Suite.user.js')
          s = script.read_text(encoding='utf-8')

          old = '0.9.921'
          new = '0.9.922'
          if f'// @version      {new}' in s:
              print('Suite already patched to', new)
          else:
              if f'// @version      {old}' not in s:
                  raise SystemExit(f'Expected Suite {old}, found another version; refusing unsafe patch.')

              backup = Path('backups/suite-elimination-layout-v0.9.922-2026-09-17/SakaLuX-Suite-v0.9.921.user.js')
              backup.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(script, backup)

              # Keep metadata and runtime version synchronized.
              s = s.replace(f'// @version      {old}', f'// @version      {new}', 1)
              s = s.replace(f"const VERSION = '{old}';", f"const VERSION = '{new}';", 1)

              marker = '/* Suite mobile Elimination geometry contract 0.9.922 */'
              if marker in s:
                  raise SystemExit('0.9.922 layout marker already exists without matching metadata.')

              override = r'''

/* Suite mobile Elimination geometry contract 0.9.922 */
(()=>{
  const id='sakalux-suite-elimination-layout-v0922';
  if(document.getElementById(id)) return;
  const st=document.createElement('style');
  st.id=id;
  st.textContent=`
/* Master Control uses the same mobile shell geometry as Elimination. */
@media(max-width:820px){
  #sakalux-master-suite-panel#sakalux-master-suite-panel#sakalux-master-suite-panel{
    position:fixed!important;
    inset:0 4px 36px 4px!important;
    top:0!important;right:4px!important;bottom:36px!important;left:4px!important;
    width:auto!important;height:auto!important;
    min-width:0!important;min-height:0!important;
    max-width:none!important;max-height:none!important;
    margin:0!important;padding:0!important;
    transform:none!important;
    display:flex!important;
    align-items:stretch!important;justify-content:stretch!important;
    box-sizing:border-box!important;
    overflow:hidden!important;
    border:0!important;border-radius:14px!important;
    background:transparent!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
    touch-action:pan-y!important;
  }

  #sakalux-master-suite-panel#sakalux-master-suite-panel#sakalux-master-suite-panel>.sakalux-suite-window{
    position:relative!important;
    inset:auto!important;
    flex:1 1 auto!important;
    align-self:stretch!important;
    display:flex!important;
    flex-direction:column!important;
    width:100%!important;height:100%!important;
    min-width:0!important;min-height:0!important;
    max-width:100%!important;max-height:100%!important;
    margin:0!important;padding:0!important;
    transform:none!important;
    box-sizing:border-box!important;
    overflow:hidden!important;
    border:1px solid #3c4652!important;
    border-radius:14px!important;
    background:#0b1118!important;
    box-shadow:0 10px 26px rgba(0,0,0,.34)!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  }

  /* Compact fixed header, matching the Elimination mobile panel density. */
  #sakalux-master-suite-panel .sakalux-suite-header{
    position:relative!important;
    inset:auto!important;
    flex:0 0 auto!important;
    min-height:0!important;height:auto!important;
    margin:0!important;
    padding:8px 10px!important;
    box-sizing:border-box!important;
    border-radius:13px 13px 0 0!important;
  }
  #sakalux-master-suite-panel .sakalux-suite-header h1,
  #sakalux-master-suite-panel .sakalux-suite-header h2,
  #sakalux-master-suite-panel .sakalux-suite-header .sakalux-suite-title{
    margin:0!important;
    font-size:18px!important;
    line-height:1.1!important;
  }
  #sakalux-master-suite-panel .sakalux-suite-header p,
  #sakalux-master-suite-panel .sakalux-suite-header .sakalux-suite-subtitle,
  #sakalux-master-suite-panel .sakalux-suite-header .sakalux-suite-description{
    margin:3px 0 0!important;
    font-size:10px!important;
    line-height:1.25!important;
  }
  #sakalux-master-suite-panel .sakalux-suite-close{
    width:34px!important;height:34px!important;
    min-width:34px!important;min-height:34px!important;
    max-width:34px!important;max-height:34px!important;
    padding:0!important;
    border-radius:10px!important;
    font-size:18px!important;
    line-height:32px!important;
  }

  /* Keep Suite-only master actions compact instead of consuming the screen. */
  #sakalux-master-suite-panel .sakalux-suite-toolbar{
    position:relative!important;
    inset:auto!important;
    flex:0 0 auto!important;
    display:grid!important;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    gap:5px!important;
    min-height:0!important;height:auto!important;
    margin:0!important;
    padding:6px 8px!important;
    box-sizing:border-box!important;
  }
  #sakalux-master-suite-panel .sakalux-suite-toolbar button,
  #sakalux-master-suite-panel .sakalux-suite-toolbar .sakalux-suite-button{
    position:relative!important;
    inset:auto!important;
    width:100%!important;height:30px!important;
    min-width:0!important;min-height:30px!important;
    max-height:30px!important;
    margin:0!important;padding:0 5px!important;
    border-radius:9px!important;
    font-size:9px!important;
    line-height:1.05!important;
    white-space:normal!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
  }

  /* Only the middle module list scrolls. Header, controls and footer stay put. */
  #sakalux-master-suite-panel>.sakalux-suite-window>.sakalux-suite-content{
    position:relative!important;
    inset:auto!important;
    flex:1 1 0!important;
    display:block!important;
    width:100%!important;height:0!important;
    min-width:0!important;min-height:0!important;
    max-width:100%!important;max-height:none!important;
    margin:0!important;
    box-sizing:border-box!important;
    overflow-y:auto!important;overflow-x:hidden!important;
    overscroll-behavior:contain!important;
    touch-action:pan-y!important;
    -webkit-overflow-scrolling:touch!important;
  }

  #sakalux-master-suite-panel>.sakalux-suite-window>#sakalux-inline-footer-suite{
    position:relative!important;
    inset:auto!important;
    flex:0 0 50px!important;
    width:100%!important;height:50px!important;
    min-height:50px!important;max-height:50px!important;
    margin:0!important;padding:0!important;
    border-radius:0 0 13px 13px!important;
    overflow:hidden!important;
  }

  #sakalux-inline-footer-suite .slh-bottom{
    height:28px!important;
    padding:4px 14px!important;
  }
  #sakalux-inline-footer-suite .slh-bottom-grid{height:20px!important;gap:7px!important}
  #sakalux-inline-footer-suite .slh-bottom-btn{
    height:20px!important;min-height:20px!important;max-height:20px!important;
    padding:0 4px!important;
    border-radius:10px!important;
    font-size:8px!important;
  }
  #sakalux-inline-footer-suite .slh-footer{
    height:22px!important;min-height:22px!important;max-height:22px!important;
    border-radius:0 0 13px 13px!important;
    font-size:9px!important;
  }
}
`;
  (document.head||document.documentElement).appendChild(st);
})();
'''
              s += override
              script.write_text(s, encoding='utf-8')

          # Update the public release notes without disturbing the existing document structure.
          doc = Path('greasyfork/SakaLuX-Suite.md')
          if doc.exists():
              d = doc.read_text(encoding='utf-8')
              d = d.replace('0.9.921', '0.9.922')
              note = '**v0.9.922** aligns Master Control with the Elimination mobile panel geometry: 4px side gaps, 36px bottom chat clearance, 14px rounded shell, compact fixed header/actions, scroll-only middle content and the existing 50px donation footer.\n\n'
              if note.strip() not in d:
                  anchor = '## Current release notes\n'
                  if anchor in d:
                      d = d.replace(anchor, anchor + '\n' + note, 1)
                  else:
                      d += '\n\n## Current release notes\n\n' + note
              doc.write_text(d, encoding='utf-8')

      - name: Validate Suite patch
        shell: python
        run: |
          from pathlib import Path
          s=Path('SakaLuX-Suite.user.js').read_text(encoding='utf-8')
          checks=[
            '// @version      0.9.922',
            "const VERSION = '0.9.922';",
            'Suite mobile Elimination geometry contract 0.9.922',
            'inset:0 4px 36px 4px!important',
            'flex:0 0 50px!important',
            'overflow-y:auto!important'
          ]
          missing=[x for x in checks if x not in s]
          if missing:
              raise SystemExit('Patch validation failed: '+repr(missing))
          if s.count('// @version      0.9.922') != 1:
              raise SystemExit('Unexpected Suite metadata version count')
          print('Suite v0.9.922 layout validation passed.')

      - name: Commit Suite v0.9.922
        run: |
          git config user.name "SakaLuX Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md backups/suite-elimination-layout-v0.9.922-2026-09-17/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Suite v0.9.922: match Elimination mobile panel layout"
            git push
          fi

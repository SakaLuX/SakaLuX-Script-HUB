name: Fix Suite Master Control full height v1.9.69

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-suite-master-fullheight-v1969.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch Hub
        shell: python
        run: |
          from pathlib import Path
          import shutil, re

          p=Path('SakaLuX-Script-Hub.user.js')
          s=p.read_text(encoding='utf-8')
          old='1.9.68'; new='1.9.69'
          if f'// @version      {new}' in s:
              raise SystemExit('already patched')
          if f'// @version      {old}' not in s:
              raise SystemExit('unexpected Hub version')

          b=Path('backups/hub-suite-master-fullheight-2026-09-17/SakaLuX-Script-Hub-v1.9.68.user.js')
          b.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(p,b)
          s=s.replace(f'// @version      {old}',f'// @version      {new}',1)

          patch=r'''

/* SakaLuX Hub v1.9.69 - force Suite Master Control to use the full TornPDA viewport */
(()=>{
  'use strict';
  const MARK='data-slx-master-fullheight-v1969';

  const imp=(el,prop,val)=>{ if(el) el.style.setProperty(prop,val,'important'); };
  const txt=el=>(el?.innerText||el?.textContent||'').replace(/\s+/g,' ').trim();

  function findPanel(){
    const nodes=[...document.querySelectorAll('div,section,aside')].filter(el=>{
      const t=txt(el);
      return t.includes('MASTER CONTROL') && t.includes('SakaLuX Suite') && t.includes('Enable Ready Modules');
    });
    if(!nodes.length) return null;

    // Prefer the smallest visible container that still contains the complete Master Control UI.
    nodes.sort((a,b)=>a.getBoundingClientRect().width*a.getBoundingClientRect().height-b.getBoundingClientRect().width*b.getBoundingClientRect().height);
    let panel=nodes.find(el=>{
      const r=el.getBoundingClientRect();
      const cs=getComputedStyle(el);
      return r.width>300 && r.height>250 && cs.display!=='none' && cs.visibility!=='hidden';
    }) || nodes[0];

    // If the chosen node is only inner content, walk up to the rounded/card shell but never to body.
    let cur=panel;
    for(let i=0;i<4 && cur?.parentElement && cur.parentElement!==document.body;i++){
      const pr=cur.parentElement.getBoundingClientRect();
      const cr=cur.getBoundingClientRect();
      const pt=txt(cur.parentElement);
      if(pt.includes('MASTER CONTROL') && pt.includes('SakaLuX Suite') && pr.width<=cr.width+40 && pr.width>300){
        panel=cur.parentElement; cur=cur.parentElement;
      } else break;
    }
    return panel;
  }

  function directChildFor(root,node){
    let n=node;
    while(n && n.parentElement!==root) n=n.parentElement;
    return n && n.parentElement===root ? n : null;
  }

  function apply(){
    const panel=findPanel();
    if(!panel) return;
    panel.setAttribute(MARK,'1');

    // This is the geometry visible in Elimination: viewport shell, tiny side gaps and chat clearance.
    imp(panel,'position','fixed');
    imp(panel,'top','0');
    imp(panel,'left','4px');
    imp(panel,'right','4px');
    imp(panel,'bottom','36px');
    imp(panel,'inset','0 4px 36px 4px');
    imp(panel,'width','auto');
    imp(panel,'height','auto');
    imp(panel,'max-width','none');
    imp(panel,'max-height','none');
    imp(panel,'min-height','0');
    imp(panel,'margin','0');
    imp(panel,'transform','none');
    imp(panel,'display','flex');
    imp(panel,'flex-direction','column');
    imp(panel,'overflow','hidden');
    imp(panel,'box-sizing','border-box');
    imp(panel,'border-radius','14px');
    imp(panel,'z-index','2147483000');

    // Detect footer by its actual labels and pin it to the bottom.
    const footerLeaf=[...panel.querySelectorAll('div,footer,section')].find(el=>{
      const t=txt(el); return t.includes('SEND MONEY') && t.includes('SEND ITEMS') && t.includes('Made with');
    });
    const footer=footerLeaf ? directChildFor(panel,footerLeaf) : null;
    if(footer){
      imp(footer,'flex','0 0 auto');
      imp(footer,'margin-top','auto');
      imp(footer,'position','relative');
      imp(footer,'bottom','auto');
      imp(footer,'width','100%');
    }

    // Header is the direct section carrying the title; keep it compact and fixed in the flex shell.
    const titleLeaf=[...panel.querySelectorAll('div,header,section')].find(el=>{
      const t=txt(el); return t.includes('MASTER CONTROL') && t.includes('SakaLuX Suite') && !t.includes('Enable Ready Modules');
    });
    const header=titleLeaf ? directChildFor(panel,titleLeaf) : null;
    if(header){ imp(header,'flex','0 0 auto'); imp(header,'position','relative'); }

    // Find direct children and make the module/list region consume all remaining height.
    const direct=[...panel.children].filter(el=>el!==header && el!==footer);
    const middle=direct.find(el=>{
      const t=txt(el);
      return !t.includes('Enable Ready Modules') && !t.includes('Disable All') && !t.includes('Export Settings') && el.scrollHeight>el.clientHeight;
    }) || direct[direct.length-1];
    if(middle && middle!==footer){
      imp(middle,'flex','1 1 0');
      imp(middle,'min-height','0');
      imp(middle,'overflow-y','auto');
      imp(middle,'overflow-x','hidden');
      imp(middle,'-webkit-overflow-scrolling','touch');
    }

    // Action block must never stretch vertically.
    const actionLeaf=[...panel.querySelectorAll('div,section')].find(el=>{
      const t=txt(el);
      return t.includes('Enable Ready Modules') && t.includes('Disable All') && t.includes('Export Settings') && t.includes('Import Settings');
    });
    const actions=actionLeaf ? directChildFor(panel,actionLeaf) : null;
    if(actions && actions!==middle){ imp(actions,'flex','0 0 auto'); imp(actions,'position','relative'); }
  }

  let raf=0;
  const schedule=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(apply); };
  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
  addEventListener('resize',schedule,{passive:true});
  addEventListener('orientationchange',schedule,{passive:true});
  setInterval(apply,1200);
  apply();
})();
'''
          s += patch
          p.write_text(s,encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('SakaLuX-Script-Hub.user.js').read_text(encoding='utf-8')
          for x in ['// @version      1.9.69','data-slx-master-fullheight-v1969',"imp(panel,'bottom','36px')","t.includes('SakaLuX Suite')"]:
              if x not in s: raise SystemExit('missing '+x)
          print('Hub v1.9.69 Master Control full-height patch validated')

      - name: Commit
        run: |
          git config user.name "SakaLuX Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js backups/hub-suite-master-fullheight-2026-09-17/
          git commit -m "Hub v1.9.69: force Suite Master Control full-height on TornPDA"
          git push

name: Patch experimental Stock Manager v0.4.0
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v040.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v040.py
      - name: Validate
        run: |
          grep -q '@version      0.4.0' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.4.0'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'BENEFIT_MODELS' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'fetchBenefitMarketValues' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'buildRoiCandidates' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'renderTradeAssistant' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Buy gap' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.4.0' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.4.0 ROI and Trade Assistant'
          git push

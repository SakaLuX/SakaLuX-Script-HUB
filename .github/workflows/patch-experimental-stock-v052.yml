name: Patch experimental Stock Manager v0.5.2
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v052.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v052.py
      - name: Validate
        run: |
          grep -q '@version      0.5.2' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.5.2'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function mountInlinePanel()' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function refreshInlinePanel()' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'slx-stock-inline' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Rebalance Preview' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.5.2' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.5.2 inline stock market dashboard'
          git pull --rebase origin main
          git push

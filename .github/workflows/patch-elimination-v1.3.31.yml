name: Patch Elimination v1.3.31

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-elimination-v1.3.31.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical Elimination userscript and registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('SakaLuX-Elimination-Assistant.user.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('// @version      1.3.30', '// @version      1.3.31'),
              ('// @description  Torn Eliminations advisor with rotating 500-player batches, persistent SAFE targets, TornPDA export and FF/BS calibration.', '// @description  Torn Eliminations advisor with rotating 500-player batches, persistent SAFE targets, TornPDA export, FF/BS calibration and PC-safe attack links.'),
              ("{version:'1.3.30'}", "{version:'1.3.31'}"),
              ("const VERSION = '1.3.30';", "const VERSION = '1.3.31';"),
              ('https://www.torn.com/loader.php?sid=attack&user2ID=${p.id}', 'https://www.torn.com/page.php?sid=attack&user2ID=${p.id}'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)
          if 'loader.php?sid=attack' in s:
              raise SystemExit('Legacy loader.php attack route still present')
          p.write_text(s, encoding='utf-8')

          registry_path = Path('scripts.json')
          data = json.loads(registry_path.read_text(encoding='utf-8'))
          item = next(x for x in data['scripts'] if x.get('id') == 'elimination-assistant')
          item['version'] = '1.3.31'
          item['description'] = 'Eliminations advisor with unified Torn + FFScouter API setup, rotating 500-player batches, availability status, TornPDA export and PC-safe attack routing.'
          item['metaUrl'] = 'https://update.greasyfork.org/scripts/594921/SakaLuX%20Elimination%20Assistant.meta.js'
          item['downloadUrl'] = 'https://update.greasyfork.org/scripts/594921/SakaLuX%20Elimination%20Assistant.user.js'
          item['sourceUrl'] = 'https://raw.githubusercontent.com/SakaLuX/SakaLuX-Script-HUB/main/SakaLuX-Elimination-Assistant.user.js'
          registry_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          wrapper = Path('SakaLuX-Elimination-Assistant-v1.3.31.user.js')
          if wrapper.exists():
              wrapper.unlink()
          PY
      - name: Validate JavaScript syntax and release state
        shell: bash
        run: |
          node --check SakaLuX-Elimination-Assistant.user.js
          grep -F '// @version      1.3.31' SakaLuX-Elimination-Assistant.user.js
          grep -F 'https://www.torn.com/page.php?sid=attack&user2ID=${p.id}' SakaLuX-Elimination-Assistant.user.js
          ! grep -F 'loader.php?sid=attack' SakaLuX-Elimination-Assistant.user.js
          grep -F '**v1.3.31**' greasyfork/Elimination-Assistant.md
      - name: Commit canonical v1.3.31
        shell: bash
        run: |
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Release Elimination Assistant v1.3.31 canonical build'
          git push

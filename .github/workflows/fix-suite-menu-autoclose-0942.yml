name: Fix Suite menu autoclose 0.9.942
on:
  push:
    branches: [fix/suite-menu-autoclose-0942]
    paths:
      - '.github/scripts/fix_suite_menu_autoclose.py'
      - '.github/workflows/fix-suite-menu-autoclose-0942.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python .github/scripts/fix_suite_menu_autoclose.py
      - run: node --check SakaLuX-Suite.user.js
      - run: node tests/suite-menu-autoclose-regression.cjs
      - run: npm install --no-save --ignore-scripts jsdom
      - run: node tests/suite-modules-regression.cjs
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-menu-autoclose-regression.cjs
          git commit -m 'Fix Suite menu autoclose in v0.9.942'
          git push

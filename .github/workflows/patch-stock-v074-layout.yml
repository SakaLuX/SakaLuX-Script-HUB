name: Patch Stock Manager v0.7.4 layout
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-stock-v074-layout.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_stock_v074_layout.py
      - name: Validate
        run: |
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q '@version      0.7.4' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.7.4'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          ! grep -q 'id="slx-inline-panic"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "Vault Max: continue?" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "Withdraw All: continue?" experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Stock Manager v0.7.4 simplify vault controls'
          git push

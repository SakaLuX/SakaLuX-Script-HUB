name: Update Bounty Hunter v0.4.4
on:
  push:
    paths:
      - '.github/workflows/update-bounty-hunter-v044.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch Shared Core workspace + Bounty Hunter
        run: python .github/scripts/update_bounty_hunter_v044.py
      - name: Re-embed Shared Core
        run: node tools/embed-shared-core.cjs SakaLuX-Bounty-Hunter.user.js src/core/sakalux-core.js SakaLuX-Bounty-Hunter.user.js
      - name: Syntax checks
        run: |
          node --check src/core/sakalux-core.js
          node --check SakaLuX-Bounty-Hunter.user.js
      - name: Verify release
        run: |
          grep -q "@version      0.4.4" SakaLuX-Bounty-Hunter.user.js
          grep -q "const VERSION='0.4.4'" SakaLuX-Bounty-Hunter.user.js
          grep -q "const CORE_VERSION = '1.2.0'" src/core/sakalux-core.js
          grep -q 'applyWorkspaceLayout' src/core/sakalux-core.js
          grep -q 'applyWorkspaceLayout' SakaLuX-Bounty-Hunter.user.js
          test "$(grep -c 'SakaLuX Shared Core — BEGIN' SakaLuX-Bounty-Hunter.user.js)" -eq 1
      - name: Update registry/changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('scripts.json')
          if p.exists():
              d=json.loads(p.read_text())
              seq=d if isinstance(d,list) else d.get('scripts',[])
              for it in seq:
                  if isinstance(it,dict) and it.get('id')=='bounty-hunter':
                      it['version']='0.4.4'
                      if isinstance(it.get('release'),dict):
                          it['release']['version']='0.4.4'
                          it['release']['date']='2026-10-06'
                          it['release']['notes']=[
                              'Uses new Shared Core workspace geometry.',
                              'Panel starts at the top of the usable TornPDA viewport and stops above the bottom chat/navigation area.',
                              'Geometry follows visualViewport on resize/keyboard changes.'
                          ]
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          c=Path('CHANGELOG.md')
          if c.exists():
              t=c.read_text()
              if 'Bounty Hunter v0.4.4' not in t:
                  t=t.rstrip()+"\n\n## Bounty Hunter v0.4.4\n- Added reusable Shared Core v1.2.0 workspace layout helper.\n- Bounty Hunter now fills the usable TornPDA viewport from the top while reserving the bottom chat/navigation zone.\n- Uses visualViewport so panel geometry stays correct across phone viewport changes.\n"
                  c.write_text(t+'\n')
          PY
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bounty-Hunter.user.js src/core/sakalux-core.js scripts.json CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Use Shared Core workspace layout in Bounty Hunter v0.4.4'
          git push

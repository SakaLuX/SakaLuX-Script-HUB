name: Extract Suite OC functions
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/extract_suite_oc_functions_20260919.py'
      - '.github/workflows/extract-suite-oc-functions-20260919.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/extract_suite_oc_functions_20260919.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/oc-functions.txt
          git commit -m "Extract Suite OC functions" || exit 0
          git push

name: Apply SakaLuX Suite v0.9.2 native icon styling
on:
  push:
    paths:
      - '.github/workflows/suite-v092-native-icon-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make reminder icons match Torn resource row
        shell: python
        run: |
          from pathlib import Path
          p=Path('SakaLuX-Suite.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      0.9.1','// @version      0.9.2',1)
          s=s.replace("const VERSION='0.9.1';","const VERSION='0.9.2';",1)

          old=".slx-rem-btn{width:30px;height:30px;border-radius:50%;border:1px solid #59616e;background:#202630;color:#e6edf5;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 2px 6px #0007}"
          new=".slx-rem-btn{width:22px!important;height:22px!important;min-width:22px!important;min-height:22px!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:inherit!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:16px!important;line-height:1!important;box-shadow:none!important;vertical-align:middle!important;-webkit-tap-highlight-color:transparent!important}"
          if old not in s:
              raise SystemExit('reminder CSS anchor not found')
          s=s.replace(old,new,1)

          a=s.index('function iconButton(')
          b=s.index('function syncReminderIcons()',a)
          new_fn='''function iconButton(id,text,title,fn){\n const native=document.getElementById(IDS.native);\n let b;\n if(native){\n  b=native.cloneNode(true);\n  b.removeAttribute('href');b.removeAttribute('target');b.removeAttribute('aria-current');\n  b.removeAttribute('style');\n  b.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));\n  const span=b.querySelector('.slxs-skull')||b.querySelector('span')||b;\n  span.textContent=text;\n  span.style.cssText='font-size:16px!important;line-height:1!important;min-width:18px!important;min-height:18px!important;display:flex!important;align-items:center!important;justify-content:center!important;color:inherit!important;';\n }else{\n  b=document.createElement('button');b.type='button';b.textContent=text;\n }\n b.id=id;b.classList.add('slx-rem-btn');b.title=title;b.setAttribute('aria-label',title);b.onclick=e=>{e.preventDefault();e.stopPropagation();fn()};return b\n}\n'''
          s=s[:a]+new_fn+s[b:]
          p.write_text(s,encoding='utf-8')

          d=Path('greasyfork/SakaLuX-Suite.md')
          t=d.read_text(encoding='utf-8')
          t=t.replace('**v0.9.1**','**v0.9.2**',1)
          if '### v0.9.2 — native resource-row icon styling' not in t:
              t += '\n\n### v0.9.2 — native resource-row icon styling\n- Reduced Reminder icons to native resource-row scale.\n- Removed the oversized circular button background/border/shadow.\n- Reminder controls now clone the existing SakaLuX/Torn resource-row control structure when available so spacing, alignment and hit-area integrate with the native row.\n- Kept a compact transparent fallback for PDA layouts where the native control is unavailable.\n'
          d.write_text(t,encoding='utf-8')
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.9.2
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m 'Match Suite reminder icons to Torn resource row in v0.9.2'
          git push origin HEAD:main

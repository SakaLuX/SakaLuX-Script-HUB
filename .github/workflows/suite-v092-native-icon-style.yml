name: Apply SakaLuX Suite v0.9.2 native icon styling
on:
  push:
    paths:
      - '.github/workflows/suite-v092-native-icon-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make reminder icons match Torn resource row
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('SakaLuX-Suite.user.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      0.9.1','// @version      0.9.2',1)
          s=s.replace("const VERSION='0.9.1';","const VERSION='0.9.2';",1)

          s,n=re.subn(r"\.slx-rem-btn\{.*?\}(?=\.slx-rem-btn:active)",
            ".slx-rem-btn{box-sizing:border-box!important;width:19px!important;height:19px!important;min-width:19px!important;min-height:19px!important;max-width:19px!important;max-height:19px!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:inherit!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:14px!important;font-weight:400!important;line-height:1!important;box-shadow:none!important;vertical-align:middle!important;overflow:visible!important;-webkit-appearance:none!important;appearance:none!important;-webkit-tap-highlight-color:transparent!important}",s,count=1)
          if n!=1: raise SystemExit('reminder CSS replacement failed')
          s=s.replace(".slx-rem-btn:active{transform:scale(.94)!important}",".slx-rem-btn:active{transform:scale(.92)!important;opacity:.8!important}",1)
          s=s.replace("height:23px!important;min-height:23px!important","height:19px!important;min-height:19px!important",1)
          s=s.replace("gap:3px!important","gap:4px!important",1)

          a=s.index('function iconButton(')
          b=s.index('function syncReminderIcons()',a)
          new_fn='''function iconButton(id,text,title,fn){\n const native=document.getElementById(IDS.native);\n let b;\n if(native){\n  b=native.cloneNode(true);\n  b.removeAttribute('href');b.removeAttribute('target');b.removeAttribute('aria-current');b.removeAttribute('style');\n  b.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));\n  const span=b.querySelector('.slxs-skull')||b.querySelector('span')||b;\n  span.textContent=text;\n  span.style.cssText='font-size:14px!important;line-height:1!important;min-width:16px!important;min-height:16px!important;width:16px!important;height:16px!important;display:flex!important;align-items:center!important;justify-content:center!important;color:inherit!important;';\n }else{\n  b=document.createElement('button');b.type='button';b.textContent=text;\n }\n b.id=id;b.classList.add('slx-rem-btn');b.title=title;b.setAttribute('aria-label',title);b.onclick=e=>{e.preventDefault();e.stopPropagation();fn()};return b\n}\n'''
          s=s[:a]+new_fn+s[b:]
          p.write_text(s,encoding='utf-8')

          d=Path('greasyfork/SakaLuX-Suite.md')
          t=d.read_text(encoding='utf-8')
          t=t.replace('**v0.9.1**','**v0.9.2**',1)
          if '### v0.9.2 — native resource-row icon styling' not in t:
              t += '\n\n### v0.9.2 — native resource-row icon styling\n- Reduced Daily Prayer Bell, Recovery Planner and Chain Alarm controls to native resource-row scale.\n- Removed the oversized circular background, border and shadow.\n- Reminder controls clone the existing SakaLuX/Torn resource-row control structure when available, so spacing and alignment match the surrounding row.\n- Kept only a compact transparent PDA fallback when the native row is unavailable.\n'
          d.write_text(t,encoding='utf-8')
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.9.2
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m 'Match Suite reminder icons to Torn resource row in v0.9.2'
          git push origin HEAD:main

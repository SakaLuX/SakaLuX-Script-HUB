name: Test Priority 7 Suite Daily Progress
on:
  push:
    branches: [test/priority7-suite-daily-progress]
    paths:
      - 'SakaLuX-Suite.user.js'
      - 'greasyfork/SakaLuX-Suite.md'
      - '.github/scripts/priority7_suite_daily_progress.py'
      - 'tests/suite-daily-progress-regression.cjs'
      - 'tests/suite-modules-regression.cjs'
      - '.github/workflows/test-priority7-suite-daily-progress.yml'
permissions:
  contents: write
concurrency:
  group: priority7-suite-daily-progress
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/priority7-suite-daily-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Priority 7 migration
        run: python3 .github/scripts/priority7_suite_daily_progress.py
      - name: Install DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Syntax check Suite
        run: node --check SakaLuX-Suite.user.js
      - name: Run Daily Progress regression
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/suite-daily-progress-regression.cjs
      - name: Run existing Suite module regression
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/suite-modules-regression.cjs
      - name: Verify migration idempotency
        run: |
          sha256sum SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md > "$RUNNER_TEMP/before.sha"
          python3 .github/scripts/priority7_suite_daily_progress.py
          sha256sum SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md > "$RUNNER_TEMP/after.sha"
          diff -u "$RUNNER_TEMP/before.sha" "$RUNNER_TEMP/after.sha"
      - name: Commit generated Suite update
        run: |
          if git diff --quiet -- SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md; then
            echo 'Generated files already synchronized.'
            exit 0
          fi
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m 'Add Suite Daily Progress Dashboard v0.9.939'
          git push origin HEAD:test/priority7-suite-daily-progress

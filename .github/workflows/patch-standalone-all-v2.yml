name: Patch standalone dock consistency v2
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-standalone-all-v2.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_standalone_all_v2.py
      - name: Validate
        run: |
          grep -q '@version      1.3.33' SakaLuX-Enhancer-Guard.user.js
          grep -q '@version      5.3.23' SakaLuX-Bazaar-Thanker-PDA.user.js
          grep -q '@version      1.0.20' SakaLuX-Mission-Rewards.user.js
          grep -q '@version      1.17.21' SakaLuX-Market-Intelligence.user.js
          grep -q '@version      1.8.17' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q '@version      1.3.4' SakaLuX-Account-Auditor.user.js
          grep -q "const rank=id=>" SakaLuX-Enhancer-Guard.user.js
          grep -q "company-intelligence" SakaLuX-Mission-Rewards.user.js
          grep -q "sakalux-account-auditor-standalone-dock" SakaLuX-Account-Auditor.user.js
          python -m json.tool scripts.json >/dev/null
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          node --check SakaLuX-Account-Auditor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Enhancer-Guard.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js SakaLuX-Account-Auditor.user.js scripts.json greasyfork/Enhancer-Guard.md greasyfork/Bazaar-Thanker.md greasyfork/Mission-Rewards.md greasyfork/Market-Intelligence.md greasyfork/Company-Intelligence.md greasyfork/Account-Auditor.md
          git commit -m 'Standardize standalone dock across SakaLuX scripts'
          git push

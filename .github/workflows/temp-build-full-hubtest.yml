name: Build full Hub TEST
on:
  push:
    paths:
      - '.github/workflows/temp-build-full-hubtest.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build full test Hub
        run: python .github/build_full_hubtest.py
      - name: Validate JavaScript
        run: node --check hubtest.user.js
      - name: Commit Hub TEST only
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add hubtest.user.js
          git commit -m 'Build full Hub TEST with forced launcher' || exit 0
          git push origin HEAD:main

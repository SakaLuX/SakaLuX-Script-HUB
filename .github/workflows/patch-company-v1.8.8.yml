name: Patch Company Intelligence v1.8.8
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-company-v1.8.8.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_company_1_8_8.py
      - name: Validate
        run: |
          grep -q '@version      1.8.8' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q "version:'1.8.8'" SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q 'function positionLabel' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q 'History samples' SakaLuX-Company-Intelligence-v1.0.0.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js greasyfork/Company-Intelligence.md
          git commit -m 'Company Intelligence v1.8.8: fix position labels and star direction semantics'
          git push

name: Fix Suite OC store v0.9.935
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_suite_oc_store_v0935.py'
      - '.github/workflows/fix-suite-oc-store-v0935.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply OC store fix
        run: python3 .github/scripts/fix_suite_oc_store_v0935.py
      - name: Validate Suite syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Assert OC store fix
        run: |
          grep -q '@version      0.9.935' SakaLuX-Suite.user.js
          grep -q 'const saved = loadLS(STAGE_SCAN_STATE_KEY) || {};' SakaLuX-Suite.user.js
          grep -q 'saveLS(STAGE_SCAN_STATE_KEY, stateValue);' SakaLuX-Suite.user.js
          ! grep -A6 'function readStageScanState' SakaLuX-Suite.user.js | grep -q 'store.get'
          ! grep -A6 'function writeStageScanState' SakaLuX-Suite.user.js | grep -q 'store.set'
          grep -q 'v0.9.935 — OC scan state storage fix' greasyfork/SakaLuX-Suite.md
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Fix Suite OC scan store reference"
          git push

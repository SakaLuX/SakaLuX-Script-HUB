name: Fix Mission Hints mobile layout v1.0.21

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mission-hints-mobile-1021.yml'
      - '.migration/fix-mission-hints-mobile-1021.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile hints fix
        run: python .migration/fix-mission-hints-mobile-1021.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Script-Hub.user.js
          grep -q '^// @version      1.0.21$' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.0.21';" SakaLuX-Mission-Rewards.user.js
          grep -q '"version": "1.0.21"' scripts.json
          grep -q 'findMobileActiveMissionHost' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.9.35';" SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit synchronized fix
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js scripts.json SakaLuX-Script-Hub.user.js greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Mission Hints on TornPDA mobile layout v1.0.21 [skip ci]'
          git push

name: Normalize SakaLuX Info Release docs

on:
  push:
    paths:
      - 'tools/normalize_info_release.py'
      - '.github/workflows/normalize-info-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize GreasyFork Info Release pages
        run: python3 tools/normalize_info_release.py

      - name: Remove one-time normalizer
        run: |
          rm -f tools/normalize_info_release.py
          rm -f .github/workflows/normalize-info-release.yml

      - name: Commit normalized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize Info Release documentation"
          git push origin HEAD:main

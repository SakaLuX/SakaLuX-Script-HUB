name: Patch experimental Stock Manager v0.5.6
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v056.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare patch helper
        run: python .github/scripts/fix_patch_experimental_stock_v056_helper.py
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v056.py
      - name: Validate
        run: |
          grep -q '@version      0.5.6' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.5.6'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function stockRowQuickTrade' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function stockRowBenefitProgress' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'data-row-quick-buy' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'slx-row-progress' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.5.6' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.5.6 quick row trades and benefit progress'
          git pull --rebase origin main
          git push

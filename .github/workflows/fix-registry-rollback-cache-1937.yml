name: Fix Hub registry rollback cache v1.9.37

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-registry-rollback-cache-1937.yml'
      - '.migration/fix-registry-rollback-cache-1937.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply registry cache fix
        run: python .migration/fix-registry-rollback-cache-1937.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q '^// @version      1.9.37$' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.37';" SakaLuX-Script-Hub.user.js
          grep -q "updates: 'SakaLuX_HUB_UPDATES_V18'" SakaLuX-Script-Hub.user.js
          grep -q "registry: 'SakaLuX_HUB_REGISTRY_V20'" SakaLuX-Script-Hub.user.js
          grep -q '"version": "1.0.18"' scripts.json
          python -m json.tool scripts.json >/dev/null
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix stale registry rollback cache v1.9.37 [skip ci]'
          git push

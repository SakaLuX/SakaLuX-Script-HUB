name: Patch experimental Stock Manager v0.4.2
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v042.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v042.py
      - name: Validate
        run: |
          grep -q '@version      0.4.2' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.4.2'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SLX_STOCK_PANIC_FALLBACK' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SLX_STOCK_PANIC_KEEP_CASH' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SLX_STOCK_PANIC_MAX_SPEND' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SLX_STOCK_PANIC_USE_ALL' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'resolvePanicPreview' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Preview PANIC' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Fallback target' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.4.2' experimental/Stock-Manager-Advisor.md
          test "$(grep -c 'function panic()' experimental/SakaLuX-Stock-Manager-Advisor.user.js)" -eq 1
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.4.2 Panic v2'
          git push

name: Test Priorities 8 and 9
on:
  push:
    branches: [test/priority8-9-audit-release]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Account Auditor Priority 8 migration
        run: python3 .github/scripts/apply_priority8_auditor_changes.py
      - name: Synchronize strict release documentation
        run: python3 .github/scripts/apply_priority9_doc_sync.py
      - name: Install repository validation dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Validate Account Auditor changes
        run: |
          node --check SakaLuX-Account-Auditor.user.js
          node tests/account-auditor-changes-regression.cjs
      - name: Run strict release preflight for all scripts
        id: preflight
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/release_preflight.py --all 2>&1 | tee priority9-preflight-report.txt
      - name: Upload preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority9-preflight-diagnostics
          path: priority9-preflight-report.txt
          if-no-files-found: error
      - name: Build Account Auditor release candidate package
        if: steps.preflight.outcome == 'success'
        run: |
          python3 tools/release_preflight.py --id account-auditor --out "$RUNNER_TEMP/releases"
          test -f "$RUNNER_TEMP/releases/account-auditor-v1.3.24/SHA256SUMS"
          test -f "$RUNNER_TEMP/releases/account-auditor-v1.3.24/RELEASE_INFO.md"
          test -f "$RUNNER_TEMP/releases/account-auditor-v1.3.24/release-manifest.json"
          (cd "$RUNNER_TEMP/releases/account-auditor-v1.3.24" && sha256sum -c SHA256SUMS)
      - name: Run current repository validator
        if: steps.preflight.outcome == 'success'
        run: python3 .github/scripts/validate_repository.py
      - name: Persist generated Priority 8-9 changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Account-Auditor.user.js greasyfork/*.md priority9-preflight-report.txt
          if git diff --cached --quiet; then
            echo "No generated changes or diagnostics to commit."
          else
            git commit -m "Synchronize Priority 8-9 release state"
            git push
          fi
      - name: Fail if strict preflight failed
        if: steps.preflight.outcome != 'success'
        run: |
          cat priority9-preflight-report.txt
          exit 1

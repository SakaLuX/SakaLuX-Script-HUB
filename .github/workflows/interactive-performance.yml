name: Interactive performance audit
on:
  push:
    branches: [main]
    paths: ['tests/performance/interactive.cjs', '.github/workflows/interactive-performance.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  interactive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.62.1 --no-audit --no-fund
          "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify production Stocks network recovery
        run: node tests/performance/stocks-network-regression.cjs --assert
      - name: Exercise actual panels, switches, search and maximize
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
        run: node tests/performance/interactive.cjs
      - name: Preserve measured findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/extended-performance-2026-09-18/interactive.json reports/extended-performance-2026-09-18/stocks-network.json
          git commit -m 'Record actual panel lifecycle and Stocks synthetic network measurements'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload complete interactive findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-performance-findings
          path: reports/extended-performance-2026-09-18/

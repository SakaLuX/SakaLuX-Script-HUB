name: Update Bounty Hunter v0.4.1
on:
  push:
    paths:
      - '.github/workflows/update-bounty-hunter-v041.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Bounty Hunter footer
        run: python .github/scripts/update_bounty_hunter_v041.py
      - name: Syntax check
        run: node --check SakaLuX-Bounty-Hunter.user.js
      - name: Verify release
        run: |
          grep -q '@version      0.4.1' SakaLuX-Bounty-Hunter.user.js
          grep -q "const VERSION='0.4.1'" SakaLuX-Bounty-Hunter.user.js
          grep -q 'SEND MONEY' SakaLuX-Bounty-Hunter.user.js
          grep -q 'SEND ITEMS' SakaLuX-Bounty-Hunter.user.js
          grep -q 'Made with ❤️ by' SakaLuX-Bounty-Hunter.user.js
          grep -q 'ensureBountyFooter' SakaLuX-Bounty-Hunter.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bounty-Hunter.user.js scripts.json CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'Update Bounty Hunter to v0.4.1 with SakaLuX footer'
          git push

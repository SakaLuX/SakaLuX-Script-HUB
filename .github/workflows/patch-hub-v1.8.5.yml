name: Patch Hub v1.8.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-hub-v1.8.5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Hub and release notes
        shell: python
        run: |
          from pathlib import Path

          hub_path = Path('SakaLuX-Script-Hub.user.js')
          hub = hub_path.read_text(encoding='utf-8')
          assert '// @version      1.8.4' in hub
          assert "const VERSION = '1.8.4';" in hub
          assert 'function isUpdateCacheFresh(id)' in hub

          hub = hub.replace('// @version      1.8.4', '// @version      1.8.5', 1)
          hub = hub.replace("const VERSION = '1.8.4';", "const VERSION = '1.8.5';", 1)

          changelog_anchor = "    const HUB_CHANGELOG = [\n        {\n            version: '1.8.4',"
          changelog_new = "    const HUB_CHANGELOG = [\n        {\n            version: '1.8.5',\n            date: '2026-08-24',\n            changes: [\n                'Fixed false UPDATE AVAILABLE states caused by a cached check from an older installed add-on version.',\n                'Update cache freshness now also requires the cached installed version to match the version currently loaded.',\n                'Update badges and counters are recalculated from Latest versus the currently installed version before rendering.',\n                'Added Market Intelligence v1.1.1 to the offline fallback registry and its ready-event refresh hook.'\n            ]\n        },\n        {\n            version: '1.8.4',"
          assert changelog_anchor in hub
          hub = hub.replace(changelog_anchor, changelog_new, 1)

          old_cache = """    function isUpdateCacheFresh(id) {
        const data = updateCache[id];
        return Boolean(data?.checkedAt && Date.now() - Number(data.checkedAt) < UPDATE_CACHE_TIME);
    }

    async function checkScriptUpdate(script, force = false) {
        if (!force && isUpdateCacheFresh(script.id)) return updateCache[script.id];
"""
          new_cache = """    function isUpdateCacheFresh(script) {
        const data = updateCache[script.id];
        const installed = getInstalledVersion(script);
        return Boolean(
            data?.checkedAt &&
            Date.now() - Number(data.checkedAt) < UPDATE_CACHE_TIME &&
            String(data.installed || '') === String(installed || '')
        );
    }

    function normalizeCachedUpdate(script) {
        const data = updateCache[script.id];
        if (!data) return null;
        const installed = getInstalledVersion(script);
        const latest = data.latest ? String(data.latest) : null;
        const available = Boolean(installed && latest && compareVersions(latest, installed) > 0);
        if (String(data.installed || '') !== String(installed || '') || Boolean(data.available) !== available) {
            updateCache[script.id] = { ...data, installed, latest, available };
            saveJson(STORAGE.updates, updateCache);
        }
        return updateCache[script.id];
    }

    async function checkScriptUpdate(script, force = false) {
        if (!force && isUpdateCacheFresh(script)) return normalizeCachedUpdate(script);
"""
          assert old_cache in hub
          hub = hub.replace(old_cache, new_cache, 1)

          old_state = """    function getUpdateState(script) {
        const installed = getInstalledVersion(script);
        const data = updateCache[script.id];
        if (!installed) return { state: 'missing', text: '⬇ ADD-ON NOT INSTALLED', data: data || null };
        if (!data) return { state: 'unknown', text: 'NOT CHECKED', data: null };
        if (data.error) return { state: 'failed', text: 'CHECK FAILED', data };
        if (data.available) return { state: 'available', text: '⬆ UPDATE AVAILABLE', data };
        return { state: 'current', text: '✓ UP TO DATE', data };
    }

    function getUpdateCount() {
        return SCRIPTS.filter(s => getInstalledVersion(s) && updateCache[s.id]?.available).length;
    }
"""
          new_state = """    function getUpdateState(script) {
        const installed = getInstalledVersion(script);
        const data = normalizeCachedUpdate(script);
        if (!installed) return { state: 'missing', text: '⬇ ADD-ON NOT INSTALLED', data: data || null };
        if (!data) return { state: 'unknown', text: 'NOT CHECKED', data: null };
        if (data.error) return { state: 'failed', text: 'CHECK FAILED', data };
        if (data.available) return { state: 'available', text: '⬆ UPDATE AVAILABLE', data };
        return { state: 'current', text: '✓ UP TO DATE', data };
    }

    function getUpdateCount() {
        return SCRIPTS.filter(script => Boolean(normalizeCachedUpdate(script)?.available)).length;
    }
"""
          assert old_state in hub
          hub = hub.replace(old_state, new_state, 1)

          fallback_anchor = """            {
                id: 'mission-rewards', type: 'addon', active: true,
                name: 'Mission Rewards', icon: '🎯', category: 'Missions', version: '1.0.1',
                description: 'Mission Shop reward values, value per credit, ammo ownership and weapon mod tracking.',
                greasyForkId: '592711',
                metaUrl: 'https://update.greasyfork.org/scripts/592711/SakaLuX%20Mission%20Rewards.meta.js',
                downloadUrl: 'https://update.greasyfork.org/scripts/592711/SakaLuX%20Mission%20Rewards.user.js',
                apiGlobal: 'SakaLuXMissionRewards', buttonSelector: '#sl-mri-button',
                quickActions: [
                    { id: 'open', label: 'SETTINGS', icon: '⚙️', method: 'open', fallbackUrl: 'https://www.torn.com/page.php?sid=missions' },
                    { id: 'refresh', label: 'REFRESH', icon: '🔄', method: 'refresh', fallbackUrl: 'https://www.torn.com/page.php?sid=missions' },
                    { id: 'missions', label: 'MISSIONS', icon: '🎯', method: 'goToMissions', fallbackUrl: 'https://www.torn.com/page.php?sid=missions' }
                ]
            }
"""
          fallback_new = fallback_anchor[:-2] + ",\n            {\n                id: 'market-intelligence', type: 'addon', active: true,\n                name: 'Market Intelligence', icon: '📈', category: 'Trading', version: '1.1.1',\n                description: 'Market and travel intelligence with clickable Best Travel Run routes, stock/restock ETA, Bazaar deals, Item Market watchlist, Items, Museum and Points Market support.',\n                greasyForkId: '592781',\n                metaUrl: 'https://update.greasyfork.org/scripts/592781/SakaLuX%20Market%20Intelligence.meta.js',\n                downloadUrl: 'https://update.greasyfork.org/scripts/592781/SakaLuX%20Market%20Intelligence.user.js',\n                apiGlobal: 'SakaLuXMarketIntelligence', buttonSelector: '#sl-mi-button',\n                quickActions: [\n                    { id: 'open', label: 'SETTINGS', icon: '⚙️', method: 'open' },\n                    { id: 'refresh', label: 'REFRESH', icon: '🔄', method: 'refresh' },\n                    { id: 'best-run', label: 'BEST RUN', icon: '✈️', method: 'goToBestRun', fallbackUrl: 'https://www.torn.com/page.php?sid=travel' },\n                    { id: 'market', label: 'MARKET', icon: '📈', method: 'goToMarket', fallbackUrl: 'https://www.torn.com/page.php?sid=ItemMarket' }\n                ]\n            }\n"
          assert fallback_anchor in hub
          hub = hub.replace(fallback_anchor, fallback_new, 1)

          ready_anchor = "    window.addEventListener('SakaLuX:MissionRewardsReady', () => { queueEnsure(); renderList(); renderMainStats(); });\n"
          ready_new = ready_anchor + "    window.addEventListener('SakaLuX:MarketIntelligenceReady', () => { queueEnsure(); renderList(); renderMainStats(); });\n"
          assert ready_anchor in hub
          hub = hub.replace(ready_anchor, ready_new, 1)

          hub_path.write_text(hub, encoding='utf-8')

          info_path = Path('UPDATE-INFO.md')
          info = info_path.read_text(encoding='utf-8')
          info = info.replace('- SakaLuX Script Hub: **v1.8.4**', '- SakaLuX Script Hub: **v1.8.5**', 1)
          latest_anchor = '## Latest changes\n\n'
          section = """### SakaLuX Script Hub v1.8.5
- Fixed false **UPDATE AVAILABLE** states left behind by a cached check made before an add-on was updated.
- Cached update data is now considered fresh only when its recorded installed version still matches the version currently loaded.
- Hub cards, the UPDATES counter and the blinking HUB alert recalculate availability from Latest versus Installed before rendering.
- Added Market Intelligence v1.1.1 to the offline fallback registry and its ready-event integration.
- Added exact backup: `backups/SakaLuX-Script-Hub-v1.8.4.user.js`.

"""
          assert latest_anchor in info
          info = info.replace(latest_anchor, latest_anchor + section, 1)
          if '- `backups/SakaLuX-Script-Hub-v1.8.4.user.js`' not in info:
              info = info.replace('## Backups available\n\n', '## Backups available\n\n- `backups/SakaLuX-Script-Hub-v1.8.4.user.js`\n', 1)
          info_path.write_text(info, encoding='utf-8')

          gf_path = Path('greasyfork/Script-Hub.md')
          gf = gf_path.read_text(encoding='utf-8')
          gf = gf.replace('**Current version: v1.8.4**', '**Current version: v1.8.5**', 1)
          version_anchor = '## v1.8.4\n'
          gf_section = """## v1.8.5

- Fixed false **UPDATE AVAILABLE** indicators after an add-on has already been updated.
- Update cache validity now includes the installed add-on version, not just the 24-hour timestamp.
- UPDATES counter and HUB alert badge now recalculate from Latest vs Installed before rendering.
- Added Market Intelligence v1.1.1 to the offline fallback registry.

"""
          assert version_anchor in gf
          gf = gf.replace(version_anchor, gf_section + version_anchor, 1)
          gf_path.write_text(gf, encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          grep -q '@version      1.8.5' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.8.5'" SakaLuX-Script-Hub.user.js
          grep -q 'normalizeCachedUpdate' SakaLuX-Script-Hub.user.js
          grep -q 'SakaLuX:MarketIntelligenceReady' SakaLuX-Script-Hub.user.js
          grep -q 'SakaLuX Script Hub: **v1.8.5**' UPDATE-INFO.md
          grep -q 'Current version: v1.8.5' greasyfork/Script-Hub.md

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Script-Hub.user.js UPDATE-INFO.md greasyfork/Script-Hub.md
          git commit -m 'SakaLuX Script Hub v1.8.5: fix stale update status'
          git push origin main

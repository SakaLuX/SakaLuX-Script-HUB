name: Patch experimental stock direct panic
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-direct-panic.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_direct_panic.py
      - name: Validate
        run: |
          grep -q '@version      0.2.0' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.2.0'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'syncStockCatalog' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'await vault({keep:parseAmount(get(K.keep' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          ! grep -A12 'async function panic()' experimental/SakaLuX-Stock-Manager-Advisor.user.js | grep -q 'location.href=APP.stocksUrl'
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.2.0' experimental/Stock-Manager-Advisor.md
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.2.0 direct Panic buy'
          git push

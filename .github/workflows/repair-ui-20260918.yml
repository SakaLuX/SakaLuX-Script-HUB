name: One-shot UI repair 20260918

on:
  push:
    paths:
      - '.github/repair-ui-20260918.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_stocks_mission_company_ui.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js scripts.json greasyfork/ backups/stocks-mission-company-ui-2026-09-18/
          git commit -m 'Stocks v0.7.14 Mission v1.0.38 Company v1.8.32 UI fixes'
          git push

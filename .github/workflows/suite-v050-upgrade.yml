name: One-time SakaLuX Suite v0.5.0 upgrade
on:
  push:
    paths: ['.github/workflows/suite-v050-upgrade.yml']
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Suite modules
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('SakaLuX-Suite.user.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('// @version      0.4.1','// @version      0.5.0').replace("const VERSION='0.4.1';","const VERSION='0.5.0';")
          s=s.replace('// @grant        none','// @grant        GM_xmlhttpRequest\n// @connect      api.torn.com')
          s=s.replace("desc:'Daily UTC prayer cue that hides after prayer until the next Torn day.'","desc:'Daily prayer cue with UTC reset, Torn Church shortcut and automatic success detection.'")
          s=s.replace("desc:'Visible-life and hospital recovery recommendations with configurable priorities.'","desc:'HP and hospital recovery advisor with configurable medical bonuses and priorities.'")
          s=s.replace("desc:'Compact purpose markers for useful items, OC gear, boosters and enhancers.'","desc:'Smart purpose markers for OC gear, crime tools, boosters, medical items and enhancers.'")
          s=s.replace("desc:'Search, categories, counts and locally saved Torn events.'","desc:'Searchable event intelligence with categories, counts and locally saved events.'")
          s=s.replace("desc:'Keeps visible chain count/timer in a compact warning panel when detected.'","desc:'Floating chain timer with warning thresholds, drag support and critical alerts.'")
          s=s.replace("desc:'Compact activity, hospital, travel and abroad status summary from visible faction rows.'","desc:'Faction member activity, hospital, travel and abroad status intelligence.'")
          s=s.replace("desc:'Highlights visible loaned/available armory entries and summarizes loan state.'","desc:'Scans faction armory loans, highlights loan state and saves a local snapshot.'")
          s=s.replace("desc:'Adds compact country markers to recognizable faction-member travel states.'","desc:'Country flags on faction members with editable local overrides and sorting.'")
          s=s.replace("desc:'Surfaces visible OC role weights, suitability and success clues without automating crimes.'","desc:'OC role suitability and visible success clues without automating crimes.'")
          s=s.replace("desc:'Warns about visible OC readiness gaps, missing roles/items and planning state.'","desc:'OC participation reminder with missing role/item readiness warnings.'")
          s=s.replace("desc:'Summarizes visible ranked-war results and local win/loss performance.'","desc:'Ranked-war performance analytics with local report snapshots and MVP signals.'")
          s=s.replace("desc:'Compact company-page overview for employees, stock, pricing, wages, trains and tax clues.'","desc:'Company overview with employee signals, snapshots, training log and price calculator.'")
          s=s.replace("desc:'Adds implied-probability hints to visible decimal sports-betting odds.'","desc:'Betting odds scanner with implied probability and market-margin hints.'")
          s=s.replace("desc:'Local race-result reader with F1-style points and a simple league table.'","desc:'Race result scanner with F1 points, persistent championships and duplicate protection.'")
          block=r'''function chainText(){const t=document.body.innerText||'',m=t.match(/chain[^0-9]{0,30}(\d[\d,]*)[\s\S]{0,80}?(\d{1,2}:\d{2}(?::\d{2})?)/i);return m?{count:m[1],time:m[2]}:null}
function chainSecs(x){if(!x)return 99999;const a=x.split(':').map(Number);return a.length===3?a[0]*3600+a[1]*60+a[2]:a[0]*60+a[1]}
function chainAlarm(){let p=document.getElementById('slx-chain-alarm-panel');if(!state['chain-alarm']){p?.remove();return}const c=chainText();if(!c){p?.remove();return}if(!p){p=document.createElement('div');p.id='slx-chain-alarm-panel';p.className='slx-suite-float';p.style.top='155px';p.style.width='190px';p.innerHTML='<div class="slx-float-head"><strong>⛓️ Chain Alarm</strong><button class="slxs-close">×</button></div><div class="slx-float-body"></div>';document.body.appendChild(p);p.querySelector('.slxs-close').onclick=()=>p.remove();let d=null,h=p.querySelector('.slx-float-head');h.onpointerdown=e=>{d={x:e.clientX-p.offsetLeft,y:e.clientY-p.offsetTop};h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(d){p.style.left=Math.max(0,e.clientX-d.x)+'px';p.style.top=Math.max(0,e.clientY-d.y)+'px';p.style.right='auto'}};h.onpointerup=()=>d=null}const sec=chainSecs(c.time);p.querySelector('.slx-float-body').innerHTML=`Chain: <b>${c.count}</b><br>Timer: <b style="color:${sec<=60?'#ff6b7b':sec<=120?'#e8bf67':'#8ee5b4'}">${c.time}</b>${sec<=120?'<br>⚠ Chain timer is low.':''}`;p.style.borderColor=sec<=60?'#db4455':sec<=120?'#b78b34':'#4a5260'}
function pagePanel(id,title,html){document.getElementById(id)?.remove();const a=document.querySelector('h1,h2')?.parentElement||document.querySelector('#mainContainer');if(!a)return;const p=document.createElement('div');p.id=id;p.className='slx-inline-panel';p.innerHTML=`<div class="slx-inline-top"><strong>${title}</strong></div><div class="slx-stat">${html}</div>`;a.prepend(p)}
function factionRows(){const o=[],seen=new Set;for(const e of document.querySelectorAll('tr,li,[class*="member"]')){const a=e.querySelector('a[href*="profiles.php"],a[href*="XID="]');if(!a)continue;const n=(a.textContent||'').trim(),t=(e.innerText||'').replace(/\s+/g,' ');if(!n||seen.has(n)||t.length>600)continue;seen.add(n);o.push({n,t,e,a,status:/hospital/i.test(t)?'Hospital':/travel|abroad/i.test(t)?'Travel':/jail/i.test(t)?'Jail':'Okay',act:/online/i.test(t)?'Online':/idle/i.test(t)?'Idle':/offline/i.test(t)?'Offline':'Unknown'})}return o}
function factionPulse(){document.getElementById('slx-faction-pulse')?.remove();if(!state['faction-pulse']||!/faction/i.test(location.href))return;const r=factionRows(),n=x=>r.filter(y=>y.status===x||y.act===x).length;if(r.length)pagePanel('slx-faction-pulse','📡 Faction Pulse',`Members: <b>${r.length}</b> · online: <b>${n('Online')}</b> · hospital: <b>${n('Hospital')}</b> · traveling: <b>${n('Travel')}</b> · offline: <b>${n('Offline')}</b>`)}
function armoryRadar(){document.getElementById('slx-armory-radar')?.remove();if(!state['armory-loan-radar']||!/(armory|armoury|faction)/i.test(location.href))return;const rows=[];for(const e of document.querySelectorAll('li,tr,[class*="item"]')){const t=(e.innerText||'').replace(/\s+/g,' ').trim();if(t.length>500||!/loaned|borrowed|available|returned/i.test(t))continue;const h=(t.match(/(?:loaned to|borrowed by)\s*:?\s*([A-Za-z0-9_\-\[\] ]{2,35})/i)||[])[1]||'';rows.push({t,h});e.style.outline=h?'1px solid #b44':'1px solid #285'}if(rows.length){localStorage.setItem('SakaLuX_SUITE_ARMORY_SCAN_V1',JSON.stringify({at:Date.now(),rows}));pagePanel('slx-armory-radar','🎒 Armory Loan Radar',`Matched: <b>${rows.length}</b> · currently loaned: <b>${rows.filter(x=>x.h).length}</b> · snapshot saved locally.`)}}
function travelMap(){document.querySelectorAll('.slx-country-tag').forEach(x=>x.remove());if(!state['member-travel-map']||!/faction/i.test(location.href))return;const ov=load('SakaLuX_SUITE_TRAVEL_OVERRIDES_V1',{});for(const r of factionRows()){const id=(r.a.href.match(/XID=(\d+)/)||[])[1]||r.n;let c=ov[id]||Object.keys(COUNTRY).find(x=>r.t.toLowerCase().includes(x));if(!c)continue;const s=document.createElement('span');s.className='slx-country-tag';s.textContent=' '+(COUNTRY[c]||'🌐');s.title='Country: '+c+' — tap to override';s.onclick=e=>{e.preventDefault();e.stopPropagation();const v=prompt('Country override (blank = automatic):',c);if(v===null)return;if(v.trim())ov[id]=v.trim().toLowerCase();else delete ov[id];save('SakaLuX_SUITE_TRAVEL_OVERRIDES_V1',ov);travelMap()};r.a.after(s)}}
function ocRoleMatch(){document.querySelectorAll('.slx-oc-match').forEach(x=>x.remove());if(!state['oc-role-match']||!/(crime|faction)/i.test(location.href))return;for(const e of document.querySelectorAll('li,tr,[class*="crime"],[class*="role"]')){const t=e.innerText||'';if(t.length>700||!/role|success|position/i.test(t))continue;const ps=[...t.matchAll(/([A-Za-z][A-Za-z \-]{2,25})\s*[:\-]?\s*(\d{1,3})\s*%/g)].map(m=>({n:m[1].trim(),p:+m[2]})).filter(x=>x.p<=100);if(!ps.length)continue;const b=ps.sort((a,b)=>b.p-a.p)[0],s=document.createElement('span');s.className='slx-oc-match slx-badge-mini';s.textContent=`BEST ${b.n} ${b.p}%`;s.title='Highest visible role suitability';e.appendChild(s)}}
function ocReadiness(){document.getElementById('slx-oc-ready')?.remove();if(!state['oc-readiness']||!/(crime|faction)/i.test(location.href))return;const t=document.body.innerText||'',no=/not (?:currently )?in an organized crime|not in an oc|join an organized crime/i.test(t),miss=(t.match(/missing|required item|vacant role|not ready/gi)||[]).length;if(no||miss)pagePanel('slx-oc-ready','✅ OC Readiness',`${no?'⚠ <b>Not in an active OC.</b> ':''}${miss?`Readiness warnings: <b>${miss}</b>`:'No visible readiness warning.'}`)}
function warPerformance(){document.getElementById('slx-war-performance')?.remove();if(!state['war-performance']||!/faction/i.test(location.href))return;const r=factionRows().map(x=>{const q=x.t.match(/respect[^0-9]{0,10}([\d,.]+)/i),h=x.t.match(/hits?[^0-9]{0,10}(\d+)/i);return{n:x.n,res:q?+q[1].replace(/,/g,''):0,h:h?+h[1]:0}}).filter(x=>x.res||x.h);if(!r.length)return;const z=[...r].sort((a,b)=>(b.res*10+b.h)-(a.res*10+a.h)),data=load('SakaLuX_SUITE_WAR_LEDGER_V1',{reports:[]});data.reports=[{at:Date.now(),url:location.href,rows:r},...(data.reports||[])].slice(0,20);save('SakaLuX_SUITE_WAR_LEDGER_V1',data);pagePanel('slx-war-performance','⚔️ War Performance',`Tracked: <b>${r.length}</b> · MVP signal: <b>${esc(z[0].n)}</b> (${z[0].res} respect / ${z[0].h} hits) · local report saved.`)}
function companyConsole(){document.getElementById('slx-company-console')?.remove();if(!state['company-console']||!/company/i.test(location.href))return;const t=document.body.innerText||'',emps=[...document.querySelectorAll('tr,li,[class*="employee"]')].filter(e=>/wage|position|employee|train/i.test(e.innerText||'')),inc=(t.match(/(?:income|revenue|profit)[^$]{0,20}\$([\d,]+)/i)||[])[1],tr=(t.match(/trains?[^0-9]{0,20}(\d+)/i)||[])[1];pagePanel('slx-company-console','🏢 Company Console',`Employee rows: <b>${emps.length}</b> · visible income: <b>${inc?'$'+inc:'—'}</b> · trains: <b>${tr||'—'}</b> · <button onclick="(()=>{const c=+prompt('Cost')||0,m=+prompt('Markup %','10')||0;alert('Suggested: $'+Math.round(c*(1+m/100)).toLocaleString())})()">PRICE CALC</button>`)}
function oddsScout(){document.querySelectorAll('.slx-odds-hint').forEach(x=>x.remove());if(!state['odds-scout']||!/(casino|bookie|sports)/i.test(location.href))return;for(const e of document.querySelectorAll('tr,li,[class*="bet"],[class*="market"]')){const t=(e.innerText||'').trim();if(t.length>700)continue;const o=[...t.matchAll(/(?:^|\s)([1-9]\d*(?:\.\d{1,3})?)(?=\s|$)/g)].map(m=>+m[1]).filter(x=>x>=1.01&&x<=1000);if(o.length<2)continue;const sum=o.reduce((a,x)=>a+100/x,0),s=document.createElement('span');s.className='slx-odds-hint slx-badge-mini';s.textContent=`MARGIN ${(sum-100).toFixed(1)}%`;s.title='Implied probabilities: '+o.map(x=>(100/x).toFixed(1)+'%').join(' / ');e.appendChild(s)}}
function raceLeague(){document.getElementById('slx-race-league')?.remove();if(!state['race-league-board']||!/race/i.test(location.href))return;const rows=[],seen=new Set;for(const e of document.querySelectorAll('tr,li,[class*="result"]')){const t=(e.innerText||'').trim().replace(/\s+/g,' '),m=t.match(/(?:^|\s)(\d{1,2})(?:st|nd|rd|th)?[.)\s-]+([A-Za-z0-9_\-\[\] ]{2,35})/i);if(m&&+m[1]<=30&&!seen.has(m[1]+'|'+m[2])){seen.add(m[1]+'|'+m[2]);rows.push({p:+m[1],n:m[2].trim()})}}if(rows.length<2)return;const pts=[25,18,15,12,10,8,6,4,2,1],key=rows.map(x=>x.p+':'+x.n).join('|'),d=load(K.race,{races:[],drivers:{}});if(!d.races.some(x=>x.key===key)){d.races.unshift({key,at:Date.now(),rows});for(const x of rows){d.drivers[x.n]??={pts:0,w:0,r:0};d.drivers[x.n].pts+=pts[x.p-1]||0;d.drivers[x.n].r++;if(x.p===1)d.drivers[x.n].w++}d.races=d.races.slice(0,100);save(K.race,d)}const z=Object.entries(d.drivers).sort((a,b)=>b[1].pts-a[1].pts).slice(0,10);pagePanel('slx-race-league','🏁 Race League Board',`Saved races: <b>${d.races.length}</b> · duplicate protection ON<br>${z.map(([n,v],i)=>`${i+1}. ${esc(n)} <b>${v.pts} pts</b> (${v.w} wins)`).join('<br>')}`)}
'''
          s=re.sub(r'function chainText\(\).*?(?=function applyModules\(\))',block,s,flags=re.S)
          s=s.replace("function applyModules(){\n syncReminderIcons();itemSignals();eventLens();chainAlarm();\n factionPulse();armoryRadar();travelMap();ocRoleMatch();ocReadiness();warPerformance();\n companyConsole();oddsScout();raceLeague();\n}","function applyModules(){syncReminderIcons();itemSignals();eventLens();chainAlarm();factionPulse();armoryRadar();travelMap();ocRoleMatch();ocReadiness();warPerformance();companyConsole();oddsScout();raceLeague();observePrayerSuccess()}")
          s=s.replace("new MutationObserver(scheduleScan).observe(document.body,{childList:true,subtree:true});","new MutationObserver(ms=>{if(ms.some(m=>[...m.addedNodes].some(n=>n.nodeType===1&&!String(n.id||'').startsWith('slx-')&&!String(n.className||'').includes('slx-'))))scheduleScan()}).observe(document.body,{childList:true,subtree:true});")
          if "const VERSION='0.5.0';" not in s or 'function factionRows()' not in s: raise SystemExit('Upgrade markers missing')
          p.write_text(s,encoding='utf-8')
          info=Path('greasyfork/SakaLuX-Suite.md'); t=info.read_text(encoding='utf-8').replace('v0.4.1','v0.5.0',1); t+='''\n\n### v0.5.0 — internal module functional upgrade\n- Upgraded all experimental internal modules from simple page counters to working local tools and scanners.\n- Chain Alarm now has a floating timer, warning thresholds and drag support.\n- Faction Pulse now parses member rows and statuses.\n- Armory Loan Radar stores local loan snapshots.\n- Member Travel Map adds editable local country overrides.\n- OC Role Match surfaces the strongest visible role suitability and OC Readiness warns about missing participation/readiness.\n- War Performance stores local report snapshots and MVP signals.\n- Company Console adds employee/income/train signals and a price calculator.\n- Odds Scout calculates implied probabilities and market margin.\n- Race League Board persists F1-style points across detected results with duplicate protection.\n- Added Torn API permission plumbing for the shared-key architecture; modules remain read-only/advisory.\n'''; info.write_text(t,encoding='utf-8')
      - name: Syntax check
        run: node --check SakaLuX-Suite.user.js
      - name: Commit
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Upgrade all SakaLuX Suite internal modules to v0.5.0"
          git push origin HEAD:main
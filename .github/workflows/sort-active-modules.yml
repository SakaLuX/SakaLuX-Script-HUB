name: Sort active modules alphabetically
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/sort_active_modules.py'
      - '.github/workflows/sort-active-modules.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python .github/scripts/sort_active_modules.py
      - run: node --check SakaLuX-Script-Hub.user.js
      - run: node --check SakaLuX-Suite.user.js
      - run: node tests/module-active-alpha-sort-regression.cjs
      - name: Commit release
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Script-Hub.user.js SakaLuX-Suite.user.js greasyfork/Script-Hub.md greasyfork/SakaLuX-Suite.md tests/module-active-alpha-sort-regression.cjs
          git commit -m 'Sort active modules alphabetically in Hub and Suite'
          git push

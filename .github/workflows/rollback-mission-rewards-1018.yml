name: One-time Mission Rewards v1.0.18 rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-mission-rewards-1018.yml'
      - '.migration/rollback-mission-rewards-1018.py'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .migration/rollback-mission-rewards-1018.py
      - name: Validate rollback
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
          grep -q '@version      1.0.18' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.0.18';" SakaLuX-Mission-Rewards.user.js
          grep -q '@version      1.9.44' SakaLuX-Script-Hub.user.js
          grep -q '"version": "1.0.18"' scripts.json
          ! grep -q 'SakaLuX Mission Guide — isolated UI layer' SakaLuX-Mission-Rewards.user.js
          ! grep -q 'const MISSION_GUIDE' SakaLuX-Mission-Rewards.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rollback Mission Rewards to stable v1.0.18 [skip ci]'
          git push

# triggered 2026-09-13

name: Sync Stocks documentation
on:
  push:
    paths:
      - '.github/workflows/temp-stock-md-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/fix_stock_md.py
      - run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add greasyfork/Stock-Manager-Advisor.md
          git commit -m 'Sync Stocks v0.7.8 documentation' || exit 0
          git push origin HEAD:main

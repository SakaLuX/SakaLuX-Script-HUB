name: Fix Suite 0.9.941 control sync
on:
  push:
    branches: [fix/suite-0.9.941-control-sync]
    paths:
      - '.github/scripts/fix_suite_0941_control_sync.py'
      - '.github/workflows/fix-suite-0941-control-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python .github/scripts/fix_suite_0941_control_sync.py
      - run: node --check SakaLuX-Suite.user.js
      - run: node tests/suite-graffiti-hub-sync-regression.cjs
      - run: npm install --no-save --ignore-scripts jsdom
      - run: node tests/suite-modules-regression.cjs
      - name: Commit correction
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-graffiti-hub-sync-regression.cjs
          git commit -m 'Fix Suite v0.9.941 Master Control Hub sync'
          git push

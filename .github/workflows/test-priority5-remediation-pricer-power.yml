name: Test Priority 5 Remediation + Pricer Power
on:
  push:
    branches: [test/priority5-remediation-pricer-power]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply remediation and Pricer power migration
        run: python3 .github/scripts/apply_priority5_remediation_and_pricer_power.py
      - name: Install validation dependencies
        run: |
          python3 -m pip install PyYAML==6.0.3
          npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Validate migration
        run: |
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Bazaar-Smart-Pricer.user.js
          node tests/priority5-remediation-pricer-power-regression.cjs
          node tests/hub-health-status-regression.cjs
          node tests/hub-health-diagnostics-regression.cjs
          NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/hub-details-regression.cjs
          python3 .github/scripts/validate_repository.py
      - name: Commit generated v1.9.88 / v1.1.12 changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js SakaLuX-Bazaar-Smart-Pricer.user.js scripts.json greasyfork/Script-Hub.md greasyfork/Bazaar-Smart-Pricer.md
          git commit -m 'Add Hub remediation actions and global Pricer power control'
          git push

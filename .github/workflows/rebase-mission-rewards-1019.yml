name: One-time Mission Rewards v1.0.19 stable rebase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebase-mission-rewards-1019.yml'
      - '.migration/rebase-mission-rewards-1019.py'

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply stable rebase
        run: python .migration/rebase-mission-rewards-1019.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
          grep -q '@version      1.0.19' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.0.19';" SakaLuX-Mission-Rewards.user.js
          grep -q 'SakaLuX Mission Guide — isolated UI layer' SakaLuX-Mission-Rewards.user.js
          grep -q '@version      1.9.43' SakaLuX-Script-Hub.user.js
          grep -q '"version": "1.0.19"' scripts.json
          ! grep -q 'SakaLuX_MR_HUB_COMMAND' SakaLuX-Mission-Rewards.user.js
          ! grep -q 'HUB_HEARTBEAT' SakaLuX-Mission-Rewards.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          for f in README.md RELEASE-INFO.md release-info.md UPDATE-INFO.md; do [ -f "$f" ] && git add "$f" || true; done
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Rebase Mission Rewards on stable v1.0.18 runtime [skip ci]'
          git push

name: Performance Hub 1.9.52

on:
  push:
    paths:
      - '.github/scripts/perf_hub_modules_1952.py'
      - '.github/workflows/perf-hub-modules-1952.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply performance patch
        run: python .github/scripts/perf_hub_modules_1952.py
      - name: Validate syntax and registry
        run: |
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit optimization
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Market-Intelligence.user.js scripts.json greasyfork backups/hub-module-performance-2026-09-17
          git commit -m "perf: smooth Hub scrolling and fix mobile bottom actions"
          git push

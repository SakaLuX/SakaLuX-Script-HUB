name: Fix Market Mission footers and standalone audit

on:
  push:
    paths:
      - '.github/fix-footers-and-standalone-audit.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup current files
        shell: bash
        run: |
          set -euo pipefail
          B='backups/footer-standalone-audit-2026-09-17'
          mkdir -p "$B/greasyfork"
          for f in SakaLuX-*.user.js; do cp "$f" "$B/$f"; done
          cp scripts.json "$B/scripts.json"
          for f in greasyfork/Market-Intelligence.md greasyfork/Mission-Rewards.md; do cp "$f" "$B/greasyfork/$(basename "$f")"; done

      - name: Patch footers and standalone registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          # --- Market footer: show both standalone and when launched by Hub ---
          p=Path('SakaLuX-Market-Intelligence.user.js'); s=p.read_text()
          s=s.replace('// @version      1.17.37','// @version      1.17.38',1)
          s=s.replace("{version:'1.17.37'}","{version:'1.17.38'}",1)
          s=s.replace("const selector=\"#sl-mi-panel\",id=\"sakalux-inline-footer-market-intelligence\"", "const selector=\"#sl-mi-panel\",id=\"sakalux-inline-footer-market-intelligence\"", 1)
          s=s.replace("const panel=document.querySelector(selector);if(!panel||panel.closest('#sakalux-hub-overlay, #sakalux-hub-panel'))return;", "const panel=document.querySelector(selector);if(!panel)return;", 1)
          marker='/* SAKALUX_FORCE_FOOTER_V4_MARKET */'
          if marker not in s:
              s += r'''

/* SAKALUX_FORCE_FOOTER_V4_MARKET */
(()=>{
 const PANEL='#sl-mi-panel',ID='sakalux-inline-footer-market-intelligence',PROFILE='https://www.torn.com/profiles.php?XID=2380374';
 function ensure(){
  const panel=document.querySelector(PANEL); if(!panel)return;
  let f=panel.querySelector('#'+ID);
  if(!f){
   f=document.createElement('div'); f.id=ID;
   f.innerHTML='<div class="slh-bottom"><div class="slh-bottom-grid"><button type="button" class="slh-bottom-btn" data-slx-donate>💸 SEND MONEY</button><button type="button" class="slh-bottom-btn" data-slx-donate>🎁 SEND ITEMS</button></div></div><div class="slh-footer">Made with ❤️ by <a class="slh-author" href="'+PROFILE+'">SakaLuX [2380374]</a></div>';
   f.querySelectorAll('[data-slx-donate]').forEach(b=>b.onclick=()=>{location.href=PROFILE});
   panel.appendChild(f);
  }
 }
 const kick=()=>{ensure();requestAnimationFrame(ensure);setTimeout(ensure,80);setTimeout(ensure,250)};
 new MutationObserver(rs=>{if(rs.some(r=>[...r.addedNodes].some(n=>n.nodeType===1&&(n.matches?.(PANEL)||n.querySelector?.(PANEL)))))kick()}).observe(document.documentElement,{childList:true,subtree:true});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',kick,{once:true});else kick();
})();
'''
          p.write_text(s)

          # --- Mission footer: previous selector was wrong (#sl-mr-settings). Real panel is #sl-mr-settings-panel. ---
          p=Path('SakaLuX-Mission-Rewards.user.js'); s=p.read_text()
          s=s.replace('// @version      1.0.36','// @version      1.0.37',1)
          s=s.replace("{version:'1.0.36'}","{version:'1.0.37'}",1)
          s=s.replace('const selector="#sl-mr-settings",id="sakalux-inline-footer-mission-rewards"','const selector="#sl-mr-settings-panel",id="sakalux-inline-footer-mission-rewards"',1)
          s=s.replace("const panel=document.querySelector(selector);if(!panel||panel.closest('#sakalux-hub-overlay, #sakalux-hub-panel'))return;", "const panel=document.querySelector(selector);if(!panel)return;", 1)
          marker='/* SAKALUX_FORCE_FOOTER_V4_MISSION */'
          if marker not in s:
              s += r'''

/* SAKALUX_FORCE_FOOTER_V4_MISSION */
(()=>{
 const PANEL='#sl-mr-settings-panel',ID='sakalux-inline-footer-mission-rewards',PROFILE='https://www.torn.com/profiles.php?XID=2380374';
 function ensure(){
  const panel=document.querySelector(PANEL); if(!panel)return;
  let f=panel.querySelector('#'+ID);
  if(!f){
   f=document.createElement('div'); f.id=ID;
   f.innerHTML='<div class="slh-bottom"><div class="slh-bottom-grid"><button type="button" class="slh-bottom-btn" data-slx-donate>💸 SEND MONEY</button><button type="button" class="slh-bottom-btn" data-slx-donate>🎁 SEND ITEMS</button></div></div><div class="slh-footer">Made with ❤️ by <a class="slh-author" href="'+PROFILE+'">SakaLuX [2380374]</a></div>';
   f.querySelectorAll('[data-slx-donate]').forEach(b=>b.onclick=()=>{location.href=PROFILE});
   panel.appendChild(f);
  }
 }
 const kick=()=>{ensure();requestAnimationFrame(ensure);setTimeout(ensure,80);setTimeout(ensure,250)};
 new MutationObserver(rs=>{if(rs.some(r=>[...r.addedNodes].some(n=>n.nodeType===1&&(n.matches?.(PANEL)||n.querySelector?.(PANEL)))))kick()}).observe(document.documentElement,{childList:true,subtree:true});
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',kick,{once:true});else kick();
})();
'''
          p.write_text(s)

          # --- Stock Manager: register globally on every Torn page so it appears in SakaLuX Scripts Standalone. ---
          p=Path('SakaLuX-Stock-Manager-Advisor.user.js'); s=p.read_text()
          s=s.replace('// @version      0.7.12','// @version      0.7.13',1)
          s=s.replace("version: '0.7.12'","version: '0.7.13'",1)
          marker='/* SAKALUX_STANDALONE_GLOBAL_REGISTRATION_STOCKS */'
          if marker not in s:
              s += r'''

/* SAKALUX_STANDALONE_GLOBAL_REGISTRATION_STOCKS */
(()=>{
 const mount=()=>{
  if(!document.body)return;
  let e=document.querySelector('[data-slx-standalone-registration="stock-manager-advisor"]');
  if(!e){e=document.createElement('span');e.hidden=true;e.setAttribute('data-slx-standalone-registration','stock-manager-advisor');document.body.appendChild(e);}
  Object.assign(e.dataset,{id:'stock-manager-advisor',name:'Stocks',icon:'📊',selector:'#sakalux-module-bridge-stock-manager-advisor',fallback:'https://www.torn.com/page.php?sid=stocks',version:'0.7.13'});
 };
 if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount,{once:true});
})();
'''
          p.write_text(s)

          # Canonical standalone order in every script that owns the shared dock. Do not touch Hub.
          canonical="const ORDER=['enhancer','bazaar','mission-rewards','market-intelligence','elimination-assistant','company-intelligence','chat-intelligence','stock-manager-advisor','account-auditor'];"
          for path in Path('.').glob('SakaLuX-*.user.js'):
              if path.name in {'SakaLuX-Script-Hub.user.js','SakaLuX-Suite.user.js','SakaLuX-Stock-Manager-Advisor.user.js'}: continue
              txt=path.read_text()
              if "const ORDER=['enhancer'" in txt:
                  txt=re.sub(r"const ORDER=\['enhancer'[^;]+;",canonical,txt,count=1)
                  path.write_text(txt)

          # Audit all primary SakaLuX scripts for standalone registration capability.
          expected={
            'SakaLuX-Account-Auditor.user.js':'account-auditor',
            'SakaLuX-Bazaar-Thanker-PDA.user.js':'bazaar',
            'SakaLuX-Chat-Intelligence.user.js':'chat-intelligence',
            'SakaLuX-Company-Intelligence-v1.0.0.user.js':'company-intelligence',
            'SakaLuX-Elimination-Assistant.user.js':'elimination-assistant',
            'SakaLuX-Enhancer-Guard.user.js':'enhancer',
            'SakaLuX-Market-Intelligence.user.js':'market-intelligence',
            'SakaLuX-Mission-Rewards.user.js':'mission-rewards',
            'SakaLuX-Stock-Manager-Advisor.user.js':'stock-manager-advisor',
          }
          rows=[]
          for fn,mid in expected.items():
              txt=Path(fn).read_text() if Path(fn).exists() else ''
              has=('data-slx-standalone-registration' in txt and mid in txt)
              rows.append((fn,mid,has))
          report=['# SakaLuX Standalone audit — 2026-09-17','', '| Script | Standalone ID | Status |','|---|---|---|']
          report += [f'| {fn} | `{mid}` | {"✅ present" if ok else "❌ missing"} |' for fn,mid,ok in rows]
          report += ['', 'Hub is intentionally excluded from the standalone dock. Suite keeps its own Master Control launcher.', '', 'Stock Manager is explicitly registered globally so its 📊 Stocks button can appear in SakaLuX Scripts Standalone on every Torn page.']
          Path('STANDALONE-AUDIT-2026-09-17.md').write_text('\n'.join(report)+'\n')
          missing=[fn for fn,mid,ok in rows if not ok]
          if missing:
              raise SystemExit('Standalone registration missing in: '+', '.join(missing))

          # Registry versions only; Hub source/version intentionally untouched.
          data=json.loads(Path('scripts.json').read_text())
          def walk(o):
              if isinstance(o,dict):
                  if o.get('id')=='market-intelligence': o['version']='1.17.38'
                  if o.get('id')=='mission-rewards': o['version']='1.0.37'
                  if o.get('id')=='stock-manager-advisor': o['version']='0.7.13'
                  for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(data); Path('scripts.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          # Docs
          for fn,old,new,note in [
            ('greasyfork/Market-Intelligence.md','1.17.37','1.17.38','Fixes the settings footer in both standalone and Hub-launched Market panels by removing the Hub suppression guard and force-mounting the Elimination-style SEND MONEY / SEND ITEMS + Made with ❤️ footer.'),
            ('greasyfork/Mission-Rewards.md','1.0.36','1.0.37','Fixes the Mission settings footer by targeting the real `#sl-mr-settings-panel` element and force-mounting the Elimination-style SEND MONEY / SEND ITEMS + Made with ❤️ footer in standalone and Hub-launched panels.')]:
              p=Path(fn); d=p.read_text(); d=d.replace(f'**v{old}**',f'**v{new}**',1); mark='## Current release note\n'; d=d.replace(mark,mark+f'\n**v{new}** {note}\n',1); p.write_text(d)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          python3 -m json.tool scripts.json >/dev/null
          grep -q 'SAKALUX_FORCE_FOOTER_V4_MARKET' SakaLuX-Market-Intelligence.user.js
          grep -q 'SAKALUX_FORCE_FOOTER_V4_MISSION' SakaLuX-Mission-Rewards.user.js
          grep -q 'stock-manager-advisor' STANDALONE-AUDIT-2026-09-17.md
          ! grep -q "@version      1.9.71" SakaLuX-Script-Hub.user.js

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-*.user.js scripts.json greasyfork/Market-Intelligence.md greasyfork/Mission-Rewards.md STANDALONE-AUDIT-2026-09-17.md backups/footer-standalone-audit-2026-09-17/
          git commit -m 'Fix Market/Mission footers and audit standalone scripts'
          git push

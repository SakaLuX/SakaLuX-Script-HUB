name: Verify Market Intelligence v1.16.0
on:
  push:
    paths:
      - '.github/workflows/lint-mi-v1.16.0.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check SakaLuX-Market-Intelligence.user.js
      - run: python -m json.tool scripts.json >/dev/null

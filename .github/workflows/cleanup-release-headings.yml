name: One-time release heading cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-release-headings.yml'
      - '.migration/cleanup-release-headings.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .migration/cleanup-release-headings.py
      - run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean duplicate release headings [skip ci]'
          git push

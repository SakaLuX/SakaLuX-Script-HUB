name: Test Shared Core v1

on:
  push:
    branches:
      - test/shared-core-v1
    paths:
      - src/core/sakalux-core.js
      - tools/embed-shared-core.cjs
      - tests/shared-core-v1-regression.cjs
      - tests/shared-core-api-broker-regression.cjs
      - tests/shared-core-v1-embedding.cjs
      - tests/shared-core-v1-compatibility.cjs
      - tests/shared-core-v1-all-scripts.cjs
      - tests/shared-core-v1-level2-audit.cjs
      - scripts.json
      - '**/*.user.js'
      - .github/workflows/test-shared-core-v1.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Shared Core
        run: node --check src/core/sakalux-core.js
      - name: Syntax check embedding helper
        run: node --check tools/embed-shared-core.cjs
      - name: Syntax check compatibility tests
        run: |
          node --check tests/shared-core-v1-compatibility.cjs
          node --check tests/shared-core-v1-all-scripts.cjs
          node --check tests/shared-core-v1-level2-audit.cjs
          node --check tests/shared-core-api-broker-regression.cjs
      - name: Run Shared Core regression suite
        run: node tests/shared-core-v1-regression.cjs
      - name: Run API Request Broker regression suite
        run: node tests/shared-core-api-broker-regression.cjs
      - name: Run Shared Core embedding/build test
        run: node tests/shared-core-v1-embedding.cjs
      - name: Run Market + Stocks compatibility test
        run: node tests/shared-core-v1-compatibility.cjs
      - name: Run every repository userscript compatibility test
        run: node tests/shared-core-v1-all-scripts.cjs
      - name: Audit level-2 shared duplication
        run: node tests/shared-core-v1-level2-audit.cjs

# Verifies the branch after repository-wide Core embedding, API broker regressions and level-2 duplication audit.

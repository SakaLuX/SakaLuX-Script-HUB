name: Stocks Advisor Upgrade 0.7.13
on:
  push:
    paths:
      - '.github/workflows/stocks-advisor-upgrade-0713.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Stocks module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('SakaLuX-Stock-Manager-Advisor.user.js')
          s=p.read_text()
          s=s.replace('// @version      0.7.12','// @version      0.7.13',1).replace("version: '0.7.12'","version: '0.7.13'",1)
          if "dailyCosts: 'SLX_STOCK_DAILY_COSTS'" not in s:
              s=s.replace("    txHistory: 'SLX_STOCK_TRANSACTION_HISTORY'\n", "    txHistory: 'SLX_STOCK_TRANSACTION_HISTORY',\n    dailyCosts: 'SLX_STOCK_DAILY_COSTS',\n    excludedStocks: 'SLX_STOCK_EXCLUDED_STOCKS',\n    bankPeriod: 'SLX_STOCK_BANK_PERIOD'\n",1)
          addon=r'''
  function excludedStocksSet() { return new Set(String(get(K.excludedStocks,'')).toUpperCase().split(/[\s,;]+/).map(v=>v.trim()).filter(Boolean)); }
  function stockIncomeSummary() {
    scanStocks(); const excluded=excludedStocksSet(); let grossDaily=0, active=0; const rows=[];
    for(const [sym] of S.stocks) { if(excluded.has(sym)) continue; const owned=ownedShares(sym); if(!owned) continue; const tier=benefitTier(sym,owned); if(!tier.tier) continue; const baseDaily=Math.max(0,Number(benefitDailyValue(sym))||0); if(!baseDaily) continue; const multiplier=BENEFITS[sym]?.type==='A'?Math.max(1,tier.tier):1; const daily=baseDaily*multiplier; grossDaily+=daily; active++; rows.push({sym,tier:tier.tier,daily}); }
    const costs=Math.max(0,parseAmount(get(K.dailyCosts,'0'))), netDaily=grossDaily-costs; return {grossDaily,costs,netDaily,monthly:netDaily*30,annual:netDaily*365,active,rows:rows.sort((a,b)=>b.daily-a.daily)};
  }
  async function sellTargetExcess() {
    scanStocks(); const sym=get(K.target).toUpperCase(); if(!sym) throw new Error('Choose a target stock first.'); const m=stockRowMetrics(sym); if(!m?.owned) throw new Error(`No ${sym} shares detected.`); const shares=Math.max(0,Math.floor(Number(m.freeShares)||0)); if(shares<=0) throw new Error(`${sym} has no excess shares above the protected benefit floor.`); const estimate=shares*Number(m.price||0); if(!confirm(`SELL EXCESS · ${sym}\n\n${shares.toLocaleString()} shares\nEstimated: ${money(estimate)}\nProtected after sale: ${Number(m.protectedShares||0).toLocaleString()} shares\n\nExecute now?`)) return; await postTrade(sym,shares,'sellShares'); inlineStatus(`${isDryRun()?'Dry Run · ':''}SELL EXCESS ${shares.toLocaleString()} ${sym} · ${money(estimate)}.`,'ok'); if(get(K.api).trim()&&!isDryRun()) await syncAllApi(); scanStocks(); enhanceStockRows(); refreshInlinePanel();
  }
  function renderIncomeAdvisor() {
    const box=$('#slx-stock-income-body'); if(!box) return; const x=stockIncomeSummary(); const bankApr=Math.max(0,Number(get(K.bankApr,'0'))||0); const period=get(K.bankPeriod,'3m'); const days=({1w:7,2w:14,1m:30,2m:60,3m:90}[period]||90); const market=buildPortfolioRows().reduce((n,r)=>n+r.value,0); const bankPeriodReturn=market>0&&bankApr>0?market*(bankApr/100)*(days/365):0; box.innerHTML=`<div class="optimizer-summary"><div><span>Gross / day</span><b>${money(x.grossDaily)}</b></div><div><span>Costs / day</span><b>${money(x.costs)}</b></div><div><span>Net / day</span><b class="${x.netDaily>=0?'good':'bad'}">${x.netDaily>=0?'+':'-'}${money(Math.abs(x.netDaily))}</b></div><div><span>Net / year</span><b>${x.netDaily>=0?'+':'-'}${money(Math.abs(x.annual))}</b></div></div><div class="api-help">${x.active} active valued benefit${x.active===1?'':'s'} · Net / 30d ${money(Math.max(0,x.monthly))}${bankApr?` · Bank ${period}: ${money(bankPeriodReturn)}`:''}</div>${x.rows.length?`<div class="optimizer-list">${x.rows.slice(0,12).map(r=>`<div class="optimizer-row"><div><b>${r.sym}</b><small>Tier ${r.tier}</small></div><div><span>${money(r.daily)}/day</span><small>${money(r.daily*365)}/yr</small></div></div>`).join('')}</div>`:''}`;
  }
  function bindAdvisorUpgradeControls() {
    const dc=$('#slx-daily-costs'); if(dc&&!dc.dataset.bound){dc.dataset.bound='1';dc.value=get(K.dailyCosts,'0');dc.onchange=()=>{set(K.dailyCosts,dc.value);renderIncomeAdvisor();};} const ex=$('#slx-excluded-stocks'); if(ex&&!ex.dataset.bound){ex.dataset.bound='1';ex.value=get(K.excludedStocks,'');ex.onchange=()=>{set(K.excludedStocks,ex.value.toUpperCase());renderAdvisor();renderOptimizer();renderIncomeAdvisor();};} const bp=$('#slx-bank-period'); if(bp&&!bp.dataset.bound){bp.dataset.bound='1';bp.value=get(K.bankPeriod,'3m');bp.onchange=()=>{set(K.bankPeriod,bp.value);renderIncomeAdvisor();};}
  }
'''
          if 'function stockIncomeSummary()' not in s: s=s.replace('  function buildOptimizerRows() {',addon+'\n  function buildOptimizerRows() {',1)
          def add_ex(fn,text):
              a=text.find(f'  function {fn}('); b=text.find('\n  function ',a+10) if a>=0 else -1
              if a<0: return text
              if b<0: b=len(text)
              seg=text[a:b]
              if 'excludedStocksSet()' in seg: return text
              seg=seg.replace('    const rows=[];','    const rows=[];\n    const excluded=excludedStocksSet();',1).replace('    for(const [sym,st] of S.stocks) {','    for(const [sym,st] of S.stocks) {\n      if(excluded.has(sym)) continue;',1)
              return text[:a]+seg+text[b:]
          s=add_ex('buildRoiCandidates',s); s=add_ex('buildOptimizerRows',s)
          anchor='      <div class="section"><div class="title">Portfolio Optimizer</div>'
          section='''      <div class="section"><div class="title">Income & Advisor Controls</div><div class="optimizer-controls"><label>Daily costs <input id="slx-daily-costs" value="${esc(get(K.dailyCosts,'0'))}" placeholder="e.g. 2m"></label><label>Bank period <select id="slx-bank-period"><option value="1w">1 week</option><option value="2w">2 weeks</option><option value="1m">1 month</option><option value="2m">2 months</option><option value="3m">3 months</option></select></label></div><label>Excluded stocks <input id="slx-excluded-stocks" value="${esc(get(K.excludedStocks,''))}" placeholder="e.g. TCI,WLT"></label><div class="api-help">Excluded symbols stay visible in Portfolio but are ignored by Advisor and Optimizer.</div><div id="slx-stock-income-body" class="muted">Waiting for portfolio data…</div></div>\n'''
          if 'id="slx-stock-income-body"' not in s: s=s.replace(anchor,section+anchor,1)
          old='<button id="slx-inline-withdraw-all" class="danger" type="button">Withdraw All</button>'
          if 'id="slx-inline-sell-excess"' not in s: s=s.replace(old,old+'<button id="slx-inline-sell-excess" type="button">Sell Excess</button>',1)
          ba="    $('#slx-inline-withdraw-value',card).onchange=e=>set(K.withdraw,e.target.value);"
          if "$('#slx-inline-sell-excess',card)" not in s: s=s.replace(ba,ba+"\n    $('#slx-inline-sell-excess',card).onclick=()=>sellTargetExcess().catch(e=>inlineStatus(e.message,'bad'));",1)
          oldopen="  function openPanel() { style(); premiumStyle(); const p=panel(); p.dataset.open='1'; safeRender('Targets',refreshTargetSelect); safeRender('Portfolio',renderPortfolio); safeRender('Benefit Values',renderBenefitValues); safeRender('ROI Advisor',renderAdvisor); safeRender('Portfolio Optimizer',renderOptimizer); safeRender('Rebalance Preview',renderRebalancePreview); safeRender('Trade Assistant',renderTradeAssistant); safeRender('Transaction History',renderTransactionHistory); safeRender('Action Log',renderActionLog); }"
          newopen="  function openPanel() { style(); premiumStyle(); const p=panel(); p.dataset.open='1'; safeRender('Targets',refreshTargetSelect); safeRender('Portfolio',renderPortfolio); safeRender('Benefit Values',renderBenefitValues); safeRender('ROI Advisor',renderAdvisor); safeRender('Income Advisor',renderIncomeAdvisor); safeRender('Portfolio Optimizer',renderOptimizer); safeRender('Rebalance Preview',renderRebalancePreview); safeRender('Trade Assistant',renderTradeAssistant); safeRender('Transaction History',renderTransactionHistory); safeRender('Action Log',renderActionLog); bindAdvisorUpgradeControls(); }"
          s=s.replace(oldopen,newopen,1)
          p.write_text(s)
          md=Path('greasyfork/Stock-Manager-Advisor.md')
          if md.exists():
              t=md.read_text(); t=re.sub(r'\*\*v0\.7\.\d+\*\*','**v0.7.13**',t,count=1)
              if 'v0.7.13 — Advisor Upgrade' not in t: t='### v0.7.13 — Advisor Upgrade\n- Exposes **Sell Excess** directly in the Stocks workspace while preserving Benefit Lock.\n- Adds gross daily benefit income, daily costs, net daily/monthly/yearly estimates.\n- Adds configurable Advisor/Optimizer stock exclusions and bank periods (1w, 2w, 1m, 2m, 3m).\n\n'+t
              md.write_text(t)
          sp=Path('scripts.json'); data=json.loads(sp.read_text())
          def walk(x):
              if isinstance(x,dict):
                  if x.get('id')=='stock-manager-advisor': x['version']='0.7.13'
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data); sp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "@version      0.7.13" SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'slx-inline-sell-excess' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'slx-stock-income-body' SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/stocks-advisor-upgrade-0713.yml
          git add SakaLuX-Stock-Manager-Advisor.user.js greasyfork/Stock-Manager-Advisor.md scripts.json
          git commit -m "feat(stocks): advisor upgrade v0.7.13"
          git push

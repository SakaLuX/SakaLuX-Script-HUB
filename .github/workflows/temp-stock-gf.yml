name: Apply Stocks Greasy Fork update channel
on:
  push:
    paths:
      - '.github/workflows/temp-stock-gf.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/stock_gf_patch.py
      - name: Validate syntax and registry
        run: |
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit source changes
        run: |
          rm -f .github/stock_gf_patch.py
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A ':!.github/workflows/temp-stock-gf.yml' ':!.github/workflows/validate-userscripts.yml'
          git commit -m 'Move Stocks updates to Greasy Fork'
          git push origin HEAD:main

name: Fix Company Intelligence v1.8.14 internal version
on:
  push:
    branches: [main]
    paths:
      - '.github/fix-company-v1.8.14-internal.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .github/scripts/fix_company_1_8_14_internal.py
      - name: Validate
        run: |
          grep -q "version:'1.8.14'" SakaLuX-Company-Intelligence-v1.0.0.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
      - name: Commit
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js
          git commit -m 'Fix Company Intelligence v1.8.14 internal version'
          git push

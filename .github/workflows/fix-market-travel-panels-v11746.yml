name: Fix Market travel panels v1.17.46
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_market_travel_panels_v11746.py'
      - '.github/workflows/fix-market-travel-panels-v11746.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-travel-panels-v11746
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Market travel fix
        run: python3 .github/scripts/fix_market_travel_panels_v11746.py
      - name: Validate userscript syntax
        run: node --check SakaLuX-Market-Intelligence.user.js
      - name: Validate registry JSON
        run: python3 -m json.tool scripts.json >/dev/null
      - name: Verify behavior markers
        run: |
          grep -q '@version      1.17.46' SakaLuX-Market-Intelligence.user.js
          grep -q 'abroadLabel&&abroadUi' SakaLuX-Market-Intelligence.user.js
          grep -q "bar.classList.remove('open')" SakaLuX-Market-Intelligence.user.js
          grep -q 'v1.17.46' greasyfork/Market-Intelligence.md
      - name: Commit release
        run: |
          if git diff --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Market-Intelligence.user.js scripts.json SakaLuX-Script-Hub.user.js greasyfork/Market-Intelligence.md
          git commit -m 'Release Market Intelligence v1.17.46 travel panels'
          git push
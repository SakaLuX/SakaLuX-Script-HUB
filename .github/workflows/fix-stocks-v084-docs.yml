name: Fix Stocks v0.8.4 Documentation Sync

on:
  push:
    paths:
      - '.github/workflows/fix-stocks-v084-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync INFO release and changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('greasyfork/Stock-Manager-Advisor.md')
          s=p.read_text()
          s=re.sub(r'(## Current version\s*\n)\*\*v[^*]+\*\*',r'\1**v0.8.4**',s,count=1)
          release='''## Current release note

**v0.8.4 — Rebalance Strategy Profiles**
- Adds persistent **SAFE / BALANCED / AGGRESSIVE** Smart Rebalance profiles.
- **SAFE:** up to 10% of portfolio value per move, stronger score threshold, maximum 2 suggested moves.
- **BALANCED:** up to 20% per move, medium threshold, maximum 4 suggested moves; this remains the default behavior.
- **AGGRESSIVE:** up to 35% per move, lower threshold, maximum 6 suggested moves.
- Profiles tune technical-score, benefit-yield, tier and affordability weighting while continuing to use only free shares.
- The selected profile persists locally across TornPDA/desktop sessions.
- Benefit Lock remains enforced and Smart Rebalance remains preview-only; no trade is submitted automatically.
'''
          s=re.sub(r'## Current release note\s*\n.*?(?=\n## Installation and Hub integration)',release+'\n',s,count=1,flags=re.S)
          what='''- **Smart Rebalance Strategy Profiles** with SAFE / BALANCED / AGGRESSIVE turnover caps, score thresholds and weighting profiles; plans remain preview-only and Benefit Lock aware.\n'''
          if what.strip() not in s:
              anchor='- **Portfolio Simulator** for no-trade SELL-excess → BUY-target scenarios while preserving Benefit Lock.\n'
              s=s.replace(anchor,anchor+what,1)
          if '### v0.8.4 — Rebalance Strategy Profiles' not in s:
              change='''### v0.8.4 — Rebalance Strategy Profiles
- Added persistent SAFE, BALANCED and AGGRESSIVE Smart Rebalance profiles.
- SAFE caps each proposed move at 10% of portfolio value, requires a stronger score gap and suggests up to 2 moves.
- BALANCED preserves the v0.8.3 default behavior at 20% per move and up to 4 moves.
- AGGRESSIVE allows up to 35% per move, uses a lower score threshold and can suggest up to 6 moves.
- Added profile-specific weighting for technical score, benefit yield, benefit tier and affordability context.
- Preserved Benefit Lock, free-share-only sell sources and preview-only execution.
- Synchronized userscript/runtime version surfaces, scripts.json, INFO/release metadata and changelog to v0.8.4.

### v0.8.3 — Smart Rebalance Engine
- Added portfolio-wide SELL → BUY planning across detected holdings.
- Uses only free shares as sell sources so Benefit Lock protected shares stay untouched.
- Ranks source and target stocks using technical score, benefit yield and tier context.
- Shows capital, share counts, score delta, technical delta, benefit delta and target tier movement.
- Added RECALCULATE to refresh the local technical snapshot before rebuilding the plan.
- Remains preview-only; no automatic trade submission.

### v0.8.2 — Portfolio Simulator
- Added BEFORE → AFTER What-if comparison.
- Added safe reallocatable coverage while respecting Benefit Lock.
- Added benefit-yield and local technical-score deltas, target tier movement and unused-cash rounding visibility.
- Simulator remains preview-only and never submits trades.

'''
              s=s.replace('## Changelog\n\n','## Changelog\n\n'+change,1)
          p.write_text(s)
          PY
      - name: Validate docs
        run: |
          grep -q '\*\*v0.8.4\*\*' greasyfork/Stock-Manager-Advisor.md
          grep -q 'v0.8.4 — Rebalance Strategy Profiles' greasyfork/Stock-Manager-Advisor.md
          grep -q 'SAFE / BALANCED / AGGRESSIVE' greasyfork/Stock-Manager-Advisor.md
      - name: Commit docs sync
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add greasyfork/Stock-Manager-Advisor.md
          git commit -m 'Stocks v0.8.4: sync INFO release and changelog'
          git push

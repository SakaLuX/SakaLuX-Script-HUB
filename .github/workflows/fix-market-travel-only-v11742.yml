name: Fix Market travel-only panels v1.17.42

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_market_travel_only_v11742.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Market travel-only patch
        run: python3 .github/scripts/fix_market_travel_only_v11742.py
      - name: Normalize release surfaces
        run: python3 .github/scripts/normalize_installed_versions.py
      - name: Validate JavaScript
        run: node --check SakaLuX-Market-Intelligence.user.js
      - name: Assert travel-only guards
        run: |
          grep -q "if(!isTravelPanelPage()){existing?.remove();return;}" SakaLuX-Market-Intelligence.user.js
          grep -q "if(!settings.arrivalStock||!detectInFlight()||!isTravelPanelPage()){previousArrival?.remove();return;}" SakaLuX-Market-Intelligence.user.js
          grep -q "document.getElementById('sl-mi-session')?.remove();" SakaLuX-Market-Intelligence.user.js
          grep -q "document.getElementById('sl-mi-arrival')?.remove();" SakaLuX-Market-Intelligence.user.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Market-Intelligence.user.js scripts.json greasyfork/*.md
          git commit -m "Fix Market travel-only panels"
          git push

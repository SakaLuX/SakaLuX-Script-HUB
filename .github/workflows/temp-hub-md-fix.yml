name: Sync Hub documentation
on:
  push:
    paths:
      - '.github/workflows/temp-hub-md-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/fix_hub_md.py
      - run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add greasyfork/Script-Hub.md
          git commit -m 'Sync Hub v1.9.64 documentation' || exit 0
          git push origin HEAD:main

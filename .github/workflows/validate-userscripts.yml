name: Validate SakaLuX userscripts

on:
  push:
    branches: [main]
    paths:
      - '*.user.js'
      - 'scripts.json'
      - 'greasyfork/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: userscript-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Elimination cleanup
        if: contains(github.event.head_commit.message, '[remove-touching-grass]')
        run: python .migration/remove-touching-grass-widget.py

      - name: Validate patched files
        if: contains(github.event.head_commit.message, '[remove-touching-grass]')
        run: |
          node --check SakaLuX-Elimination-Assistant.user.js
          python -m json.tool scripts.json >/dev/null
          grep -q "@version      1.3.10" SakaLuX-Elimination-Assistant.user.js
          grep -q "const VERSION='1.3.10'" SakaLuX-Elimination-Assistant.user.js
          grep -q "removeTouchingGrassWidget" SakaLuX-Elimination-Assistant.user.js

      - name: Commit migration
        if: contains(github.event.head_commit.message, '[remove-touching-grass]')
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Elimination-Assistant.user.js scripts.json SakaLuX-Script-Hub.user.js greasyfork/Elimination-Assistant.md greasyfork/Script-Hub.md
          git commit -m "Elimination v1.3.10 remove Touching Grass injected widget [skip ci]"
          git push

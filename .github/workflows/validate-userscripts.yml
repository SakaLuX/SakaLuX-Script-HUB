name: Validate SakaLuX userscripts

on:
  push:
    branches: [main]
    paths:
      - '*.user.js'
      - 'scripts.json'
      - 'greasyfork/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '*.user.js'
      - 'scripts.json'
      - 'greasyfork/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userscript-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(SakaLuX-*.user.js)
          if ((${#files[@]} == 0)); then
            echo 'No root SakaLuX userscripts found.' >&2
            exit 1
          fi
          printf 'Checking %d userscripts\n' "${#files[@]}"
          for file in "${files[@]}"; do
            echo "node --check $file"
            node --check "$file"
          done

      - name: Validate scripts.json
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('scripts.json')
          json.loads(p.read_text(encoding='utf-8'))
          print('scripts.json: valid JSON')

      - name: Validate Suite metadata
        shell: python
        run: |
          import re
          from pathlib import Path

          p = Path('SakaLuX-Suite.user.js')
          text = p.read_text(encoding='utf-8')

          meta = re.search(r'^// @version\s+([^\s]+)\s*$', text, re.M)
          runtime = re.search(r"const VERSION\s*=\s*['\"]([^'\"]+)['\"];", text)
          if not meta or not runtime:
              raise SystemExit('Suite version metadata/runtime constant missing')
          if meta.group(1) != runtime.group(1):
              raise SystemExit(f"Suite version mismatch: metadata={meta.group(1)} runtime={runtime.group(1)}")

          required = [
              '// ==UserScript==',
              '// @match        https://www.torn.com/*',
              '// @license      All Rights Reserved',
              '// @updateURL    https://raw.githubusercontent.com/SakaLuX/SakaLuX-Script-HUB/main/SakaLuX-Suite.user.js',
              '// @downloadURL  https://raw.githubusercontent.com/SakaLuX/SakaLuX-Script-HUB/main/SakaLuX-Suite.user.js',
              '// ==/UserScript=='
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Suite metadata missing: ' + ', '.join(missing))

          print(f'SakaLuX Suite v{meta.group(1)} metadata: OK')

      - name: Validate Suite module parity invariants
        shell: python
        run: |
          import re
          from pathlib import Path

          text = Path('SakaLuX-Suite.user.js').read_text(encoding='utf-8')

          expected_modules = {
              'prayerReminder': 'createPrayerReminderModule',
              'medAdvisor': 'createMedAdvisorModule',
              'itemIntel': 'createItemIntelModule',
              'eventsDashboard': 'createEventsDashboardModule',
              'activityIntelligence': 'createActivityIntelligenceModule',
              'factionMemberView': 'createFactionMemberViewModule',
              'armoryLoanScanner': 'createArmoryLoanScannerModule',
              'warLedger': 'createWarLedgerModule',
              'ocOperations': 'createOcOperationsModule',
              'companyManagement': 'createCompanyManagementModule',
              'racingChampionship': 'createRacingChampionshipModule',
              'casinoEdgeScanner': 'createCasinoEdgeScannerModule',
              'targetAlerts': 'createTargetAlertsModule',
          }
          for module_id, factory in expected_modules.items():
              entry = re.search(
                  r'id:\s*["\']' + re.escape(module_id) + r'["\'][\s\S]{0,500}?factory:\s*' + re.escape(factory),
                  text,
              )
              if not entry:
                  raise SystemExit(f'Module/factory registry mismatch: {module_id} -> {factory}')

          required_runtime = [
              "function createEventsDashboardModule(context) {",
              "function createItemIntelModule(context) {",
              "function createMedAdvisorModule(context) {",
              "function createPrayerReminderModule(context) {",
              "function migrateLegacySakaLuXSettings() {",
              "function createSakaLuXChainAlarmModule() {",
              "function restoreMessageLinks(element, links) {",
          ]
          missing = [x for x in required_runtime if x not in text]
          if missing:
              raise SystemExit('Suite runtime invariant missing: ' + ', '.join(missing))

          event_factory = re.search(
              r'^\s*function createEventsDashboardModule\(context\) \{',
              text,
              re.M,
          )
          if not event_factory:
              raise SystemExit('Event Lens factory is not a scoped function declaration')

          print('Suite complete-module invariants: OK')

      - name: Ensure only stable workflow remains
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)
          printf 'Workflow files: %s\n' "${workflows[*]:-none}"
          if ((${#workflows[@]} != 1)) || [[ "${workflows[0]:-}" != "validate-userscripts.yml" ]]; then
            echo 'Unexpected workflow file detected. Only validate-userscripts.yml is allowed.' >&2
            printf '%s\n' "${workflows[@]}" >&2
            exit 1
          fi
          echo 'Workflow directory clean: only stable validator remains.'

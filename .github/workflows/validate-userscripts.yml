name: Integrate Hub v1.9.44 temporary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-userscripts.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Hub layout
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check SakaLuX-Script-Hub.user.js
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          git commit -m 'Hub v1.9.44 mobile module controls and Company footer'
          git push origin main

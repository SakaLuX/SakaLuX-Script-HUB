name: Apply Elimination v1.3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-userscripts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('SakaLuX-Elimination-Assistant.user.js')
          s=p.read_text()
          b=Path('backups/SakaLuX-Elimination-Assistant-v1.3.0.user.js')
          if not b.exists(): b.write_text(s)
          s=s.replace('// @version      1.3.0','// @version      1.3.1',1)
          s=s.replace("const VERSION='1.3.0';","const VERSION='1.3.1';",1)
          old="async function calibrate(force=false){if(state.my.source==='manual'&&!force)return state.my.total;if(!force&&state.my.total&&Date.now()-Number(state.my.at||0)<900000)return state.my.total;const raw=await torn('user/battlestats');const x=raw?.battlestats??raw?.data??raw??{};const total=['strength','defense','speed','dexterity'].reduce((s,k)=>s+Number(x[k]??x?.battle_stats?.[k]??0),0);if(!total)throw new Error('battlestats not returned; run TEST TORN KEY');state.my={total,at:Date.now(),source:'Torn API'};save(K.my,state.my);apply();return total}"
          new="async function calibrate(force=false){if(state.my.source==='manual'&&!force)return state.my.total;if(!force&&state.my.total&&Date.now()-Number(state.my.at||0)<900000)return state.my.total;const raw=await torn('user/battlestats');const x=raw?.battlestats??raw?.data?.battlestats??raw?.data??raw??{};const statVal=k=>{const v=x?.[k]??x?.battle_stats?.[k]??0;if(v&&typeof v==='object')return Number(v.value??v.amount??v.total??v.base??0)||0;return Number(v)||0};const apiTotal=Number(x?.total??x?.total_battlestats??0)||0;const total=apiTotal||['strength','defense','speed','dexterity'].reduce((sum,k)=>sum+statVal(k),0);if(!total)throw new Error('Battle stats endpoint replied, but no stat values were found. Check Torn API key access.');state.my={total,at:Date.now(),source:'Torn API'};save(K.my,state.my);apply();setStatus('Battle stats calibrated: '+fmtBS(total));return total}"
          if old not in s: raise SystemExit('calibrate marker missing')
          p.write_text(s.replace(old,new,1))
          d=json.loads(Path('scripts.json').read_text())
          for row in d.get('scripts',[]):
              if row.get('id')=='elimination-assistant': row['version']='1.3.1'
          Path('scripts.json').write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          md=Path('greasyfork/Elimination-Assistant.md'); t=md.read_text().replace('**Current version: v1.3.0**','**Current version: v1.3.1**',1)
          if '## v1.3.1 — Battle Stats API v2 Fix' not in t:
              pos=t.find('\n## ')
              entry='\n## v1.3.1 — Battle Stats API v2 Fix\n\n- Fixed CALIBRATE ME for Torn API v2 battlestats object values and battlestats.total.\n- Added exact backup: backups/SakaLuX-Elimination-Assistant-v1.3.0.user.js.\n\n'
              t=t[:pos+1]+entry+t[pos+1:]
          md.write_text(t)
          u=Path('UPDATE-INFO.md'); x=u.read_text().replace('SakaLuX Elimination Assistant: **v1.3.0**','SakaLuX Elimination Assistant: **v1.3.1**',1)
          if '### SakaLuX Elimination Assistant v1.3.1' not in x:
              x=x.replace('## Latest changes\n','## Latest changes\n\n### SakaLuX Elimination Assistant v1.3.1\n- Fixed current Torn API v2 battlestats parsing for CALIBRATE ME.\n\n',1)
          u.write_text(x)
          PY
          node --check SakaLuX-Elimination-Assistant.user.js
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Elimination-Assistant.user.js scripts.json greasyfork/Elimination-Assistant.md UPDATE-INFO.md backups/SakaLuX-Elimination-Assistant-v1.3.0.user.js
          git diff --cached --quiet || git commit -m "fix: Elimination Assistant v1.3.1 battlestats API v2"
          git push origin main

name: Integrate Hub v1.9.43 then restore validator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-userscripts.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch Hub natively
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Restore stable validator and publish integration
        shell: bash
        run: |
          git show HEAD^:.github/workflows/validate-userscripts.yml > .github/workflows/validate-userscripts.yml
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Hub v1.9.43 native INFO NEW module cards'
          git push origin main

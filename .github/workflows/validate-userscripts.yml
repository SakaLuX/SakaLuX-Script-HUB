name: Validate SakaLuX userscripts

on:
  push:
    branches: [main]
    paths:
      - '*.user.js'
      - 'scripts.json'
      - 'greasyfork/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '*.user.js'
      - 'scripts.json'
      - 'greasyfork/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userscript-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(SakaLuX-*.user.js)
          if ((${#files[@]} == 0)); then
            echo 'No root SakaLuX userscripts found.' >&2
            exit 1
          fi
          printf 'Checking %d userscripts\n' "${#files[@]}"
          for file in "${files[@]}"; do
            echo "node --check $file"
            node --check "$file"
          done

      - name: Validate scripts.json
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('scripts.json')
          json.loads(p.read_text(encoding='utf-8'))
          print('scripts.json: valid JSON')

      - name: Validate Suite metadata
        shell: python
        run: |
          import re
          from pathlib import Path

          p = Path('SakaLuX-Suite.user.js')
          text = p.read_text(encoding='utf-8')

          meta = re.search(r'^// @version\s+([^\s]+)\s*$', text, re.M)
          runtime = re.search(r"const VERSION='([^']+)';", text)
          if not meta or not runtime:
              raise SystemExit('Suite version metadata/runtime constant missing')
          if meta.group(1) != runtime.group(1):
              raise SystemExit(f"Suite version mismatch: metadata={meta.group(1)} runtime={runtime.group(1)}")

          required = [
              '// ==UserScript==',
              '// @match        https://www.torn.com/*',
              '// @license      All Rights Reserved',
              '// @updateURL    https://raw.githubusercontent.com/SakaLuX/SakaLuX-Script-HUB/main/SakaLuX-Suite.user.js',
              '// @downloadURL  https://raw.githubusercontent.com/SakaLuX/SakaLuX-Script-HUB/main/SakaLuX-Suite.user.js',
              '// ==/UserScript=='
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Suite metadata missing: ' + ', '.join(missing))

          print(f'SakaLuX Suite v{meta.group(1)} metadata: OK')

      - name: Validate reminder and Recovery Planner invariants
        shell: python
        run: |
          import re
          from pathlib import Path

          text = Path('SakaLuX-Suite.user.js').read_text(encoding='utf-8')

          expected = {
              'daily-prayer': False,
              'recovery-planner': True,
              'item-signals': False,
              'event-lens': False,
              'chain-alarm': False,
          }
          for module_id, should_have_settings in expected.items():
              m = re.search(r"\{id:'" + re.escape(module_id) + r"'[^\n]*settings:(true|false)", text)
              if not m:
                  raise SystemExit(f'Module settings flag missing for {module_id}')
              actual = m.group(1) == 'true'
              if actual != should_have_settings:
                  raise SystemExit(f'Unexpected settings flag for {module_id}: {actual}')

          required_runtime = [
              "function createSakaLuXEventLensModule(context) {",
              "document.getElementById('slx-daily-prayer')?.remove()",
              "function openRecoveryPanel(){",
              "className='slx-recovery-card'",
              "id=\"slx-recovery-scan\"",
              "id=\"slx-recovery-settings-open\"",
              "setTimeout(observePrayerSuccess,700)",
              "setTimeout(observePrayerSuccess,1600)",
              "setTimeout(observePrayerSuccess,3000)",
          ]
          missing = [x for x in required_runtime if x not in text]
          if missing:
              raise SystemExit('Reminder/Recovery runtime invariant missing: ' + ', '.join(missing))

          event_factory = re.search(
              r'^\s*function createSakaLuXEventLensModule\(context\) \{',
              text,
              re.M,
          )
          if not event_factory:
              raise SystemExit('Event Lens factory is not a scoped function declaration')

          print('Reminder and Recovery Planner invariants: OK')

      - name: Ensure only stable workflow remains
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)
          printf 'Workflow files: %s\n' "${workflows[*]:-none}"
          if ((${#workflows[@]} != 1)) || [[ "${workflows[0]:-}" != "validate-userscripts.yml" ]]; then
            echo 'Unexpected workflow file detected. Only validate-userscripts.yml is allowed.' >&2
            printf '%s\n' "${workflows[@]}" >&2
            exit 1
          fi
          echo 'Workflow directory clean: only stable validator remains.'

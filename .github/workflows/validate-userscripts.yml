name: Apply global top alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-userscripts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate
        shell: bash
        run: |
          set -e
          for f in SakaLuX-Script-Hub.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Elimination-Assistant.user.js SakaLuX-Chat-Intelligence.user.js; do node --check "$f"; done
          python -m json.tool scripts.json >/dev/null
      - name: Commit
        shell: bash
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-*.user.js scripts.json greasyfork/*.md
          git commit -m 'Fix top alignment across SakaLuX mobile panels'
          git push

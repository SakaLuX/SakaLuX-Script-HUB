name: Integrate Hub v1.9.43 temporary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-userscripts.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and publish Hub
        shell: bash
        run: |
          set -euo pipefail
          python .migration/integrate_hub_1943.py
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          git rm -f SakaLuX-Hub-Card-UX.user.js
          git commit -m 'Hub v1.9.43 native INFO NEW module cards'
          git push origin main

name: Integrate Hub v1.9.45 temporary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-userscripts.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.9.45 patch
        shell: bash
        run: |
          set -euo pipefail
          python .tmp/apply_v1_9_45.py
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          python -m json.tool scripts.json >/dev/null
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Script-Hub.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js scripts.json greasyfork/Script-Hub.md greasyfork/Company-Intelligence.md
          git commit -m 'Hub v1.9.45 compact cards and Company mobile scroll'
          git push origin main

name: Validate repository
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validation dependencies
        run: |
          python3 -m pip install PyYAML==6.0.3
          npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Check workflows, userscripts and registry
        run: python3 .github/scripts/validate_repository.py
      - name: Verify Stocks panel in a busy TornPDA page
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/stocks-panel-regression.cjs
      - name: Verify Hub INFO and NEW
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/hub-details-regression.cjs
      - name: Verify all Suite tool bridges
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/suite-modules-regression.cjs
      - name: Verify scoped footer recovery and stable inventory badges
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/performance/ui-regression.cjs
      - name: Verify bounded chat history and API synchronization recovery
        run: |
          node tests/performance/chat-cache-regression.cjs --assert
          node tests/performance/elimination-lifecycle-regression.cjs
          node tests/performance/stocks-network-regression.cjs --assert
          node tests/performance/auditor-rate-regression.cjs --assert
      - name: Check all-script performance workload budgets
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/performance/run.cjs "$RUNNER_TEMP/performance-budget.json" --assert

name: Update Bounty Hunter v0.3.3

on:
  push:
    paths:
      - '.github/scripts/update_bounty_hunter_v033.py'
      - '.github/workflows/update-bounty-hunter-v033.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Bounty Hunter
        run: python .github/scripts/update_bounty_hunter_v033.py
      - name: Syntax check
        run: node --check SakaLuX-Bounty-Hunter.user.js
      - name: Verify
        run: |
          grep -q '@version      0.3.3' SakaLuX-Bounty-Hunter.user.js
          grep -q "const VERSION='0.3.3'" SakaLuX-Bounty-Hunter.user.js
          grep -q 'settingsOpen:false' SakaLuX-Bounty-Hunter.user.js
          grep -q 'maxPages:60' SakaLuX-Bounty-Hunter.user.js
          grep -q 'Math.min(100' SakaLuX-Bounty-Hunter.user.js
          grep -q 'data-filters' SakaLuX-Bounty-Hunter.user.js
          grep -q "+' bounties · FF '" SakaLuX-Bounty-Hunter.user.js
          grep -q '### v0.3.3' greasyfork/Bounty-Hunter.md
          python - <<'PY'
          import json
          d=json.load(open('scripts.json'))
          x=next(x for x in d['scripts'] if x.get('id')=='bounty-hunter')
          assert x['version']=='0.3.3'
          PY
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Bounty-Hunter.user.js greasyfork/Bounty-Hunter.md scripts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Bounty Hunter to v0.3.3'
          git push

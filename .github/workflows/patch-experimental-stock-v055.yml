name: Patch experimental Stock Manager v0.5.5
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v055.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v055.py
      - name: Validate
        run: |
          grep -q '@version      0.5.5' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.5.5'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function enhanceStockRows' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function stockRowBuyGap' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function stockRowSellExcess' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'slx-stock-row-tools' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Native Per-Stock Row Tools' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.5.5 native per-stock row tools'
          git pull --rebase origin main
          git push

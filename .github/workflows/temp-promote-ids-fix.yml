name: Promote Hub IDS fix
on:
  push:
    paths:
      - '.github/workflows/temp-promote-ids-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production fix
        run: python .migration/promote_ids_fix.py
      - name: Validate Hub JavaScript
        run: node --check SakaLuX-Script-Hub.user.js
      - name: Commit production fix
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md hubtest.user.js
          git commit -m 'Fix Hub IDS runtime and remove test build' || exit 0
          git push origin HEAD:main

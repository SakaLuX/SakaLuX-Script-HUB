name: One-time release info sync 1.0.19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-release-info-1019.yml'
      - '.migration/fix-release-info-1019.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .migration/fix-release-info-1019.py
      - name: Validate docs
        run: |
          set -euo pipefail
          grep -q '\*\*v1.0.19\*\*' greasyfork/Mission-Rewards.md
          grep -q '\*\*v1.9.43\*\*' greasyfork/Script-Hub.md
          grep -q 'confirmed-working \*\*v1.0.18\*\* runtime' greasyfork/Mission-Rewards.md
          grep -q 'pins Mission Rewards to the stable \*\*v1.0.19\*\* line' greasyfork/Script-Hub.md
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync Mission Rewards v1.0.19 release info [skip ci]'
          git push

name: Apply Bookie Scout v0.9.906 patch

on:
  push:
    paths:
      - '.github/workflows/bookie-scout-v0906-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Suite
        run: python3 .github/bookie_patch.py
      - name: Syntax check
        run: node --check SakaLuX-Suite.user.js
      - name: Verify Bookie Scout
        run: |
          grep -q '@version      0.9.906' SakaLuX-Suite.user.js
          grep -q 'name: "Bookie Scout"' SakaLuX-Suite.user.js
          grep -q 'sakalux_bookie_scout_external_prob_v1' SakaLuX-Suite.user.js
          grep -q 'data-bookie-metric="edge"' SakaLuX-Suite.user.js
          grep -q 'data-bookie-metric="ev"' SakaLuX-Suite.user.js
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/bookie-scout-v0906-patch.yml .github/bookie_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Suite.user.js UPDATE-INFO.md .github/workflows/bookie-scout-v0906-patch.yml .github/bookie_patch.py
          git commit -m 'feat: upgrade Odds Scout to Bookie Scout v0.9.906'
          git push

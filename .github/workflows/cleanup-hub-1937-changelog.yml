name: Cleanup Hub v1.9.37 changelog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-hub-1937-changelog.yml'
      - '.migration/cleanup-hub-1937-changelog.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .migration/cleanup-hub-1937-changelog.py
      - run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          test "$(grep -c "version: '1.9.37'" SakaLuX-Script-Hub.user.js)" -eq 1
          grep -q "registry: 'SakaLuX_HUB_REGISTRY_V20'" SakaLuX-Script-Hub.user.js
          grep -q "updates: 'SakaLuX_HUB_UPDATES_V18'" SakaLuX-Script-Hub.user.js
      - run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Clean duplicate Hub v1.9.37 changelog entry [skip ci]'
          git push

name: Audit and sync all SakaLuX versions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-sync-all-versions.yml'
      - '.migration/audit-sync-all-versions.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit and synchronize versions
        run: python .migration/audit-sync-all-versions.py
      - name: Commit synchronized metadata
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js scripts.json greasyfork/*.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit and sync all script versions and release info [skip ci]'
          git push

name: Patch Company Intelligence v1.8.15
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-company-v1.8.15.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_company_1_8_15_restore_standalone_entry.py
      - name: Validate
        run: |
          grep -q '@version      1.8.15' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q "version:'1.8.15'" SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q "data-slx-standalone-registration" SakaLuX-Company-Intelligence-v1.0.0.user.js
          ! grep -q 'SakaLuX Standalone Dock Bootstrap — BEGIN' SakaLuX-Company-Intelligence-v1.0.0.user.js
          ! grep -q "textContent='🏢 Company Intel'" SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q '"version": "1.8.15"' scripts.json
          python -m json.tool scripts.json >/dev/null
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js scripts.json greasyfork/Company-Intelligence.md
          git commit -m 'Company Intelligence v1.8.15: restore clean standalone entry'
          git push

name: Temporary global top alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-global-top-align.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch SakaLuX mobile panels
        shell: python
        run: |
          from pathlib import Path
          import json, re

          files = {
            'SakaLuX-Enhancer-Guard.user.js': ('1.3.35','1.3.36','VERSION'),
            'SakaLuX-Bazaar-Thanker-PDA.user.js': ('5.3.27','5.3.28','BAZAAR_VERSION'),
            'SakaLuX-Mission-Rewards.user.js': ('1.0.22','1.0.23','VERSION'),
            'SakaLuX-Market-Intelligence.user.js': ('1.17.23','1.17.24','VERSION'),
            'SakaLuX-Elimination-Assistant.user.js': ('1.3.33','1.3.34','VERSION'),
            'SakaLuX-Company-Intelligence-v1.0.0.user.js': ('1.8.20','1.8.21',None),
            'SakaLuX-Chat-Intelligence.user.js': ('1.2.9','1.2.10','V'),
          }

          top_js = r'''

  // SakaLuX mobile top-alignment contract.
  (() => {
    const id='sakalux-global-top-align-v3';
    if(document.getElementById(id)) return;
    const st=document.createElement('style');
    st.id=id;
    st.textContent=`@media(max-width:700px){
body [id^="sakalux-"][id*="overlay"],body [id^="sakalux-"][id*="modal"],
body [id^="slx-"][id*="overlay"],body [id^="slx-"][id*="modal"],
body [id^="sl-"][id*="overlay"],body [id^="sl-"][id*="modal"],
#sl-eg-overlay,#sl-mr-settings-overlay,#sl-mi-overlay,#sl-aa-overlay,#ci-root{
  align-items:flex-start!important;justify-content:center!important;padding-top:0!important;margin-top:0!important;
}
body [id^="sakalux-"][id*="panel"],body [id^="slx-"][id*="panel"],body [id^="sl-"][id*="panel"],
#sl-eg-panel,#sl-mr-settings-panel,#sl-mi-panel,#ci-root .ci-shell{
  margin-top:0!important;align-self:flex-start!important;
}
}`;
    (document.head||document.documentElement).appendChild(st);
  })();
'''

          def bump_script(path, old, new, runtime):
            p=Path(path); s=p.read_text(encoding='utf-8')
            s,n=re.subn(r'(^// @version\s+)'+re.escape(old)+r'(\s*$)',rf'\g<1>{new}\g<2>',s,count=1,flags=re.M)
            if n!=1: raise SystemExit(f'{path}: metadata version not bumped')
            if runtime:
              pat=re.compile(r'(const\s+'+re.escape(runtime)+r'\s*=\s*[\'\"])([^\'\"]+)([\'\"])')
              m=pat.search(s)
              if m:
                s=pat.sub(lambda x:x.group(1)+new+x.group(3),s,count=1)
              elif path!='SakaLuX-Chat-Intelligence.user.js':
                raise SystemExit(f'{path}: runtime {runtime} missing')
            if path=='SakaLuX-Company-Intelligence-v1.0.0.user.js':
              s,n=re.subn(r"(version:\s*['\"])(?:1\.8\.20)(['\"])",rf'\g<1>{new}\g<2>',s,count=1)
              if n!=1: raise SystemExit('Company APP version not bumped')
            marker="'use strict';"
            if marker not in s:
              marker="'use strict'"
            if 'sakalux-global-top-align-v3' not in s:
              idx=s.find(marker)
              if idx<0: raise SystemExit(f'{path}: use strict marker missing')
              end=idx+len(marker)
              s=s[:end]+top_js+s[end:]
            p.write_text(s,encoding='utf-8')

          for path,(old,new,runtime) in files.items(): bump_script(path,old,new,runtime)

          # Hub: version + authoritative final CSS after every older rule.
          hp=Path('SakaLuX-Script-Hub.user.js'); h=hp.read_text(encoding='utf-8')
          h=h.replace('// @version      1.9.46','// @version      1.9.47',1)
          h=h.replace("const VERSION = '1.9.46';","const VERSION = '1.9.47';",1)
          hub_css=r'''

/* v1.9.47 FINAL PDA OVERRIDE — intentionally appended after every legacy rule */
@media(max-width:700px){
#${IDS.overlay}{align-items:flex-start!important;justify-content:center!important;padding:0!important;margin:0!important}
#${IDS.panel}{margin:0 auto!important;align-self:flex-start!important;border-radius:0 0 18px 18px!important;max-height:calc(100dvh - 72px)!important}
.slh-card{display:grid!important;grid-template-columns:42px minmax(0,1fr) 136px!important;grid-template-rows:auto!important;align-items:center!important;column-gap:8px!important;row-gap:0!important;padding:9px!important;min-height:78px!important}
.slh-card .slh-icon{grid-column:1!important;grid-row:1!important;margin:0!important}
.slh-card .slh-card-copy{grid-column:2!important;grid-row:1!important;min-width:0!important;margin:0!important}
.slh-card .slh-module-controls{grid-column:3!important;grid-row:1!important;display:grid!important;grid-template-columns:1fr 1fr!important;grid-template-rows:32px 32px!important;grid-template-areas:'info toggle' 'new primary'!important;gap:5px!important;width:136px!important;min-width:136px!important;margin:0!important;align-self:center!important}
.slh-card .slh-card-tools{display:contents!important}
.slh-card .slh-info-btn{grid-area:info!important}
.slh-card .slh-new-btn{grid-area:new!important}
.slh-card .slh-switch-wrap{grid-area:toggle!important}
.slh-card .slh-primary{grid-area:primary!important}
.slh-card .slh-info-btn,.slh-card .slh-new-btn,.slh-card .slh-switch-wrap,.slh-card .slh-primary{width:100%!important;min-width:0!important;height:32px!important;min-height:32px!important;padding:0 4px!important;margin:0!important;font-size:8px!important;border-radius:9px!important}
.slh-settings .slh-setting-row{display:grid!important;grid-template-columns:minmax(0,1fr) 38px!important;align-items:center!important;gap:10px!important}
.slh-settings .slh-setting-toggle{width:38px!important;min-width:38px!important;max-width:38px!important;height:22px!important;min-height:22px!important;padding:2px!important;border-radius:999px!important;justify-self:end!important}
.slh-settings .slh-setting-toggle i{width:16px!important;height:16px!important;margin:0!important}
.slh-settings .slh-setting-toggle.on i{transform:translateX(16px)!important}
}
'''
          anchor='        document.head.appendChild(style);'
          if 'v1.9.47 FINAL PDA OVERRIDE' not in h:
            pos=h.rfind(anchor)
            if pos<0: raise SystemExit('Hub final CSS anchor missing')
            h=h[:pos]+'        style.textContent += `'+hub_css.replace('`','\\`')+'`;\n'+h[pos:]
          # bump Hub fallback registry versions
          bumps={'enhancer':('1.3.35','1.3.36'),'bazaar':('5.3.27','5.3.28'),'mission-rewards':('1.0.22','1.0.23'),'market-intelligence':('1.17.23','1.17.24'),'elimination-assistant':('1.3.33','1.3.34'),'company-intelligence':('1.8.20','1.8.21')}
          for sid,(old,new) in bumps.items():
            pat=re.compile(r"(id:\s*['\"]"+re.escape(sid)+r"['\"][\s\S]{0,500}?version:\s*['\"])("+re.escape(old)+r")(['\"])")
            h,n=pat.subn(lambda m:m.group(1)+new+m.group(3),h,count=1)
            if n!=1: raise SystemExit(f'Hub fallback {sid} not bumped')
          entry="""        {\n            version: '1.9.47',\n            date: '2026-09-17',\n            changes: [\n                'Applies top-aligned mobile panels directly in every SakaLuX module instead of relying on Hub-only CSS.',\n                'Adds a final Hub CSS layer that keeps INFO, NEW, ON/OFF and OPEN/SETTINGS in the right-side 2x2 control block.',\n                'Normalizes compact Hub Settings switches after all legacy mobile rules.',\n                'Includes Chat Intelligence in the shared top-alignment contract.'\n            ]\n        },\n"""
          ch='    const HUB_CHANGELOG = [\n'
          if "version: '1.9.47'" not in h: h=h.replace(ch,ch+entry,1)
          hp.write_text(h,encoding='utf-8')

          # Registry versions + release notes.
          rp=Path('scripts.json'); data=json.loads(rp.read_text(encoding='utf-8'))
          for item in data['scripts']:
            sid=item['id']
            if sid in bumps:
              item['version']=bumps[sid][1]
              item['release']={'version':bumps[sid][1],'date':'2026-09-17','notes':['Mobile panels now open aligned to the top of the TornPDA viewport.','Shared top-alignment behavior is applied inside the module itself, not only by Script Hub.']}
          rp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Documentation synchronization.
          docs={
            'greasyfork/Enhancer-Guard.md':('1.3.35','1.3.36'),
            'greasyfork/Bazaar-Thanker.md':('5.3.27','5.3.28'),
            'greasyfork/Mission-Rewards.md':('1.0.22','1.0.23'),
            'greasyfork/Market-Intelligence.md':('1.17.23','1.17.24'),
            'greasyfork/Elimination-Assistant.md':('1.3.33','1.3.34'),
            'greasyfork/Company-Intelligence.md':('1.8.20','1.8.21'),
            'greasyfork/Chat-Intelligence.md':('1.2.9','1.2.10'),
          }
          def upd_doc(path,old,new):
            p=Path(path); s=p.read_text(encoding='utf-8')
            s,n1=re.subn(r'(## Current version\s*\n\s*\*\*v)'+re.escape(old)+r'(\*\*)',rf'\g<1>{new}\g<2>',s,count=1,flags=re.I)
            if not n1:
              s,n1=re.subn(r'(\*\*Current version:\s*v)'+re.escape(old)+r'(\*\*)',rf'\g<1>{new}\g<2>',s,count=1,flags=re.I)
            s,n2=re.subn(r'(## Current release note\s*\n+\*\*v)'+re.escape(old)+r'(\*\*)',rf'\g<1>{new}\g<2>',s,count=1,flags=re.I)
            if not n1 or not n2: raise SystemExit(f'{path}: version headings not updated')
            if not re.search(r'^###\s+v'+re.escape(new)+r'\b',s,re.M):
              m=re.search(r'^###\s+v\d',s,re.M)
              add=f'### v{new} — Mobile top alignment\n- Panels and settings sheets open from the top of the TornPDA viewport.\n- Uses the shared SakaLuX mobile positioning contract.\n\n'
              s=s[:m.start()]+add+s[m.start():] if m else s+'\n'+add
            p.write_text(s,encoding='utf-8')
          for path,v in docs.items(): upd_doc(path,*v)

          # Hub documentation and registered versions.
          p=Path('greasyfork/Script-Hub.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('**v1.9.46**','**v1.9.47**',1)
          s=s.replace('**v1.9.46** Right-side 2x2 module controls, compact Settings toggles, top-aligned SakaLuX sheets and corrected Company footer/scroll behavior.','**v1.9.47** Global top-alignment correction for Hub, managed modules and Chat, plus authoritative right-side module controls.',1)
          for _,(old,new) in bumps.items(): s=s.replace(f'**v{old}**',f'**v{new}**',1)
          if '### v1.9.47 ' not in s:
            marker='## Release history\n'
            add='### v1.9.47 — Global mobile top alignment\n\n- Applies the top-alignment contract in each managed script and Chat Intelligence.\n- Forces Hub module controls into the compact right-side 2×2 block after legacy CSS.\n- Normalizes compact Settings switches.\n\n'
            s=s.replace(marker,marker+add,1)
          p.write_text(s,encoding='utf-8')

          # Chat runtime was stale at 1.2.8 despite 1.2.9 metadata; force exact sync now.
          cp=Path('SakaLuX-Chat-Intelligence.user.js'); cs=cp.read_text(encoding='utf-8')
          cs=re.sub(r"const V=['\"][^'\"]+['\"]", "const V='1.2.10'", cs, count=1)
          cp.write_text(cs,encoding='utf-8')

      - name: Syntax and registry checks
        shell: bash
        run: |
          set -e
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Elimination-Assistant.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          node --check SakaLuX-Chat-Intelligence.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-*.user.js scripts.json greasyfork/*.md
          git commit -m 'Global top-align SakaLuX mobile panels' || exit 0
          git push

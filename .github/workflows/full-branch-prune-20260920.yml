name: Full branch prune 2026-09-20
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-branch-prune-20260920.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: full-branch-prune-main
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -vE '^(main|HEAD)$' | sort -u)
          echo "Deleting ${#branches[@]} remote branches..."
          for b in "${branches[@]}"; do
            echo "Deleting $b"
            git push origin --delete "$b"
          done
          remaining=$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | grep -v '^main$' || true)
          if [ -n "$remaining" ]; then
            echo "Unexpected branches remain:"
            echo "$remaining"
            exit 1
          fi
      - name: Remove this one-shot workflow
        run: |
          rm -f .github/workflows/full-branch-prune-20260920.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-shot branch cleanup workflow"
          git push

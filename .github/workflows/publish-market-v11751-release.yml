name: Publish Market v1.17.51 Release

on:
  push:
    branches:
      - test/market-travel-state-machine
    paths:
      - .github/workflows/publish-market-v11751-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release build
        run: |
          node --check SakaLuX-Market-Intelligence.user.js
          node tests/market-travel-state-machine-regression.cjs
          grep -q '@version      1.17.51' SakaLuX-Market-Intelligence.user.js
          grep -q 'Canonical version: \*\*v1.17.51\*\*' greasyfork/Market-Intelligence.md
      - name: Prepare release assets
        run: |
          cp SakaLuX-Market-Intelligence.user.js SakaLuX-Market-Intelligence-v1.17.51.user.js
          cat > market-intelligence-v1.17.51.md <<'EOF'
          # Market Intelligence v1.17.51 — Explicit Travel state machine

          - Adds explicit `TORN_TRAVEL_AGENCY`, `IN_FLIGHT`, `LANDED_ABROAD` and `OTHER` travel states.
          - Best Route Basket is limited to Torn Travel Agency.
          - Arrival Basket is limited to active flights.
          - In-country Best Buys / Travel Buy Planner are limited to landed foreign-country pages.
          - Travel Session Summary stays inside the travel lifecycle.
          - SPA/TornPDA navigation removes stale travel panels deterministically.
          - Regression coverage validates Hawaii and Travel → Flight → foreign country → Messages → Travel.

          Validation: JavaScript syntax, registry/release surfaces and the Market Travel state-machine regression suite pass on the release build.
          EOF
          sha256sum SakaLuX-Market-Intelligence-v1.17.51.user.js market-intelligence-v1.17.51.md > SHA256SUMS-Market-v1.17.51.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view market-intelligence-v1.17.51 >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create market-intelligence-v1.17.51 \
              SakaLuX-Market-Intelligence-v1.17.51.user.js \
              market-intelligence-v1.17.51.md \
              SHA256SUMS-Market-v1.17.51.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target d0f4769f4661aa3e59067dec1c5047ebba42c69f \
              --title 'SakaLuX Market Intelligence v1.17.51 — Travel State Machine' \
              --notes-file market-intelligence-v1.17.51.md
          fi

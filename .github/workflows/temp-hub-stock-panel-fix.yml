name: Apply Hub launcher and Stocks panel fix
on:
  push:
    paths:
      - '.github/workflows/temp-hub-stock-panel-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/fix_hub_stock_panel.py
      - name: Validate patched files
        run: |
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit patch
        run: |
          git config user.name 'SakaLuX Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Script-Hub.user.js SakaLuX-Stock-Manager-Advisor.user.js scripts.json greasyfork/Script-Hub.md greasyfork/Stock-Manager-Advisor.md .github/workflows/validate-userscripts.yml
          git commit -m 'Fix Hub launcher visibility and Stocks panel layout' || exit 0
          git push origin HEAD:main

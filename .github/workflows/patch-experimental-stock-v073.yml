name: Patch experimental Stock Manager v0.7.3
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v073.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v073.py
      - name: Validate
        run: |
          grep -q '@version      0.7.3' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.7.3'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function buildPortfolioRows' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'const isDryRun = () => bool(K.dryRun,true)' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-inline-compact"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'id="slx-exec-rebalance" class="primary"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Rebalance Preview' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          ! grep -q 'id="slx-compact-mode"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          ! grep -q 'id="slx-inline-edit-presets"' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.7.3 inline workspace and runtime fixes'
          git push

name: Finalize Stocks and Company API Layout

on:
  push:
    paths:
      - '.github/finalize-stock-company-api-layout.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch
        run: python3 .github/scripts/finalize_stock_company_api_layout.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          python3 -m json.tool scripts.json >/dev/null
          grep -q '@version      0.7.18' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SAKALUX_STOCK_API_FINAL_V0718' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q '@version      1.8.38' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q 'SAKALUX_COMPANY_API_FINAL_V1838' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q 'v0.7.18' greasyfork/Stock-Manager-Advisor.md
          grep -q 'v1.8.38' greasyfork/Company-Intelligence.md

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js scripts.json greasyfork/Stock-Manager-Advisor.md greasyfork/Company-Intelligence.md backups/stock-company-api-final-2026-09-18/
          git commit -m 'Stocks v0.7.18 + Company v1.8.38: finalize API layout and release docs'
          git push

name: Fix Suite OC entry v0.9.936
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_suite_oc_entry_v0936.py'
      - '.github/workflows/fix-suite-oc-entry-v0936.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply OC entry fix
        run: python3 .github/scripts/fix_suite_oc_entry_v0936.py
      - name: Validate Suite syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Assert OC entry behavior
        run: |
          grep -q '@version      0.9.936' SakaLuX-Suite.user.js
          grep -q 'Do NOT invalidate an already completed scan' SakaLuX-Suite.user.js
          grep -q 'const domResult = await scanCurrentCrimesStage();' SakaLuX-Suite.user.js
          grep -q 'incorrect id-entity relation' SakaLuX-Suite.user.js
          ! python3 - <<'PY'
from pathlib import Path
s=Path('SakaLuX-Suite.user.js').read_text()
a=s.index('async function handleOcStageEntry')
b=s.index('function refreshNotInOCFromPage',a)
chunk=s[a:b]
raise SystemExit(1 if 'markStageScanRequired(stage);' in chunk else 0)
PY
          grep -q 'v0.9.936 — OC scan visual state + API fallback' greasyfork/SakaLuX-Suite.md
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Fix Suite OC scan state and faction API fallback"
          git push

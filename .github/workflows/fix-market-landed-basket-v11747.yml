name: Fix Market landed basket v1.17.47
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_market_landed_basket_v11747.py'
      - '.github/workflows/fix-market-landed-basket-v11747.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-landed-basket-v11747
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply landed basket fix
        run: python3 .github/scripts/fix_market_landed_basket_v11747.py
      - name: Validate userscript syntax
        run: node --check SakaLuX-Market-Intelligence.user.js
      - name: Validate registry JSON
        run: python3 -m json.tool scripts.json >/dev/null
      - name: Verify landed basket guard
        run: |
          grep -q '@version      1.17.47' SakaLuX-Market-Intelligence.user.js
          grep -q "if(!settings.bestRun||detectPage()!=='travel'||detectInFlight())" SakaLuX-Market-Intelligence.user.js
          grep -q 'v1.17.47' greasyfork/Market-Intelligence.md
      - name: Commit release
        run: |
          if git diff --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Market-Intelligence.user.js scripts.json SakaLuX-Script-Hub.user.js greasyfork/Market-Intelligence.md
          git commit -m 'Release Market Intelligence v1.17.47 landed basket fix'
          git push
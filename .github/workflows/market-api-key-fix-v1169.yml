name: Market Intelligence API Key Fix v1.16.9

on:
  push:
    paths:
      - '.github/workflows/market-api-key-fix-v1169.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/market_api_key_fix_v1169.py
      - name: Validate
        run: |
          node --check SakaLuX-Market-Intelligence.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Market-Intelligence.user.js').read_text()
          assert '// @version      1.16.9' in s
          assert "const VERSION = '1.16.9';" in s
          assert 'API KEY MISSING EQUIPMENT ACCESS' in s
          assert 'SAVE NEW API KEY' in s
          assert 'CHECK API ACCESS' in s
          assert 'checkRequiredApiAccess' in s
          data=json.loads(Path('scripts.json').read_text())
          assert next(x for x in data['scripts'] if x['id']=='market-intelligence')['version']=='1.16.9'
          assert Path('backups/SakaLuX-Market-Intelligence-v1.16.8.user.js').exists()
          assert '**Current version: v1.16.9**' in Path('greasyfork/Market-Intelligence.md').read_text()
          PY
      - name: Commit
        run: |
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Market-Intelligence.user.js scripts.json greasyfork/Market-Intelligence.md UPDATE-INFO.md backups/SakaLuX-Market-Intelligence-v1.16.8.user.js
          git diff --cached --quiet || git commit -m "fix: Market Intelligence v1.16.9 API key diagnostics"
          git push origin main

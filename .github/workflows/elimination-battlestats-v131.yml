name: Elimination BattleStats Fix v1.3.1

on:
  push:
    paths:
      - '.github/workflows/elimination-battlestats-v131.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Elimination Assistant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('SakaLuX-Elimination-Assistant.user.js')
          s=p.read_text()
          old=s
          b=Path('backups/SakaLuX-Elimination-Assistant-v1.3.0.user.js')
          if not b.exists(): b.write_text(s)

          s=s.replace('// @version      1.3.0','// @version      1.3.1',1)
          s=s.replace("const VERSION='1.3.0';","const VERSION='1.3.1';",1)

          old_cal="""async function calibrate(force=false){if(state.my.source==='manual'&&!force)return state.my.total;if(!force&&state.my.total&&Date.now()-Number(state.my.at||0)<900000)return state.my.total;const raw=await torn('user/battlestats');const x=raw?.battlestats??raw?.data??raw??{};const total=['strength','defense','speed','dexterity'].reduce((s,k)=>s+Number(x[k]??x?.battle_stats?.[k]??0),0);if(!total)throw new Error('battlestats not returned; run TEST TORN KEY');state.my={total,at:Date.now(),source:'Torn API'};save(K.my,state.my);apply();return total}"""
          new_cal="""async function calibrate(force=false){
  if(state.my.source==='manual'&&!force)return state.my.total;
  if(!force&&state.my.total&&Date.now()-Number(state.my.at||0)<900000)return state.my.total;
  const raw=await torn('user/battlestats');
  const x=raw?.battlestats??raw?.data?.battlestats??raw?.data??raw??{};
  const statVal=k=>{
    const v=x?.[k]??x?.battle_stats?.[k]??0;
    if(v&&typeof v==='object')return Number(v.value??v.amount??v.total??v.base??0)||0;
    return Number(v)||0;
  };
  const apiTotal=Number(x?.total??x?.total_battlestats??0)||0;
  const total=apiTotal||['strength','defense','speed','dexterity'].reduce((sum,k)=>sum+statVal(k),0);
  if(!total)throw new Error('Battle stats endpoint replied, but no stat values were found. Check Torn API key access.');
  state.my={total,at:Date.now(),source:'Torn API'};save(K.my,state.my);apply();setStatus('Battle stats calibrated: '+fmtBS(total));return total
}"""
          if old_cal not in s: raise SystemExit('calibrate marker missing')
          s=s.replace(old_cal,new_cal,1)
          p.write_text(s)
          if s==old: raise SystemExit('no changes')

          j=Path('scripts.json'); data=json.loads(j.read_text())
          for row in data.get('scripts',[]):
              if row.get('id')=='elimination-assistant': row['version']='1.3.1'
          j.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          md=Path('greasyfork/Elimination-Assistant.md'); t=md.read_text()
          t=t.replace('**Current version: v1.3.0**','**Current version: v1.3.1**',1)
          entry='''\n## v1.3.1 — Battle Stats API v2 Fix\n\n- Fixed **CALIBRATE ME** for Torn API v2 battle stats, where each stat is now returned as an object containing a `value`.\n- Uses the API-provided `battlestats.total` when available, with per-stat `value` fallback.\n- Supports both current v2 and older/simple numeric response shapes.\n- Added a clear successful calibration status message.\n- Added exact backup: `backups/SakaLuX-Elimination-Assistant-v1.3.0.user.js`.\n\n'''
          if '## v1.3.1 — Battle Stats API v2 Fix' not in t:
              pos=t.find('\n## '); t=t[:pos+1]+entry+t[pos+1:]
          md.write_text(t)

          u=Path('UPDATE-INFO.md'); x=u.read_text()
          x=x.replace('SakaLuX Elimination Assistant: **v1.3.0**','SakaLuX Elimination Assistant: **v1.3.1**',1)
          latest='''\n### SakaLuX Elimination Assistant v1.3.1\n- Fixed CALIBRATE ME for the current Torn API v2 battlestats object shape (`strength.value`, `defense.value`, `speed.value`, `dexterity.value`) and `battlestats.total`.\n- Added exact backup: `backups/SakaLuX-Elimination-Assistant-v1.3.0.user.js`.\n\n'''
          if '### SakaLuX Elimination Assistant v1.3.1' not in x:
              x=x.replace('## Latest changes\n','## Latest changes\n'+latest,1)
          u.write_text(x)
          PY
      - name: Validate
        run: |
          node --check SakaLuX-Elimination-Assistant.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Elimination-Assistant.user.js').read_text()
          assert '// @version      1.3.1' in s
          assert "const VERSION='1.3.1';" in s
          assert 'v.value' in s
          assert 'x?.total' in s
          d=json.loads(Path('scripts.json').read_text())
          assert next(x for x in d['scripts'] if x['id']=='elimination-assistant')['version']=='1.3.1'
          assert Path('backups/SakaLuX-Elimination-Assistant-v1.3.0.user.js').exists()
          PY
      - name: Commit
        run: |
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Elimination-Assistant.user.js scripts.json greasyfork/Elimination-Assistant.md UPDATE-INFO.md backups/SakaLuX-Elimination-Assistant-v1.3.0.user.js
          git diff --cached --quiet || git commit -m "fix: Elimination Assistant v1.3.1 battlestats API v2"
          git push origin main

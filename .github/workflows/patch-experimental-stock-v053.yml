name: Patch experimental Stock Manager v0.5.3
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v053.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v053.py
      - name: Validate
        run: |
          grep -q '@version      0.5.3' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.5.3'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function renderInlineWorkspace' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function renderInlineAdvisor' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function renderInlineTrade' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function renderInlineRebalance' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function scheduleInlineMount' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SLX_STOCK_INLINE_TAB' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.5.3' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.5.3 inline workspace'
          git pull --rebase origin main
          git push

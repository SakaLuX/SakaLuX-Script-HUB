name: Fix Hub 1.9.53

on:
  push:
    paths:
      - '.github/scripts/fix_hub_1953.py'
      - '.github/workflows/fix-hub-1953.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hub and module fixes
        run: python .github/scripts/fix_hub_1953.py
      - name: Validate syntax and registry
        run: |
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit fixes
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js SakaLuX-Enhancer-Guard.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Market-Intelligence.user.js scripts.json greasyfork backups/hub-responsive-perf-2026-09-17
          git commit -m "fix: bottom-align Hub and reduce tap latency"
          git push

name: Fix Hub Fullscreen 1.9.55

on:
  push:
    paths:
      - '.github/scripts/fix_hub_fullscreen_1955.py'
      - '.github/workflows/fix-hub-fullscreen-1955.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hub full-screen parity patch
        run: python .github/scripts/fix_hub_fullscreen_1955.py
      - name: Validate Hub and registry
        run: |
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit Hub 1.9.55
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md backups/hub-fullscreen-1955-2026-09-17
          git commit -m "fix: align Hub fullscreen with working add-on panels"
          git push

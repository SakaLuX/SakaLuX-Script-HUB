name: Final version audit consistency fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-version-audit-fix.yml'
      - '.migration/final-version-audit-fix.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply consistency fix
        run: python .migration/final-version-audit-fix.py
      - name: Validate modified repository
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Account-Auditor.user.js
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          node --check SakaLuX-Suite.user.js
          grep -q '^// @version      1.9.38$' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.38';" SakaLuX-Script-Hub.user.js
          grep -q "version: '1.0.18'" SakaLuX-Script-Hub.user.js
          grep -q '"version": "1.0.18"' scripts.json
          python -m json.tool scripts.json >/dev/null
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md .github/workflows/validate-userscripts.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize registry and audit consistency v1.9.38 [skip ci]'
          git push

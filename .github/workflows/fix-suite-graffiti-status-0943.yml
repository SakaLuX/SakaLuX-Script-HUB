name: Fix Suite graffiti/status 0.9.943
on:
  push:
    branches: [fix/suite-graffiti-status-0943]
    paths:
      - '.github/scripts/fix_suite_graffiti_status_0943.py'
      - '.github/workflows/fix-suite-graffiti-status-0943.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python .github/scripts/fix_suite_graffiti_status_0943.py
      - run: node --check SakaLuX-Suite.user.js
      - run: node tests/suite-graffiti-status-0943-regression.cjs
      - run: npm install --no-save --ignore-scripts jsdom
      - run: node tests/suite-modules-regression.cjs
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-graffiti-status-0943-regression.cjs
          git commit -m 'Fix Suite graffiti rendering and module state sync v0.9.943'
          git push

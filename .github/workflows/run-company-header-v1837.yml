name: Run Company header v1.8.37

on:
  push:
    paths:
      - '.github/run-company-header-v1837.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: python3 .github/scripts/fix_company_header_v1837.py
      - name: Validate
        run: |
          node --check SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q '// @version      1.8.37' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q 'SAKALUX_COMPANY_PRO_HEADER_V1837' SakaLuX-Company-Intelligence-v1.0.0.user.js
          grep -q '### v1.8.37' greasyfork/Company-Intelligence.md
      - name: Commit
        run: |
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Company-Intelligence-v1.0.0.user.js greasyfork/Company-Intelligence.md backups/company-v1.8.37-professional-mobile-header-2026-09-18
          git commit -m 'Company v1.8.37: professional mobile header layout'
          git push

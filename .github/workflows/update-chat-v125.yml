name: Update Chat Intelligence v1.2.25

on:
  push:
    paths:
      - '.github/scripts/update_chat_v125.py'
      - '.github/workflows/update-chat-v125.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Chat Intelligence v1.2.25 patch
        run: python .github/scripts/update_chat_v125.py
      - name: Syntax check
        run: node --check SakaLuX-Chat-Intelligence.user.js
      - name: Verify v1.2.25 controls
        run: |
          grep -q '@version      1.2.25' SakaLuX-Chat-Intelligence.user.js
          grep -q "const V='1.2.25'" SakaLuX-Chat-Intelligence.user.js
          grep -q "data-o title=\"Chat Intelligence settings\"" SakaLuX-Chat-Intelligence.user.js
          grep -q "function chatShell" SakaLuX-Chat-Intelligence.user.js
          grep -q "Message context actions" SakaLuX-Chat-Intelligence.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Chat-Intelligence.user.js greasyfork/Chat-Intelligence.md
          if git diff --cached --quiet; then
            echo 'No release changes required.'
          else
            git commit -m 'Release Chat Intelligence v1.2.25'
            git push
          fi

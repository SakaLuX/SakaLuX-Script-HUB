name: Sync Release Docs 1.9.54

on:
  push:
    paths:
      - '.github/scripts/sync_release_docs_1954.py'
      - '.github/workflows/sync-release-docs-1954.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync release docs
        run: python .github/scripts/sync_release_docs_1954.py
      - name: Commit docs
        run: |
          git config user.name "SakaLuX Automation"
          git config user.email "actions@users.noreply.github.com"
          git add greasyfork
          git commit -m "docs: sync current release notes and changelogs"
          git push

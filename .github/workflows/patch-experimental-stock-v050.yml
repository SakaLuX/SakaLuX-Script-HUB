name: Patch experimental Stock Manager v0.5.0
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v050.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v050b.py
      - name: Validate
        run: |
          grep -q '@version      0.5.0' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.5.0'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'SLX_STOCK_BANK_APR' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function buildOptimizerRows()' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function renderOptimizer()' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'paybackDays' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Portfolio Optimizer' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.5.0' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.5.0 portfolio optimizer'
          git pull --rebase origin main
          git push

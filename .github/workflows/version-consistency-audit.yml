name: Version Consistency Audit

on:
  push:
    paths:
      - 'SakaLuX-*.user.js'
      - 'scripts.json'
      - 'greasyfork/**'
      - 'releases/**'
      - 'tools/verify_version_consistency.py'
      - '.github/workflows/version-consistency-audit.yml'
  pull_request:
    paths:
      - 'SakaLuX-*.user.js'
      - 'scripts.json'
      - 'greasyfork/**'
      - 'releases/**'
      - 'tools/verify_version_consistency.py'
      - '.github/workflows/version-consistency-audit.yml'
  workflow_dispatch:

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source, runtime, Hub registry, documentation and release metadata
        run: python tools/verify_version_consistency.py

name: Fix Suite OC scan v0.9.934
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_suite_oc_scan_v0934.py'
      - '.github/workflows/fix-suite-oc-scan-v0934.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply OC scan fix
        run: python3 .github/scripts/fix_suite_oc_scan_v0934.py
      - name: Validate Suite syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Assert OC scan fix
        run: |
          grep -q '@version      0.9.934' SakaLuX-Suite.user.js
          grep -q 'for (let attempt = 0; attempt < 8 && !roots.length' SakaLuX-Suite.user.js
          grep -q 'Required-item tooltip failure must not abort the entire stage scan' SakaLuX-Suite.user.js
          grep -q 'Scan failed: ${err.message}' SakaLuX-Suite.user.js
          grep -q 'v0.9.934 — OC Recruiting/Planning scan reliability' greasyfork/SakaLuX-Suite.md
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Fix Suite OC Recruiting and Planning scan"
          git push

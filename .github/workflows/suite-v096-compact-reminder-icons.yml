name: Apply SakaLuX Suite v0.9.6 compact reminder icons
on:
  push:
    paths:
      - '.github/workflows/suite-v096-compact-reminder-icons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make reminder icons compact and Torn-row friendly
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('SakaLuX-Suite.user.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'// @version\s+0\.9\.\d+', '// @version      0.9.6', s, count=1)
          s=re.sub(r"const VERSION='0\.9\.\d+';", "const VERSION='0.9.6';", s, count=1)

          # Replace the reminder button styling with a two-layer control:
          # a small transparent hit area + an even smaller circular glyph.
          s=re.sub(
              r"#\$\{IDS\.dock\}\{[^}]*\}\.slx-rem-btn\{[^}]*\}\.slx-rem-btn:active\{[^}]*\}",
              "#${IDS.dock}{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:1px!important;z-index:2147483644;order:2147483647!important;flex:0 0 auto!important;width:auto!important;height:24px!important;min-height:24px!important;margin:0 1px!important;padding:0!important}.slx-rem-btn{all:unset!important;box-sizing:border-box!important;width:23px!important;height:24px!important;min-width:23px!important;min-height:24px!important;max-width:23px!important;max-height:24px!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;flex:0 0 23px!important;-webkit-tap-highlight-color:transparent!important}.slx-rem-glyph{box-sizing:border-box!important;width:19px!important;height:19px!important;min-width:19px!important;min-height:19px!important;max-width:19px!important;max-height:19px!important;border-radius:50%!important;border:1px solid #4d5c68!important;background:radial-gradient(circle at 38% 32%,#33414c 0,#26323b 58%,#1c252c 100%)!important;color:#e2e9ee!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:11px!important;font-weight:700!important;line-height:19px!important;font-family:Arial,sans-serif!important;box-shadow:inset 0 1px 1px #ffffff14,0 1px 2px #0008!important;overflow:hidden!important}.slx-rem-btn:active .slx-rem-glyph{transform:scale(.9)!important;opacity:.82!important}",
              s,
              count=1
          )

          old="""function iconButton(id,text,title,fn){
 const b=document.createElement('button');
 b.type='button';b.id=id;b.className='slx-rem-btn';b.textContent=text;b.title=title;b.setAttribute('aria-label',title);
 b.onclick=e=>{e.preventDefault();e.stopPropagation();fn()};
 return b
}"""
          new="""function iconButton(id,text,title,fn){
 const b=document.createElement('button');
 b.type='button';b.id=id;b.className='slx-rem-btn';b.title=title;b.setAttribute('aria-label',title);
 const g=document.createElement('span');g.className='slx-rem-glyph';g.textContent=text;b.appendChild(g);
 b.onclick=e=>{e.preventDefault();e.stopPropagation();fn()};
 return b
}"""
          if old not in s:
              raise SystemExit('iconButton block not found')
          s=s.replace(old,new,1)

          # Ensure the dock stays at the visual right/end of the discovered resource strip.
          a=s.index('function ensureDock(){')
          b=s.index('function iconButton',a)
          block=s[a:b]
          block=re.sub(r"d\.style\.cssText='[^']*';\n  return d", "d.style.cssText='display:inline-flex!important;flex-direction:row!important;align-items:center!important;justify-content:center!important;gap:1px!important;position:static!important;inset:auto!important;margin:0 1px!important;padding:0!important;width:auto!important;height:24px!important;min-height:24px!important;z-index:auto!important;vertical-align:middle!important;flex:0 0 auto!important;order:2147483647!important;';\n  return d", block, count=1)
          s=s[:a]+block+s[b:]

          p.write_text(s,encoding='utf-8')

          d=Path('greasyfork/SakaLuX-Suite.md')
          if d.exists():
              t=d.read_text(encoding='utf-8')
              t=re.sub(r'\*\*v0\.9\.\d+\*\*','**v0.9.6**',t,count=1)
              if '### v0.9.6 — compact native-style reminder icons' not in t:
                  t += '\n\n### v0.9.6 — compact native-style reminder icons\n- Rebuilt reminder controls as a small transparent hit area with a 19 px circular glyph to avoid Torn/PDA inherited button sizing.\n- Reduced spacing to 1 px and kept the reminder group at the visual end/right side of the resource strip.\n- Styling is independently implemented from observed public behavior; no third-party source/CSS was copied.\n'
              d.write_text(t,encoding='utf-8')
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.9.6
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m 'Shrink Suite reminder icons and isolate Torn button styles in v0.9.6'
          git push origin HEAD:main

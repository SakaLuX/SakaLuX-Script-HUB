name: Update Market Intelligence v1.17.53
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_market_v11753.py'
      - '.github/workflows/update-market-v11753.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-v11753
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Market update
        run: python3 .github/scripts/update_market_v11753.py
      - name: Validate userscripts
        run: |
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Script-Hub.user.js
      - name: Validate registry
        run: python3 -m json.tool scripts.json >/dev/null
      - name: Verify fixes
        run: |
          grep -q '@version      1.17.53' SakaLuX-Market-Intelligence.user.js
          grep -q "const VERSION = '1.17.53';" SakaLuX-Market-Intelligence.user.js
          grep -q 'travelInlineInfo: true' SakaLuX-Market-Intelligence.user.js
          grep -q 'MI INFO:' SakaLuX-Market-Intelligence.user.js
          grep -q 'parseTravelStockCell' SakaLuX-Market-Intelligence.user.js
          grep -q "const VERSION = '1.9.88';" SakaLuX-Script-Hub.user.js
          grep -q '"version": "1.17.53"' scripts.json
      - name: Commit release
        run: |
          if git diff --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Market-Intelligence.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Market-Intelligence.md releases/market-intelligence-v1.17.53.md
          git commit -m 'Release Market Intelligence v1.17.53'
          git push

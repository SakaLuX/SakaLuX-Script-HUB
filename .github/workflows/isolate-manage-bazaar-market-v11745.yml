name: Market Intelligence v1.17.45 Manage Bazaar isolation
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/isolate_manage_bazaar_market_v11745.py'
      - '.github/workflows/isolate-manage-bazaar-market-v11745.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-v11745-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply strict Manage Bazaar isolation
        run: python3 .github/scripts/isolate_manage_bazaar_market_v11745.py
      - name: Validate
        run: |
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Script-Hub.user.js
          python3 -m json.tool scripts.json >/dev/null
          grep -F '// @version      1.17.45' SakaLuX-Market-Intelligence.user.js
          grep -F 'if(isManageBazaarPage()){purgeManageBazaarMarketUi();return;}' SakaLuX-Market-Intelligence.user.js
          grep -F 'function purgeManageBazaarMarketUi()' SakaLuX-Market-Intelligence.user.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Market-Intelligence.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Market-Intelligence.md greasyfork/Script-Hub.md releases/market-intelligence-v1.17.45.md backups/market-manage-isolation-v1.17.44-2026-09-20
          git commit -m "Release Market Intelligence v1.17.45 strict Manage Bazaar isolation"
          git push
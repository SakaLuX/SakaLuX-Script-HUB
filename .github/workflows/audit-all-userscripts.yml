name: Audit all active userscripts
on:
  push:
    branches: [main]
    paths:
      - '.github/audit-all-userscripts.trigger'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every active userscript
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.user.js' \
            ! -path './backups/*' \
            ! -path './.migration/*' \
            ! -path './node_modules/*' | sort)
          echo "Active userscripts found: ${#files[@]}"
          printf '%s\n' "${files[@]}"
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do
            echo "::group::node --check $file"
            node --check "$file"
            echo "::endgroup::"
          done
      - name: Metadata and registry audit
        shell: python
        run: |
          import json,re
          from pathlib import Path
          files=[p for p in Path('.').rglob('*.user.js') if 'backups' not in p.parts and '.migration' not in p.parts]
          errors=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              for token in ('// ==UserScript==','// ==/UserScript==','// @version','// @match'):
                  if token not in s: errors.append(f'{p}: missing {token}')
              m=re.search(r'^// @version\s+([^\s]+)',s,re.M)
              if not m: errors.append(f'{p}: unreadable @version')
          reg=json.loads(Path('scripts.json').read_text(encoding='utf-8'))['scripts']
          hub=Path('SakaLuX-Script-Hub.user.js').read_text(encoding='utf-8')
          info=Path('greasyfork/Script-Hub.md').read_text(encoding='utf-8')
          for item in reg:
              src=item.get('sourceUrl','').split('/main/',1)[-1]
              p=Path(src)
              if not p.exists():
                  errors.append(f"registry {item['id']}: missing source {src}")
                  continue
              s=p.read_text(encoding='utf-8')
              m=re.search(r'^// @version\s+([^\s]+)',s,re.M)
              if not m or m.group(1)!=str(item['version']):
                  errors.append(f"registry {item['id']}: header={m.group(1) if m else 'missing'} registry={item['version']}")
              if item.get('sourceUrl') != f'https://raw.githubusercontent.com/SakaLuX/SakaLuX-Script-HUB/main/{src}':
                  errors.append(f"registry {item['id']}: non-canonical sourceUrl")
              name=item['name']
              pat=rf'SakaLuX\s+{re.escape(name)}(?:\s+-\s+PDA)?\s+\*\*v{re.escape(str(item["version"]))}\*\*'
              if not re.search(pat,info,re.I):
                  errors.append(f"Script-Hub.md: {name} version not synchronized to {item['version']}")
          # Known runtime helpers that previously regressed in Stock Manager.
          stock=Path('experimental/SakaLuX-Stock-Manager-Advisor.user.js')
          if stock.exists():
              s=stock.read_text(encoding='utf-8')
              for token in ('function buildPortfolioRows()', 'const isDryRun = () => bool(K.dryRun,true)', 'function buildRebalancePreview()', 'function renderInlineWorkspace('):
                  if token not in s: errors.append(f'Stock Manager: missing runtime helper {token}')
          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              raise SystemExit(1)
          print(f'Metadata/registry audit OK for {len(files)} active userscripts')
      - name: Report suspicious unresolved placeholders
        shell: bash
        run: |
          set -euo pipefail
          echo 'Scanning active userscripts for merge markers / obvious placeholders'
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)|\b(TODO_FATAL|FIXME_FATAL)\b' --include='*.user.js' --exclude-dir=backups --exclude-dir=.migration .; then
            echo 'Suspicious unresolved markers found' >&2
            exit 1
          fi
          echo 'No unresolved merge/fatal markers found.'

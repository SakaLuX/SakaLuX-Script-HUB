name: Patch Stock API buttons v0.8.10

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_stock_api_buttons_v0810.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Stock Manager API buttons
        run: python3 .github/scripts/patch_stock_api_buttons_v0810.py
      - name: Normalize release surfaces
        run: python3 .github/scripts/normalize_installed_versions.py
      - name: Validate JavaScript
        run: |
          node --check SakaLuX-Stock-Manager-Advisor.user.js
          node --check SakaLuX-Script-Hub.user.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Stock-Manager-Advisor.md
          git commit -m "Stock Manager v0.8.10: align API action buttons"
          git push

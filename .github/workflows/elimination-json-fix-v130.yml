name: Elimination JSON Transport Fix v1.3.0

on:
  push:
    paths:
      - '.github/workflows/elimination-json-fix-v130.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 .github/scripts/elimination_json_fix_v130.py
      - name: Validate
        run: |
          node --check SakaLuX-Elimination-Assistant.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Elimination-Assistant.user.js').read_text()
          assert '// @version      1.3.0' in s
          assert "const VERSION='1.3.0';" in s
          assert "Empty API response" in s
          assert "viaFetch" in s
          d=json.loads(Path('scripts.json').read_text())
          assert next(x for x in d['scripts'] if x['id']=='elimination-assistant')['version']=='1.3.0'
          assert Path('backups/SakaLuX-Elimination-Assistant-v1.2.9.user.js').exists()
          PY
      - name: Commit
        run: |
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Elimination-Assistant.user.js scripts.json greasyfork/Elimination-Assistant.md UPDATE-INFO.md backups/SakaLuX-Elimination-Assistant-v1.2.9.user.js
          git diff --cached --quiet || git commit -m "fix: Elimination Assistant v1.3.0 TornPDA JSON transport"
          git push origin main

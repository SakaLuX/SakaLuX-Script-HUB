name: Add Account Auditor API panel v1.3.20
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_account_auditor_api_panel_v1320.py'
      - '.github/workflows/add-account-auditor-api-panel-v1320.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Auditor API Access panel
        run: python3 .github/scripts/add_account_auditor_api_panel_v1320.py
      - name: Validate syntax
        run: node --check SakaLuX-Account-Auditor.user.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Account-Auditor.user.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Account Auditor API Access panel"
          git push

name: Suite 0.9.947 stable UI
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/suite_0947_stable_ui_patch.py'
      - '.github/workflows/suite-0947-stable-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply patch
        run: python .github/scripts/suite_0947_stable_ui_patch.py
      - name: Syntax check
        run: node --check SakaLuX-Suite.user.js
      - name: Stable UI regression
        run: node tests/suite-0947-stable-ui-regression.cjs
      - name: Existing Suite regression
        run: |
          npm install --no-save --ignore-scripts jsdom
          node tests/suite-modules-regression.cjs
      - name: Commit release
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md tests/suite-0947-stable-ui-regression.cjs
          git commit -m 'Release Suite v0.9.947 stable modules and Graffiti'
          git push

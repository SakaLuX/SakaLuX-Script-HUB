name: Migrate Shared Core v1 legacy duplication

on:
  workflow_dispatch:
  push:
    branches:
      - test/shared-core-v1
    paths:
      - src/core/sakalux-core.js
      - tools/migrate-shared-core-legacy.cjs
      - tests/shared-core-v1-regression.cjs
      - .github/workflows/migrate-shared-core-v1-legacy.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/shared-core-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check migration helper
        run: node --check tools/migrate-shared-core-legacy.cjs
      - name: Apply Shared Core dedup migration
        run: node tools/migrate-shared-core-legacy.cjs
      - name: Syntax check all userscripts
        run: |
          find . -type f -name '*.user.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Run Shared Core regression suite
        run: node tests/shared-core-v1-regression.cjs
      - name: Run Market + Stocks compatibility test
        run: node tests/shared-core-v1-compatibility.cjs
      - name: Run repository-wide compatibility test
        run: node tests/shared-core-v1-all-scripts.cjs
      - name: Commit migrated userscripts
        run: |
          if git diff --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.user.js'
          git commit -m 'Deduplicate legacy helpers through Shared Core v1'
          git push origin HEAD:test/shared-core-v1

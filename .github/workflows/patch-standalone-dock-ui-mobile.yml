name: Patch standalone dock mobile UI
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-standalone-dock-ui.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_standalone_dock_ui_mobile.py
      - name: Validate
        run: |
          grep -q '@version      1.3.32' SakaLuX-Enhancer-Guard.user.js
          grep -q '@version      5.3.22' SakaLuX-Bazaar-Thanker-PDA.user.js
          grep -q '@version      1.0.19' SakaLuX-Mission-Rewards.user.js
          grep -q '@version      1.17.20' SakaLuX-Market-Intelligence.user.js
          grep -q '@version      1.3.3' SakaLuX-Account-Auditor.user.js
          grep -q 'max-height:calc(100dvh - 190px)' SakaLuX-Mission-Rewards.user.js
          grep -q 'min-height:42px' SakaLuX-Mission-Rewards.user.js
          grep -q 'company-intelligence' SakaLuX-Mission-Rewards.user.js
          python -m json.tool scripts.json >/dev/null
          node --check SakaLuX-Enhancer-Guard.user.js
          node --check SakaLuX-Bazaar-Thanker-PDA.user.js
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Market-Intelligence.user.js
          node --check SakaLuX-Account-Auditor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Enhancer-Guard.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Account-Auditor.user.js scripts.json
          git commit -m 'Improve standalone dock mobile layout'
          git push

name: One-time Mission Rewards bridge-order fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mission-rewards-bridge.yml'
      - '.migration/fix-mission-rewards-bridge.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .migration/fix-mission-rewards-bridge.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
          grep -q '@version      1.1.2' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.1.2';" SakaLuX-Mission-Rewards.user.js
          grep -q 'publishEarlyPresence' SakaLuX-Mission-Rewards.user.js
          grep -q "bridge.dataset.ready = '1'" SakaLuX-Mission-Rewards.user.js
          grep -q '@version      1.9.40' SakaLuX-Script-Hub.user.js
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          git commit -m 'Fix Mission Rewards bridge initialization [skip ci]'
          git push

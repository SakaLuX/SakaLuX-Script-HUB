name: Update Bazaar Smart Pricer v1.1.1
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_bazaar_smart_pricer_v111.py'
      - '.github/workflows/update-bazaar-smart-pricer-v111.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply update
        run: python3 .github/scripts/update_bazaar_smart_pricer_v111.py
      - name: Validate userscript
        run: node --check SakaLuX-Bazaar-Smart-Pricer.user.js
      - name: Validate registry
        run: python3 -m json.tool scripts.json >/dev/null
      - name: Verify release
        run: |
          grep -q '@version      1.1.1' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'function showApiAccessPanel()' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'SakaLuX_HUB_TORN_API_KEY' SakaLuX-Bazaar-Smart-Pricer.user.js
          grep -q 'function ensureManagePriceEditor(item)' SakaLuX-Bazaar-Smart-Pricer.user.js
      - name: Commit release
        run: |
          if git diff --quiet; then echo 'Already synchronized.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Bazaar-Smart-Pricer.user.js scripts.json CHANGELOG-Bazaar-Smart-Pricer.md greasyfork/Bazaar-Smart-Pricer.md releases/bazaar-smart-pricer-v1.1.1.md
          git commit -m 'Release Bazaar Smart Pricer v1.1.1 Hub API and collapsed manage pricing'
          git push

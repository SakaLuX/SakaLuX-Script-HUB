name: Remove Violentmonkey-specific Hub handling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-violentmonkey-hub.yml'
      - '.migration/remove-violentmonkey-hub.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python .migration/remove-violentmonkey-hub.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q '@version      1.9.34' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.34';" SakaLuX-Script-Hub.user.js
          ! grep -qi 'violentmonkey' SakaLuX-Script-Hub.user.js
          ! grep -qi 'violentmonkey' greasyfork/Script-Hub.md
          grep -q '^// @version      1.0.18$' SakaLuX-Mission-Rewards.user.js
          python -m json.tool scripts.json >/dev/null
      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove Violentmonkey-specific Hub handling [skip ci]'
          git push

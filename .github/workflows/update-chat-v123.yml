name: Update Chat Intelligence v1.2.23

on:
  push:
    paths:
      - '.github/scripts/update_chat_v123.py'
      - '.github/workflows/update-chat-v123.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Chat Intelligence v1.2.23 patch
        run: python .github/scripts/update_chat_v123.py
      - name: Syntax check
        run: node --check SakaLuX-Chat-Intelligence.user.js
      - name: Verify version and restored features
        run: |
          grep -q '@version      1.2.23' SakaLuX-Chat-Intelligence.user.js
          grep -q "const V='1.2.23'" SakaLuX-Chat-Intelligence.user.js
          grep -q "Clear mute list" SakaLuX-Chat-Intelligence.user.js
          grep -q "Optional color" SakaLuX-Chat-Intelligence.user.js
          grep -q "data-s.*Search" SakaLuX-Chat-Intelligence.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Chat-Intelligence.user.js greasyfork/Chat-Intelligence.md
          if git diff --cached --quiet; then
            echo 'No release changes required.'
          else
            git commit -m 'Release Chat Intelligence v1.2.23'
            git push
          fi

name: Fix Hub fly-out first row without Home

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_hub_flyout_first_any_v1982.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Hub Fly-out placement
        run: python3 .github/scripts/fix_hub_flyout_first_any_v1982.py
      - name: Validate Hub JavaScript
        run: node --check SakaLuX-Script-Hub.user.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Script-Hub.user.js
          git commit -m "Hub v1.9.82: first Fly-out row without Home dependency"
          git push

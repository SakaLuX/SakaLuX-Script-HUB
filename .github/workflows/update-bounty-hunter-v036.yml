name: Update Bounty Hunter v0.3.6
on:
  push:
    paths:
      - '.github/workflows/update-bounty-hunter-v036.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Bounty Hunter
        run: python .github/scripts/update_bounty_hunter_v036.py
      - name: Syntax check
        run: node --check SakaLuX-Bounty-Hunter.user.js
      - name: Verify
        run: |
          grep -q '@version      0.3.6' SakaLuX-Bounty-Hunter.user.js
          grep -q "const VERSION='0.3.6'" SakaLuX-Bounty-Hunter.user.js
          grep -q "lastSource='API cache'" SakaLuX-Bounty-Hunter.user.js
          grep -q "travelText" SakaLuX-Bounty-Hunter.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Bounty-Hunter.user.js scripts.json
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Update Bounty Hunter to v0.3.6'
          git pull --rebase origin main
          git push

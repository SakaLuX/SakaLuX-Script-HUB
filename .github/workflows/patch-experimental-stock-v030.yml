name: Patch experimental Stock Manager v0.3.0
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v030.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_experimental_stock_v030.py
      - name: Validate
        run: |
          grep -q '@version      0.3.0' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.3.0'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'REQUIRED_API_KEY_URL' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'Create Required Key' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function renderPortfolio()' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'v0.3.0' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.3.0 API manager and portfolio'
          git push

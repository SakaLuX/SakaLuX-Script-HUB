name: Full SakaLuX performance and UI optimization
on:
  push:
    branches: [main]
    paths:
      - '.github/full-performance-ui-optimization.trigger'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply optimization pass
        run: python .github/scripts/full_performance_ui_optimization.py
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(SakaLuX-*.user.js experimental/SakaLuX-Stock-Manager-Advisor.user.js)
          for f in "${files[@]}"; do echo "node --check $f"; node --check "$f"; done
      - name: Validate registries and core synchronization
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool scripts.json >/dev/null
          python -m json.tool locales.json >/dev/null
          grep -q 'Shared SakaLuX performance + Hub-style UI foundation.' SakaLuX-Script-Hub.user.js
          grep -q 'Shared SakaLuX performance + Hub-style UI foundation.' experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit optimized scripts
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-*.user.js experimental/SakaLuX-Stock-Manager-Advisor.user.js scripts.json greasyfork experimental/Stock-Manager-Advisor.md PERFORMANCE-UI-AUDIT.md
          git commit -m 'Optimize SakaLuX scripts performance and unify Hub-style UI'
          git push

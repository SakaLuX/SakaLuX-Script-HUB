name: Test Priority 7 Daily Progress Dashboard
on:
  push:
    branches: [test/priority7-daily-progress-dashboard]
    paths:
      - 'SakaLuX-Suite.user.js'
      - 'greasyfork/SakaLuX-Suite.md'
      - '.github/scripts/migrate_priority7_daily_progress.py'
      - 'tests/priority7-daily-progress-dashboard-regression.cjs'
      - 'tests/suite-modules-regression.cjs'
      - '.github/workflows/test-priority7-daily-progress-dashboard.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply Priority 7 migration
        run: python3 .github/scripts/migrate_priority7_daily_progress.py
      - name: Install DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/dom-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Syntax check Suite
        run: node --check SakaLuX-Suite.user.js
      - name: Run Daily Progress regression
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/priority7-daily-progress-dashboard-regression.cjs
      - name: Run existing Suite bridge regression
        run: NODE_PATH="$RUNNER_TEMP/dom-tests/node_modules" node tests/suite-modules-regression.cjs
      - name: Commit generated Priority 7 changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Add Suite Daily Progress Dashboard v0.9.939"
          git push

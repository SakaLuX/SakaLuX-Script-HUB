name: Market Intelligence Item Detection v1.16.8

on:
  push:
    paths:
      - '.github/workflows/market-item-detect-v1168.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Market Intelligence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('SakaLuX-Market-Intelligence.user.js')
          s=p.read_text()
          old=s

          backup=Path('backups/SakaLuX-Market-Intelligence-v1.16.7.user.js')
          if not backup.exists(): backup.write_text(s)

          s=s.replace('// @version      1.16.7','// @version      1.16.8',1)
          s=s.replace("const VERSION = '1.16.7';","const VERSION = '1.16.8';",1)

          old_fn="""    function selectedMarketItemId(){const m=(location.hash||'').match(/itemID=(\\d+)/i);return m?Number(m[1]):null;}"""
          new_fn=r'''    function selectedMarketItemId(){
        const sources=[location.hash||'',location.search||'',location.href||''];
        for(const src of sources){
            const m=String(src).match(/(?:itemID|itemId|item_id)=(\d+)/i);
            if(m&&Number(m[1])>0)return Number(m[1]);
        }
        const links=[...document.querySelectorAll('a[href*="itemID="],a[href*="itemId="],[data-itemid],[data-item-id],[data-item]')];
        for(const el of links){
            const raw=el.getAttribute('href')||el.getAttribute('data-itemid')||el.getAttribute('data-item-id')||el.getAttribute('data-item')||'';
            const m=String(raw).match(/(?:itemID|itemId|item_id)?=?\b(\d{1,6})\b/i);
            if(m&&Number(m[1])>0)return Number(m[1]);
        }
        const searchText=normText(document.querySelector('input[type="search"],input[placeholder*="Search" i],input[placeholder*="item" i]')?.value||'').toLowerCase();
        const imgs=[...document.querySelectorAll('img[src*="/images/items/"]')].filter(isVisible);
        if(searchText){
            const exact=imgs.find(img=>normText(img.alt||img.getAttribute('title')||'').toLowerCase()===searchText);
            const id=itemIdFromImg(exact);if(id)return id;
        }
        const ids=imgs.map(itemIdFromImg).filter(Boolean);
        const unique=[...new Set(ids)];
        if(unique.length===1)return unique[0];
        if(ids.length)return ids[0];
        return null;
    }'''
          if old_fn not in s: raise SystemExit('selectedMarketItemId marker missing')
          s=s.replace(old_fn,new_fn,1)

          old_scan="""        const id=selectedMarketItemId();if(!id){previous?.remove();return;}"""
          new_scan="""        const id=selectedMarketItemId();if(!id){if(detectPage()==='itemmarket'){setTimeout(()=>scheduleScan(false),700);return;}previous?.remove();return;}"""
          if old_scan not in s: raise SystemExit('scan id marker missing')
          s=s.replace(old_scan,new_scan,1)

          old_detect="""        if(/sid=ItemMarket/i.test(u)) return 'itemmarket';"""
          new_detect="""        if(/sid=ItemMarket/i.test(u)||document.querySelector('input[type=\"search\"][value],input[placeholder*=\"item\" i]')&&/Item Market/i.test(body)) return 'itemmarket';"""
          if old_detect not in s: raise SystemExit('detectPage marker missing')
          s=s.replace(old_detect,new_detect,1)

          p.write_text(s)
          if s==old: raise SystemExit('no script changes')

          j=Path('scripts.json');data=json.loads(j.read_text())
          for row in data.get('scripts',[]):
              if row.get('id')=='market-intelligence':
                  row['version']='1.16.8'
                  row['description']='Torn PDA-first market/travel intelligence with robust Item Market detection, instant sliding settings, automatic required-key creation, Loadout Comparator, Price Network and travel tools.'
          j.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          md=Path('greasyfork/Market-Intelligence.md');t=md.read_text()
          t=t.replace('**Current version: v1.16.7**','**Current version: v1.16.8**',1)
          entry='''\n## v1.16.8 — TornPDA Item Detection Fix\n\n- Fixed Item Market Intelligence / Loadout Comparator disappearing after TornPDA rerenders or when an item is selected through the search UI without `itemID` remaining in the URL hash.\n- Selected item detection now checks URL hash/query, Torn item links/data attributes and visible item images as fallbacks.\n- If TornPDA is temporarily rebuilding the Item Market DOM, the existing Market Intelligence panel is kept instead of being removed and a short retry is scheduled.\n- Added a TornPDA-oriented Item Market page fallback detector.\n- Added exact backup: `backups/SakaLuX-Market-Intelligence-v1.16.7.user.js`.\n\n'''
          if '## v1.16.8 — TornPDA Item Detection Fix' not in t:
              pos=t.find('\n## '); t=t[:pos+1]+entry+t[pos+1:]
          md.write_text(t)

          u=Path('UPDATE-INFO.md');x=u.read_text()
          x=x.replace('SakaLuX Market Intelligence: **v1.16.7**','SakaLuX Market Intelligence: **v1.16.8**',1)
          latest='''\n### SakaLuX Market Intelligence v1.16.8\n- Fixed Loadout Comparator / Item Market Intelligence disappearing on TornPDA when the selected item ID is not kept in the URL hash.\n- Added URL, DOM-link/data-attribute and visible-item-image fallbacks plus a short DOM rebuild retry that keeps the existing panel visible.\n- Added exact backup: `backups/SakaLuX-Market-Intelligence-v1.16.7.user.js`.\n\n'''
          needle='## Latest changes\n'
          if '### SakaLuX Market Intelligence v1.16.8' not in x: x=x.replace(needle,needle+latest,1)
          u.write_text(x)
          PY
      - name: Validate
        run: |
          node --check SakaLuX-Market-Intelligence.user.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('SakaLuX-Market-Intelligence.user.js').read_text()
          assert '// @version      1.16.8' in s
          assert "const VERSION = '1.16.8';" in s
          assert 'data-itemid' in s
          assert 'setTimeout(()=>scheduleScan(false),700)' in s
          data=json.loads(Path('scripts.json').read_text())
          assert next(x for x in data['scripts'] if x['id']=='market-intelligence')['version']=='1.16.8'
          assert Path('backups/SakaLuX-Market-Intelligence-v1.16.7.user.js').exists()
          assert '**Current version: v1.16.8**' in Path('greasyfork/Market-Intelligence.md').read_text()
          PY
      - name: Commit
        run: |
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Market-Intelligence.user.js scripts.json greasyfork/Market-Intelligence.md UPDATE-INFO.md backups/SakaLuX-Market-Intelligence-v1.16.7.user.js
          git diff --cached --quiet || git commit -m "fix: Market Intelligence v1.16.8 TornPDA item detection"
          git push origin main

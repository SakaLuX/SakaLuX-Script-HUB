name: Publish validated extended performance releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-extended-20260918.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned validation dependencies
        run: |
          python3 -m pip install PyYAML==6.0.3
          npm install --prefix "$RUNNER_TEMP/release-tests" jsdom@30.1.0 --no-audit --no-fund
      - name: Verify complete final sources and functional regressions
        env:
          NODE_PATH: ${{ runner.temp }}/release-tests/node_modules
        run: |
          python3 .github/scripts/validate_repository.py
          node tests/stocks-panel-regression.cjs
          node tests/hub-details-regression.cjs
          node tests/suite-modules-regression.cjs
          node tests/performance/ui-regression.cjs
          node tests/performance/chat-cache-regression.cjs --assert
          node tests/performance/stocks-network-regression.cjs --assert
          node tests/performance/elimination-lifecycle-regression.cjs
          node tests/performance/auditor-rate-regression.cjs --assert
          node tests/performance/request-sharing-regression.cjs
          node tests/performance/run.cjs "$RUNNER_TEMP/final-performance-budget.json" --assert
      - name: Publish complete sources, measured evidence and previous-version archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/report_extended.py
          python3 .github/scripts/publish_extended.py
      - name: Preserve independently verified source checksums
        uses: actions/upload-artifact@v4
        with:
          name: extended-performance-complete-release
          path: dist/extended-performance-2026-09-18

name: Fix Mission Hints static runtime

on:
  push:
    branches: [main]
    paths:
      - '.migration/fix-mission-hints-static.py'
      - '.github/workflows/fix-mission-hints-static.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .migration/fix-mission-hints-static.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Mission-Rewards.user.js
          node --check SakaLuX-Script-Hub.user.js
          python -m json.tool scripts.json >/dev/null
          grep -q '^// @version      1.0.20$' SakaLuX-Mission-Rewards.user.js
          grep -q "const VERSION = '1.0.20';" SakaLuX-Mission-Rewards.user.js
          grep -q "{version:'1.0.20'}" SakaLuX-Mission-Rewards.user.js
          ! grep -q '(0, Function)(missionHintsSource)()' SakaLuX-Mission-Rewards.user.js
          grep -q 'SAKALUX_MISSION_HINTS_ISOLATED_V1020_BEGIN' SakaLuX-Mission-Rewards.user.js
          grep -q '"version": "1.0.20"' scripts.json
          grep -q "const VERSION = '1.9.35';" SakaLuX-Script-Hub.user.js
      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Mission-Rewards.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Mission-Rewards.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Mission Hints runtime on TornPDA v1.0.20 [skip ci]'
          git push

name: Patch Market Intelligence v1.16.3
on:
  push:
    paths:
      - '.github/workflows/patch-mi-v1.16.3.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/patches/mi-v1.16.3.py
      - run: |
          git config user.name 'SakaLuX Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SakaLuX-Market-Intelligence.user.js scripts.json UPDATE-INFO.md greasyfork/Market-Intelligence.md
          git commit -m 'Market Intelligence v1.16.3 automatic live cash Best Buys' || exit 0
          git push

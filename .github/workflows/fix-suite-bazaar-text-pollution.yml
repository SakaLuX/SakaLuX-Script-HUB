name: Fix Suite Bazaar event text
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_suite_bazaar_text_pollution.py'
      - '.github/workflows/fix-suite-bazaar-text-pollution.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-suite-bazaar-event-text-main
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply Event Lens text cleanup
        run: python3 .github/scripts/fix_suite_bazaar_text_pollution.py
      - name: Validate Suite syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit fix if needed
        run: |
          if git diff --quiet; then
            echo "Already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SakaLuX-Suite.user.js scripts.json
          git commit -m "Clean Bazaar helper text from Suite Event Lens"
          git push

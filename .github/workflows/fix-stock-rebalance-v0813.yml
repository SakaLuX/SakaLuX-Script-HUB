name: Fix Stock rebalance v0.8.13
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_stock_rebalance_v0813.py'
      - '.github/workflows/fix-stock-rebalance-v0813.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-stock-rebalance-v0813
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply rebalance fix
        run: python3 .github/scripts/fix_stock_rebalance_v0813.py
      - name: Validate userscript syntax
        run: node --check SakaLuX-Stock-Manager-Advisor.user.js
      - name: Validate registry JSON
        run: python3 -m json.tool scripts.json >/dev/null
      - name: Verify fixes
        run: |
          grep -q '@version      0.8.13' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'sellNetFactor=0.999' SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "String(r.sym||'').toUpperCase()!==targetSym" SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "data?.success!==true" SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          if git diff --quiet; then
            echo 'Already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SakaLuX-Stock-Manager-Advisor.user.js scripts.json SakaLuX-Script-Hub.user.js greasyfork/Stock-Manager-Advisor.md
          git commit -m 'Release Stock Manager v0.8.13 rebalance reliability fix'
          git push

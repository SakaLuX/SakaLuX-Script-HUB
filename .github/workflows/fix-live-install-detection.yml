name: Fix live-only Hub install detection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-install-detection.yml'
      - '.migration/fix-live-install-detection.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .migration/fix-live-install-detection.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check SakaLuX-Script-Hub.user.js
          grep -q '@version      1.9.35' SakaLuX-Script-Hub.user.js
          grep -q "const VERSION = '1.9.35';" SakaLuX-Script-Hub.user.js
          ! grep -q "localStorage.getItem('SakaLuX_Installed_' + script.id)" SakaLuX-Script-Hub.user.js
          grep -q '^// @version      1.0.18$' SakaLuX-Mission-Rewards.user.js
      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-Script-Hub.user.js greasyfork/Script-Hub.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Hub ghost installation detection [skip ci]'
          git push

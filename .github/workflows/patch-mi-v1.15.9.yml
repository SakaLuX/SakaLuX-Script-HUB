name: Patch Market Intelligence v1.15.9
on:
  push:
    branches: [main]
    paths:
      - '.github/patches/mi-v1.15.9.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/patches/mi-v1.15.9.py
      - run: |
          git config user.name "SakaLuX"
          git config user.email "actions@users.noreply.github.com"
          git add SakaLuX-Market-Intelligence.user.js scripts.json UPDATE-INFO.md greasyfork/Market-Intelligence.md
          git commit -m "Market Intelligence v1.15.9 stable Item Market panel" || exit 0
          git push

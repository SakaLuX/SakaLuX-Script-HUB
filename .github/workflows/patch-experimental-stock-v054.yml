name: Patch experimental Stock Manager v0.5.4
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-experimental-stock-v054.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python .github/scripts/patch_experimental_stock_v054.py
          python .github/scripts/fix_experimental_stock_v054.py
      - name: Validate
        run: |
          grep -q '@version      0.5.4' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "version: '0.5.4'" experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function inlinePresetValues' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'function inlineButtonPrefs' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'slx-inline-api-mode' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'slx-inline-market' experimental/SakaLuX-Stock-Manager-Advisor.user.js
          grep -q 'cost basis' experimental/Stock-Manager-Advisor.md
          grep -q 'v0.5.4' experimental/Stock-Manager-Advisor.md
          node --check experimental/SakaLuX-Stock-Manager-Advisor.user.js
      - name: Commit release
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add experimental/SakaLuX-Stock-Manager-Advisor.user.js experimental/Stock-Manager-Advisor.md
          git commit -m 'Experimental Stock Manager v0.5.4 native metrics and inline customization'
          git pull --rebase origin main
          git push

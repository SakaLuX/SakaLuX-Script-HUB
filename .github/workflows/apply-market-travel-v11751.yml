name: Apply Market Travel v1.17.51

on:
  push:
    branches:
      - test/market-travel-state-machine
    paths:
      - tmp_market_state_patch.py
      - .github/workflows/apply-market-travel-v11751.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/market-travel-state-machine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration patch
        run: python3 tmp_market_state_patch.py
      - name: Syntax check Market Intelligence
        run: node --check SakaLuX-Market-Intelligence.user.js
      - name: Run Market Travel regression suite
        run: node tests/market-travel-state-machine-regression.cjs
      - name: Validate scripts registry JSON
        run: node -e "JSON.parse(require('fs').readFileSync('scripts.json','utf8')); console.log('scripts.json OK')"
      - name: Verify release surfaces
        run: |
          grep -q '@version      1.17.51' SakaLuX-Market-Intelligence.user.js
          grep -q 'TORN_TRAVEL_AGENCY' SakaLuX-Market-Intelligence.user.js
          grep -q 'LANDED_ABROAD' SakaLuX-Market-Intelligence.user.js
          grep -q 'v1.17.51' greasyfork/Market-Intelligence.md
      - name: Commit integrated release candidate
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Market-Intelligence.user.js SakaLuX-Script-Hub.user.js scripts.json greasyfork/Market-Intelligence.md greasyfork/Script-Hub.md
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "Integrate Market Travel state machine v1.17.51"
            git push origin HEAD:test/market-travel-state-machine
          fi

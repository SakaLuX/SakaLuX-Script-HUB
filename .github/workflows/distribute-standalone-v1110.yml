name: Distribute Standalone v1.1.10
on:
  push:
    paths:
      - '.github/workflows/distribute-standalone-v1110.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python .github/scripts/distribute_standalone_v1110.py
      - name: Embed runtime
        run: |
          for f in SakaLuX-Enhancer-Guard.user.js SakaLuX-Account-Auditor.user.js SakaLuX-Mission-Rewards.user.js SakaLuX-Bazaar-Thanker-PDA.user.js SakaLuX-Bazaar-Smart-Pricer.user.js SakaLuX-Elimination-Assistant.user.js SakaLuX-Market-Intelligence.user.js SakaLuX-Stock-Manager-Advisor.user.js SakaLuX-Company-Intelligence-v1.0.0.user.js SakaLuX-Bounty-Hunter.user.js; do
            node tools/embed-shared-dock-runtime.cjs "$f" src/core/sakalux-dock-runtime.js "$f"
          done
      - name: Verify
        run: |
          grep -q "const VERSION = '1.1.10'" src/core/sakalux-dock-runtime.js
          grep -q "translateY(2px)" src/core/sakalux-dock-runtime.js
          grep -q "@version      0.8.18.7" SakaLuX-Stock-Manager-Advisor.user.js
          grep -q "@version      0.5.6.7" SakaLuX-Bounty-Hunter.user.js
      - name: Commit
        run: |
          git config user.name 'SakaLuX'
          git config user.email 'sakalutzu92@yahoo.com'
          git add SakaLuX-*.user.js scripts.json
          git diff --cached --quiet && exit 0
          git commit -m 'Distribute Standalone v1.1.10 centering fix'
          git push

name: Apply SakaLuX Suite v0.8.1 reminder icon fix
on:
  push:
    paths:
      - '.github/workflows/suite-v081-icons-fix.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.8.1 patch
        run: python tools/suite_v081_icons_fix.py
      - name: Verify JavaScript syntax
        run: node --check SakaLuX-Suite.user.js
      - name: Commit v0.8.1
        run: |
          git config user.name "SakaLuX"
          git config user.email "sakalutzu92@yahoo.com"
          git add SakaLuX-Suite.user.js greasyfork/SakaLuX-Suite.md
          git commit -m "Fix Suite reminder icons in v0.8.1"
          git push origin HEAD:main

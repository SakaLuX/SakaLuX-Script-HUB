name: Diagnose Hub open handler

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-hub-open.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect openHub
        run: |
          set -e
          echo '=== openHub references ==='
          grep -n -C 8 'openHub' SakaLuX-Script-Hub.user.js || true
          echo '=== overlay creation ==='
          grep -n -C 8 'IDS.overlay' SakaLuX-Script-Hub.user.js || true
          echo '=== closeHub ==='
          grep -n -C 8 'closeHub' SakaLuX-Script-Hub.user.js || true
